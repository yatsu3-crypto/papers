  items: [
    { cat:"A", pmid:"42887704", journal:"J Allergy Clin Immunol", year:2026, type:"システマティックレビュー・用量反応・ネットワークメタ解析（211試験・22,187名）",
      tj:"慢性蕁麻疹の抗ヒスタミン薬：第二世代が優位、4倍増量は上乗せが小さく眠気は増える",
      te:"Comparative efficacy and safety of antihistamines, increased antihistamine dosing, and antihistamine adjuncts for chronic urticaria: a systematic review, dose-response, and network meta-analysis of randomized trials.",
      sum:["慢性蕁麻疹はH1抗ヒスタミン薬を一次治療としますが、薬剤ごとの効果と害の比較、増量の意義、併用薬（H2受容体拮抗薬やモンテルカスト）の位置づけには未解決の点が残っています。本研究は米国アレルギー学会（AAAAI）と米国アレルギー喘息免疫学会（ACAAI）合同の慢性蕁麻疹ガイドライン改訂作業の一部として、MEDLINE・EMBASE・CENTRALと規制当局のデータベースを2025年3月17日まで検索し、ランダム化試験を集めてランダム効果のネットワークメタ解析と用量反応メタ解析を行ったものです。評価項目は蕁麻疹活動性（かゆみと膨疹のスコア）、血管性浮腫の活動性、蕁麻疹関連の生活の質、眠気を含む有害事象で、根拠の確実性はGRADEで評価しています。",
           "211試験・22,187名、55種類の治療が解析されました。蕁麻疹活動性・蕁麻疹関連の生活の質・睡眠障害の改善では、ビラスチン、デスロラタジン、フェキソフェナジン、レボセチリジンが上位に入りました。セチリジンとロラタジンは蕁麻疹活動性とその内訳の低下で上位にあり、セチリジンは生活の質の改善でも上位でした。常用量から4倍量までの増量は、上乗せの効果が次第に小さくなる可能性が示されました。第二世代は薬剤群として、蕁麻疹活動性と睡眠障害の改善において第一世代より有効である可能性があります。眠気の危険は高用量で増すと考えられ、第一世代（ジフェンヒドラミン、ヒドロキシジンなど）とドキセピンが最も眠気が強く、セチリジン・ケトチフェン・レボセチリジン・ルパタジンが中間、ベポタスチン・ビラスチン・デスロラタジン・エバスチン・フェキソフェナジン・ロラタジンが最も眠気が少ない群に分類されました。第二世代へのモンテルカストの追加（確実性は中）、H2受容体拮抗薬の追加（確実性は非常に低い）は、蕁麻疹活動性をさらに下げる可能性があります。",
           "慢性蕁麻疹では第二世代のあいだでも有効性と安全性に差があり、第一世代は有益性が小さく害が大きいと述べられています。1日量の増量は追加の効果をもたらしうるものの、眠気は増す可能性が高いとしています。"],
      use:"蕁麻疹の患者さんに、眠気の出にくい薬をお選びしたうえで、効きが足りないときに増量するか別の薬に替えるかをご説明する材料になります。" },
    { cat:"A", pmid:"42886609", journal:"Int Arch Allergy Immunol", year:2026, type:"システマティックレビュー・メタ解析（11研究・13群・1,382名）",
      tj:"オマリズマブ：漸減中止だと再燃31.2%、急な中止は48.9%（150mg4週まで減量が最も低い）",
      te:"Relapse Rates, Time-to-Flare, and Biomarker Predictors Following Omalizumab Gradual De-escalation versus Abrupt Discontinuation in Controlled Chronic Spontaneous Urticaria: A Systematic Review and Meta-Analysis of Randomized Controlled Trials and Observational Cohorts.",
      sum:["慢性特発性蕁麻疹（CSU）のコントロールが良くなったあと、オマリズマブをどのようにやめるのが最善かは定まっておらず、ゆっくり減らすのか一度にやめるのかは臨床上の迷いの種になっています。本研究はPubMed・Embase・Cochrane CENTRALを2026年4月まで系統的に検索し、11研究・5,130名を検討対象として、再燃割合の解析には13の独立した研究群・1,382名が寄与するランダム効果の割合メタ解析（DerSimonian-Laird法）を行いました。漸減（投与間隔の延長または用量の減量）と急な中止をあらかじめ決めたサブグループとして比較し、根拠の確実性をGRADEで評価しています。",
           "全体をまとめた再燃率は39.5%（95%信頼区間30.1〜49.7%）でした。漸減は急な中止より有意に再燃率が低く（31.2%［95%信頼区間20.3〜44.7%］対48.9%［95%信頼区間37.0〜61.0%］、Qb=8.12、p=0.004）、4週ごと150 mgへの減量が全体のなかで最も低い再燃率（23.3%［95%信頼区間9.2〜47.6%］、I二乗=50.4%）でした。再燃を独立して予測したベースラインの特徴として、総IgEが高いこと（90 IU/mL超でp=0.005、341 kU/L以上でCox解析のp<0.001）、血中好酸球が0.15×10の9乗/L超（p=0.043）、血管性浮腫の併存（オッズ比2.40、p=0.004）、2年を超える病悩期間（治療継続の成功に対するハザード比0.81、p=0.03）が挙げられています。出版バイアスのEgger検定は慣習的な有意水準には達しませんでしたが（報告されたp=0.109）、切片が大きく負に出ていることと、割合のメタ解析でこの検定が信頼しにくいことから、小規模研究の影響を確実に除外はできないとしています。6か月以上追跡された均質なコホートに限った感度分析でも、漸減が優れることが再確認されました（p=0.008）。",
           "オマリズマブをゆっくり減らしていく方法は、一度にやめる場合と比べて中止後の再燃の危険をほぼ半分に減らすことと関連していたと述べられています。ベースラインの総IgEと血中好酸球は、やめる準備ができている患者さんを見分けるうえで重要な指標になりうるとしています。"],
      use:"蕁麻疹が落ち着いてオマリズマブをやめていくときに、いきなり中止せず間隔を延ばす・量を減らす方法をお勧めする根拠になります。" },
    { cat:"A", pmid:"42886333", journal:"BioDrugs", year:2026, type:"システマティックレビュー・メタ解析（26報・34,511例の曝露）",
      tj:"乾癬の生物学的製剤で湿疹反応は2.17%、IL-17阻害薬3.47%・アトピー既往でハザード比12.4",
      te:"Incidence and Risk Factors of Treatment-Emergent Eczematous Reactions in Patients with Psoriasis Treated with Biologics: A Systematic Review and Meta-Analysis.",
      sum:["乾癬の患者さんが生物学的製剤を使用中に湿疹のような反応が出ることが報告されていますが、まとめた発生頻度や関連する因子は明らかではありませんでした。本研究はPubMed・EMBASE・Web of Scienceを2026年1月まで検索し、腫瘍壊死因子（TNF）阻害薬、インターロイキン（IL）-17阻害薬、IL-12/23阻害薬、IL-23阻害薬で治療された乾癬の患者さんに新たに生じた、あるいは悪化した湿疹を報告した研究を集めました。内服のTYK2阻害薬デュークラバシチニブの2研究は探索的なサブグループとして別に解析しています。PRISMA声明に従い、Freeman-Tukeyの二重逆正弦変換を用いたランダム効果モデルで統合しました。",
           "26報・34,511例の曝露の解析で、全体の発生頻度は2.17%（95%信頼区間1.57〜2.85）でした。薬剤群によって差があり（p<0.001）、IL-17阻害薬が最も高く3.47%（95%信頼区間2.34〜4.77）、次にIL-12/23阻害薬2.15%（95%信頼区間0.04〜6.59）、TNF阻害薬1.02%（95%信頼区間0.83〜1.23）で、IL-23阻害薬が最も低く0.09%（95%信頼区間0.00〜0.71）でした。IL-17阻害薬のなかではセクキヌマブ（5.3%、95%信頼区間2.95〜8.2）がイキセキズマブ（1.51%、95%信頼区間0.41〜3.1）より高い頻度でした。高用量の投与法は低用量より頻度が高く（7.65%対3.36%、p=0.03）、東アジアの集団を対象とした研究（約6%）は欧米の集団（約1%）より高い頻度でした。患者さん側の因子では、アトピー性皮膚炎の既往が最も強く関連しました（ハザード比12.40、95%信頼区間6.97〜22.06）。",
           "生物学的製剤で治療された乾癬における湿疹反応は、薬剤群・用量・対象集団と関連しており、IL-17阻害薬、高用量の投与法、東アジア集団を対象とした研究で最も頻度が高かったと述べられています。"],
      use:"乾癬で生物学的製剤を始める際に、アトピー性皮膚炎の既往がある患者さんには湿疹のような皮疹が出ることがある旨を前もってお伝えする材料になります。" },
    { cat:"A", pmid:"42887863", journal:"Actas Dermosifiliogr", year:2026, type:"傾向スコアマッチ後方視コホート（各群2,016名・TriNetX）",
      tj:"生物学的製剤中の乾癬：SGLT2阻害薬の併用で心筋梗塞ハザード比0.60・脳卒中0.55",
      te:"SGLT2 inhibitors and cardiovascular outcomes in patients with moderate-to-severe psoriasis receiving biologic therapy: A propensity score-matched cohort study.",
      sum:["中等症から重症の乾癬の患者さんは心血管疾患の危険が高いことが知られています。ナトリウム・グルコース共役輸送体2（SGLT2）阻害薬には心血管系の有益性がありますが、乾癬の患者さんでの心血管イベントとの関連は十分に研究されていませんでした。本研究は国際的な診療データベースTriNetXを用い、生物学的製剤で治療されている尋常性乾癬の40歳を超える患者さんを、SGLT2阻害薬の使用の有無で分けた後方視コホート研究です。人口統計学的特徴、心血管の危険因子、腎疾患、併用する糖尿病治療薬を揃えるため傾向スコアマッチを行い、各群2,016名を解析しました。",
           "SGLT2阻害薬の使用は、急性心筋梗塞（ハザード比0.601、95%信頼区間0.426〜0.849）、脳卒中（ハザード比0.553、95%信頼区間0.381〜0.804）、心不全（ハザード比0.751、95%信頼区間0.581〜0.970）、末梢動脈疾患（ハザード比0.648、95%信頼区間0.470〜0.894）、狭心症（ハザード比0.601、95%信頼区間0.404〜0.894）の発生が有意に低いことと関連していました。一過性脳虚血発作については有意な関連はみられませんでした。",
           "生物学的製剤で治療されている中等症から重症の乾癬の患者さんにおいて、SGLT2阻害薬の使用は良好な心血管系の経過と関連していたと述べられています。この集団での心血管リスク低減の方策として、前向きの検討をさらに進めることを支持する結果だとしています。"],
      use:"乾癬で糖尿病を併せもつ患者さんの内科の処方内容を確認し、心血管リスクについて内科の先生と情報を共有する手がかりになります。" },
    { cat:"A", pmid:"42887600", journal:"J Am Acad Dermatol", year:2026, type:"システマティックレビュー",
      tj:"JAK阻害薬の使用中に生じたカポジ肉腫：新たな安全性シグナルとして系統的に整理",
      te:"Kaposi sarcoma during Janus kinase inhibition: A systematic review of an emerging safety signal.",
      sum:["PubMed上で抄録が公開されていないため、タイトルから分かる範囲にとどめます。ヤヌスキナーゼ（JAK）阻害薬の投与中に生じたカポジ肉腫について、システマティックレビューとして報告されたものです。",
           "新たに浮かび上がりつつある安全性シグナルという位置づけが示されていますが、報告の件数、危険の大きさ、対象となった薬剤や背景因子については抄録がないため分かりません。",
           "具体的な数値・対象・結論は原著の確認が必要です。"],
      use:"アトピー性皮膚炎などでJAK阻害薬を長く続けている患者さんの皮膚を診るときに、見慣れない紫紅色の皮疹があれば念頭に置く材料になります。",
      note:"抄録なし（タイトルのみで要約）。原著確認が必要。" },
    { cat:"A", pmid:"42885110", journal:"J Dermatol", year:2026, type:"後方視コホート（日本人109名・単施設）",
      tj:"水疱性類疱瘡：治療前の血清TARCが高いと1年以内の再燃と関連（ステロイド未使用例でハザード比1.34）",
      te:"Baseline Serum Thymus and Activation-Regulated Chemokine Levels and 1-Year Relapse in Bullous Pemphigoid: A Retrospective Cohort Study.",
      sum:["水疱性類疱瘡（BP）で再燃の危険と関連するベースラインの血液検査の指標は十分に定まっていません。血清TARC（thymus and activation-regulated chemokine）はBPにおける2型炎症と疾患活動性を反映しますが、治療前の値がその後の再燃と関連するかは明らかではありませんでした。本研究は2006年1月から2025年9月までに富山大学附属病院で治療された日本人のBP患者さん109名を後方視的に調べ、治療開始後1年以内の再燃を主要評価項目として、治療前の血清TARCと再燃までの時間との関連をCox比例ハザードモデルで評価したものです。",
           "1年の追跡期間中に31名が再燃し、9名が亡くなりました。単変量解析では血清TARCが高いほど再燃と関連していました（2倍になるごとのハザード比1.19、95%信頼区間1.02〜1.39、p=0.029）。年齢・認知症・BPDAI総スコア・抗BP180-NC16A抗体価で調整した主たる多変量Coxモデルでは関連は弱まり有意ではありませんでした（ハザード比1.16、95%信頼区間0.95〜1.42、p=0.138）。全身ステロイドの使用歴がない患者さんに限ると、血清TARCはCox解析（ハザード比1.34、95%信頼区間1.03〜1.73、p=0.027）とFine-Gray解析（部分分布ハザード比1.35、95%信頼区間1.03〜1.75、p=0.029）の双方で再燃と関連し続け、多変量モデルにTARCを加えるとC統計量が0.582から0.653に上がり、あてはまりも改善しました（尤度比検定p=0.025）。",
           "これらは探索的な結果であり、全身ステロイドによる治療の前に測った血清TARCは、再燃の見通しについて控えめながら補足的な情報をもたらしうると述べられています。ただし外部での検証が必要とされています。"],
      use:"高齢の方の水疱性類疱瘡で治療を始める前に、TARCを測っておくと再燃の見通しを考える一助になると考える材料になります。" },
    { cat:"A", pmid:"42888170", journal:"Dermatitis", year:2026, type:"評価尺度の検証（皮膚科医22名・写真21例）",
      tj:"頭頸部EASIの重症度区分：vIGA-ADと重み付きκ=0.83で一致（中等症は1.8〜3.0）",
      te:"Validation of Head and Neck EASI Severity Strata Against vIGA-AD in Atopic Dermatitis.",
      sum:["アトピー性皮膚炎（AD）の頭頸部（H&N）についてEASIの部分スコアが報告されることが増えていますが、妥当性の検証されたvIGA-AD（Investigator Global Assessment for Atopic Dermatitis）と照らしてどう解釈すればよいかは明らかではありませんでした。本研究は、22名の皮膚科医が頭頸部にADのある21名の患者さんの写真を頭頸部EASIとvIGA-ADで評価し、vIGA-AD内の実際の分布にもとづいて頭頸部EASIの重症度区分を定め、収束的妥当性（Kendallのタウ、Spearmanの相関係数）と評価者間信頼性（級内相関係数）を検討したものです。",
           "頭頸部EASIのスコアはvIGA-ADとよく対応し、0が消失、0.1〜0.6がほぼ消失、0.7〜1.7が軽症、1.8〜3.0が中等症、3.1〜4.8が重症という区分になり、ほぼ完全な一致を示しました（重み付きCohenのκ=0.83、95%信頼区間0.80〜0.86、p<0.001）。頭頸部EASIとvIGA-ADは強く相関し（タウ=0.74、95%信頼区間0.71〜0.77、Spearman相関係数=0.86、95%信頼区間0.83〜0.88、いずれもp<0.001）、評価者間の信頼性は頭頸部EASIで0.73（95%信頼区間0.60〜0.85）、vIGA-ADで0.61（95%信頼区間0.46〜0.77）と中程度でした（いずれもp<0.001）。",
           "頭頸部EASIの重症度区分は、顔面のvIGA-ADと対応した信頼できる臨床的に意味のある評価を可能にし、全体評価だけでは捉えられない部分の評価に役立つと述べられています。"],
      use:"顔や首のアトピー性皮膚炎の重症度を、診察のたびに同じ目安で記録し患者さんと共有する材料になります。" },
    { cat:"A", pmid:"42881821", journal:"J Clin Med", year:2026, type:"単施設後方視コホート（100名）",
      tj:"乾癬性関節炎：全身ステロイド中止後3か月の皮疹悪化は10%、多くは軽度",
      te:"Cutaneous Deterioration Following Glucocorticoid Discontinuation in Psoriatic Arthritis: A Real-World Cohort Study.",
      sum:["乾癬性関節炎（PsA）で全身ステロイドを完全に中止した後3か月のあいだに、どの程度の頻度で皮疹の悪化が記録されるか、またそれが累積のステロイド投与量と関連するかを検討した研究です。2008年から2024年までに三次医療のリウマチ科でステロイドの全身投与を受け、CASPAR分類基準を満たすPsAの患者さん100名を対象とした単施設の後方視コホート研究で、主要評価項目は完全中止後3か月以内の皮疹の悪化、プレドニゾロン換算の累積投与量との関連をロジスティック回帰で解析しています。",
           "皮疹の悪化は中止後3か月以内に10%の患者さんで起こりました。そのうち臨床的にはっきりしたものは少数にとどまり、紅皮症や全身性の膿疹型への移行はみられませんでした。累積のステロイド投与量と皮疹の悪化のあいだには統計学的に有意な関連はみられませんでした（オッズ比0.90、95%信頼区間0.67〜1.22）。",
           "実地診療のPsAコホートにおいて、ステロイド中止後の皮疹の悪化は頻度が低く、おおむね軽度であったと述べられています。累積投与量との有意な関連はみられず、また対照群がないため、ステロイドの中止とその後の皮疹の悪化に因果関係があるかについては結論できないとしています。"],
      use:"関節症状のために内科やリウマチ科でステロイドを使っていた患者さんがやめるときに、皮疹の悪化は多くなく大半は軽いとお伝えする材料になります。" },
    { cat:"A", pmid:"42888566", journal:"Medicine (Baltimore)", year:2026, type:"横断研究（動画262本）",
      tj:"痤瘡の動画情報：質はGQS中央値2点と低い、医療者の投稿がもっとも高評価",
      te:"The quality and reliability of acne-related information on Douyin and Bilibili: A cross-sectional study.",
      sum:["痤瘡（にきび）はよくみられる慢性炎症性の皮膚疾患で、心身に大きな影響を与えます。本研究は、2026年1月1日に「痤瘡」というキーワードで動画共有サイトのDouyin（中国版TikTok）とBilibiliを検索し、動画の長さ、再生・反応の指標、投稿者の属性、内容を集め、質をGlobal Quality Scale（GQS）、信頼性を改変DISCERN（mDISCERN）で評価した横断研究です。",
           "262本の動画が解析されました。内容は治療に偏っており（内容分類325件のうち41.85%）、原因（16.00%）と予防（6.76%）の扱いは限られていました。全体のGQSの中央値は2.00（四分位範囲1.00〜3.00）、mDISCERNの中央値は2.00（四分位範囲1.00〜2.00）でした。DouyinのGQS・mDISCERNはBilibiliより有意に高く（p<0.05）、医療の専門職が投稿した動画が最も高いGQS・mDISCERNを示しました（p<0.05）。いいね・保存・コメントの数はmDISCERNと有意な相関を示しませんでした（p>0.05）。",
           "これらの動画共有サイト上の痤瘡に関する情報の質と信頼性はおおむね不十分で、医療の専門職が投稿したものが最も高い評価でした。反応の多さは信頼性と有意に関連しておらず、質の高い根拠にもとづく情報が広まるよう、運営側の内容管理の強化と医療者の参加が望まれると述べられています。"],
      use:"にきびの患者さんが動画で見た方法を試しておられるときに、再生数の多さは内容の正しさを意味しないとご説明する材料になります（生活指導アシスタントの生活指導のタブと結びつけられます）。" },
    { cat:"C", pmid:"42888574", journal:"Medicine (Baltimore)", year:2026, type:"傾向スコアマッチ後方視コホート",
      tj:"急性蕁麻疹に耳介刺絡を併用：入院期間が短縮、マッチ後は男性で有意",
      te:"Efficacy of auricular bloodletting therapy for acute urticaria: A propensity score-matched retrospective cohort study.",
      sum:["急性蕁麻疹はあらゆる年齢層にみられる一般的な疾患で、現在の薬物治療は主に抗ヒスタミン薬とステロイドに頼っています。しかしこれらは効果が十分でないことや、用量と時間に依存すること、副作用の可能性といった限界があり、有効な補助療法を組み合わせることには臨床的な意義があるとされます。本研究は、急性蕁麻疹の患者さんにおける耳介刺絡（auricular bloodletting）療法と入院期間との関連を調べたもので、入院期間の群間比較にPoisson回帰を用い、選択バイアスを小さくするため傾向スコアマッチを行い、性別・年齢によるサブグループ解析と、ブートストラップ再標本化およびRosenbaumの感度分析による頑健性の確認も実施しています。",
           "傾向スコアマッチの前では、Poisson回帰により刺絡を受けた群の入院期間が有意に短いことが示され、男性・女性・成人のサブグループで有意でした。マッチ後は、すべてのモデルで発生率比が1を下回り統計学的な有意差がみられましたが、サブグループでは女性・成人では有意差がみられず、男性のサブグループでは有意差が保たれていました。有害事象の報告はありませんでした。ブートストラップとRosenbaumの感度分析により結果の頑健性が確認されています。",
           "耳介刺絡を受けた患者さんは入院期間が短かったと述べられています。マッチ後は男性のサブグループで有意差が保たれており、介入群の例数が限られているため、結果の検証と機序の解明には、より大きな集団を対象とした前向き研究が今後必要とされています。"],
      use:"薬だけでは落ち着きにくい急性の蕁麻疹に鍼灸の併用をご相談されたときに、耳介への刺絡について報告があることをお伝えする材料になります（後方視研究で例数が限られる点は添えてご説明します）。" }
  ]
},
{
  date: "2026-10-17",
  range: { A: "2026-10-15〜10-17", B: "2026-10-15〜10-17", C: "2026-09-17〜10-17" },
  items: [
    { cat:"A", pmid:"42879117", journal:"Dermatol Ther (Heidelb)", year:2026, type:"多施設後方視・レジストリ（433名・イタリア）",
      tj:"ウパダシチニブ52週：EASI75は85.7%、1年のうち約253日が良好なコントロール",
      te:"Cumulative Disease Control with Upadacitinib in Moderate-to-Severe Atopic Dermatitis-A 52-Week Multicenter Real-World Study: IL-AD (Italian Landscape Atopic Dermatitis).",
      sum:["一時点での評価項目だけではアトピー性皮膚炎（AD）の治療の良さを十分にとらえられない可能性があるとして、ウパダシチニブの実地診療での52週の有効性と安全性を、累積的な病勢コントロールに着目して検討した多施設の後方視解析です。イタリアの LANDSCAPE レジストリに前向きに集められたデータから、15 mg または 30 mg を1日1回、用量を変えずに継続した中等症から重症の AD の患者さんを対象とし（52週の観察期間中に 15 mg と 30 mg のあいだで用量を変更した方は除外）、ベースラインと16・32・52週で評価しました。中等度のコントロールを EASI75 かつ最強時のかゆみ NRS 4 以下、最適なコントロール（最小疾患活動性・MDA）を EASI90 かつかゆみ NRS 1 以下と定義し、累積のコントロールは目標の状態にいた日数（time-in-target）として推計しています。",
           "433名（15 mg が315名・72.7%、30 mg が118名・27.3%）が含まれました。52週時点で EASI75 は85.7%、EASI90 は72.7%、中等度のコントロールは80.6%、最適なコントロール／MDA は62.6%が達成しました。目標の状態にいた日数は平均で、中等度のコントロールが253.3±101.9日、最適なコントロール／MDA が176.1±124.4日でした。16週から52週まで持続して中等度・最適なコントロールが保たれた方はそれぞれ63.0%、38.3%でした。27.0%が1件以上の有害事象を経験しましたが、有害事象による恒久的な治療中止はありませんでした。",
           "ウパダシチニブは実地診療でも52週にわたり持続的な病勢コントロールをもたらし、目標の状態にいた日数という指標は、従来の一時点の評価項目を補って治療効果の持続をよりよく反映しうると述べられています。"],
      use:"ADで内服のJAK阻害薬を続けている患者さんに、1年のうちどれくらいの期間を良い状態で過ごせるかという見通しをお伝えする材料になります。" },
    { cat:"A", pmid:"42882146", journal:"J Clin Med", year:2026, type:"総説・ナラティブ統合（36研究）",
      tj:"刺激誘発型の蕁麻疹：抗ヒスタミン薬4倍増量が常用量より有効、難治例にオマリズマブ",
      te:"Effectiveness and Safety of Pharmacological Treatments for Chronic Inducible Urticaria: A Narrative Synthesis.",
      sum:["慢性の刺激誘発型蕁麻疹（CIndU）には複数の治療が検討されてきましたが、すべての病型を横断して扱ったレビューは限られています。本稿は PubMed と Scopus を検索し、寒冷蕁麻疹・症候性皮膚描記症・日光蕁麻疹・遅発性圧蕁麻疹・運動誘発蕁麻疹・コリン性蕁麻疹および混合型について治療データを報告した研究を集め、有効性と安全性を整理したナラティブレビューです。温熱・水・接触による蕁麻疹のみを扱った研究はみつからず、これらは混合型を扱った研究のなかに含まれる形で検討されています。",
           "36研究が得られました。第二世代H1抗ヒスタミン薬を一次治療とすることで、ほとんどの病型で有意な症状のコントロールが得られ、常用量の4倍までの増量は常用量より有効でした。抗ヒスタミン薬が効きにくい患者さんでは、二次治療としてのオマリズマブが高い有効性を示しましたが、中止後の再燃はよくみられました。遅発性圧蕁麻疹ではダプソンと高用量の免疫グロブリン静注が良好な反応を示しました。ナローバンドUVBは症候性皮膚描記症と日光蕁麻疹に有益でしたが再燃率は高いものでした。新しい肥満細胞を減らす薬（バルゾルボリマブ、リレンテリマブ）は有望な有効性を示した一方、インターロイキン1阻害薬のリロナセプトは臨床的な有益性を示せませんでした。36研究全体で有害事象はおおむね少なく、バルゾルボリマブでやや多く報告されました。",
           "増量した抗ヒスタミン薬は有害事象を大きく増やすことなく常用量より症状を抑え、抗ヒスタミン薬抵抗性の CIndU にはオマリズマブ150〜300 mg の4週ごとの投与が有効（ただし適応外）であると述べられています。治療をやめた後の再燃が多く、個別の長期的な方針が必要であり、現在の根拠の多くは慢性特発性蕁麻疹からの外挿であるため、CIndU を対象とした専用の試験が求められるとしています。"],
      use:"寒さ・圧迫・日光などの刺激で出る蕁麻疹の患者さんに、まず抗ヒスタミン薬の増量から試していく方針をご説明する材料になります。" },
    { cat:"A", pmid:"42882118", journal:"J Clin Med", year:2026, type:"単施設後方視（成人46名）",
      tj:"慢性特発性蕁麻疹：オマリズマブ中止後、63%が繰り返し再開（予測できる指標なし）",
      te:"Repeated Relapse-Retreatment Cycles After Omalizumab Withdrawal in Chronic Spontaneous Urticaria: A Real-World Study.",
      sum:["慢性特発性蕁麻疹（CSU）ではオマリズマブ中止後の再燃がよくみられますが、中止を重ねるたびに再開が必要となる患者さんの特徴は十分に明らかになっていません。本研究は、通常用量のオマリズマブによる最初の6か月の治療で病勢のコントロールが得られた成人46名を対象に、最初の中止後の12か月間を評価した単施設の後方視研究です。中止後12週以内の再燃による再開が少なくとも2回あった場合を繰り返しの再開と定義し、ベースラインの臨床所見・検査所見を群間で比較して多変量ロジスティック回帰を行いました。",
           "29名（63.0%）が繰り返しの再開の基準に該当しました。ベースラインの疾患活動性、血管性浮腫、アトピー素因、自己免疫性甲状腺疾患、全身性ステロイドの使用歴、総IgE、抗TPO抗体、CRP、好酸球数・好塩基球数、炎症指標のいずれも両群で有意な差はありませんでした。検査値ではビタミンB12のみ単変量解析で有意な差がみられましたが（259 対 335 pg/mL、p=0.034）、多変量で調整すると関連は保たれませんでした。多変量モデルに含めたどの変数も、繰り返しの再開と独立した関連を示しませんでした。",
           "12か月の観察期間において、中止のたびに再開が必要となる経過は少なくなく、日常的に得られるベースラインの臨床・検査所見では、そうした患者さんを確実に見分けることはできなかったと述べられています。従来の評価から再治療の必要性を予測することの難しさを示すものであり、個別化した中止・減量の方法について前向きの検討が必要とされています。"],
      use:"蕁麻疹が落ち着いてオマリズマブを一度やめてみるときに、再燃して再開となる方が一定数いることを前もってお伝えする材料になります。" },
    { cat:"A", pmid:"42881133", journal:"J Dermatolog Treat", year:2026, type:"横断研究（成人150名・タイ）",
      tj:"乾癬の外用ステロイド恐怖：40%が明確な不安、顔の皮疹・副作用経験で強い",
      te:"A cross-sectional analysis of topical steroid phobia and observable side effects in Thai psoriasis patients.",
      sum:["外用ステロイド（TCS）への恐怖はアドヒアランスを損ない乾癬の管理を妨げますが、タイの成人ではあまり研究されていません。本研究は、シリラート病院で TCS の使用経験のある成人の乾癬患者150名を対象に、妥当性の検証されたタイ語版 TOPICOP 尺度で恐怖の程度を数値化し、関連する因子を調べた横断調査です。",
           "150名のうち81名（54.0%）が女性で、年齢の中央値は52歳（四分位範囲35.0〜62.3）でした。TOPICOP の平均は36点満点中17.1±5.3（47.5%±14.7%）で、40%が TCS への明確な恐怖を報告しました。皮膚科医が確認した副作用（最も多いのは皮膚萎縮）は50.0%にみられ、副作用のある方ほどスコアが高いという関連がありました（18.1±4.3 対 16.0±6.0、p=0.016）。顔に皮疹のある方もスコアが高く（18.1±5.0 対 16.3±5.4、p=0.032）、スコアは DLQI（r=0.175、p=0.030）および教育歴（r=0.240、p=0.003）と正の相関を示しました。",
           "TCS への恐怖はタイの成人の乾癬患者さんに広くみられ、顔の皮疹がある場合、過去に副作用を経験した場合、生活の質が損なわれている場合にとくに強くなっていました。安全な TCS の使用を進めるには、個別に合わせた説明が勧められると述べられています。"],
      use:"ステロイドの塗り薬をこわいと感じておられる患者さんに、顔の皮疹や過去の副作用の経験を伺ったうえで塗り方を一緒に確認する根拠になります（生活指導アシスタントの外用薬のタブと結びつけられます）。" },
    { cat:"A", pmid:"42881807", journal:"J Clin Med", year:2026, type:"総説",
      tj:"疥癬：湿疹や虫刺されと誤られやすい、PCR・ELISAは感度特異度80%超",
      te:"Scabies Diagnosis: A Narrative Review of Diagnostic Methods, Clinical Misdiagnosis, and Emerging Directions.",
      sum:["疥癬はヒゼンダニ（Sarcoptes scabiei）による顧みられない熱帯病とされ、主に小児・高齢者・免疫の低下した方が罹ります。有病率は西太平洋の島嶼国で最も高いものの、英国やニュージーランドなどの高所得国でも流行が報告されており、それでもなお誤診の多い疾患です。本稿は PubMed・Scopus・Web of Science の3つのデータベースを検索し、疥癬を検出する検査法、誤診の危険、診断を改善する方策を整理した総説です。",
           "疥癬の診断は臨床的な疑いと診察する医師の経験に左右されやすく、いくつかの臨床所見の感度が低いことと、臨床で使える客観的な基準がないことから、湿疹や虫刺されなど他の皮膚疾患と誤られることがよくあります。取り上げられた方法は、視診、皮膚擦過、墨汁法、粘着テープ法、ダーモスコピー、ビデオダーモスコピー、nested PCR です。PCR や ELISA といった分子・免疫学的な検査は80%を超える感度・特異度を示しており、臨床所見がはっきりしない場合の診断に検討しうるとされています。",
           "客観的な検査が確立すれば制御の取り組みが進むと考えられ、International Alliance for Control of Scabies（IACS）基準の臨床的・疑いという分類を用いることで、誤診を減らし、より多くの患者さんの診断と治療につながり、重症化や感染の広がりを抑えうると述べられています。資源の限られた地域に向けて、感度の高い客観的な診断法の標準化された使い方についての合意が急がれるとしています。"],
      use:"かゆみの強い湿疹がなかなか治らないときに疥癬を疑い、ダーモスコピーや皮膚擦過で確かめる手順を見直す材料になります。" },
    { cat:"A", pmid:"42886188", journal:"Am Fam Physician", year:2026, type:"総説",
      tj:"小児のよくある発疹：ADは15〜20%、自然に治るものと薬が要るものを見分ける",
      te:"Common Skin Rashes in Children.",
      sum:["小児の発疹はプライマリ・ケアの医師が診る機会が多く、特徴的な所見を見分けることで診断されることが少なくありません。本総説は、よくみられる小児の発疹について、見分け方と治療の要点を整理しています。",
           "アトピー性皮膚炎は小児の15〜20%にみられ、多くは2歳未満で発症し、治療は重症度に応じて保湿剤と外用ステロイドから始めます。伝染性紅斑は頬の平手打ち様の紅斑に続いて体幹と四肢に網目状の皮疹が広がります。手足口病は痛みを伴う口腔内の潰瘍と、手・足・臀部・陰部の水疱性の発疹を呈します。伝染性膿痂疹は、非水疱型では蜂蜜色の痂皮を伴う病変、水疱型では弛緩性の水疱が特徴で、いずれも抗菌薬で治療します。",
           "伝染性軟属腫はドーム状でへそのような陥凹のある丘疹で、数か月から数年のうちに自然に消えますが、冷凍凝固・掻爬・外用薬で治療することもあります。ばら色粃糠疹は体幹の大きなヘラルドパッチに続いて、皮膚割線に沿った小さな皮疹が多発します。猩紅熱はA群β溶血性連鎖球菌の感染症で、紙やすりのような発疹を呈し、リウマチ熱を防ぐために抗菌薬で治療します。頭部白癬は内服の抗真菌薬による治療を要し、体部白癬は通常は外用薬で治療できると述べられています。"],
      use:"お子さんの発疹で受診されたときに、自然に治るものと抗菌薬・抗真菌薬が必要なものの見分け方を保護者にご説明する材料になります。" },
    { cat:"A", pmid:"42884589", journal:"Nutrients", year:2026, type:"総説",
      tj:"小児AD×食事：プロバイオティクスの効果は小さく、必要のない除去食は避ける",
      te:"The Gut-Skin Axis in Pediatric Atopic Dermatitis: Nutritional Modulation, Microbiome Interactions, and Emerging Precision Approaches.",
      sum:["小児のアトピー性皮膚炎（AD）はバリア障害を軸とする炎症性の皮膚疾患で、全身の免疫や細菌叢とも関連します。腸と皮膚をつなぐ腸-皮膚軸は、乳幼児期の栄養・腸内細菌の代謝・腸のバリア機能・免疫の成熟が発症や症状に影響しうるという枠組みを与えますが、それを支える根拠の多くは関連を示す段階にとどまります。本総説は PubMed/MEDLINE・Scopus・Web of Science を2026年7月31日まで検索し、診療指針・系統的レビュー・無作為化試験・出生コホート・機序研究のうち小児に関わるものを優先して、臨床的な根拠のある栄養の工夫はどれか、研究段階のものはどれかを整理しています。",
           "現在の指針で支持されるのは、可能な場合の母乳栄養、離乳食の時期の食品の多様性、必要のない除去食を避けること、確認された栄養の不足を補うこと、確定した食物アレルギーの管理です。プロバイオティクスとシンバイオティクスはメタ解析で SCORAD を下げますが、統合した効果は小さく、ばらつきが大きく、臨床的に意味のある最小の差に届かないため、推奨される治療というより任意の補助と位置づけられます。地中海式や食物繊維の多い食事パターンの根拠は主に観察研究に基づきます。細菌叢のプロファイリング、メタボロミクス、マルチオミクスによる分類、人工知能は、食事への反応を予測する妥当性が検証されておらず、研究上の道具にとどまります。",
           "栄養は小児の AD において、確立した外用・全身療法に代わるものではなく補助であり、精密栄養は日常診療の確立した要素というより有望な研究の方向であると述べられています。その臨床的な価値は、標準化されたバイオマーカーと、設計のよい縦断研究・介入研究に左右されるとしています。"],
      use:"お子さんのADで食べ物が原因ではないかとご相談されたときに、必要のない除去食は避けて外用治療を軸に進める説明の材料になります（生活指導アシスタントの食物アレルギー・食事のタブと結びつけられます）。" },
    { cat:"A", pmid:"42877410", journal:"J Clin Aesthet Dermatol", year:2026, type:"総説・実践的アルゴリズム",
      tj:"AD生物学的製剤の注射部位反応：4〜19%、多くは軽度で中止は1〜2%",
      te:"Prevention and Management of Injection Site Reactions in Type 2 Inflammation-Targeted Biologic Therapies for Atopic Dermatitis: A Practical Clinical Algorithm for Contemporary Dermatologic Practice.",
      sum:["2型炎症の経路を標的とする生物学的製剤は、中等症から重症のアトピー性皮膚炎（AD）の治療を大きく変えました。注射部位反応（ISR）はこれらの薬剤で最も多い局所の有害事象で、治療の継続に影響しうるものです。本稿は、主要な第3相試験で報告された ISR の頻度についてのナラティブレビューに、実地診療の観察研究の知見と最近の処方動向を統合し、ISR の予防と対処の実践的な枠組みを示したものです。",
           "主要試験全体で ISR の頻度はおよそ4%から19%で、作用機序と対照群によって幅がありました。インターロイキン（IL）-4/IL-13 経路の阻害ではおよそ10〜18%（プラセボ群では6〜10%）、選択的な IL-13 阻害では4〜14%、IL-31 受容体の阻害では局所の反応がおよそ8〜15%と報告されています。実地診療の観察データとメタ解析でも、ISR の多くは軽度から中等度で治療中止に至ることはまれであり、中止率はおおむね1〜2%と報告されています。",
           "ISR は数のうえでは多いものの、通常は良性で自然に軽快し、適切な説明と支持療法で対処できると述べられています。報告される頻度のばらつきは、分子の構造・製剤・投与デバイス・試験の方法の違いを反映したもので、全身的な安全性の意味ある差を示すものではないと考えられています。あらかじめの説明と標準化された対処の流れは、不安による中止を減らし、治療の継続を支えうるとしています。"],
      use:"注射の薬を始める患者さんに、注射した場所の赤みや痛みはよくあるものの軽く済むことが多いと、前もってお伝えする材料になります。" },
    { cat:"A", pmid:"42877577", journal:"Cureus", year:2026, type:"系統的レビュー・メタ解析（14研究）",
      tj:"尋常性痤瘡：内服イソトレチノインでDLQIが改善（標準化平均差 −1.49）",
      te:"The Effect of Oral Isotretinoin on Quality of Life in Patients With Acne Vulgaris: A Systematic Review and Meta-Analysis of Patient-Reported Outcomes.",
      sum:["尋常性痤瘡は頻度の高い慢性の炎症性皮膚疾患で、心理的な健康・社会生活・生活の質を損なうことがあります。内服イソトレチノインは中等症から重症の痤瘡に有効とされてきましたが、患者さん自身が報告する生活の質への影響については、研究ごとに結果がばらついており十分に明らかになっていません。本研究は PRISMA 2020 に沿い、PubMed・Scopus・Web of Science・Cochrane Library・Google Scholar を2026年4月5日まで検索し、妥当性の検証された指標で生活の質を報告した研究を集めた系統的レビュー・メタ解析です。バイアスの危険は非無作為化研究に ROBINS-I、無作為化試験に Cochrane RoB 2 を用いて評価しました。",
           "デザイン・設定・対象の異なる14研究が系統的レビューに組み入れられました。全体として内服イソトレチノインによる治療は生活の質の改善と関連し、皮膚科に特化した指標・痤瘡に特化した指標で最も一貫した改善がみられました。独立した DLQI のデータが十分に得られた4研究で統合したところ、DLQI の有意な低下（すなわち生活の質の改善）が示されました（標準化平均差 −1.49、95%信頼区間 −2.48〜−0.51）。異質性は大きいものでした（I²=98.1%）。探索的なサブグループ解析では、重症度の混在した集団でも、重症あるいは治療抵抗性の集団でも改善がみられ、両者のあいだに統計学的に有意な差はありませんでした。",
           "内服イソトレチノインは尋常性痤瘡の患者さんの生活の質の意味のある改善と関連しうるとされますが、異質性が大きく非無作為化研究が中心であるため、統合された効果の解釈は慎重に行う必要があります。効果の大きさと持続を明らかにするには、標準化された生活の質の指標と長期の追跡を用いた、設計のよい前向き・無作為化研究が必要であると述べられています。"],
      use:"痤瘡の治療の効果をみるときに、皮疹の数だけでなく DLQI のような生活の質の指標で変化を確認する意義をご説明する材料になります。",
      note:"海外の研究で、評価された治療は本邦の保険診療の範囲とは異なります。" },
    { cat:"C", pmid:"42876987", journal:"Front Med (Lausanne)", year:2026, type:"症例報告・文献レビュー（1例）",
      tj:"火鍼：繰り返す皮膚軟部組織感染に3回施行し、1年間再発なしの1例",
      te:"Fire needle therapy for recurrent skin and soft tissue infections: a case report and literature review.",
      sum:["繰り返す皮膚軟部組織感染症（RSSTI）は、臨床での発生割合が7%から45%とされる難しい感染症で、身体的・精神的な負担と医療費の負担が続きます。化膿性の感染に対して現在の西洋医学は主に抗菌薬と切開排膿に頼りますが、抗菌薬耐性の増加と手術による侵襲という限界があり、それがさらに再発の危険を高めるとされます。中国伝統医学の外治法である火鍼は、局所の微小循環を改善し、膿の排出を助け、創の治癒を促しうると考えられており、手技が簡便で薬剤に依存しないことから新たな方法となりうると述べられています。",
           "70歳の男性が、背部の発赤・腫脹・排膿を6か月にわたり繰り返し、直前の2日で悪化して受診しました。RSSTI と診断され、以前に切開排膿を受けていましたが効果は乏しく再発を繰り返していました。火鍼療法を3回行ったところ創は完全に治癒し、1年間の追跡期間中に再発はなく、治療を通じて有害事象もみられませんでした。",
           "本症例は、選ばれた患者さんにおいて火鍼療法が RSSTI の補助的な方法となりうる可能性を示唆するものです。ただし1例のみから有効性と安全性について結論を導くことはできず、対照を置いた臨床研究がさらに必要であると述べられています。"],
      use:"切開排膿を繰り返しても治りにくい化膿性の病変について、鍼灸の併用を考える際の参考になります（1例のみの報告である点を添えてご説明ください）。",
      note:"症例報告1例のみ。" }
  ]
},
{
  date: "2026-10-16",
  range: { A: "2026-10-14〜10-16", B: "2026-10-14〜10-16", C: "2026-09-16〜10-16" },
  items: [
    { cat:"A", pmid:"42873475", journal:"Am J Clin Dermatol", year:2026, type:"系統的レビュー（19研究・4375名）",
      tj:"中等症〜重症AD：減量後の効果維持率は薬剤ごとに幅あり、急な中止より減量",
      te:"Outcomes and Predictors of Sustained Response After Dose Tapering of Targeted Therapies in Moderate-to-Severe Atopic Dermatitis: A Systematic Review.",
      sum:["中等症から重症のアトピー性皮膚炎に用いる生物学的製剤・低分子薬（デュピルマブ、トラロキヌマブ、レブリキズマブ、アブロシチニブ、バリシチニブ、ウパダシチニブ）の減量または中止を検討した研究を、PRISMA に沿って MEDLINE・Embase・Cochrane Library から 2010 年以降で検索し、19 研究・4375 名を対象に、減量後も病勢が保たれることに関連する因子を整理した系統的レビューです。",
           "減量後の効果維持率はアブロシチニブ 0〜60%、バリシチニブ 45〜61%、デュピルマブ 30〜100%、レブリキズマブ 67〜82%、トラロキヌマブ 25〜50%、ウパダシチニブ 47〜61% と薬剤間で幅がありました。維持しやすい因子としては、ベースラインの疾患活動性が低いことと早期に臨床的改善が得られたことが繰り返し挙げられました。デュピルマブでは一部のコホートで年齢が高いこと・BMI が低いこと・結節性痒疹の病型が、トラロキヌマブでは単一時点ではなく複数回の受診を通じた安定が、維持と関連していました。アブロシチニブはアレルギー合併のない軽めの病勢で成績が良く、ウパダシチニブは中止後の再燃率が高めでした。",
           "病勢が安定している一部の患者さんでは、急な中止よりも段階的な減量の方が効果が保たれやすい傾向でしたが、維持率や持続期間は薬剤の種類・研究デザイン・評価項目の定義によってばらつきが大きく、個別の減量計画を立てるにはより長期の前向き研究が必要であると述べられています。"],
      use:"症状が落ち着いた患者さんから薬を減らせるかとご相談されたときに、急にやめるより段階的に減らす方針と、薬剤ごとに維持率が異なることをご説明する材料になります。" },
    { cat:"A", pmid:"42873519", journal:"JAMA Dermatol", year:2026, type:"全国登録後方視コホート（35,845名・デンマーク）",
      tj:"扁平苔癬：口腔・性器の癌リスク上昇、20年絶対リスクは1%前後",
      te:"Cancer Risk in Patients With Overall and Site-Specific Lichen Planus.",
      sum:["扁平苔癬（LP）とその後の癌の危険、とくに部位ごとの関連は十分に確立されていません。本研究はデンマークの全国登録データを用い、1978〜2020 年に LP と新規に診断され、それ以前に癌のなかった方を国民患者登録（全 LP）と病理登録（全 LP および口腔・皮膚・性器の部位別 LP）から同定し、死亡・国外転出・2023 年 12 月 31 日まで追跡して、一般人口と比べた標準化発生比（SIR）を男女別に算出した後方視コホート研究です（解析は 2025 年 8 月 20 日〜12 月 20 日）。",
           "35,845 名（女性 21,650 名・男性 14,195 名）が解析に含まれました。女性では口唇癌 SIR 6.0（95% 信頼区間 3.3〜10.0）、口腔癌 SIR 7.5（6.4〜8.9）、舌癌 SIR 6.8（5.4〜8.4）、外陰癌 SIR 2.6（2.0〜3.4）と上昇し、有棘細胞癌もわずかに高め（SIR 1.4、1.3〜1.6）でした。一方で肺癌は低下していました（SIR 0.7、0.6〜0.8）。男性でも同様の傾向でした。部位別では口腔 LP で口腔癌、性器 LP で性器癌の危険が最も高く、20 年の絶対リスクは口腔癌が女性 0.8%・男性 1.0%、舌癌が 0.5%・0.6%、口唇癌が 0.1%・0.2%、性器癌が 0.4%・0.2% でした。",
           "LP は口腔・性器の癌の明らかな危険上昇と、皮膚癌のわずかな上昇と関連し、とくに LP の病変部位に対応する部位で高くなることが示されました。絶対リスクは低いものの、部位ごとの癌は LP の長期的な合併症として考慮すべきであると述べられています。"],
      use:"口腔や外陰部の扁平苔癬の患者さんに、絶対リスクは低いながら同じ部位を長く経過観察していく理由をご説明する材料になります。" },
    { cat:"A", pmid:"42875855", journal:"Am J Ther", year:2026, type:"系統的レビュー・メタ解析（4コホート・57,331名）",
      tj:"乾癬の生物学的製剤：IL-12/23・TNF-α・IL-17 で心血管イベントに差なし",
      te:"Meta-Analysis of Long-Term Major Adverse Cardiovascular Events of Different Biologics in Psoriatic Patients.",
      sum:["乾癬は全身性の炎症を伴い心血管イベントの危険が高いことが知られていますが、生物学的製剤の種類ごとの長期的な主要心血管イベント（MACE）への影響は明らかでありません。本研究は PubMed を 2026 年 5 月 27 日まで検索し、52 週以上追跡した乾癬の生物学的製剤の比較コホート研究と、MACE を報告した無作為化比較試験の長期非盲検延長期間を集め、ハザード比を逆分散法で統合したメタ解析です。コホート研究の質は Newcastle-Ottawa Scale で評価しました。",
           "定量的な統合には 4 つの比較コホート研究・計 57,331 名が含まれました。MACE の危険は、インターロイキン（IL）-12/23 阻害薬と TNF-α 阻害薬のあいだ（ハザード比 0.91、95% 信頼区間 0.68〜1.23）、IL-12/23 阻害薬と IL-17 阻害薬のあいだ（ハザード比 1.38、95% 信頼区間 0.73〜2.62）のいずれでも有意な差はみられませんでした。長期非盲検延長試験での MACE 発生率は、いずれの生物学的製剤でも 0〜1.33% と低い水準でした。",
           "長期の比較データが得られている範囲では、IL-12/23・TNF-α・IL-17 の各阻害薬のあいだで MACE の危険に有意な差はなく、新しい生物学的製剤の心血管系の安全性をより明確にするにはさらに長期・大規模な研究が必要であると述べられています。"],
      use:"乾癬で生物学的製剤を始める際に心臓への影響をご心配されたときに、現時点では製剤の種類による心血管イベントの差は示されていないとお伝えする材料になります。" },
    { cat:"A", pmid:"42875367", journal:"J Dermatol", year:2026, type:"後方視（50名・71スイッチ・日本）",
      tj:"日本人乾癬：難治部位は下肢が最多、生物→生物のスイッチは改善しにくい",
      te:"Refractory Psoriatic Lesions in Japanese Patients Before and After Switching Biologics.",
      sum:["生物学的製剤は尋常性乾癬（PsO）と乾癬性関節炎（PsA）の病勢を改善しますが、治療下でも残る難治部位があります。本研究は自治医科大学附属病院で 2010 年 1 月 1 日から 2019 年 12 月 31 日までに生物学的製剤を切り替えた 50 名・71 スイッチ分を後方視的に解析し、13 の解剖学的部位について切り替え時と観察終了時の難治部位を評価したものです（複数回切り替えた方は複数のスイッチとして扱っています）。",
           "PsO・PsA のいずれでも難治部位は下肢が最も多く、次いで PsO では上肢、PsA では頭部でした。難治部位の分布は切り替えの前後で概ね同様でした。スイッチ内の相関を考慮した混合効果ロジスティックモデルでは、内服から生物学的製剤に切り替えた群は生物学的製剤から別の生物学的製剤に切り替えた群より皮疹の改善が記録された割合が高く（オッズ比 2.12、P<0.001）、病型（PsO 対 PsA）では差がありませんでした（オッズ比 1.03、P=0.876）。",
           "生物学的製剤から別の生物学的製剤への切り替えを必要とする患者さんは、より治療抵抗性の集団である可能性が示唆され、下肢は切り替え後もとくに難しい部位のままであったと述べられています。部位ごとの治療反応に関わる因子を明らかにするには前向き研究が必要とされています。"],
      use:"乾癬で薬を切り替えるときに、下肢の皮疹が残りやすいことを前もってお伝えし、下肢の外用を丁寧に続けていただく説明の材料になります。" },
    { cat:"A", pmid:"42870655", journal:"J Cutan Med Surg", year:2026, type:"総説",
      tj:"乾癬と脂肪性肝疾患：IL-17 を介した関連、FIB-4 で拾う",
      te:"Clinical Implications of Interleukin-17 as a Hepato-Dermal Link in Patients With Psoriasis and Concomitant Steatotic Liver Disease.",
      sum:["乾癬は皮膚と関節を越えた全身性の炎症性疾患として理解されるようになってきました。本総説は、乾癬の患者さんで代謝異常に関連する脂肪性肝疾患（MASLD）と過度の飲酒が多く、最大で 3 分の 2 に及ぶことを背景に、インターロイキン 17（IL-17）が乾癬と MASLD をつなぐ主要な炎症性の橋渡しとなりうるという知見を整理したものです。",
           "IL-17 の値は MASLD から脂肪肝炎・肝硬変・肝細胞癌といった進行した肝疾患への移行と正の相関が報告されています。乾癬と肝疾患の併存が多いことから、とくに代謝面の危険因子や過度の飲酒がある患者さんでは MASLD を疑う目をもつことが望ましく、3 つの指標から計算する Fibrosis-4（FIB-4）指数は、実地診療に取り入れられる妥当性の検証された非侵襲的なスクリーニング手段であると述べられています。",
           "乾癬の治療薬が多様化した現在、肝毒性の可能性がある全身療法には留意し、肝への影響が中立あるいは有益となりうる治療を検討する余地があります。より大規模な前向き研究による確認は待たれるものの、MASLD のある、あるいはその危険がある適切な患者さんでは IL-17 阻害薬が妥当な選択肢となりうるデータが出てきていると述べられています。"],
      use:"乾癬の患者さんで肝機能やお酒の量が気になるときに、FIB-4 を含めた肝臓の評価を合わせて行う根拠になります（生活指導の飲酒の項目と結びつけられます）。" },
    { cat:"A", pmid:"42875675", journal:"Dermatol Ther (Heidelb)", year:2026, type:"横断・患者報告コスト研究（成人147名・ポルトガル）",
      tj:"慢性蕁麻疹：社会的費用は年1人4687ユーロ、6割はプレゼンティーイズム",
      te:"The Economic Burden of Chronic Urticaria in Portugal: A Patient-Reported Cost-of-Illness Study.",
      sum:["慢性蕁麻疹（CU）は生活の質を大きく損ないますが費用はあまり定量化されていません。本研究はポルトガルの全国患者会を通じて 2021〜2022 年に募った、医師により CU と診断された成人 147 名を対象に、社会的視点からボトムアップ・有病割合に基づく設計で年間の社会的費用を推計し、生活の質の障害と生産性損失の関連を検討した横断研究です。重症度別に AWARE 研究の分布へ事後層化し、重み付けと非重み付けの両方の推計を 2022 年ユーロ建てで示しています。",
           "重み付けした年間社会的費用は患者 1 人あたり 4687 ユーロ（非重み付け 7014 ユーロ）と推計され、そのうち 62.4%（2927 ユーロ）が出勤していても生産性が落ちるプレゼンティーイズムによるものでした。就労している方では欠勤が年 1.5 日に対し、生産性低下による損失が年 64.2 日（95% 信頼区間 40.6〜87.8）に相当しました。直接費用は 1 人あたり 1132 ユーロ（非重み付け 2500 ユーロ）で、その 64% は患者さんの自己負担でした。就労者では重症度で調整しても DLQI が 1 点悪いごとに年 270 ユーロ（95% 信頼区間 131〜408）の生産性損失と関連し、仕事に関する DLQI の項目を除いても推計は変わりませんでした。全国の推計は有病割合の想定により年 2 億〜9 億 2700 万ユーロの幅がありました。",
           "この自己選択を含む集団では、CU の社会的費用はプレゼンティーイズムが大半を占め、直接費用の多くは患者さんの負担でした。生活の質の低下は重症度とは独立に生産性損失と関連しており、患者単位の推計の方が全国への外挿より頑健であると述べられています。"],
      use:"慢性蕁麻疹の治療継続をためらわれる患者さんに、症状を抑えることが仕事の効率の維持につながるとお話しする材料になります（ポルトガルの費用データである点は添えてお伝えします）。" },
    { cat:"A", pmid:"42876360", journal:"Int J Dermatol", year:2026, type:"後方視観察研究（閉経後女性26名・52週）",
      tj:"閉経後の女性型脱毛症：外用フィナステリド0.25%で毛密度・太さが有意に改善",
      te:"Topical Finasteride 0.25% Solution for Female Pattern Hair Loss (FPHL) in Postmenopausal Women: A 52-Week Retrospective Observational Study.",
      sum:["女性型脱毛症（FPHL）は毛包が徐々に小さくなることで起こり、女性の薄毛の最も多い原因で閉経後に増えます。外用ミノキシジルが承認されていますが反応には差があり、内服フィナステリドは閉経後女性では適応外使用で全身性の副作用が懸念されます。本研究は、閉経後の FPHL の女性 26 名に外用フィナステリド 0.25% 単独療法を 52 週間行い、前頭部または頭頂部のあらかじめ定めた部位について、ベースラインと 52 週の臨床写真・トリコスコピー画像から毛密度・毛の太さ・終毛／軟毛比の変化を評価した後方視的観察研究です。忍容性と服薬遵守、患者さんと医師による有効性の評価は 3 段階の順序尺度で調べました。",
           "平均毛密度は 149.48±34.32 本/cm2 から 172.84±35.29 本/cm2（P<0.001）、毛の太さは 40.42±7.15 μm から 51.04±9.28 μm（P<0.001）、終毛／軟毛比は 1.04±0.61 から 1.56±0.64（P<0.001）へ、いずれも有意に改善しました。患者さん・医師いずれの主観的評価でも良好から非常に良好とされました。有害事象は記録されず、忍容性と服薬遵守は患者さんから高く評価されました。",
           "外用フィナステリド 0.25% の単独療法は毛密度と毛の太さの有意な改善、および良好な忍容性・遵守と関連しており、これまで選択肢が限られていた閉経後の FPHL の女性についての実地診療での予備的な観察データを示すものであると述べられています。"],
      use:"閉経後の薄毛をご相談されたときに、外用という選択肢に関する最近の報告としてご紹介できます（26名・52週の小規模な後方視研究である点は添えてお伝えします）。" },
    { cat:"A", pmid:"42873063", journal:"Int J Dermatol", year:2026, type:"総説（15の術後ケアを評価）",
      tj:"皮膚外科の術後ケア：白色ワセリンが外用抗菌薬に優る、過酸化水素は避ける",
      te:"Postoperative Wound Care in Mohs Micrographic Surgery: Tradition, Variation, and the Evidence.",
      sum:["Mohs 手術後の創傷ケアは施設差が大きく、実地のエビデンスは意外に限られています。米国では年間 100 万件を超える Mohs 手術が行われている一方、外用薬・圧迫包帯・創の洗浄・ドレッシング交換の頻度・活動制限・創チェックの間隔などの推奨は施設間で大きく異なり、臨床データではなく研修時の慣習に基づくことが多いと指摘されています。本総説は術後によく行われる 15 の実践について、それぞれのエビデンスの質を批判的に評価したものです。",
           "6 つの実践は少なくともレベル III のエビデンスに支持されており、代表的なものとして、白色ワセリンが外用抗菌薬や Aquaphor のような多成分軟膏に優ること、低刺激の石鹸と水による穏やかな洗浄、早期のシャワーの安全性、過剰な肉芽に対する酢酸浸漬、オンラインでの創チェックが挙げられました。一方で、過酸化水素やダキン液のような細胞毒性のある消毒薬はエビデンス上支持されませんでした。圧迫包帯・活動制限・ドレッシング交換の頻度など、その他の多くの術後の実践は Mohs 手術後では十分に研究されていませんでした。",
           "確立した実践を標準化しつつ、不確かな領域を率直に示していくことで、患者さんの混乱を減らし転帰を改善し、皮膚外科における今後の前向き研究の優先課題を明確にできると述べられています。"],
      use:"切除やくり抜き後の創の手入れをご説明するときに、白色ワセリンと石鹸・水での洗浄で足りることと、過酸化水素は使わない方がよいことをお伝えする根拠になります。" },
    { cat:"A", pmid:"42872880", journal:"Pharmacoepidemiol Drug Saf", year:2026, type:"多国データベース研究（欧州5か国・2017〜2023年）",
      tj:"欧州5か国のJAK阻害薬：使用は増加、投与期間は1年未満・薬剤間の切替も多い",
      te:"Temporal Trends in Janus Kinase Inhibitor (JAKi) Use Across Five European Countries: A DARWIN EU Network Study.",
      sum:["JAK 阻害薬は安全性への懸念がありながら自己免疫疾患での使用が増えています。本研究は DARWIN EU ネットワークの欧州 5 か国のデータソース（フィンランド FinOMOP-HILMO、オランダ IPCI、ドイツ IQVIA DA、ノルウェー NLHR、スペイン VID）を用い、2017 年 1 月 1 日から 2023 年 12 月 31 日までのアブロシチニブ・バリシチニブ・フィルゴチニブ・トファシチニブ・ウパダシチニブの新規使用の年間発生を推計し、使用者の特徴と治療期間を記述した薬剤疫学研究です。",
           "JAK 阻害薬の新規使用は経時的に増加し、COVID-19 流行期には一時的な減少がみられました。開始者はアブロシチニブを除き 41〜60 歳が主で、適応はアブロシチニブ以外では関節リウマチが最も多く、アブロシチニブではアトピー性皮膚炎が中心でした。治療期間の中央値は概ね 1 年未満で、トファシチニブとバリシチニブは以前に他の JAK 阻害薬を使っていた割合が最も低く、ウパダシチニブで最大 17%、フィルゴチニブで最大 16% が他の JAK 阻害薬からの切り替えでした。結果はデータソース間で一貫していましたが、発生率は対象とする医療セクターにより異なりました。",
           "JAK 阻害薬の新規使用は全体として増加し、最も多く開始されたのはトファシチニブでした。治療期間は比較的短く、JAK 阻害薬のあいだでの切り替えも多くみられ、本研究は適応の分布を示すとともに今後の安全性研究の枠組みを提供すると述べられています。"],
      use:"アトピー性皮膚炎で JAK 阻害薬をご検討のときに、欧州では同薬の適応の中心がアトピー性皮膚炎であり、実際の使用期間は 1 年未満が多いという背景としてお伝えできます。" },
    { cat:"B", pmid:"42873277", journal:"Cancer Chemother Pharmacol", year:2026, type:"前向き多施設探索研究（30名・人参養栄湯RCT附随）",
      tj:"人参養栄湯の試験に附随：血中pNF-Hは末梢神経障害の指標にならず",
      te:"Longitudinal plasma phosphorylated neurofilament-heavy chain levels in oxaliplatin-induced peripheral neuropathy: a prospective multi-institutional exploratory study.",
      sum:["化学療法に伴う末梢神経障害（CIPN）の信頼できる血中バイオマーカーは確立していません。本研究は、切除不能または再発の大腸癌で CapeOX＋ベバシズマブを受ける患者さんを対象に人参養栄湯（TJ-108）9.0 g/日を 24 週間投与する無作為化試験（NYX 試験）の一部として、軸索の障害を反映するリン酸化ニューロフィラメント重鎖（pNF-H）の血中濃度を、ベースライン・臨床的な CIPN 発症時・神経障害の回復時または 9 コース時または中止時のいずれか早い時点で ELISA 法により測定した、前向き多施設の探索研究です。CIPN は CTCAE version 5.0 で評価しました。",
           "評価可能な血液検体が得られた 30 名が対象となりました。血中 pNF-H は個人差が大きく、一定の経時的な傾向を示しませんでした。ベースラインおよび CIPN 発症時と比べ、2 回目のフォローアップ時点では軽度ながら有意な上昇がみられましたが、臨床的に評価した CIPN の発症・重症度・持続とは関連していませんでした。",
           "血中 pNF-H の経時的な測定は技術的には実施可能でしたが、オキサリプラチンによる末梢神経障害の臨床的に意味のあるバイオマーカーとしては機能しませんでした。これは、障害の主座である脊髄後根神経節の神経細胞体と、軸索を標的とする pNF-H の生物学的特異性のずれを反映している可能性があると述べられています。"],
      use:"人参養栄湯をご希望される患者さんに、同薬の無作為化試験が進んでいることをお伝えする材料になります。",
      note:"皮膚科領域外（消化器癌の化学療法に伴う末梢神経障害）。人参養栄湯の無作為化試験に附随したバイオマーカー研究で、漢方薬の有効性そのものは本論文の評価対象ではありません。" },
    { cat:"C", pmid:"42876828", journal:"Front Med (Lausanne)", year:2026, type:"ネットワークメタ解析（93RCT・7746名）",
      tj:"慢性蕁麻疹への鍼灸：痒みとQOLで上位、ただし膨疹数で抗ヒスタミン薬に優らず",
      te:"Efficacy and safety of acupuncture therapy for chronic spontaneous urticaria: a network meta-analysis based on randomized controlled trials.",
      sum:["慢性特発性蕁麻疹（CSU）は生活の質を損なう、よくみられる難治性の皮膚疾患です。本研究は CNKI・VIP・WanFang・SinoMed・PubMed・Embase・Cochrane Library・Web of Science の 8 データベースを開設時から 2025 年 7 月 31 日まで検索し、各種の鍼灸治療を検討した無作為化比較試験（RCT）を集めて、有効性と安全性をネットワークメタ解析で評価したものです（PROSPERO 登録 CRD42024608056、研究の質は Risk of Bias 2 で評価）。",
           "93 件の RCT・7746 名が含まれました。累積順位曲線下面積（SUCRA）では、有効率の改善で鍼＋自家血療法が 1 位（SUCRA 92.79%、相対危険 1.46、95% 信用区間 1.19〜1.84）、DLQI の改善で灸が 1 位（SUCRA 99.94%、平均差 −9.45、95% 信用区間 −12.48〜−6.44）、そう痒の重症度の軽減で鍼＋灸が 1 位（SUCRA 96.27%、平均差 −1.03、95% 信用区間 −1.15〜−0.91）でした。膨疹数についてはほとんどの比較で有意差がなく、いずれの鍼灸治療も抗ヒスタミン薬に統計学的に優るとは示されませんでした。IgE の低下では自家血療法＋灸が 1 位、インターロイキン 4 の低下と IFN-γ の上昇では鍼＋刺絡・吸角＋抗ヒスタミン薬が 1 位、有害事象の頻度の低さと再発率の低さでは鍼＋吸角が 1 位でした。",
           "鍼灸治療は CSU に対して良好な有効性と安全性を示しましたが、最適な治療は症状の特徴・免疫の状態・患者さんの忍容性に応じて選ぶべきであり、研究上の限界があるため結果は慎重に解釈し、より大規模で質の高い試験での検証が必要であると述べられています。"],
      use:"抗ヒスタミン薬で痒みや生活の質が十分に改善しない慢性蕁麻疹の患者さんに、鍼灸の併用を補助としてご提案する材料になります（膨疹の数では抗ヒスタミン薬に優るとは示されていない点も添えてお伝えします）。" },
    { cat:"C", pmid:"42873508", journal:"JAMA Dermatol", year:2026, type:"ランダム化偽治療対照・評価者盲検試験（204名）",
      tj:"酒さ：耳介のツボ圧迫の上乗せで8週成功率56.9%対35.3%、NNT 5",
      te:"Device-Free Auricular Acupressure for Rosacea: A Randomized Clinical Trial.",
      sum:["経皮的な耳介迷走神経刺激は酒さに有効とされますが、その神経免疫調節の作用には偽治療対照での血清生化学的な裏づけがなく、専用機器を要することが普及の妨げとなっていました。本研究は西安交通大学第二附属医院の皮膚科外来で 2025 年 10 月から 2026 年 5 月に、標準的な一次治療を受けている酒さの患者さん 204 名をブロック割り付けで 1 対 1 に分けた、単施設・ランダム化・偽治療対照・評価者盲検の試験です。実治療群は迷走神経の耳介枝が分布する両側の耳介腔に王不留行の種子を貼り、偽治療群は体性感覚のみが分布する耳介結節上縁に貼って、1 日 3 回 30 秒の圧迫を 8 週間行いました（急な悪化時は追加の圧迫を許可）。血清の LL-37・CGRP・TNF-α・インターロイキン 6 をベースラインと 8 週で測定し、直後の血管の反応はベースラインと 4 週にマルチスペクトル画像で評価しました。主要評価項目は 8 週時点で医師による全般評価（IGA）が 0 または 1 となる治療成功で、治療必要数は絶対リスク差から算出しました。",
           "204 名が各群 102 名に分かれました（実治療群：平均年齢 32.51±10.60 歳、女性 86 名 84.3%／偽治療群：平均年齢 30.82±9.32 歳、女性 86 名 84.3%）。8 週の IGA 成功率は実治療群 56.9%（58 名）対偽治療群 35.3%（36 名）で（相対危険 1.61、95% 信頼区間 1.18〜2.20、P=0.003、治療必要数 5）、血清 LL-37・CGRP・TNF-α・インターロイキン 6 はいずれも実治療群でより大きく低下しました。直後の血管の改善率は 59.3% 対 7.4%（P<0.001）で、20 週の時点でも実治療群の IGA と紅斑評価は有意に低い水準を保ちました。重篤な有害事象はありませんでした。",
           "機器を使わず必要なときに行えるこの介入は、標準的な一次治療に併用することで明らかな上乗せの臨床的利益をもたらし、その神経免疫調節の機序について偽治療対照・血清に基づく初期の根拠を示したもので、酒さの自己管理の方策となりうると述べられています。"],
      use:"酒さの赤みが外用や内服で残る患者さんに、ご自身でできる耳介のツボ圧迫を併用としてご案内する材料になります（中国の単施設試験である点は添えてお伝えします）。" }
  ]
},
{

  items: [
    { cat:"A", pmid:"42868105", journal:"Skin Pharmacol Physiol", year:2026, type:"ランダム化二重盲検プラセボ対照試験（成人60名）",
      tj:"成人AD：セラミドNP配合保湿剤の上乗せ、傾向は良好だが群間有意差なし",
      te:"Effect of a Ceramide NP-Containing Moisturizer on Skin Barrier Function in Adults with Atopic Dermatitis: A Randomized, Double-Blind, Placebo-Controlled Study.",
      sum:["成人の中等症アトピー性皮膚炎 60 名を対象に、標準治療に加えてセラミド NP を配合した保湿クリームまたはプラセボを 1 対 1 で割り付け、21 日目と 42 日目に皮膚バリア機能と臨床成績を評価した単施設のランダム化・二重盲検・プラセボ対照の並行群間試験です。",
           "両群ともに角層水分量・経表皮水分蒸散量（TEWL）・皮脂量といったバリア指標が全体として改善し、数値の傾向は介入群でより良好でしたが、ベースラインからの変化量の群間差は統計学的な有意差に達せず、皮膚表面 pH にも群間差はみられませんでした。EASI・SCORAD・DLQI・そう痒と不眠の VAS はいずれも両群でベースラインから有意に改善し（P<0.05）、改善の程度は 21 日目より 42 日目でより明らかでした。",
           "標準治療への上乗せとして、この保湿クリームは皮膚バリア指標と臨床症状の改善に良好な傾向を示したものの、有効性と長期的な価値を確認するにはより大規模で厳密に設計された試験が必要であると述べられています。"],
      use:"保湿剤の選び方をご相談されたときに、標準治療とあわせた保湿の継続で症状が改善し、効果は 3 週より 6 週の方がはっきりしてくる点をご説明する材料になります。" },
    { cat:"A", pmid:"42869768", journal:"Clin Ther", year:2026, type:"後方視コホート（小児37名・うち35名を追跡）",
      tj:"小児AD：デュピルマブ中止後 77% が再燃、無再燃期間の中央値150日",
      te:"Relapse After Dupilumab Discontinuation in Pediatric Moderate-to-Severe Atopic Dermatitis: A Single-Center Retrospective Study From China.",
      sum:["デュピルマブを 16 週以上使用した中等症から重症のアトピー性皮膚炎の小児 37 名のうち、中止して中止後の経過を追えた 35 名について、再燃の様子と再燃に関連する因子を検討した中国・単施設の後方視研究です。無再燃生存を Kaplan-Meier 法で評価し、発症年齢とベースラインの好酸球絶対数を含む Cox モデルを事前に設定して解析しました。",
           "追跡に入った 35 名のうち 27 名（77.1%）が再燃し、無再燃期間の中央値は 150 日（95% 信頼区間 120〜240 日）でした。デュピルマブ単独と皮下免疫療法併用のあいだに有意な差はみられませんでした（log-rank P=0.709）。事前に設定した 2 変数の Cox モデルでは、発症年齢が遅いほど（ハザード比 0.76、95% 信頼区間 0.54〜1.07、P=0.115）、ベースラインの好酸球数が高いほど（ハザード比 0.39、95% 信頼区間 0.13〜1.18、P=0.094）再燃の危険が低い方向でしたが、いずれも統計学的な有意差には達しませんでした。",
           "この小規模な後方視コホートでは中止後の再燃は多くみられ、発症年齢と好酸球数はさらに検討する価値があるものの、現時点のデータではどちらも再燃の予測因子として確立されていないと述べられています。より大規模な前向き研究が必要とされています。"],
      use:"小児でデュピルマブの中止をご希望されたときに、中止後の再燃が少なくないことと、無再燃期間の目安（中央値およそ5か月）をお伝えする材料になります。" },
    { cat:"A", pmid:"42868059", journal:"Dermatology", year:2026, type:"系統的レビュー・メタ解析（16研究）",
      tj:"喫煙と乾癬：現在喫煙でリスク1.89倍、過去喫煙でも1.45倍",
      te:"Smoking Status and Psoriasis Risk: An Updated Systematic Review and Meta-Analysis.",
      sum:["喫煙は以前から乾癬の環境因子として指摘されてきましたが、これまでの研究やメタ解析の結果は一致していませんでした。本研究は PubMed・Embase・Cochrane Library をデータベース開設時から 2025 年 8 月 8 日まで PRISMA に沿って検索し、喫煙状況（現在喫煙・過去喫煙）と乾癬の危険の関連を検討したコホート研究・ケースコントロール研究・横断研究を対象に、調整済みオッズ比またはハザード比を統合した最新の系統的レビュー・メタ解析です。",
           "16 研究が解析に含まれ、現在喫煙・過去喫煙のいずれも乾癬の危険の上昇と関連していました。統合オッズ比は現在喫煙者で 1.89（95% 信頼区間 1.50〜2.39）、過去喫煙者で 1.45（95% 信頼区間 1.25〜1.68）で、研究間に有意な異質性がみられました。地域差もあり、アジアでは現在喫煙者の危険が高め（オッズ比 2.19、95% 信頼区間 0.96〜4.99）、欧州と米州では過去喫煙者の危険が高めでした（欧州：オッズ比 1.62、95% 信頼区間 1.46〜1.79、米州：オッズ比 1.39、95% 信頼区間 1.28〜1.52）。感度分析でも結果は安定していました。",
           "喫煙は乾癬の危険の上昇と関連する、修正可能な因子であることが改めて支持され、乾癬の予防や公衆衛生の方策で考慮すべきであると述べられています。"],
      use:"乾癬の患者さんに禁煙をおすすめするとき、現在喫煙でおよそ1.9倍という具体的な数値をお示しできる根拠になります（生活指導の喫煙の項目と結びつけられます）。" },
    { cat:"A", pmid:"42870207", journal:"Dermatol Ther (Heidelb)", year:2026, type:"多施設後方視コホート（573名・770治療ライン）",
      tj:"乾癬：肥満で生物学的製剤の一次無効が2.75倍（770治療ライン）",
      te:"Obesity and Early Biologic Failure in Psoriasis: An Italian Multicentre Retrospective Cohort Study.",
      sum:["肥満は乾癬における生物学的製剤の効果を下げる可能性が指摘されていますが、中止の理由別の影響は十分に分かっていません。本研究はイタリアの 5 施設で生物学的製剤を使用した尋常性乾癬の患者さんを対象に、治療ラインごとに Kaplan-Meier 法と Cox 比例ハザードモデルを用いて、肥満（BMI 30 kg/m2 以上）と薬剤の継続期間、とくに一次無効および薬剤の種類との関連を検討した後方視の多施設コホート研究です。",
           "573 名から 770 治療ラインが得られ、BMI が判明した 562 名のうち 193 名（34.3%）が肥満でした。一次無効は肥満のある方の治療ラインで 17.0%、肥満のない方で 5.8%（log-rank P<0.001）でした。調整後の Cox モデルで肥満は一次無効の危険の上昇と関連し（ハザード比 2.75、95% 信頼区間 1.59〜4.77）、BMI が 5 kg/m2 上がるごとに危険は 37% 高くなりました（ハザード比 1.37、95% 信頼区間 1.14〜1.65）。TNF-α 阻害薬と比べると IL-17 阻害薬（ハザード比 0.49、95% 信頼区間 0.24〜0.97）と IL-23 経路阻害薬（ハザード比 0.47、95% 信頼区間 0.24〜0.93）で一次無効の危険は低めでした。肥満は二次無効や安全性による中止とは関連していませんでした。",
           "肥満は乾癬における生物学的製剤の早期の無効と主に関連し、その関連は TNF-α 阻害薬で最も明らかであったと述べられています。"],
      use:"乾癬で生物学的製剤を始める前に、体重の管理が治療の効きに関わりうることをご説明する材料になります（生活指導の体重・食事の項目と結びつけられます）。" },
    { cat:"A", pmid:"42870206", journal:"Dermatol Ther (Heidelb)", year:2026, type:"eDelphi 合意形成（専門医104名が回答）",
      tj:"湿疹と乾癬の重なり：専門医104名が43項目のうち42項目で合意",
      te:"Eczema-Psoriasis Overlap: An eDelphi Consensus on Clinical Presentation and Therapeutic Management Among Italian Experts.",
      sum:["アトピー性皮膚炎と乾癬は、それぞれ Th2 経路と Th1・Th17 経路が主に関わる別の病気と考えられてきましたが、湿疹様の皮疹と乾癬様の皮疹が同時に、あるいは前後して現れる患者さんがいることが分かってきました。本研究は、この重なりの臨床的な定義と対応についてイタリアでの合意をつくることを目的に、8 名の皮膚科医の運営委員会が「問題の定義」「臨床像」「治療の進め方」の 3 領域で 43 項目の文を作成し、131 名の皮膚科医に 1〜9 の数値評価尺度で評価してもらう eDelphi 法を行ったものです。平均 7 点以上を合意としました。",
           "131 名のうち 104 名（79.4%）が回答し、43 項目のうち 42 項目で合意に達しました。合意に至らなかったのは、乾癬における生物学的製剤の選択に呼吸器のアレルギー併存症がどう影響するかという項目のみで、二者択一的な性質のため修正・再投票は行われませんでした。",
           "湿疹と乾癬は免疫の調節の乱れという連続した広がりのうえに存在し、前後して、あるいは同時に現れ、表現型の入れ替わりが自然にも薬剤によっても起こりうるとまとめられています。薬剤による形の危険因子を評価して治療を選ぶべきで、軽症では外用療法で対応できることが多く、中等症から重症では T 細胞をより広く標的とする治療が必要になりうると述べられています。"],
      use:"湿疹と乾癬のどちらとも言いにくい皮疹の患者さんに、両者が重なることがあり経過で見極めていく方針をご説明する材料になります。" },
    { cat:"A", pmid:"42870452", journal:"Ann Pharmacother", year:2026, type:"系統的レビュー（第2b相プログラム5研究・364名）",
      tj:"非分節型白斑：リトレシチニブ50mg、nbUVB併用で顔の色素再生が増強",
      te:"Ritlecitinib in Nonsegmental Vitiligo: A Systematic Review and Comprehensive Program Synthesis of Clinical Efficacy, Safety, and Biomarker Outcomes.",
      sum:["JAK3 と TEC ファミリーキナーゼを選択的に阻害する経口薬リトレシチニブの、成人の非分節型尋常性白斑に対する有効性と安全性を評価した系統的レビューです。2026 年 8 月 31 日までに PubMed・Web of Science・Scopus・ClinicalTrials.gov・Cochrane Library を検索し、単独または狭帯域 UVB（nbUVB）併用の臨床試験を対象に、第 2b 相プログラムの相互に関連する 5 研究・計 364 名を質的に統合しました。",
           "リトレシチニブ 50 mg 1 日 1 回は 24 週時点で顔の色素再生を有意に示し、F-VASI のベースラインからの変化率はプラセボの +2.1% に対して −18.5% から −21.2% でした。nbUVB の併用で効果は有意に高まり（F-VASI 変化率 −69.6% 対 −55.1%、P=0.009）、全身の色素再生も向上しました。肌の色がより濃い方（Fitzpatrick IV〜VI 型）はより早く大きな反応を示しました（−37.4%、I〜III 型は −15.2%）。安全性はプラセボと同程度で、有害事象の全体の発生率は 60.0〜86.2%、重篤な有害事象はまれ（2% 以下）でした。バイオマーカーでは Th1 関連の CXCL9・IFNG の低下と、チロシナーゼや Melan-A といったメラノサイトのマーカーの回復が確認されました。",
           "リトレシチニブ 50 mg 1 日 1 回は活動性の非分節型尋常性白斑に対する良好な耐容性をもつ経口の全身療法であり、48 週まで色素再生が続いたと述べられています。効果は nbUVB の併用で最適化され、治療前の肌の色の型が色素再生の速さと程度を予測する重要な因子であるとされています。"],
      use:"白斑の治療の見通しをご相談されたときに、光線療法との併用で効果が高まることと、効果が現れるまでに時間がかかることをご説明する材料になります。" },
    { cat:"A", pmid:"42868293", journal:"Cutis", year:2026, type:"総説",
      tj:"痤瘡への次亜塩素酸外用：BPOと同程度の病変減少で刺激が少ない可能性",
      te:"Topical Hypochlorous Acid for Acne Vulgaris: Mechanisms, Clinical Evidence, and Therapeutic Potential.",
      sum:["尋常性痤瘡（にきび）は Cutibacterium acnes・皮脂腺の活動・自然免疫の活性化によって生じ、炎症や瘢痕、生活の質の低下につながります。標準的な外用・全身療法は有効ですが、刺激感や副作用、抗菌薬耐性によって使用が制限されることがあります。本総説は外用の次亜塩素酸（HOCl）の機序と臨床の知見を整理したものです。",
           "次亜塩素酸は NF-κB および MAPK シグナルの阻害を介して、抗菌作用・バイオフィルムを壊す作用・抗炎症作用を示すと述べられています。予備的な研究では、過酸化ベンゾイルと同程度の病変の減少が得られ、耐容性はより良好でバリアの破壊もみられなかったとされています。",
           "より規模の大きな対照試験の結果を待つ段階ではありますが、痤瘡の補助的な外用治療として可能性があると述べられています。"],
      use:"外用薬の刺激感でお困りのにきびの患者さんに、刺激の少ない選択肢が検討されつつあることをお伝えする材料になります（現時点では補助的な位置づけです）。" },
    { cat:"A", pmid:"42868298", journal:"Cutis", year:2026, type:"総説",
      tj:"にきびに見える真菌感染：ステロイド外用後に見分けにくくなる",
      te:"When Fungal Infections Mimic Acne: Diagnostic Pitfalls and Practical Approaches.",
      sum:["白癬の一種である tinea incognita（ステロイド外用などで典型像が変わった白癬）や Majocchi 肉芽腫、さらに Malassezia 毛包炎は、にきびができやすい部位に毛包性の小さな隆起や膿を伴う皮疹として現れ、尋常性痤瘡と誤って診断されることが少なくないと述べられています。とくにステロイド外用後は臨床像が変わるため見分けが難しくなります。",
           "これらを早く見分けることは、症状の長期化を防ぎ、感染を悪化させて適切な治療を遅らせうるステロイドなどの不適切な治療を避けるために重要であるとされています。",
           "本総説は、にきびと見誤られやすい真菌感染について、見分けるための臨床的な特徴、よくある診断の落とし穴、評価の進め方を実践的に整理しています。"],
      use:"にきびとして治療しても改善しない方や、ステロイド外用後に形が変わった皮疹の方で、真菌感染を疑って検査を考える手がかりになります。" },
    { cat:"A", pmid:"42870108", journal:"Eur J Clin Pharmacol", year:2026, type:"不均衡分析（EudraVigilance の自発報告）",
      tj:"JAK阻害薬とメラノーマ：欧州の副作用報告で4剤にシグナル",
      te:"Cutaneous melanoma and JAK inhibitors: a disproportionality analysis in EudraVigilance.",
      sum:["JAK 阻害薬は皮膚の悪性腫瘍との関連が指摘されてきましたが、メラノーマ（悪性黒色腫）はトファシチニブを除いて添付文書に記載がありません。本研究は欧州の副作用報告データベース EudraVigilance を用い、JAK 阻害薬への曝露と「皮膚メラノーマ（眼を除く）」との関連を報告オッズ比で評価したケース・ノンケース研究です。",
           "2025 年 4 月 30 日までに、トファシチニブ 158 件、ルキソリチニブ 65 件、ウパダシチニブ 42 件、バリシチニブ 21 件、フィルゴチニブ 2 件、アブロシチニブ 1 件の報告がありました。報告オッズ比の解析では、バリシチニブ・ルキソリチニブ・トファシチニブ・ウパダシチニブへの曝露とこの有害事象のあいだにシグナルが認められました。個別症例で最も多くコード化されていた悪性黒色腫について変数との関連をみると、薬剤（P=0.0014）と適応（P=0.0037）で統計学的に有意な関連がみられました。",
           "これらは仮説を生み出す段階の所見であり、因果関係の証拠と解釈すべきではないと明記されています。交絡や監視バイアスの影響がありうる一方でメラノーマは重大であるため、JAK 阻害薬を使用中の患者さん、とくにメラノーマの危険因子を併せ持つ方では、臨床的な注意と適切な皮膚の観察を続けることが支持されると述べられています。"],
      use:"JAK 阻害薬を使用中の方の定期診察で、ほくろや色素斑の変化を一緒に確認する意義をご説明する材料になります（因果関係は示されていない点も添えてお伝えします）。" },
    { cat:"A", pmid:"42870596", journal:"Biomed Environ Sci", year:2026, type:"全国横断研究（心血管代謝疾患のある成人118,036名）",
      tj:"慢性蕁麻疹：心血管代謝疾患のある成人で有病率2.90%、喫煙と睡眠時間が関連",
      te:"A Nationwide Cross-Sectional Study of Chronic Urticaria in Chinese Adults with Cardiometabolic Diseases: Epidemiology, Risk Factors, and Effect on Disease Management.",
      sum:["心血管代謝疾患（高血圧・糖尿病・脂質異常症など）のある中国の成人における慢性蕁麻疹の疫学と危険因子、および心血管代謝疾患の認知・治療・管理への影響を調べた研究です。2018〜2019 年の中国慢性疾患・危険因子サーベイランスに参加した心血管代謝疾患のある成人 118,036 名のデータを用い、複雑な標本設計を考慮して重み付け有病率と認知率・治療率・管理率を推定し、慢性蕁麻疹の危険因子を多変量ロジスティック回帰で検討した全国横断研究です。",
           "心血管代謝疾患のある方における慢性蕁麻疹の重み付け有病率は 2.90% で、60〜69 歳で最も高く 3.94%、女性（3.41%）が男性（2.56%）より高く、とくに農村部で顕著でした。主な危険因子は現在の喫煙（オッズ比 1.17、95% 信頼区間 1.06〜1.29）と睡眠時間の偏り（5 時間未満：オッズ比 1.79、95% 信頼区間 1.61〜1.99、10 時間超：オッズ比 1.39、95% 信頼区間 1.19〜1.61）でした。慢性蕁麻疹のある方は、ない方と比べて心血管代謝疾患の認知率（高血圧 50.71% 対 40.27%、糖尿病 47.14% 対 36.21%、脂質異常症 30.71% 対 17.12%）と治療率（高血圧 41.37% 対 34.22%、糖尿病 41.31% 対 32.52%、脂質異常症 18.29% 対 9.94%）が高い一方、管理の達成率は同程度でした。",
           "慢性蕁麻疹は心血管代謝疾患のある方に多くみられ、特徴的な人口統計学的・生活習慣の危険因子と関連していました。慢性蕁麻疹があることで心血管代謝疾患の発見は早まるものの管理の改善にはつながっておらず、皮膚科と心血管代謝の診療を統合して診る必要があると述べられています。"],
      use:"慢性蕁麻疹の方に、喫煙と睡眠時間の偏りが関連として報告されていることをお伝えし、生活指導（禁煙・睡眠）につなげる材料になります。" },
    { cat:"B", pmid:"42865816", journal:"JGH Open", year:2026, type:"動物実験＋in vitro（マウス・腹腔マクロファージ）",
      tj:"大建中湯と乾姜：マウスの肝虚血再灌流障害をHO-1誘導で軽減",
      te:"Daikenchuto and Processed Ginger Alleviate Liver Ischemia-Reperfusion Injury by Enhancing Anti-Inflammatory Effects and HO-1 Production.",
      sum:["大建中湯は消化管の運動を促す作用から外科診療で広く用いられ、消化管における抗炎症作用もよく知られていますが、肝臓の虚血再灌流障害（IRI）における役割は明らかではありませんでした。本研究は雄の C57BL/6 マウスに大建中湯 3.6% を含む餌、または構成生薬を単独で含む餌を 1 週間与えたうえで 60 分の部分肝虚血を行い、血中の肝酵素・組織像・TUNEL 染色で肝障害を評価し、門脈血のアドレノメデュリン（ADM）と肝の HO-1 発現も測定したものです。あわせて腹腔マクロファージを HMGB1 で刺激し、大建中湯と 6-ショウガオール（6SG）の効果を検討しました。",
           "大建中湯は対照と比べて血中 ALT・壊死領域・肝細胞のアポトーシスを有意に減らしました。大建中湯の処方中の量に相当する単独生薬では保護作用は得られませんでしたが、乾姜（処理生姜）を 3 倍量にすると大建中湯と同様の肝保護作用が再現されました。大建中湯は門脈血の ADM を上げず、一方で大建中湯と 6SG はいずれも生体内で HO-1 発現を有意に高め、HMGB1 で刺激したマクロファージの炎症性サイトカイン産生を抑えました。",
           "大建中湯は ADM の上昇ではなく HO-1 の誘導とマクロファージを介した炎症の抑制によって肝虚血再灌流障害を軽減し、この保護作用には少なくとも一部、乾姜が関わっている可能性があると述べられています。"],
      use:"大建中湯を消化管の目的で服用中の方に、基礎研究では抗炎症の働きも報告されていることをお伝えする程度にとどめ、ヒトでの効果は未確認と添えます。",
      note:"マウスと培養細胞による基礎研究で、皮膚領域外（肝臓）の報告です。" },
    { cat:"C", pmid:"42864288", journal:"Zhongguo Zhen Jiu", year:2026, type:"臨床観察研究（141名）",
      tj:"慢性胃腸疾患の体表反応点：皮膚電気抵抗の変化率が痛みの強さと相関",
      te:"[Skin resistance measurement in chronic gastrointestinal disorders and its correlation with visceral referred pain].",
      sum:["慢性胃腸疾患の患者さんにみられる体表の反応点を観察し、その電気抵抗値と内臓からの関連痛の強さとの関連を調べた臨床研究です。慢性胃炎 103 名と炎症性腸疾患 38 名を対象に、痛みの強さで軽度・中等度・重度の 3 群に分け、指で押して体幹と四肢を探って反応点と対照点を同定し、神経の皮膚分節（デルマトーム）の図に記して分布を観察したうえで、経絡・経穴の動態分析装置で両者の抵抗値を測定し、抵抗変化率と痛みの強さの相関を解析しました。",
           "慢性胃炎では反応点は主に右側の T8〜T9 の神経分節に、炎症性腸疾患では主に右側の T10〜T12 の神経分節に分布していました。いずれの疾患でも反応点の抵抗値は対照点より低く（P<0.05）、重度の痛みの群では対照点の抵抗値が軽度の群より低く（P<0.05）、中等度・重度の群の抵抗変化率は軽度の群より高い値でした（P<0.05）。女性では抵抗変化率と関連痛の強さに正の相関がみられました（P<0.01）。",
           "慢性胃腸疾患の反応点は主にそれぞれの臓器に対応する神経分節が支配する体表の部位に分布し、抵抗が低下しており、反応点の抵抗変化率は軽い痛みと強い痛みを見分けるのに利用できると述べられています。"],
      use:"胃腸の不調を伴う方の鍼灸の施術で、背部や腹部の圧痛点を探す際に、神経分節に沿った部位を丁寧に確認する裏づけになります。",
      note:"皮膚疾患そのものではなく、体表（皮膚）の電気抵抗と内臓由来の関連痛との関連を扱った研究です。" }
  ]
},
{
  date: "2026-10-14",

  items: [
    { cat:"A", pmid:"42864314", journal:"Signal Transduct Target Ther", year:2026, type:"総説",
      tj:"痤瘡の総説：C. acnes を標的とするワクチン・生物学的製剤まで",
      te:"Acne: epidemiology, risk factors, pathogenesis, management and cutting-edge research.",
      sum:["尋常性痤瘡（にきび）について、疫学・危険因子・診断分類・併存症から、免疫病態と分子機構、現在の治療と今後の方向性までを体系的に整理した総説です。",
           "病態は皮脂の過剰産生・毛漏斗部の異常な角化・Cutibacterium acnes の過剰定着・宿主免疫応答の調節異常が複雑に関わるとされ、皮脂腺の活動・炎症の調節・ホルモン代謝に関わる経路の遺伝的多型が関与し、マクロファージや樹状細胞などの免疫細胞の相互作用も病態に寄与すると述べられています。皮膚の症状以外に不安・抑うつといった心理的な併存症がしばしばみられ、生活の質に大きく影響するとされます。従来の治療は抗菌薬耐性の増加と治療の継続率の低さという課題を抱えており、C. acnes を標的とした生物学的製剤やワクチンが臨床研究で有望性を示していると紹介されています。",
           "機序に基づいた標的性のある精密な治療戦略へと臨床研究・診療の関心が移りつつあり、本総説は今後の機序研究と治療開発の参照となることを目的としていると述べられています。"],
      use:"にきびの患者さんに、皮脂・角化・菌・免疫という複数の要因が重なることと、心理面への影響も含めてご説明するときの土台になります。" },
    { cat:"A", pmid:"42864532", journal:"Am J Clin Dermatol", year:2026, type:"総説（第2b/3相 ALLEGRO 試験ほか）",
      tj:"重症円形脱毛症のリトレシチニブ：24週で脱毛20%以下を有意に増やす",
      te:"Ritlecitinib: A Review in Severe Alopecia Areata.",
      sum:["リトレシチニブ（Litfulo）は JAK3 と TEC ファミリーキナーゼを阻害する経口薬で、成人および12歳以上の青年の重症円形脱毛症に対して複数の国で承認されています。本総説はその臨床成績をまとめたものです。",
           "頭部の50%以上の脱毛を有する成人・青年を対象とした主要なランダム化・二重盲検・プラセボ対照の第2b/3相 ALLEGRO 試験で、リトレシチニブ 50 mg 1日1回は 24 週時点で頭部の脱毛が 20% 以下となった方の割合をプラセボと比べて有意に増やしました。患者さんご自身による評価（Patient's Global Impression of Change など）も改善し、主要な有効性の指標の反応率は 48 週まで上昇を続け、非盲検の第3相 ALLEGRO-LT 試験では最長3年間維持されました。長期の治療は健康関連の生活の質の改善も伴い、有害事象はほとんどが軽度から中等度で、概ね良好な耐容性でした。",
           "長期の安全性を十分に明らかにするにはさらなるデータが必要ですが、現時点で得られているデータからは、承認された治療選択肢が限られる青年を含め、重症円形脱毛症に対する価値ある新しい選択肢であると述べられています。"],
      use:"重症の円形脱毛症で治療の見通しをご相談されるときに、効果が時間をかけて上がっていくことと長期の成績をご説明する材料になります。" },
    { cat:"A", pmid:"42863815", journal:"Pediatr Dermatol", year:2026, type:"後方視観察コホート（13 名・62 回の評価）",
      tj:"小児AD：振動＋冷却でネモリズマブ注射の痛みは中央値0（13例）",
      te:"Injection-Related Pain During Nemolizumab Treatment With Standardized Vibration-and-Cooling Analgesia in Children With Atopic Dermatitis: A Real-World Observational Study.",
      sum:["注射の痛みと針への不安は、小児のアトピー性皮膚炎で生物学的製剤の受け入れや継続を妨げることがあります。本研究は、標準化した振動＋冷却による鎮痛のもとでのネモリズマブ投与時の注射痛を経時的に定量し、早期の臨床成績を評価する目的で、6〜12歳の中等症から重症のアトピー性皮膚炎の小児のうち 2024年6月から 2025年7月にネモリズマブ 30 mg を4週ごとに16週間完了した方を対象に行われた後方視的観察コホート研究です。注射痛は各注射の直後に Wong-Baker FACES 痛み評価尺度（0〜10）で評価しました。",
           "13 名から予定 65 回のうち 62 回の痛みの評価が得られ、注射痛は一貫してごく軽度（中央値 0、四分位範囲 0〜2）で、強い痛み（8点以上）を訴えた児はいませんでした。16 週時点で EASI の改善は中央値 87.5%（IQR 73.7〜90.3）、EASI-75 の達成は 13 名中 9 名（69.2%）でした。最大そう痒 NRS は中央値 5.0 点（IQR 3.0〜6.0）、POEM は中央値 7.0 点（IQR 4.0〜12.0）改善し、重篤な有害事象はありませんでした。",
           "標準化した振動＋冷却による鎮痛のもとでは、ネモリズマブの投与は最小限の注射痛と早期からの大きな臨床的改善を伴ったと述べられています。ただしこれらの結果は、鎮痛を行わない場合のネモリズマブ本来の注射痛を表すものではないと注記されています。"],
      use:"小児で注射をためらわれるご家族に、振動と冷却を併用した投与の工夫と16週までの改善の目安をご説明する材料になります。" },
    { cat:"A", pmid:"42864808", journal:"Dermatitis", year:2026, type:"後方視コホート＋横断調査（マッチ 494,292 名・調査 16,038 名）",
      tj:"乳幼児AD：不安・行動の問題のリスクが1.36倍（49万人マッチ解析）",
      te:"Atopic Dermatitis and Emotional and Behavioral Outcomes in Infants and Toddlers: A U.S. Population-Based Study.",
      sum:["乳児期のアトピー性皮膚炎は数年後の不安・抑うつ・行動の問題と関連することが知られていますが、乳児期・幼児期の早期の情緒・行動のサインとの関連は十分に検討されていません。本研究は複数の独立したデータ源を用い、米国の TriNetX Collaborative Network で 12〜23 か月のアトピー性皮膚炎のある児と非該当の対照を、人口統計学的要因と神経発達症に基づいて1対1の傾向スコアマッチングを行い、1年追跡して Cox 回帰で不安と破壊的な行動の問題のハザードを比較しました。あわせて 1998〜2024 年の国民健康聞き取り調査（NHIS）の 0〜23 か月の乳児と 24〜35 か月の幼児について、社会人口学的要因と神経発達症で調整したロジスティック回帰で、情緒・行動のスクリーニングの陽性のオッズを比較しました。",
           "TriNetX のコホートはマッチした乳児 494,292 名で、アトピー性皮膚炎のある乳児は不安と破壊的な行動の問題の危険が高くなっていました（ハザード比 1.36、95% 信頼区間 1.28〜1.45）。NHIS の乳児 1,785 名・幼児 14,253 名の標本では、アトピー性皮膚炎は情緒・行動のスクリーニングの陽性と関連し、乳児で調整オッズ比 1.76（95% 信頼区間 1.23〜2.52）、幼児で調整オッズ比 1.66（95% 信頼区間 1.47〜1.88）でした。",
           "乳児期のアトピー性皮膚炎に関連する情緒・行動の問題は乳児期・幼児期から始まるという一貫した証拠が得られ、早期のスクリーニングの価値を支持すると述べられています。スクリーニングが陽性の場合は、より強力な外用薬や全身療法といった治療の強化が妥当となりうるとも記載されています。"],
      use:"乳幼児のアトピー性皮膚炎で、かゆみと睡眠だけでなくお子さんの機嫌や行動の変化にも目を向けて、治療を強めるかをご相談するときの材料になります。" },
    { cat:"A", pmid:"42862557", journal:"JAMA Netw Open", year:2026, type:"前向きコホート（Project Viva・1,324 組）",
      tj:"妊娠中の食事：地中海食スコア1点ごとに乳児の湿疹＋コリックが0.85倍",
      te:"Maternal Prenatal Diet and Colic and Eczema Among Infants.",
      sum:["乳児のコリック（長く泣き続けること）は腸と脳の相互作用の障害で、原因は十分に分かっていません。本研究は、母体の食事の質とアレルギーを起こしやすい特定の食品の摂取が乳児の湿疹とコリックとどう関連するかを推定する目的で、米国東部マサチューセッツで 1999年4月から 2002年11月に妊娠初期に登録された、アトピーの危険によって選別していない母子 2,128 組の前向きコホート（Project Viva）を用いて行われました。妊娠初期（中央値 9.9 週）と妊娠中期（中央値 27.9 週）の食物摂取頻度調査から地中海食スコア（MDS）と食事性炎症指数（DII）を算出し、生後中央値 6.3 か月の時点で母親からの報告によりコリックの症状と湿疹の診断を評価しました。",
           "曝露と結果のデータが揃った 1,324 組のうち、湿疹のみが 152 名（11.5%）、コリックのみが 273 名（20.6%）、両方が 61 名（4.6%）でした。母体の年齢・人種・民族・学歴・経産・喫煙・アトピーで調整した多項ロジスティック回帰では、MDS が高いほどコリックと湿疹の併存のオッズが低く（1点あたりオッズ比 0.85、95% 信頼区間 0.74〜0.98）、DII が高いほど高くなりました（1点あたりオッズ比 1.34、95% 信頼区間 1.12〜1.61）。どちらの食事スコアも湿疹のみ・コリックのみとは関連しませんでした。魚介類の摂取は週1食あたりコリックと湿疹の併存のオッズの低さと関連し（オッズ比 0.75、95% 信頼区間 0.58〜0.97）、ナッツの摂取は湿疹のない児のコリックの危険と関連しました（ナッツまたはピーナッツ週1食あたりオッズ比 1.05、95% 信頼区間 1.00〜1.09）が、コリックと湿疹の併存とは関連しませんでした（オッズ比 0.97、95% 信頼区間 0.88〜1.07）。乳製品と卵の摂取はいずれの結果とも関連しませんでした。食事スコアと魚の摂取とコリックとの関連は、アトピーのある母親の児でより強くみられました。",
           "この 1,324 組のコホート研究では、母体の食事の質の低さと魚介類の摂取の少なさが、湿疹を伴う乳児のコリック、あるいは母親のアトピーの既往と関連していたと述べられています。"],
      use:"院内アプリ「生活指導アシスタント」の食事・食物アレルギーのご案内で、妊娠中は特定の食品を避けるよりも食事全体の質と魚介類に目を向ける、という考え方をお話しする参考になります。",
      note:"観察研究であり、因果関係は示されていません。" },
    { cat:"A", pmid:"42862885", journal:"Clin Exp Dermatol", year:2026, type:"前向きコホート（単施設・38 名・12 週）",
      tj:"尋常性白斑：ウパダシチニブ＋NB-UVB で12週T-VASI50が47.4%対5.3%",
      te:"Upadacitinib Combined with NB-UVB for Non-Segmental Vitiligo: A Single-Center Prospective Study.",
      sum:["尋常性白斑は慢性の自己免疫性の脱色素性疾患で、活動期や治療に抵抗性の方に対する治療選択肢は限られています。本研究は、活動期の非分節型尋常性白斑で以前の治療への反応が不十分な成人を対象に、経口ウパダシチニブ 15 mg 1日1回とナローバンド UVB（NB-UVB）の併用、または NB-UVB 単独を 12 週間行い、12 週時点で白斑面積スコア（T-VASI）が 50% 以上改善すること（T-VASI50）を主要評価項目として、有効性と安全性を評価した前向きコホート研究です。副次評価項目は T-VASI・顔面 VASI・Vitiligo Extent Score（VES）・疾患活動性および改善のスコア（VDAS／VDIS）の変化でした。",
           "計 38 名（各群 19 名）が組み入れられ、12 週時点の T-VASI50 の達成は併用群 47.4%、NB-UVB 単独群 5.3%（P=0.0078）でした。T-VASI の平均改善率は 49.1%±20.3% 対 18.7%±14.3%、VES は 44.6%±20.1% 対 18.6%±13.8%（いずれも P<0.01）で併用群が有意に良好でした。体幹と四肢の非末梢の病変でより良い反応がみられ、顔面の成績には両群で有意な差はありませんでした。有害事象はすべて軽度で、重篤な有害事象の報告はありませんでした。",
           "経口ウパダシチニブと NB-UVB の併用は NB-UVB 単独より短期の有効性が優れ、安全性も許容できるものであったと述べられています。有望な治療戦略を支持する結果ですが、より大規模でより長期のランダム化比較試験による検証が必要とされています。"],
      use:"活動期の尋常性白斑で紫外線療法だけでは色が戻りにくい方に、内服との併用という選択肢と、部位によって反応が異なることをご説明する材料になります。" },
    { cat:"A", pmid:"42865149", journal:"J Eur Acad Dermatol Venereol", year:2026, type:"専門家パネルによる推奨",
      tj:"早期の爪部メラノーマ：爪母生検が標準、切除縁は6mm（Hutchinson徴候では10mm）",
      te:"Experience-based recommendations for the diagnosis and management of early-stage nail unit melanoma.",
      sum:["爪部メラノーマ（NUM）は多くが爪母から生じる特徴的なメラノーマですが、特に早期（上皮内・ステージ IA・IB）の取り扱いについての推奨は存在しませんでした。本論文は国際的な専門家パネルが、臨床・病理の経験と広範な文献検索に基づいて、爪部メラノーマが疑われる病変の診断・鑑別診断・管理について実践的な推奨を示したものです。",
           "臨床的には多くが成人の爪の縦長の色素帯として現れます。白人ではメラノーマ全体の 1.5〜2.5% ですが、黒人の患者さんでは最大 50% を占めます。爪は全体表面積の 1% 未満であることを考えると、爪母はメラノーマが生じやすい部位とみなせると述べられています。上皮内または最小限の浸潤の段階での治療は治癒率が高いため早期診断が重要で、ダーモスコピーは診断の助けになりますが、病理検査を伴う爪母生検が今も標準（ゴールドスタンダード）です。血液検査や通常の画像検査は診断的ではなく、進行例の手術計画の助けになる程度とされます。治療は完全な外科的切除が第一選択で、早期には広範な局所切除が推奨され、切除縁は通常の病変で 6 mm、Hutchinson 徴候がある場合は 10 mm、切断は厚い腫瘍（1 mm 超）に一般に限られます。再発の監視のために 10 年間の経過観察が推奨されています。",
           "上皮内または最小限の浸潤の段階（IA／IB）での早期診断と治療は高い治癒率と関連する一方、深い浸潤や転移を伴う進行例の予後は不良であり、適切な時期の認識と介入が結果を最適化するうえで不可欠であると述べられています。"],
      use:"爪の黒い縦の線をご心配されて来られた方に、経過観察と爪母生検の判断の目安、ならびに早期であれば治癒率が高いことをご説明する材料になります。" },
    { cat:"A", pmid:"42865135", journal:"J Eur Acad Dermatol Venereol", year:2026, type:"叙述的総説",
      tj:"化膿性汗腺炎：併用・使う順序・治療目標（treat-to-target）の整理",
      te:"Optimizing therapy in hidradenitis suppurativa: Combination, sequencing and treat-to-target.",
      sum:["化膿性汗腺炎（HS）は慢性・反復性で進行性に組織を破壊する炎症性疾患で、身体的・心理的・社会的な負担が大きい疾患です。TNF-α と IL-17 を標的とする生物学的製剤の登場、代謝・ホルモンへの介入の増加、手術と全身療法の統合が進む一方で、多くの患者さんでは疾患の制御が不十分なまま、瘻管の形成と障害の蓄積が進みます。本総説は現在使える治療の最適化について、治療の順序・合理的な併用・treat-to-target（目標を定めた治療）の原則に焦点を当てて論じたものです。",
           "治療を個々に独立した介入としてみるのではなく、炎症の量・構造的な病変・併存症に応じて、生物学的製剤・抗菌薬・ホルモン療法・代謝に対する治療・手術を、病型に基づいて動的に統合することが現代の HS 管理では求められると述べられています。全身の抗菌薬は慢性的に抑え込む治療ではなく期間を限った導入療法としての位置づけに変わりつつあること、生物学的製剤の順序の選択と用量の最適化の実践的な考え方、生物学的製剤と代謝への介入や手技的な治療を組み合わせる根拠が論じられています。また、不可逆的な瘻管形成と長期の構造的な損傷を防ぐための治療の「機会の窓」における早期の炎症制御の重要性が強調され、HiSCR や IHS4 といった客観的な炎症の指標とともに、患者さんご自身による評価・痛みの管理・生活の質が治療目標として重視されるようになっていると述べられています。",
           "HS の治療の最適化は、短期的に炎症性の病変を減らすことだけでなく、長期の経過を変え、不可逆的な障害を防ぎ、個別化された多面的で戦略的に統合された医療によって生活の質を回復することを目指すべきであると結論されています。"],
      use:"腋や股のくり返す痛い膿のたまりでお困りの方に、抗菌薬を漫然と続けるのではなく早い段階で炎症を抑える方針と、痛み・生活の質も治療目標に含めることをご説明する材料になります。" },
    { cat:"A", pmid:"42862760", journal:"Dermatology", year:2026, type:"後方視解析（単施設・249 名・10 年）",
      tj:"UVA1 療法10年249例：78.3%が客観的に改善、有害事象は軽度中心",
      te:"UVA1 Phototherapy in a national reference center: A 10-year systematical analysis.",
      sum:["UVA1 療法（340〜400 nm）は様々な皮膚疾患に安全で有効とされてきましたが、公表されたデータが限られるため、疾患ごとに個別化した治療プロトコルを定めることが難しいとされます。本研究は、2010 年から 2019 年にチューリッヒ大学病院皮膚科で UVA1 療法を受けた様々な皮膚疾患の患者さん 249 名について、中等量（40〜60 J/cm²）の UVA1 療法の有効性と耐容性を後方視的に解析したものです。治療の反応は診察・スコア・写真記録・標準化された質問票に基づいて、完全・部分・無反応に分類し、有害事象は CTCAE v5.0 で評価し、全例を少なくとも2年間追跡しました。",
           "最も多い適応は硬化性の皮膚疾患（39.8%）、アトピー性皮膚炎（32.5%）、環状肉芽腫（14.9%）でした。1回あたりの平均線量は 49.25 J/cm² で週3回照射され、累積線量の平均は 1,395.32 J/cm² でした。全体では 78.3% の患者さんに客観的な臨床的改善がみられ、14.9% が完全反応、63.5% が部分反応でした。客観的な反応率は診断群の間で有意な差はありませんでした（p=.169）。患者さんご自身が感じた改善は 65.9% で報告されました。軽度の有害事象（CTCAE グレード I。主に一時的な紅斑と紫外線による色素沈着）が 26.5% にみられ、中等度の有害事象（2度の熱傷）が1名、重篤な有害事象はありませんでした。",
           "主に中等量で行われた UVA1 療法は主要な診断群にわたって高い全体の反応率と関連し、有害事象はおおむね軽度で一時的であったことから、選択された炎症性・硬化性の皮膚疾患に対する有効な治療選択肢として支持されると述べられています。長期の安全性・維持療法のプロトコル・患者ごとの要因・併用療法については今後の検討が必要とされています。"],
      use:"硬化性の皮膚疾患やアトピー性皮膚炎で紫外線療法をご案内するときに、改善が期待できる割合と副作用の目安をお伝えする材料になります。" },
    { cat:"A", pmid:"42863980", journal:"Arerugi", year:2026, type:"論考（日本語・アレルギー学会誌）",
      tj:"アトピー性皮膚炎診療ガイドライン2024：治療戦略と実際の注意点",
      te:"[ATOPIC DERMATITIS CLINICAL PRACTICE GUIDELINES 2024: TREATMENT STRATEGY AND PRACTICAL CONSIDERATIONS].",
      sum:["日本のアトピー性皮膚炎診療ガイドライン 2024 について、治療戦略と実地診療での注意点を解説した日本語の論考であることが、タイトルから分かります。",
           "抄録が公開されていないため、取り上げられている推奨の内容や、どの点が実際の注意点として挙げられているかは確認できません。",
           "国内のガイドラインの改訂内容を整理した解説と考えられますが、具体的な記載は原著をご確認ください。"],
      use:"アトピー性皮膚炎の当院の治療方針を国内のガイドラインに照らして確認するときに、目を通しておきたい一本です。",
      note:"抄録なし（タイトルのみで要約）。原著確認が必要。" },
    { cat:"C", pmid:"42864289", journal:"Zhongguo Zhen Jiu", year:2026, type:"ランダム化比較試験（80 名・8 週）",
      tj:"慢性特発性蕁麻疹に鍼：8週でUAS7・DLQI・不安が内服より良好（80例）",
      te:"[Acupuncture regulates the Th17/Treg axis for chronic spontaneous urticaria: a randomized controlled trial].",
      sum:["慢性特発性蕁麻疹（CSU）に対する鍼の臨床効果と、ヘルパーT細胞17（Th17）／制御性T細胞（Treg）の軸への影響を観察する目的で行われたランダム化比較試験です。CSU の患者さん 80 名を観察群（40 名、2 名脱落）と対照群（40 名、2 名脱落）に無作為に割り付け、観察群は両側の肩髃（LI15）・手三里（LI10）・曲池（LI11）・偏歴（LI6）・血海（SP10）・足三里（ST36）・三陰交（SP6）への刺鍼を1回30分・週3回、対照群はエバスチン錠 10 mg を1日1回内服し、いずれも8週間行いました。7日間の蕁麻疹活動性スコア（UAS7）・皮膚疾患生活の質指標（DLQI）・ハミルトン不安尺度（HAMA）と、末梢血の Th17・Treg の割合、血清の IL-17・IL-23・IL-10・IL-35 を治療前後で測定し、Th17／Treg 比を算出しました。",
           "治療後、両群とも UAS7・DLQI・HAMA のスコアは治療前より低下し（P<0.05）、観察群のスコアは対照群より低くなりました（P<0.05）。両群とも末梢血の Th17 の割合・Th17／Treg 比・血清 IL-17・IL-23 は治療前より低下し（P<0.05）、観察群ではこれらが対照群より低くなりました（P<0.05）。また両群とも末梢血の Treg の割合・血清 IL-10・IL-35 は治療前より上昇し（P<0.05）、観察群では対照群より高くなりました（P<0.05）。",
           "鍼は慢性特発性蕁麻疹の症状を効果的に和らげることができ、その作用機序は Th17／Treg の軸の調節に関係している可能性があると述べられています。"],
      use:"抗ヒスタミン薬だけでは治まりにくい慢性の蕁麻疹で鍼灸のご相談を受けたときに、症状・生活の質・不安の面での報告として一例をご紹介する材料になります。",
      note:"中国・単一試験で、対照は抗ヒスタミン薬内服との比較です。" },
    { cat:"C", pmid:"42864292", journal:"Zhongguo Zhen Jiu", year:2026, type:"動物実験（ラット・帯状疱疹後神経痛モデル）",
      tj:"帯状疱疹後神経痛モデルへの電気鍼：脊髄後角のミクログリア活性化を抑制",
      te:"[Effect of electroacupuncture on microglial activation in the spinal dorsal horn of rats with postherpetic neuralgia based on the BDNF/TrkB pathway].",
      sum:["帯状疱疹後神経痛（PHN）のラットで、電気鍼が脊髄後角の脳由来神経栄養因子（BDNF）／チロシンキナーゼ受容体B（TrkB）経路とミクログリアの活性化に与える影響を観察した動物実験です。雄 SD ラット 20 匹のうち5匹を正常対照群とし、残りにレシニフェラトキシンを腹腔内投与して PHN モデルを作製し、PHN 群・電気鍼群・電気鍼＋BDNF 群に各5匹ずつ割り付けました。電気鍼群には左側の阿是穴・心兪（BL15）・胆兪（BL19）に疎密波（2 Hz／15 Hz）・1 mA で1日1回30分を4週間行い、電気鍼＋BDNF 群では各治療前に組換えラット BDNF 10 μg を髄腔内投与しました。機械的逃避閾値と熱逃避潜時、脊髄後角のミクログリア活性化の指標 Iba-1、IL-1β と TNF-α、BDNF と TrkB の蛋白発現を測定しました。",
           "正常対照群と比べ PHN 群では機械的逃避閾値が低下し熱逃避潜時が延長し（P<0.05）、脊髄後角の Iba-1 陽性発現・IL-1β・TNF-α・BDNF と TrkB の蛋白発現が増加しました（P<0.05）。PHN 群と比べ電気鍼群では機械的逃避閾値が上昇し熱逃避潜時が短縮し（P<0.05）、Iba-1 陽性発現・IL-1β・TNF-α・BDNF と TrkB の蛋白発現が低下しました（P<0.05）。電気鍼＋BDNF 群と比べても電気鍼群でこれらの改善が大きくなりました（P<0.05）。",
           "電気鍼は PHN のラットの痛みの症状を和らげることができ、その機序は BDNF／TrkB 経路の調節、脊髄後角のミクログリアの活性化の抑制、炎症性因子の低下を介する可能性があると述べられています。"],
      use:"帯状疱疹後の痛みで鍼灸をご希望される方に、動物実験での作用機序の裏づけとしてご説明できますが、ヒトでの効果は未確認と添える必要があります。",
      note:"動物実験（ラット）です。ヒトでの効果は確認されていません。" }
  ]
},
{
  date: "2026-10-13",
  range: { A: "2026-10-11〜10-13", B: "2026-10-11〜10-13", C: "2026-09-13〜10-13" },
  items: [
    { cat:"A", pmid:"42862174", journal:"Eur J Dermatol", year:2026, type:"後方視コホート（日本・単施設・311 名・538 治療エピソード）",
      tj:"日本の乾癬コホート：IL-23 阮害薬の継続率が最も良好（538 例）",
      te:"Comparative drug survival of biologic classes in psoriasis: a Japanese single-centre cohort study.",
      sum:["薬剤の継続率（drug survival）は、実臨床における生物学的製剤の長期の有効性・安全性・耕容性を反映する指標です。本研究は、日本の乾癬の患者さんで現在使用できる生物学的製剤のクラス間で薬剤継続率を比較し、中止理由別の検討を行う目的で、日本の三次的な皮膚科施設で治療を受けた 311 名の 538 の生物学的製剤治療エピソードを対象に行われた後方視コホート研究です。TNF 阮害薬・IL-17 阮害薬・IL-23 阮害薬・IL-12/23 阮害薬を比較し、全体の中止はクラスターロバスト標準誤差を用いた多変量 Cox 比例ハザードモデルで、効果不十分による中止と有害事象による中止は Fine-Gray の競合リスクモデルで評価しました。",
           "TNF 阮害薬と比べて、IL-23 阮害薬は全体の薬剤継続率が良好で（調整ハザード比 0.43、95% 信頼区間 0.25〜0.74、p=0.002）、104 週の解析でも有意でした（ハザード比 0.50、95% CI 0.28〜0.91、p=0.023）。IL-17 阮害薬とウステキヌマブは主解析で TNF 阮害薬と有意な差はありませんでした。競合リスク解析では、IL-23 阮害薬は TNF 阮害薬より有害事象による中止の危険が低く（部分分布ハザード比 0.10、95% CI 0.02〜0.59、p=0.010）、効果不十分による中止についてはクラス間で有意な差は認められませんでした。",
           "IL-23 阮害薬が最も良好な薬剤継続率のプロファイルを示し、それは主に有害事象による中止の少なさによるものであったと述べられています。"],
      use:"乾癬で生物学的製剤を長く続けていく見通しをご相談されるときに、日本の実臨床のデータとして IL-23 阮害薬の続けやすさをご説明する材料になります。" },
    { cat:"A", pmid:"42862173", journal:"Eur J Dermatol", year:2026, type:"系統的レビュー・ネットワークメタ解析（RCT 20 件・2,158 名）",
      tj:"掌蹎の乾癬・膂莆疹への生物学的製剤：イキセキズマブが最上位",
      te:"Biologic treatments for palmoplantar psoriasis and palmoplantar pustulosis: a systematic review and network meta-analysis.",
      sum:["手のひら・足の裏の乾癬（PPP：過角化した斑として、あるいは膂莆膿胞症（PPPP）のような膿胞型の病変としてあらわれます）の治療は難しいとされます。本研究はネットワークメタ解析により PPP に対する各種の生物学的製剤の有効性を評価する目的で、成人の PPP または PPPP を対象に生物学的製剤を用いたランダム化比較試験（RCT）を、PubMed・Embase・CENTRAL・Scopus と試験登録（ClinicalTrials.gov、WHO ICTRP）から開始時から 2026 年 5 月まで検索して組み入れたものです。主要評価項目は 14〜16 週時点で ppPASI75 または同等の PGA 0/1 を達成した方の割合で、ベイズ流のランダム効果ネットワークメタ解析を行い 95% 信用区間（CrI）を示しました。",
           "RCT 20 件・2,158 名が組み入れられました。プラセボと比べて有意な有効性が認められたのは、アダリマブ（オッズ比 6.8、95% CrI 1.5〜31）、グセルクマブ 100 mg（OR 7.4、95% CrI 2.0〜2）、イキセキズマブ（OR 10.0、95% CrI 2.2〜44）、セクキヌマブ（OR 6.1、95% CrI 1.7〜27）でした。SUCRA 値はイキセキズマブ（87.2%）、グセルクマブ 100 mg（84.1%）、アダリマブ（76.5%）、セクキヌマブ（71.3%）の順に高く、手のひら・足の裏に病変が限られる方は治療への反応がより難しい傅向でした。",
           "生物学的製剤は PPP・PPPP の管理において有意な改善をもたらし、特定の薬剤が優れた有効性を示したため治療戦略の最適化が可能であると述べられています。ただしこれらの結果は間接比較に基づき、対象集団も不均一であるため解釈には注意が必要で、今後は直接比較・病型別の試験・長期の有効性の検討が必要とされています。"],
      use:"掌蹎の乾癬や膂莆膿胞症で外用療法では改善しにくい方に、生物学的製剤という選択肢と、薬剤ごとの反応の目安をご説明する材料になります。",
      note:"グセルクマブの信用区間（2.0〜2）は抄録の記載をそのまま引用しています。原著での確認が必要です。" },
    { cat:"A", pmid:"42862144", journal:"Acta Derm Venereol", year:2026, type:"後方視症例集積（17 例）",
      tj:"AD への JAK 阮害薬治療中の伝染性軟属腫・疚趘・コンジローマ 17 例",
      te:"Molluscum Contagiosum, Warts and Condylomas during JAK Inhibitor Therapy for Atopic Dermatitis: a Retrospective Series of 17 Cases.",
      sum:["アトピー性皮膚炎に対する JAK 阮害薬による治療の期間中に生じた、伝染性軟属腫（水いぼ）・尋常性疚趘（いぼ）・尖圭コンジローマの 17 例をまとめた後方視的な症例集積であることが、タイトルから分かります。",
           "抄録が公開されていないため、各例の背景・使用された薬剤・発症までの期間・その後の経過といった結果は確認できません。",
           "ウイルス性の皮膚疾患が JAK 阮害薬の治療中に生じうることに注意を促す報告と考えられますが、頻度や因果関係についてはこの情報だけでは判断できません。"],
      use:"アトピー性皮膚炎で JAK 阮害薬を使われている方に水いぼやいぼが出てきたときに、治療との関連も念頭に置いて経過を確認する材料になります。",
      note:"抄録なし（タイトルのみで要約）。原著確認が必要。" },
    { cat:"A", pmid:"42861124", journal:"J Psoriasis Psoriatic Arthritis", year:2026, type:"後方視研究（単施設・15 名・28 週）",
      tj:"デュークラバシチニブ不十分例をチルドラキズマブへ：28 週で PASI 89.0% 改善",
      te:"Effects of Switching From Deucravacitinib to Tildrakizumab in Psoriasis: A 28-Week Real-World Study.",
      sum:["チロシンキナーゼ 2（TYK2）阮害薬のデュークラバシチニブは中等症から重症の乾癬で有効性と耕容性が示されていますが、デュークラバシチニブから IL-23 阮害薬へ切り替えた場合のデータは限られています。本研究は、デュークラバシチニブ 6 mg を 16 週以上使用して反応が不十分（PASI のベースラインからの改善が 75% 未満、または sPGA が 2 以上）であった 18 歳以上の乾癬の患者さん 15 名を対象に、抗 IL-23p19 抗体のチルドラキズマブへ切り替えた後の経過を調べた単施設の後方視研究です。切り替え後はチルドラキズマブ 100 mg を 0 週と 4 週、以後 12 週ごとに投与し、4・16・28 週で PASI・sPGA・DLQI を評価しました。",
           "28 週時点でベースラインからの平均の改善率は PASI が 89.0%、DLQI が 77.2% でした。28 週時点の達成率は PASI 75 が 88.9%、PASI 90 が 55.6%、PASI 100 が 44.4%、sPGA 0/1 が 77.8% でした。また PASI 3 以下が 88.9%、PASI 2 以下が 77.8%、PASI 1 以下が 55.6%、DLQI 0/1 が 50.0% でした。治療に関連した有害事象は 3 件で、湿疹が 2 名（13.3%）、関節痛が 1 名（6.7%）でした。",
           "これらは予備的な所見であるものの、デュークラバシチニブへの反応が不十分な方にとってチルドラキズマブが治療の選択肢になりうると述べられています。"],
      use:"内服の TYK2 阮害薬で効果が物足りない乾癬の方に、注射の IL-23 阮害薬へ切り替えるという次の一手をご相談する材料になります。" },
    { cat:"A", pmid:"42860920", journal:"J Dtsch Dermatol Ges", year:2026, type:"多施設前向き研究（235 名・6 か月）",
      tj:"IL-17A／IL-23p19 阮害薬で不安・抑うつも改善、CRP 低下と相関",
      te:"Impact of IL-17A and IL-23p19 Inhibitors on Psychiatric Outcomes and Inflammation in Psoriasis.",
      sum:["乾癬は皮膚と心の健康に影響する全身性の炎症性疾患です。IL-17A と IL-23p19 を標的とする生物学的製剤は皮膚症状に有効ですが、精神面への影響と全身の抗炎症作用、とくに実臨床での効果は明らかではありません。本研究は、IL-17A 阮害薬・IL-23p19 阮害薬が精神症状を改善するか、またその改善が皮膚の反応とは独立して炎症指標の低下と関連するかを評価する目的で、これらの薬剤を開始した乾癬の患者さん 235 名を開始時と 6 か月時点で評価した多施設前向き研究です。評価には CRP・好中球リンパ球比（NLR）・HADS-A（不安）・HADS-D（抑うつ）・DLQI を用いました。",
           "治療により皮膚・生活の質・精神面のスコアはいずれも有意に改善しました（p<0.001）。CRP は有意に低下し、PASI90 を達成していない方でも HADS-A と HADS-D の低下と独立して相関していました。IL-23p19 阮害薬は IL-17A 阮害薬と比べて CRP と NLR の低下が大きく、上流のサイトカインを阮害することによるより幅広い抗炎症作用が示唆されました。",
           "IL-17A 阮害薬と IL-23p19 阮害薬は、全身の炎症を抑えることによって乾癬の皮膚と精神面の両方の結果を改善する可能性があり、CRP は皮膚の反応とは独立した精神面の改善の指標になりうると述べられています。今後はより長期の追蹌と生物学的製剤を用いない対照群での検討が必要とされ、皮膚科と精神科の診療を統合することが成績の向上につながる可能性が示されています。"],
      use:"乾癬で気分の落ち込みや不安を併せて訴えられる方に、皮膚の治療が心の状態にも関わりうることをご説明する材料になります。" },
    { cat:"A", pmid:"42860289", journal:"J Dermatol", year:2026, type:"後方視観察研究（被災 8 市町村）",
      tj:"熊本地震後：急性蕥麻疹・帯状疹疹・AD 悪化が有意に増加",
      te:"Dermatological Needs After the 2026 Kumamoto Earthquake.",
      sum:["大きな地震は、身体の外傖・生活環境の変化・心理的ストレスを通して皮膚科の医療需要を変えうる可能性があります。本研究は 2026 年の熊本地震後の皮膚科の需要を調べたものです。被害の大きかった 8 市町村の患者さんのうち、地震後の最初の診療 10 日間と、続く診療 12 日間に当該の皮膚科を受診された方を対象とし、2025 年の同じ時期と外来受診者数および特定の皮膚疾患を比較した後方視観察研究です。",
           "最初の診療 10 日間で、8 市町村からの受診者数は 2025 年の 1,670 名から 2026 年は 1,030 名と 38.3% 減少しました。40 名が地震に関連した外傖で、19 名が熱傖で受診されました。急性蕥麻疹（2.5% 対 1.3%、p=0.021）、帯状疹疹（1.7% 対 0.5%、p=0.001）、アトピー性皮膚炎の悪化（3.1% 対 0.9%、p<0.001）は 2026 年に有意に多く、単純ヘルペスには有意な差はありませんでした。",
           "地震後の皮膚科の需要には、外傖や熱傖だけでなくストレスに関連した皮膚疾患も含まれ、多職種による災害医療において皮膚科医が果たしうる役割が示されると述べられています。"],
      use:"災害や強いストレスの後に蕥麻疹や帯状疹疹、アトピー性皮膚炎の悪化でお越しになる方に、環境の変化と皮膚の関係をご説明し、院内アプリ「生活指導アシスタント」の生活指導と合わせてお伝えする材料になります。" },
    { cat:"A", pmid:"42858389", journal:"Dermatol Pract Concept", year:2026, type:"メンデルランダム化解析（GWAS 要約データ）",
      tj:"不安・心配しやすい感情が蕥麻疹の危険因子という解析結果",
      te:"Negative Emotions Induce Urticaria by Regulating Metabolites: A Two-Step Mendelian Randomization Study.",
      sum:["感情と蕥麻疹の関連は複数の研究で示されてきましたが、個々の感情と蕥麻疹およびその病型との因果関係、また血中の代謝物がそれを媒介するかは明らかではありません。本研究は、負の感情・血中代謝物・蕥麻疹とその病型の因果関係を調べ、血中代謝物の媒介効果を評価する目的で、公開されている GWAS の要約データから 8 つの負の感情・1,400 の血中代謝因子・蕥麻疹についての操作変数を取得し、逆分散重み付け（IVW）を主たる方法としてメンデルランダム化（MR）解析を行ったものです。",
           "MR 解析では、緊張した感情（P=0.046、95% CI 1.02〜7.65）と心配しやすい・不安な感情（P=0.016、95% CI 1.17〜4.60）が蕥麻疹の危険因子となりうることが示されました。また 17 の代謝物と 3 つの代謝物比が蕥麻疹の危険を高め、18 の代謝物と 2 つの代謝物比が保護的な因子でした。媒介 MR 解析では、心配しやすい・不安な感情は、マンノース・マンノン酸・グリコシルN-(2-ヒドロキシネルボノイル)スフィンゴシンの低下と、リン酸／マンノース比およびグルコース／マンノース比の上昇を介して蕥麻疹の危険を高めていました。一方で、緊張した感情と蕥麻疹の関係は代謝物では媒介されていませんでした。",
           "感情と代謝への介入を通じた蕥麻疹の総合的な予防・治療について、新しい視点と方策の可能性が示されると述べられています。"],
      use:"慣性の蕥麻疹で不安や心配が強い方に、心身の状態と皮膚のつながりをご説明し、生活面も含めて一緒に整えていくことをご相談する材料になります。",
      note:"遺伝子情報を用いた因果推計の解析で、個々の患者さんの症状を直接調べた研究ではありません。" },
    { cat:"A", pmid:"42858399", journal:"Dermatol Pract Concept", year:2026, type:"費用分析（PSORED 試験・156 名・52 週）",
      tj:"安定した乾癬で投与間隔 1.5 倍：総費用 26% 減・年 7,303 ユーロ節約",
      te:"Less Is More: Cost-Effective Psoriasis Management via Disease-Driven Dosing of IL-17/IL-23 Inhibitors.",
      sum:["慣性の尋常性乾癬では IL-17 阮害薬と IL-23 阮害薬が広く使われ、非常に有効である一方で費用が大きい治療です。長期に病勢が落ち着く方が多いため、固定用量での投与は過剰な治療となる可能性があります。本研究は、病勢が安定した尋常性乾癬の成人において、セクキヌマブ・ブロダルマブ・グセルクマブ・リサンキズマブを用いた疾患活動性に応じた減量（DR）戦略の経済的な影響を評価したものです。イタリア・ピエモンテ州で 2023〜2025 年に行われた多施設前向き非盲検研究 PSORED 試験のデータに基づく費用分析で、病勢が安定した方（PASI 3 以下・DLQI 3 以下が 9 か月以上）を対象に維持期の投与間隔を 1.5 倍に延長し、イタリアの診療報酬データと実臨床の治療パターンを用いて 52 週にわたり減量時と標準投与時の費用を比較しました。",
           "登録された 156 名のうち、39 名が減量を中止、38 名が標準投与に戻り、1 名が別の治療に切り替えました。減量により通院の必要を増やすことなく生物学的製剤の使用量が減り、総費用は 26% 減少し、1 名あたり年間平均 7,303.57 ユーロの節約となりました。",
           "減量は臨床的に有効でありかつ費用を抜えられ、重大な安全性の懸念なく病勢を保てたと述べられています。有効性を保ちながら長期の持続可能性を高めるため、実臨床での減量戦略の導入を支持する結果とされています。"],
      use:"生物学的製剤で乾癬が長く落ち着いている方に、投与間隔を延ばすという選択肢と、その際に病勢を見ながら進める必要があることをご説明する材料になります。",
      note:"費用はイタリアの診療報酬に基づく金額です。" },
    { cat:"A", pmid:"42861727", journal:"J Dermatolog Treat", year:2027, type:"三重盲検ランダム化比較試験（74 名・4 週間）",
      tj:"女性の尖圭コンジローマ：ニンニク抽出 5% とポドフィリン 20% が同等",
      te:"Comparative efficacy of topical garlic extract and 20% podophyllin solution in the treatment of female genital warts: a triple-blind randomized clinical trial.",
      sum:["ヒトパピローマウイルスによる尖圭コンジローマは頻度の高い性感染症で、一貫した治癒をもたらす単独の治療法はありません。ニンニク抽出物には抗ウイルス作用と抗増殖作用があり、低コストの治療になりうる可能性があります。本研究は、尖圭コンジローマのある女性において 5% ニンニク抽出外用薬と 20% ポドフィリン液の有効性と安全性を比較する目的で、74 名を 5% ニンニク抽出物（37 名）と 20% ポドフィリン（37 名）にランダムに割り付け、週 1 回・4 週間塗布した三重盲検のランダム化比較試験です。病変の大きさと個数を一般化推定方程式による周辺モデルで評価し、主要評価項目は平均の病変の大きさの変化、副次評価項目は病変数の変化としました。",
           "平均の病変の大きさは、ニンニク抽出物で 1.61 ± 0.81 mm から 0.60 ± 0.82 mm へ、ポドフィリンで 2.96 ± 7.99 mm から 0.62 ± 0.73 mm へ減少しました。最終評価時点の群間の p 値は 0.756、群と時間の交互作用の p 値は病変の大きさで 0.329、病変数で 0.583 でした。解析された 35 名と 37 名のうち、完全な反応はそれぞれ 18 名（51.4%）と 19 名（51.4%）、完全または部分的な反応は 23 名（65.7%）と 25 名（67.6%）でした。ニンニク抽出群ではかゆみと灼熱感がそれぞれ 8 名（21.6%）にみられました。",
           "いずれの治療も病変の大きさと数を減らし、反応率は同程度であったと述べられています。追蹌が 4 週間であったため、効果の持続と再発については評価できていません。"],
      use:"尖圭コンジローマの治療をご相談されるときに、外用薬による完全な消失はおよそ半数という目安と、再発の確認のため経過観察が必要なことをご説明する材料になります。" },
    { cat:"A", pmid:"42857590", journal:"World Allergy Organ J", year:2026, type:"横断研究（ブラジル・632 名）",
      tj:"高齢者の自己申告食物アレルギーは生涯 18.8%、原因は甲殻類・牛乳・果物",
      te:"Self-reported food allergy in the elderly - Lifetime prevalence and clinical features in older adults seeking allergy care in Brazil.",
      sum:["食物アレルギーは世界的に関心が高まっていますが、疫学研究の多くは小児や若年成人を対象としており、高齢の方の食物アレルギーの実態はよく分かっていません。本研究は、アレルギー診療を受けに来られたブラジルの高齢の方における自己申告の食物アレルギーの生涯有病率と、社会人口学的・臨床的特徴との関連を調べたものです。ポルトガル語で作成・標準化・妥当性確認された自己記入式の質問紙を用い、ブラジル在住の 60 歳以上の方を公的または民間の医療機関で主治医を通して募った非確率標本による横断研究で、多変量回帰モデルで関連を推定しました。",
           "ブラジルの 5 つの地域すべてから 632 名（69.8% が女性、平均年齢 70.2 歳）が組み入れられました。「これまでに何らかの食物でアレルギー反応を起こしたことがありますか」という質問に「はい」と答えた割合に基づく自己申告の食物アレルギーの有病率は 18.8%（95% CI 16.0〜22.1%）でした。医師による食物アレルギーの診断を受けたと答えた方は 9.0%（7.0〜11.5%）、2 時間以内の即時型の反応があり同じ食物で 2 回以上の反応があったと答えた方は 5.5%（4.0〜7.6%）でした。原因として多かった食物は甲殻類・牛乳・新鮮な果物で、症状としては蕥麻疹と消化器症状が多くみられました。多変量解析では、食物アレルギーは女性であること、および本人・家族のアレルギーの既往と関連していました。",
           "ブラジルのアレルギー・免疫の診療の場で募られた高齢の方における自己申告の食物アレルギーの生涯有病率は高く、女性と、本人または家族にアレルギーの既往がある方でより多かったと述べられています。"],
      use:"ご高齢の方が蕥麻疹でお越しになったときに、食物による反応の可能性も丁寧にお伺いし、院内アプリ「生活指導アシスタント」の食物アレルギーのタブと合わせてご説明する材料になります。",
      note:"ブラジルのアレルギー外来を受診された方を対象とした自己申告に基づく調査です。" }
  ]
},
