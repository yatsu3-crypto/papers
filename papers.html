  items: [
    { cat:"A", pmid:"42832221", journal:"Nutr Rev", year:2026, type:"系統的レビュー・メタ解析（13 研究）",
      tj:"乾癬・アトピー・脂漏性皮膚炎で血清亜鉛は低め：13 研究のメタ解析",
      te:"Zinc Status and Disease Severity in Psoriasis, Atopic Dermatitis, and Seborrheic Dermatitis: A Systematic Review and Meta-analysis.",
      sum:["亜鉛は皮膚のバリアの保持と免疫の調節に必要ですが、亜鉛の状態が重症度と関連するか、亜鉛の補充が炎症性の皮膚疾患で臨床的な利益をもたらすかは定まっていないという背景の研究です。乾癬・アトピー性皮膚炎・脂漏性皮膚炎について、血清または赤血球の亜鉛値と、検証された重症度指標（乾癬の PASI、アトピー性皮膚炎の SCORAD、脂漏性皮膚炎の SDASI）との関係を整理し、亜鉛の補充が臨床成績を改善するかを評価しました。PubMed・ScienceDirect・SpringerLink・Google Scholar（2000 年 1 月〜2025 年 12 月）と引用文献の手作業検索から無作為化試験と観察研究（症例対照・横断）を集め、4 名の評価者が選定と抽出を行い、バイアスのリスクは無作為化試験に Cochrane RoB 2、観察研究に Joanna Briggs Institute のツールで評価しています。亜鉛の単位は µg/dL に統一し、検体の種類をまたいだ統合は行っていません。",
           "13 研究が選択基準を満たしました。血清亜鉛はいずれの疾患でも患者のほうが対照より低く、比較可能な範囲では亜鉛値と重症度は逆の関係にありました。ただし測定機器・年齢層・検体の違いによる異質性は高いと報告されています。この方向性は、1 件ずつ除く感度分析やモデルを変えた解析でも一貫していました。介入研究のデータは限られており、標準治療に上乗せした亜鉛の補充が日常的な臨床的利益をもたらすことは示されませんでした。",
           "亜鉛の状態はアトピー性皮膚炎・脂漏性皮膚炎・乾癬でしばしば低下しており重症度と逆の関係にあることが多い一方、現在の証拠は亜鉛の一律の投与を支持せず、確認された欠乏の是正にとどめるのが妥当であり、測定法を標準化して欠乏例を集めた無作為化試験が必要と述べられています。"],
      use:"「亜鉛のサプリメントは効きますか」と尋ねられたときに、検査で欠乏が確認された場合の補正にとどめるとご説明する材料になります（生活指導アシスタントの食事・栄養のタブ）。" },
    { cat:"A", pmid:"42833744", journal:"Immunol Allergy Clin North Am", year:2026, type:"総説",
      tj:"小児の難治性アトピーの全身療法：広く免疫を抑える薬から新しい薬へ",
      te:"Practical Guidance for Systemic Treatment Selection in Pediatric Refractory Atopic Dermatitis.",
      sum:["重症または難治性の小児のアトピー性皮膚炎では全身療法が必要になります。重症度はこれまで医師が行う評価の道具で測られてきましたが、近年のガイドラインは、かゆみ・睡眠の乱れ・顔や手などの特別な部位の病変といった患者さん中心の影響を重視しており、これらは成長や生活の質に大きく関わります。本稿は、小児の難治性アトピー性皮膚炎の管理に使える治療の選択肢が広がっている現状を整理した総説です。",
           "治療は、メトトレキサートやシクロスポリンのように広く免疫を抑える従来の薬から、新しい全身療法へと移りつつあると述べられています。抄録は総説の概要のみで、個別の薬剤ごとの有効性の数値は示されていません。",
           "全身療法を選ぶ際には、医師による重症度の評価だけでなく、かゆみ・睡眠・部位による生活への影響も踏まえて考えることが勧められています。"],
      use:"小児で外用治療だけでは収まらないときに、かゆみや睡眠への影響も含めて全身療法のご相談を進める整理に使えます。",
      note:"総説の抄録は概要のみで、個別の薬剤の有効性や安全性の数値は記載されていません。原著の確認が必要です。" },
    { cat:"A", pmid:"42833640", journal:"Pediatr Dermatol", year:2026, type:"無作為化（予備研究・47 名）",
      tj:"図を増やした説明用紙で保護者の理解が最も向上：47 名の無作為化",
      te:"Impact of a Simplified, Visual Educational Intervention on Caregiver Understanding of Pediatric Atopic Dermatitis: A Clinic-Based Randomized Study.",
      sum:["アトピー性皮膚炎は広くみられる慢性の疾患ですが、その説明資料は読みやすさの目安を超えて難しく、図による補強も乏しいため、健康情報を読み取る力が十分でないご家庭に不利に働きます。保護者 47 名を、簡潔で図を増やした説明用紙・従来の文字中心の説明用紙・説明用紙なしの 3 群のいずれかに割り付け、小児アトピー性皮膚炎のケアの理解が改善するかを調べた予備的な無作為化研究です。",
           "図を増やした説明用紙を受け取った方の平均点の改善が最も大きく、説明用紙なしの対照群と従来の文字中心の用紙の群のいずれに対しても有意に上回りました。",
           "簡潔で図を用いた教材は、小児アトピー性皮膚炎の保護者の理解を高め、皮膚科診療における格差を縮めるのに役立つと述べられています。"],
      use:"保護者向けの説明を図とイラスト中心に整えることで、外用薬の塗り方の理解が深まる根拠になります（生活指導アシスタントのスキンケアのタブ）。",
      note:"47 名の予備研究で、点数の絶対値は抄録に記載されていません。" },
    { cat:"A", pmid:"42835382", journal:"Case Rep Dermatol Med", year:2026, type:"症例報告＋文献レビュー",
      tj:"デュピルマブ開始 5 か月で好酸球 2070/μL と心筋炎：22 歳男性の 1 例",
      te:"Hypereosinophilia With Organ Damage Secondary to Dupilumab Therapy: A Case Report and Literature Review.",
      sum:["デュピルマブはインターロイキン（IL）-4 と IL-13 の signaling を標的とする抗体で、中等症から重症のアトピー性皮膚炎に広く使われています。喘息と小児期から続くアトピー性皮膚炎の既往がある 22 歳男性が、外用治療でも再燃を繰り返したためデュピルマブ 300 mg を 2 週ごとに開始した症例の報告と文献レビューです。開始前の EASI・DLQI・PGA は記録されていませんが、皮膚の状態は明らかに改善し、治療後の EASI は 1 でした。",
           "開始 5 か月後に動悸と胸の痛みで受診し、末梢血の好酸球数は開始前の 860/μL から 2070/μL に増加し、トロポニン I は 1.56 ng/mL と上昇していました。心電図は正常洞調律でしたが、心臓 MRI で心筋の浮腫と、心室中隔およびその周囲の壁の早期・遅延ガドリニウム造影効果が認められ、心筋炎が確認されました。抗核抗体・抗好中球細胞質抗体・腎機能・呼吸器ウイルス PCR・検便（卵・寄生虫）・全エクソーム解析によって自己免疫性・感染性・家族性の原因は除外され、デュピルマブに伴う好酸球増多による好酸球性心筋炎と診断されました。副鼻腔の CT では中等度の鼻副鼻腔炎がみられましたが浸潤性の所見はありませんでした。デュピルマブを中止し、副腎皮質ステロイドとコルヒチンで治療して、好酸球増多と症状は消失しました。",
           "デュピルマブに伴う好酸球増多は通常は軽く一時的ですが、心臓や呼吸器の新たな症状がある方や開始前から好酸球が高い方では、まれではあっても重い臓器障害を疑う意識をもつことが大切であり、一方で現時点ですべての方に定期的な好酸球の測定が推奨されているわけではないと述べられています。"],
      use:"デュピルマブ使用中に動悸や胸の痛みを訴えられたときに、好酸球数の推移を確かめて循環器へのご紹介を考える材料になります。",
      note:"1 例の症例報告で、起こる頻度を示すものではありません。" },
    { cat:"A", pmid:"42832695", journal:"Cutan Ocul Toxicol", year:2026, type:"後方視（123 例・5 年間）",
      tj:"65 歳以上の紫外線療法 123 例：42% が完全〜ほぼ完全な改善、有害事象 11.5%",
      te:"Phototherapy in dermatologic patients aged 65 years and older: a five-year retrospective study.",
      sum:["紫外線療法は最も古い皮膚科治療の一つですが、65 歳以上といった特定の集団における有効性と安全性は十分に定まっていません。ある施設の紫外線療法室で 2021 年 1 月 1 日から 2025 年 12 月 31 日までに治療を受けた 65 歳以上の方の診療記録を後方視的に見直し、年齢・性別・Fitzpatrick の皮膚型・診断・照射の種類・治療期間・総回数・累積線量・有害事象・治療反応・通院状況・中断の理由・実施した月を記録しています。",
           "5 年間に 688 名が紫外線療法を受け、うち 123 名（17.9%）が 65 歳以上でした。最も多い診断は乾癬で 36 名（29.3%）。全身のナローバンド UVB が 95 名（77.2%）、部分照射の NB-UVB が 23 名（18.7%）、全身 PUVA が 4 名（3.6%）、部分 PUVA が 1 名（0.8%）でした。NB-UVB を受けた方の累積線量の中央値は 15.12 J/cm2（範囲 0.01〜240.10）、総回数の中央値は 29 回（範囲 1〜175）。45 名（36.6%）が少なくとも 1 回治療を中断するか不規則な通院となり、有害事象は 14 名（11.5%）にみられました。反応を評価できた 100 名のうち、完全またはほぼ完全な改善が 42 名（42.0%）、部分的な改善が 22 名（22.0%）、改善なし・わずか・悪化が 36 名（36.0%）でした。反応した 64 名と反応しなかった 36 名の間で年齢・性別・治療の組み合わせ・照射の種類・通院の守り方に有意な差はなく、NB-UVB の累積線量が高いことと回数が多いことが治療反応と有意に関連していました。",
           "紫外線療法は 65 歳以上の方にとっても重要で信頼できる選択肢であり、とくに重症または治療に抵抗する病変の方、全身療法が禁忌であるか適さない方で有用と述べられています。"],
      use:"ご高齢の方に紫外線療法をご提案する際、通院を続けて回数を重ねることが結果に結びつくとご説明する材料になります。" },
    { cat:"A", pmid:"42836606", journal:"Immun Inflamm Dis", year:2026, type:"後方視症例集積（98 例・17 年間）",
      tj:"乳児アトピーのプリックテスト 98 例：卵 64.3%・牛乳 49% が最多",
      te:"Assessment of Common Food Allergens in Infants With Atopic Dermatitis in Kashan From 2005 to 2021.",
      sum:["アトピー性皮膚炎の乳児は食物アレルギーを起こしやすく、症状の出ない食物への感作もみられます。そこで 2005 年から 2021 年までの 17 年間に外来でプリックテスト（皮膚テスト）を受けたアトピー性皮膚炎の乳児 98 名について、食物アレルギーの状況を調べた後方視的な症例集積研究です。背景の情報を記録したうえで、前腕の皮膚テストで記録された食物アレルゲンの結果を診療記録から集め、SPSS v24 で解析しています。",
           "大多数（66.3%）は軽症の皮膚炎で、重症は 9 例（9.18%）でした。反応が多かったのは卵 64.3%、牛乳 49%、ナッツ類 35.7%、大豆 20.4%、小麦 12.2% の順でした。卵への反応は女児で男児より有意に多く（74.1% 対 52.3%、p=0.025）、牛乳への反応は症状の出始めが生後 6 か月より前の乳児で、6 か月以降の乳児より有意に多かった（56.06% 対 34.3%、p=0.044）。重症例では症状の出始めが他の重症度より有意に早く（2.78±2.77 か月、p=0.014）でした。",
           "アトピー性皮膚炎の乳児で反応が最も多かったのは卵と牛乳であり、著者らは、薬・食事・食物アレルギーを避ける工夫が助けになる可能性があり、とくに生後 6 か月より前の食事では卵と牛乳を避けることが考えられると述べています。"],
      use:"乳児の湿疹のご相談で、卵と牛乳の関与を調べる優先度が高いことをご説明する材料になります（生活指導アシスタントの食物アレルギーのタブ）。",
      note:"1 施設の後方視研究で、皮膚テストの反応は必ずしも食べて症状が出ることを意味しません。除去を行うかどうかは医師とご相談のうえで判断します。" },
    { cat:"A", pmid:"42836355", journal:"Dermatol Reports", year:2026, type:"単施設研究（220 例・治療 36 例）",
      tj:"中等症〜重症のニキビ 220 例：48.6% に不安、IPL 8 週で治療成功 86.1%",
      te:"Anxiety, patient satisfaction, and outcomes of intense pulsed light-based treatment for moderate-to-severe acne vulgaris in Southern Vietnam.",
      sum:["尋常性痤瘡（ニキビ）はよくある炎症性の疾患で心理社会的な影響を伴いますが、ベトナムでは中等症から重症のニキビに対する IPL（強力パルス光）を用いた治療の成績と不安についての資料が限られています。ベトナムのカントー皮膚科病院で 2023 年 5 月から 2024 年 5 月に、12 歳以上の中等症から重症の尋常性痤瘡 220 名を登録し、重症度を Global Acne Grading System（GAGS）、不安を DASS-21 の不安の下位尺度で評価しました。不安がみられた 36 名が 8 週間の IPL を含む併用療法を受け、臨床反応・GAGS の得点・不安の変化・満足度・忍容性を評価しています。",
           "平均年齢は 21.8±6.3 歳、59.5% が女性で、紅色丘疹・膿疹型が 98.6% を占め、全員に顔の病変がありました。炎症後の色素沈着は 100.0%、萎縮性の瘢痕は 76.8% にみられました。治療開始前の不安は 48.6% に認められ、重症のニキビは中等症と比べて不安と強く関連しました（オッズ比 24.64、95% 信頼区間 7.32〜127.43、p<0.001）。治療を受けた 36 名では、良好な臨床反応が 4 週の 36.1% から 8 週の 66.7% に増え、GAGS の平均得点は 25.3±3.8 から 12.7±5.9 に低下し（p<0.001）、治療成功は 86.1% に達しました。不安がみられた方の割合は 100.0% から 30.6% に減り（p<0.001）、86.1% が満足と答え、有害事象は軽度でした。",
           "中等症から重症のニキビはしばしば不安を伴っており、IPL を用いた治療は臨床的な改善・不安の軽減・高い満足度・良好な忍容性と関連していたと述べられています。"],
      use:"ニキビの程度が重い方の診察で、見た目のお悩みや不安についても伺っておく根拠になります。",
      note:"対照群のない単群の観察で、IPL 単独の効果や自然経過との区別はできません。" },
    { cat:"A", pmid:"42834764", journal:"Pediatr Allergy Immunol", year:2026, type:"横断研究（18,371 名）",
      tj:"小児 18,371 名を 3 型に分類：多アレルギー型 9.4%、上気道感染の調整オッズ比 3.48",
      te:"Phenotypic patterns of allergic comorbidity and associated health outcomes in children and adolescents: A population-based latent class study.",
      sum:["小児のアレルギー疾患は併存しやすい一方、食物アレルギーと薬物アレルギーまで含めた表現型の検討は限られています。湿疹・鼻炎・喘息・食物アレルギー・薬物アレルギーの 5 疾患にまたがる併存の型を導き、その型と健康上の結果との関連を調べることが目的です。北京と唐山から 3〜14 歳の 18,371 名を登録した地域住民ベースの横断研究で、湿疹・鼻炎・喘息は保護者が報告した医師の診断、食物と薬物のアレルギーは質問票で把握し、潜在クラス分析で分類しました。各型への所属に関わる要因は多項ロジスティック回帰、型と健康上の結果との関連は二項ロジスティック回帰で調べています。",
           "低アレルギー型 13,505 名（73.5%）、鼻炎優位型 3,147 名（17.1%）、多アレルギー型 1,719 名（9.4%）の 3 つの型が示されました。女児であること・母親の学歴が高いこと・世帯収入が中程度であること・屋外で過ごす時間が短いことは、鼻炎優位型と多アレルギー型のいずれでもオッズが有意に高く、生後早期の要因は主に鼻炎優位型と関連していました。座っている時間が長いことと週 1〜2 回のファストフードの摂取は多アレルギー型と関連しました。低アレルギー型と比べて、鼻炎優位型と多アレルギー型は上気道感染（調整オッズ比 4.40 と 3.48）および下気道感染（2.49 と 2.57）のオッズが高く、虫歯との関連は比較的弱いものでした。感度分析でも呼吸器感染の結果は支持されました。",
           "中国の 3〜14 歳で 3 つのはっきりした併存の型が示され、好ましくない 2 つの型は生活習慣に関わる要因を共有しつつ、生後早期の曝露との関連が異なっており、いずれも呼吸器感染の起こりやすさと独立して関連していたと述べられています。"],
      use:"湿疹に鼻炎や喘息が重なるお子さんに、外で体を動かす時間と食事のとり方についてお話しする材料になります（生活指導アシスタントの生活リズム・食事のタブ）。",
      note:"中国での横断研究で、原因と結果の向きを示すものではありません。" },
    { cat:"A", pmid:"42836164", journal:"Clin Cosmet Investig Dermatol", year:2026, type:"総説",
      tj:"乾癬と腸内細菌：Th17/IL-23 軸を介する機序と治療の見通しを整理",
      te:"Gut Microbiota in Psoriasis: Evidence for Dysbiosis, Pathological Mechanisms, Causality, and Therapeutic Implications.",
      sum:["乾癬は遺伝的な素因・環境からの引き金・免疫の調節の乱れによって起こる慢性の炎症性皮膚疾患で、世界の有病率は約 2〜3% です。近年、腸内細菌が環境要因と宿主の免疫をつなぐ重要な接点として注目されており、本稿はその証拠を体系的に整理した総説です。",
           "乾癬の方では、細菌の多様性の低下、特定の有益な菌の減少、日和見的な菌の増加といった明らかな腸内細菌の乱れ（dysbiosis）が報告されています。機序としては、Th17/IL-23 軸の調節、制御性 T 細胞の機能の乱れ、腸のバリアの破綻による細菌の移行、細菌の代謝産物の不均衡が挙げられています。因果関係については、無菌動物モデル・便微生物移植の実験・メンデルランダム化研究が複数の水準から支持を与えています。治療面では、プロバイオティクス・プレバイオティクス・食事による介入・便微生物移植が、前臨床および初期の臨床研究で乾癬の重症度を和らげる可能性を示したとされています。",
           "腸内細菌を標的とする方法には実用化の見通しがある一方、現時点の限界と今後の課題が併せて示されています。"],
      use:"乾癬の方から腸や食事との関係を尋ねられたときに、研究が進んでいる段階であるとお伝えする材料になります（生活指導アシスタントの食事のタブ）。",
      note:"総説で、個別の治療法の有効性を確立したものではありません。" },
    { cat:"A", pmid:"42832771", journal:"Cutan Ocul Toxicol", year:2026, type:"横断比較研究（72 名）",
      tj:"軽症中心の乾癬では便中カルプロテクチンは対照と差なし：72 名",
      te:"Subclinical intestinal inflammation in psoriasis: a cross-sectional comparative study using fecal calprotectin.",
      sum:["乾癬は炎症性腸疾患や腸と皮膚のつながり（gut-skin axis）と関連づけられてきましたが、皮膚の乾癬が症状として現れない腸の炎症と関連するかは定まっていません。成人 72 名（全身療法を受けている乾癬 22 名、受けていない乾癬 25 名、対照 25 名）を対象に、便中カルプロテクチン（FC）を ELISA で測定し、消化器症状を Gastrointestinal Symptom Rating Scale（GSRS）、乾癬の重症度を PASI で評価した横断比較研究です。年齢と性別で調整した解析は対数変換した FC を用いています。",
           "FC の中央値（四分位範囲）は、全身療法を受けている群で 60.0（30.0〜263.1）µg/g、受けていない群で 48.4（30.0〜188.0）µg/g、対照で 57.6（30.0〜157.7）µg/g と 3 群間に有意差はなく（p=0.554）、乾癬をまとめた比較でも 53.1（30.0〜197.3）対 57.6（30.0〜157.7）µg/g（p=0.503）でした。年齢と性別で調整した幾何平均の比は 1.30（95% 信頼区間 0.74〜2.28、p=0.356）。GSRS の得点も群間で有意差はなく、FC は PASI や GSRS と有意な関連を示しませんでした。",
           "皮膚症状が主に軽症で、既知の消化器疾患や乾癬性関節炎のない少数の選ばれた集団では、FC と GSRS による差は検出されず、より大規模な前向き研究が必要と述べられています。"],
      use:"乾癬の方でお腹の症状がないときに、便中カルプロテクチンの測定を急がない判断の材料になります。" },
    { cat:"B", pmid:"42835142", journal:"Front Med (Lausanne)", year:2026, type:"症例提示（2 例・後方視）",
      tj:"舌の色を数値化して漢方の舌診を客観化：2 例で色差 ΔE00 1〜2 と 10.08",
      te:"Clinical usefulness of objective tongue image devices monitoring in temporal tongue color: a demonstration of successively treated cases with traditional medicines.",
      sum:["漢方医学では、患者さんの舌を観察する診察法を舌診といいます。舌から得られる情報は、初診時の処方の選択、治療開始後の効果の確認、処方を変えるかどうかの判断に用いられます。そのため漢方を行う医師は、以前の舌の状態と現在の状態を正確に比べる必要がありますが、以前の舌の見た目を細かく覚えて一貫して正確に比べることは難しいという背景があります。舌の所見を客観的で再現性のある形で記録する方法が求められることから、著者らが開発した Tongue Image Analyzing System（TIAS、舌画像解析システム）の有用性を検討しました。同意を得て舌の写真を撮影した方を後方視的に見直し、経過中の舌の所見の変化の程度が対照的な 2 例を選び、TIAS で撮影した画像から舌の色を RGB の値として取得し、CIE L*a*b* 色空間に変換しています。",
           "症例 1 は 3 つの時点で解析し、初診からの色の差（L*a*b* の値から ΔE00 として計算）は 42 日後に 1〜2 増加しましたが、この変化は肉眼では捉えられない程度でした。症例 2 は 5 つの時点で解析し、初診と 105 日後の色の差は ΔE00 10.08 で、舌の色のはっきりした変化を示し、舌苔の不均一さの変化も伴っていました。",
           "TIAS は舌の画像を標準化して経時的に記録でき、肉眼では見分けにくいわずかな舌の色の変化も客観的・定量的に比べられるため、日常診療で舌の所見の経過を記録し比較するのに役立つ可能性があると述べられています。"],
      use:"漢方の再診で舌の所見を言葉と写真の両方で残しておくと、処方を続けるか変えるかのご相談がしやすくなる裏づけになります。",
      note:"代表的な 2 例の提示で、診断の精度や処方の成績が上がるかは示されていません。" },
    { cat:"C", pmid:"42749858", journal:"Support Care Cancer", year:2026, type:"RCT（第 III 相・各群 36 名）",
      tj:"自分で行う指圧で疲労・不眠・抑うつの症状群が改善：乳がん経験者の第 III 相 RCT",
      te:"Effects of self-acupressure on the fatigue-sleep disturbance-depression symptom cluster in breast cancer survivors: a phase III randomised controlled trial.",
      sum:["乳がんの経験者における疲労・睡眠の乱れ・抑うつという症状群（FSDSC）に対して、自分で行う指圧（self-acupressure）の有効性と安全性、および試験のなかで生じた費用を調べた無作為化比較試験です。適格な方を、本物の自己指圧群・偽の自己指圧群・通常ケア群に各 36 名ずつ無作為に割り付けました。主要評価は症状群で、個々の症状の水準（疲労は Brief Fatigue Inventory、睡眠はピッツバーグ睡眠質問票、抑うつは HADS の抑うつ尺度）と、症状群としての水準（疲労・抑うつ・睡眠の乱れの 0〜10 の数値評価尺度の平均）の両方で測りました。副次評価は FACT-B による生活の質で、開始前（0 週）・介入直後（7 週）・追跡後（19 週）に評価しています。",
           "93 名が試験を完了し、すべての臨床評価と生活の質で群と時期の交互作用が有意でした。本物の自己指圧群は 7 週と 19 週の時点で他の 2 群より症状群の成績が有意に良好で（いずれも p<0.01）、個々の症状でも睡眠質問票と HADS の抑うつが 2 群より有意に良好でした（いずれも p<0.05）。疲労（BFI）は通常ケア群より両時点で有意に低く（いずれも p<0.0001）、偽の自己指圧群との差は 19 週のみ有意でした（p=0.0076）。生活の質（FACT-B の総得点）は通常ケア群より両時点で有意に高く（いずれも p<0.0001）、偽の自己指圧群との差は 7 週では有意でなく（p=0.069）、19 週で有意でした（p=0.0002）。有害事象の報告はありませんでした。",
           "自己指圧は安全な介入であり、乳がん経験者の疲労・睡眠の乱れ・抑うつの症状群の管理に良い効果を示したとされています。症状管理を支える方法として推奨される一方、費用対効果は不確かで今後の検討が必要と述べられています。"],
      use:"疲労と寝つきの悪さを訴えられる方に、ご自身でツボを押す方法を併せてご案内する裏づけになります。",
      note:"皮膚領域外（乳がん経験者の症状管理）の研究です。" },
    { cat:"C", pmid:"42809191", journal:"Int Urol Nephrol", year:2026, type:"後方視コホート（傾向スコアマッチング・82 対）",
      tj:"督脈の火龍灸で睡眠の質が −5.3 点：早期の糖尿病性腎症 82 対",
      te:"Association of governor vessel fire dragon moxibustion with patient-reported sleep quality and proteinuria in early stage diabetic kidney disease: a propensity score-matched retrospective cohort study.",
      sum:["糖尿病性腎症（DKD）と併存する不眠は互いを悪くする関係にあり、腎機能の低下を速めます。ガイドラインに沿った標準治療（GDMT）を行っても蛋白尿の残余リスクは相当に残るという背景で、早期の DKD・不眠・脾腎陽虚のある方において、標準治療に加えた督脈（Governor Vessel）の火龍灸が、患者さんが申告する睡眠の質・腎機能の指標・記録された安全性とどう関連するかを調べた後方視コホート研究です。286 名が標準治療のみ、または標準治療に 4 週間の火龍灸を加える形で登録され、測定された背景の偏りを減らすため 1 対 1 の傾向スコアマッチングを行い、背景のそろった 82 対（計 164 名）を作りました。主要評価は患者さんが申告するピッツバーグ睡眠質問票（PSQI）の総得点の変化です。",
           "マッチング後の集団で、火龍灸の群は PSQI 総得点の平均の低下が標準治療の群より有意に大きく（−5.3±1.8 対 −1.3±1.1、p<0.001）、患者さんが申告する睡眠の質の改善が大きいことを示しました。探索的な解析では、4 週間での 24 時間尿蛋白の低下（−0.07±0.06 対 −0.02±0.05 g/日、p<0.001）と尿アルブミン／クレアチニン比の低下（−23.9±15.4 対 −5.8±12.5 mg/g、p<0.001）も大きく、eGFR と空腹時血糖の変化には有意差がありませんでした（いずれも p>0.05）。3 名（3.7%）に軽度で一時的な局所の皮膚反応がみられ、重篤な有害事象の記録はありませんでした。",
           "標準治療に加えた督脈の火龍灸は、4 週間での患者申告の睡眠の質の改善の大きさと関連し、おおむね良好に受け入れられたとされています。尿蛋白とアルブミン尿の短期の低下も探索的に示されましたが、その安定性・持続性・長期の腎臓における意義は不確かであり、盲検化されておらず睡眠も自己申告であるため慎重に解釈し、適切な偽治療または注意の量をそろえた対照・客観的な睡眠の指標・尿の反復測定・より長い腎機能の追跡を伴う前向き研究での確認が必要と述べられています。"],
      use:"灸をご希望の方に、冷えと寝つきのご相談で用いる際の参考になり、施灸部位の軽い皮膚反応にも目を配る材料になります。",
      note:"皮膚領域外（糖尿病性腎症）の後方視研究で、盲検化されていません。" },
    { cat:"C", pmid:"42782868", journal:"Curr Oncol", year:2026, type:"単群・多施設の探索的試験（48 例）",
      tj:"内関への患者操作の経皮電気ツボ刺激で化学療法の吐き気が軽減：単群 48 例",
      te:"Patient-Controlled Real-Time Transcutaneous Electrical Acupoint Stimulation at Neiguan (PC6) for Chemotherapy-Induced Nausea and Vomiting in Breast Cancer: An Exploratory Single-Arm Two-Stage Trial.",
      sum:["化学療法に伴う吐き気と嘔吐（CINV）は、ガイドラインに沿った制吐薬を用いても退院後は抑えにくいことがあります。乳がんの患者さんで、標準の制吐療法に加えて内関（PC6）に対する患者さん自身が操作する経皮的電気ツボ刺激（TEAS）を用いる方法を評価した、多施設の探索的な単群 2 段階試験です。CINV を経験し、登録時に 2 回続く治療周期で同じ化学療法と制吐薬の予定であった 48 名を解析しました。第 1 周期を観察期間とし、第 2 周期では化学療法後 0〜120 時間のあいだに吐き気や嘔吐が出た時点で、患者さんが手首に装着した装置で必要に応じて TEAS を開始しました。",
           "観察期間と比べて、TEAS は 1〜5 日目の吐き気の回数と視覚的評価尺度の得点がより低いこと、1〜4 日目の吐き気の反応率がより高いことと関連していました。嘔吐の回数と程度は 1〜3 日目では低かった一方、4〜5 日目の期間間の差は有意ではありませんでした。5 日目には SF-36 の得点が上昇し、SAS・SDS の得点が低下しました。一時的な局所のしびれが 2 件生じ、TEAS に関連する重篤な有害事象はありませんでした。",
           "患者さん自身が操作する TEAS は実施可能であり、偽刺激を対照とした無作為化試験での確認に値すると述べられています。"],
      use:"治療中の吐き気のご相談で、ツボ刺激を併用する選択肢に触れる材料になります。",
      note:"皮膚領域外（化学療法に伴う吐き気）。対照群のない単群の試験です。" },
    { cat:"C", pmid:"42813726", journal:"Integr Cancer Ther", year:2026, type:"証拠地図（47 レビュー）",
      tj:"乳がんの症状への鍼灸：47 のレビューを地図化、質が高いものはなし",
      te:"Acupuncture and Related Therapies for Breast Cancer-Related Symptoms: An Evidence Map.",
      sum:["乳がんは世界で女性に最も多い悪性腫瘍で、治療が進んでも多くの経験者が生活の質を損なう症状や治療に伴う副作用を経験します。鍼灸に関連する治療は支持療法として用いられることが増えていますが、証拠は散在しています。そこで乳がんに関連する症状に対する鍼灸とその関連療法を評価したシステマティックレビューとメタ解析の証拠地図（エビデンスマップ）を作成しました。PubMed・Embase・Cochrane のレビュー・CNKI・万方・RISS・OASIS・KISS を開始時点から 2025 年 4 月 24 日まで検索し、介入の種類・評価項目・研究数・対象者数・効果の方向、および AMSTAR-2 による方法論的な質を抽出して、ヒートマップで整理しています。",
           "メタ解析を伴う 47 のシステマティックレビューが含まれ、11 の症状領域と 6 種類の介入を扱っていました。多く調べられていた評価項目はホットフラッシュ（9 件）、化学療法中の支持療法全般（9 件）、リンパ浮腫（7 件）、副作用の管理全般（6 件）、アロマターゼ阻害薬に伴う関節痛（4 件）で、介入は鍼（17 件）、鍼の併用療法（16 件）、ツボ注射（9 件）が多かったです。結果は 20 件が肯定的、23 件が混合、4 件が明確な利益の証拠なしでした。方法論的な質は、47 件のうち中程度の確信度が 8 件のみで高いものはなく、低いものが 29 件、きわめて低いものが 10 件でした。",
           "鍼灸とその関連療法は支持療法として広く研究され有望な証拠がある一方、レビューの多くは方法論的な質が低く、証拠を強めて重複を減らし統合医療の実践を導くには質の高い試験と厳密なレビューが必要と述べられています。"],
      use:"鍼灸を支持療法としてお尋ねになる方に、報告は多いけれども質には幅があると率直にお伝えする材料になります。",
      note:"皮膚領域外（乳がんに関連する症状）。レビューの質を地図化した研究で、個別の効果の大きさを示すものではありません。" },
    { cat:"C", pmid:"42718746", journal:"Front Med (Lausanne)", year:2026, type:"ネットワークメタ解析（36 RCT・3,351 名）",
      tj:"がんのオピオイド誘発性便秘への鍼灸：36 RCT のネットワークメタ解析（確実性は低い）",
      te:"Acupuncture-related therapies for opioid-induced constipation in patients with cancer: a systematic review and network meta-analysis.",
      sum:["がんの患者さんのオピオイド誘発性便秘（OIC）に対する鍼灸関連療法の有効性と安全性を、対比較とネットワークメタ解析で評価したシステマティックレビューです。8 つのデータベースを開始時点から 2025 年 6 月 28 日まで検索し、下剤の併用の有無を問わず、がんの患者さんの OIC を対象とした無作為化比較試験を集め、R で対比較とベイズ流のネットワークメタ解析を行いました。主要評価は便秘に関わる症状と便の形状で、Cleveland 便秘尺度（CCS）、週あたりの自発的な排便回数、Bowel Function Index（BFI）、PAC-SYM、Bristol 便形状尺度を用い、SUCRA で順位づけし、証拠の確実性は GRADE で評価しています。",
           "36 の無作為化比較試験・3,351 名・15 種類の鍼灸関連の介入が含まれました。対比較と単一の研究による比較からの直接の証拠では、一部の鍼灸関連療法が単独または浸透圧性下剤（OSM）との併用で、OSM や他の対照と比べて CCS・週あたりの排便回数・BFI・PAC-SYM・便形状尺度を改善する可能性が示されました。ネットワークメタ解析では 3 つの併用（抄録では AA＋OSM、AP＋OSM、APA＋OSM と略記され、略語の定義は抄録に記載がありません）が OSM と比べて BFI の有意な低下と関連しましたが、これらの推定は確実性の低い証拠に基づいていました。CCS・週あたりの排便回数・PAC-SYM・便形状尺度・PAC-QOL の総得点では有意差は検出されませんでした。安全性を報告した研究では有害事象はおおむね軽度でまれであり、主に消化器症状と局所の皮膚反応でした。多くのネットワークの推定はまばらな証拠に基づき、確実性は低いからきわめて低いとされ、SUCRA による順位づけは探索的なものとされています。",
           "鍼灸関連療法は、がんに関連する OIC の一部の便秘の症状と便秘に関わる生活の質の側面を改善する可能性があり、報告された有害事象はおおむね軽度でしたが、利用できる証拠は限られ全体に確実性が低いため、これらの結果は探索的なものとして捉えるべきと述べられています。"],
      use:"便秘のご相談でツボ押しを併せてご案内する際に、期待の程度を控えめにお伝えする材料になります。",
      note:"皮膚領域外（がんのオピオイド誘発性便秘）。証拠の確実性は低いからきわめて低いとされています。" }
  ]
},
{
  date: "2026-10-06",

  items: [
    { cat:"A", pmid:"42830251", journal:"Allergol Int", year:2026, type:"出生コホート（1,769 名）",
      tj:"手のひらのしわが目立つ子はアトピーが続きやすい：調整オッズ比 3.60",
      te:"Palmar hyperlinearity is associated with persistent atopic dermatitis trajectory with high allergic risk: The yamanashi adjunct study of the Japan environment and Children's study.",
      sum:["手掌の過線条（palmar hyperlinearity、手のひらのしわが目立つ所見）は Hanifin と Rajka が示したアトピー性皮膚炎の小基準の一つで、フィラグリン遺伝子の機能喪失型変異と関連します。フィラグリンの変異はアトピー性皮膚炎の長期の経過と結びついている一方、この所見と経過の型との関係を調べた資料は限られているという背景の研究です。エコチル調査（子どもの健康と環境に関する全国調査）の山梨サブコホートの小児 1,769 名を解析し、所見は経過を知らされていない小児アレルギー専門医と人工知能（AI）による判定の両方で評価しました。生後 6 か月から 6 歳までの 8 回の評価をもとに縦断的な潜在クラス分析で経過の型を分類し、ほとんど発症しない群を基準とした多項ロジスティック回帰で関連を調べています。",
           "手掌の過線条は 34 名（1.9%）、AI 判定では 10 名（0.6%）に認められました。経過の型は持続型 8.5%、早期発症型 16.7%、遅発型 10.3%、ほとんどなし 64.6% の 4 つに分かれました。手掌の過線条は持続型と有意に関連し（調整オッズ比 3.60、95% 信頼区間 1.49〜8.67）、早期発症型・遅発型とは関連しませんでした。AI による判定でも同様の結果でした。持続型は 6 歳時の食物アレルギー・喘息・アレルギー性鼻炎の症状、および 8 歳時のアレルゲン感作とも関連していました。",
           "手掌の過線条は、より持続しやすい経過をたどるアトピー性皮膚炎の表現型と関連していたと述べられています。"],
      use:"乳幼児の診察で手のひらのしわが目立つときに、長引きやすさと他のアレルギーの併発に目を配り、保湿と環境の指導を早めにお伝えする材料になります（生活指導アシスタントのスキンケア・食物アレルギーのタブ）。" },
    { cat:"A", pmid:"42831033", journal:"World Allergy Organ J", year:2026, type:"横断研究＋検証コホート（125 例・40 例）",
      tj:"慢性蕁麻疹の IIb 型を見分ける：抗 TPO 抗体高値＋自己血清皮内テスト陽性が最も特徴的",
      te:"Development and validation of a clinically applicable biomarker panel for identifying autoimmune type IIb chronic spontaneous urticaria.",
      sum:["慢性特発性蕁麻疹には、自己アレルギー性の I 型と自己免疫性の IIb 型という 2 つの自己免疫性のエンドタイプ（病態の型）があり、成り立ちと治療への反応が異なります。しかし日常診療でこの 2 つを見分ける実用的な基準は限られているという背景です。慢性特発性蕁麻疹の 125 名を対象に、入手しやすい臨床・検査の項目の組み合わせで IIb 型らしい方を見分けられるかを検討しました。評価したのは、①IgG 型の抗甲状腺ペルオキシダーゼ抗体（抗 TPO 抗体）高値と総 IgE 低値、②抗 TPO 抗体高値と自己血清皮内テスト陽性、③総 IgE 低値と自己血清皮内テスト陽性、の 3 つの組み合わせです。血清サイトカインも解析し、独立した 40 名のコホートで検証して、臨床・検査の変数を統合した予測モデル（ノモグラム）を作成しています。",
           "3 つの組み合わせはいずれも IIb 型に合致する特徴をもつ集団を同定し、具体的には病勢（UAS7）が高い傾向、末梢血の好酸球減少・好塩基球減少がみられました。なかでも抗 TPO 抗体高値と自己血清皮内テスト陽性の組み合わせが、IIb 型に合致する特徴を最も広くとらえていました。サイトカインの傾向も異なり、IIb 型の可能性がある方では血清インターロイキン（IL）-6 が低め、IL-17A と腫瘍壊死因子（TNF）-α が高めで、他の慢性特発性蕁麻疹の方と差がみられました。これらの傾向は独立した検証コホートでも同じ方向に支持され、予測ノモグラムは良好な識別能を示しました。",
           "抗 TPO 抗体・総 IgE・自己血清皮内テストの組み合わせは、IIb 型の慢性特発性蕁麻疹を推定するための実用的な参考になり、とくに抗 TPO 抗体高値と自己血清皮内テスト陽性の併存が臨床的に最も意味があるとされています。サイトカインのパターンの違いもエンドタイプによる免疫の差を支持し、個々に合わせた対応に役立つ可能性があると述べられています。"],
      use:"抗ヒスタミン薬を増やしても長引く蕁麻疹の方で、抗 TPO 抗体と総 IgE の採血結果を治療方針のご相談に活かす材料になります。",
      note:"病態の型を推定する研究で、治療法の優劣を比べたものではありません。" },
    { cat:"A", pmid:"42828343", journal:"Psoriasis (Auckl)", year:2026, type:"前向き観察研究（50 例・対照 50 例）",
      tj:"乾癬の生物学的製剤は 4 週で心の負担とコルチゾールを健常範囲へ：50 例",
      te:"Four Weeks of Biologic Treatment are Sufficient to Normalize Blunted HPA-Axis Activity and Significantly Improve Psychological Burden in Patients with Psoriasis.",
      sum:["乾癬は心理的な負担が大きく、視床下部・下垂体・副腎（HPA）系の調節の乱れを含む内分泌の変化と関連します。生物学的製剤は皮膚の状態を改善しますが、心理的負担と HPA 系の活動の早期の変化は十分に調べられていないという背景の研究です。中等症から重症の乾癬 50 名を治療開始前と生物学的製剤 4 週後に評価し、背景を合わせた健常者 50 名を開始前の時点で評価した前向き観察研究です。心理面の主要評価は抑うつ症状（ベック抑うつ質問票、BDI）、不安（状態・特性不安抑うつ質問票、STADI）、知覚ストレス（知覚ストレス尺度、PSS）で、採血時刻を合わせた患者 25 名と健常者 25 名で血漿コルチゾールを測定しています。",
           "開始前の時点で、乾癬の方は健常者と比べて抑うつ症状・状態不安・特性不安・状態抑うつ・特性抑うつ・知覚ストレスがいずれも高い、はっきりとした心理的苦痛を示しました。生物学的製剤 4 週後には BDI、STADI の状態不安と特性不安、PSS が有意に改善し（いずれも p≤0.002）、4 週の時点で BDI・特性不安・知覚ストレスは Bonferroni 補正後の検定で健常者と差がなくなりました。開始前の血漿コルチゾールは健常者より低く（p=0.015）、4 週後に有意に上昇して健常者と差がなくなりました（p=0.839）。同じ 4 週間で PASI は 16.9 から 7.2 へ低下しています（p<0.001）。",
           "生物学的製剤による治療をわずか 4 週間行った時点で心理的負担が明らかに改善し、血漿コルチゾールは低下した状態から健常者でみられる範囲へ移っており、HPA 系の活動が早期に正常化したことと一致すると述べられています。"],
      use:"乾癬の治療を始める方に、皮膚の改善とあわせて気分やストレスの負担も比較的早く軽くなりうるとご説明する材料になります。",
      note:"対照群のない 4 週間の観察で、プラセボ効果や自然経過の影響は分けられていません。" },
    { cat:"A", pmid:"42830944", journal:"Clin Cosmet Investig Dermatol", year:2026, type:"免疫学的比較研究",
      tj:"IgE が高い乾癬はかゆみが強い：Th2 と CD23 陽性 B 細胞が増加",
      te:"Elevated IgE Levels in Psoriasis: An Atypical Subtype with Th2 Dominance and Overlapping Features of Atopic Dermatitis.",
      sum:["乾癬で IgE が高い場合にどのような影響があるのかを、T 細胞と B 細胞の各分画およびそれに関わるサイトカインの反応から調べた研究です。サイトカインは ELISA 法、総 IgE は ELISPOT 法で測定し、末梢血単核球のフローサイトメトリーで CD4 陽性 T 細胞の分画（Th1・Th2・Th17 をそれぞれ IFN-γ・IL-4・IL-17A という指標となるサイトカインで）を評価しました。あわせて末梢血リンパ球の CD23 と CD19 の発現を測定して B 細胞の反応を調べ、IgE が高い乾癬（H-PSO）群、尋常性乾癬（PSO）群、アトピー性皮膚炎（AD）群を比較しています。",
           "PASI は H-PSO 群と PSO 群で同程度でしたが、H-PSO 群はかゆみのピークを表す数値評価尺度（NRS）が有意に高い値を示しました。H-PSO 群で上昇した末梢血の IgE は PASI と正の相関を示した一方、かゆみのピークの NRS とは必ずしも相関しませんでした。IgE の上昇に一致して Th2 細胞と IL-4 が増加し、CD19 陽性・CD23 陽性の細胞集団も増えていました。Th17 細胞の割合は H-PSO 群でアトピー性皮膚炎群より有意に高く、IL-17A も同じ傾向でしたが統計的な有意差には達しませんでした。Th1 細胞と IFN-γ は、2 つの乾癬群の間でも、各乾癬群とアトピー性皮膚炎群の間でも同程度でした。",
           "IgE が高い乾癬の方では Th2 反応と CD23 陽性 B 細胞が目立ち、同時に Th17 反応も顕著という独特の免疫像があり、乾癬における免疫の乱れの複雑さを示していると述べられています。"],
      use:"乾癬の診断で、かゆみが強くアトピー性皮膚炎と見分けにくい方の採血結果を考えるときの参考情報になります。",
      note:"免疫学的な検討で、治療法を比べた研究ではありません。例数は抄録に記載がありません。" },
    { cat:"A", pmid:"42830235", journal:"Contact Dermatitis", year:2026, type:"後方視（4,343 例）",
      tj:"洗浄成分アルキルグルコシドの接触アレルギー：4,343 例で 5.2% が陽性",
      te:"High Frequency of Sensitisation to Decyl and Lauryl Glucoside in Routine Patch Testing in the Netherland.",
      sum:["アルキルグルコシドであるデシルグルコシドとラウリルグルコシド（化粧品や洗浄料に使われる界面活性剤）への接触アレルギーが、近年ますます認識されてきている背景の研究です。感作の頻度、研究期間中の推移、両者がともに反応する交叉反応のパターン、陽性反応の臨床的な意味、そしてアトピーの既往がある方で感作しやすいかどうかを調べました。オランダで 2019 年 11 月 1 日から 2026 年 1 月 5 日までにパッチテストを受けた 4,343 名に、デシルグルコシド 5%ワセリンとラウリルグルコシド 3%ワセリンを定型的に貼布した後方視的な研究です。",
           "陽性率はデシルグルコシドで 3.5%、ラウリルグルコシドで 3.1% で、少なくとも一方に反応した方は全体の 5.2% でした。判定が疑わしい反応も多く（デシルグルコシド 2.5%、ラウリルグルコシド 3.1%）、全体の 1.9% が確実またはおそらく臨床的に意味があると判断されました。デシルグルコシドとラウリルグルコシドの交叉反応は陽性となった方の 40〜47% にみられ、アトピーの既往は陽性となるオッズをわずかに高める程度の関連でした。",
           "アルキルグルコシドへの接触アレルギーは、このパッチテスト集団では頻度が高かったと述べられています。一方で疑わしい反応が相当な割合を占め、強い陽性反応がほとんどみられなかったことから、用いたグルコシドの試薬自体に刺激性がある可能性が示唆されるとされています。"],
      use:"洗顔料やシャンプーで顔や手がヒリヒリする方のパッチテストを考えるときに、洗浄成分も候補に入れる材料になります（生活指導アシスタントのパッチのタブ）。" },
    { cat:"A", pmid:"42830386", journal:"Contact Dermatitis", year:2026, type:"前向き観察（100 例）",
      tj:"全身性接触皮膚炎を疑う湿疹 100 例：パッチ陽性 40%、基準を満たしたのは 2 例",
      te:"Patch Test Relevance and Systemic Exposure Pathways in Eczema Patterns Suspected of Systemic Contact Dermatitis.",
      sum:["全身性接触皮膚炎（systemic contact dermatitis、SCD）は、すでに感作された方が全身を通して取り込まれたアレルゲンに反応して生じます。北インドの三次医療機関で 2023 年 7 月から 2024 年 7 月まで、12 歳以上で SCD と結びつけられてきた 4 つの湿疹のパターン（非特異的な湿疹・手足の汗疱・治りにくい手湿疹・左右対称性薬剤関連間擦部屈曲部発疹〈SDRIFE〉）の連続例を対象に、詳しい曝露歴の聴取、インド標準シリーズのパッチテスト、COADEX による判定を行いました。SCD の診断には、関連のある陽性反応・記録された全身曝露・時間的な悪化の一致のすべてを必要とし、経口負荷試験は行っていません。",
           "100 名（平均年齢 37.7±14.7 歳、女性 59%）が登録されました。内訳は非特異的な湿疹 38%、汗疱 32%、手湿疹 29%、SDRIFE 様の発疹 1% でした。パッチテストは 40% で陽性となり、主な感作源はパラフェニレンジアミン 13%、ニッケル 9%、パルテニウム 9%、重クロム酸カリウム 8% でした。あらかじめ定めた SCD の臨床基準を満たしたのは女性 2 名（2%、95% 信頼区間 0.24〜7.04%）で、ニッケルに関連する 1 例が臨床的に確実、ニンニクに関連する 1 例がおそらく該当と分類されました。汗疱と手湿疹の群では SCD と診断された方はいませんでした。",
           "臨床的に意味のある接触感作はしばしばみられる一方、SCD の臨床基準を満たしたのは 100 名中 2 名のみでした。SCD と関連づけられる特定の湿疹パターンでは、的を絞ったパッチテストと構造化した曝露評価が支持されるとされ、真の頻度を把握するにはより大規模で多施設の前向き研究が必要と述べられています。"],
      use:"治りにくい手湿疹や汗疱の方に、まずパッチテストで接触アレルゲンを絞り込むという進め方の根拠になります。",
      note:"インド標準シリーズを用いた単施設の報告で、曝露の状況は日本と異なる可能性があります。" },
    { cat:"A", pmid:"42830028", journal:"Contact Dermatitis", year:2026, type:"横断研究（58 店舗・266 本）",
      tj:"美容室のはさみ・バリカン：13.9% からニッケル、6.8% からコバルトが検出",
      te:"Occupational Exposure to Nickel and Cobalt From Hairdressing Tools: A Cross-Sectional Study in 58 Danish Salons.",
      sum:["美容師は水仕事が多く皮膚のバリアが弱まりやすく、そこに金属製の道具へ繰り返し触れることで職業上のアレルゲン曝露が加わります。しかし、よく手に取る刃物類からのニッケルとコバルトの溶出についての資料は限られているという背景です。デンマークの美容室 58 店舗を 2026 年 3 月 1 日から 6 月 30 日まで訪問し、はさみ・バリカン・かみそりをそれぞれ 1 回ずつ、ニッケルはジメチルグリオキシム、コバルトはニトロソ R 塩を用いた比色スポットテストで調べた横断的な実地調査です。",
           "調べた 266 本（はさみ 167 本、バリカン 95 本、かみそり 4 本）のうち、37 本（13.9%）がニッケル陽性、18 本（6.8%）がコバルト陽性でした。ニッケル陽性ははさみで 15.6%、バリカンで 10.5%、コバルト陽性はそれぞれ 6.6%、6.3% でした。少なくとも 1 本が陽性だった店舗は、ニッケルで 58 店舗中 22 店舗（37.9%）、コバルトで 12 店舗（20.7%）でした。",
           "よく使われる美容道具からのニッケルとコバルトの溶出はありふれた職業上のリスクであり、材質の慎重な選択や規制上のより厳しい監督といった、先手を打った予防策が必要であると述べられています。"],
      use:"美容師・理容師の手湿疹の方に、水仕事に加えて道具の金属も原因の候補になるとご説明し、手袋や道具の見直しをご相談する材料になります。" },
    { cat:"A", pmid:"42830060", journal:"Georgian Med News", year:2026, type:"診断指標の検証",
      tj:"爪白癬の爪甲破壊指数は鏡検の菌量とよく相関：r=0.81",
      te:"NAIL PLATE DAMAGE INDEX IN DERMATOSCOPIC EXAMINATION OF PATIENTS WITH ONYCHOMYCOSIS.",
      sum:["爪白癬での爪甲の障害の程度を評価する統一された基準がないため、治療効果を客観的に評価したり、異なる治療法の成績を比べたりすることができないという背景の研究です。病変の状態を知る方法の一つとして爪甲破壊指数（nail plate damage index、NPDI）がありますが、見た目の所見が実際の状態とどこまで対応するのかは不明でした。そこで爪白癬の患者さんを NPDI、爪真菌症臨床スコア指数（SCIO）、爪真菌症重症度指数（OSI）で評価し、真菌の量は擦過物の鏡検で調べて、両者の結果を比較しています。",
           "鏡検による障害が面積の 25% までのときは、通常は爪の色の変化がみられ、白または黄色の斑や条が（多くは遊離縁の近くや側縁に）現れる一方、爪の厚さはほとんど損なわれていませんでした。25% から 50% の障害では、爪はつやを失い、明らかに厚くなって変形し、崩れ始め、爪の下に角質が蓄積する爪下角質増殖がしばしば生じていました。50% を超える障害では変化が爪母（爪の成長する部分）に達し、爪甲が崩れて爪床から剥がれる爪甲剥離を起こすか、薄く柔らかくなっていました。NPDI は真菌に覆われた面積とよく相関し（r=0.81）、診断と治療経過の観察の両方に推奨できるとされています。",
           "爪甲破壊指数は情報量の多い指標であり、診断と治療のモニタリングの双方に用いることができると述べられています。"],
      use:"爪白癬の方に見た目の変化がどの段階にあるかをご説明し、治療前後の比較を記録するときの目安になります。",
      note:"例数や統計手法の詳細は抄録に記載がありません。" },
    { cat:"A", pmid:"42831009", journal:"Cureus", year:2026, type:"ナラティブレビュー",
      tj:"ネットのスキンケア情報と痤瘡の治療継続：自己流の重ね塗りが刺激と中断につながる",
      te:"Digital Skincare Marketing, Self-Experimentation, and Treatment Adherence in Acne Vulgaris: A Psychodermatological Review.",
      sum:["痤瘡（にきび）は治療を続ける必要がありますが、外用薬で乾燥・皮むけ・赤み・ピリピリ感が起きると、意味のある改善が現れる前に治療の継続が弱まりやすいという背景です。ネット上の痤瘡の情報は教育や患者さんの体験へのアクセスを広げる一方で、臨床的な助言を商業的な宣伝・変身の物語・複雑なスキンケアの手順と同じ並びに置き、エビデンスの序列が一定しません。心の面での弱さとネットのスキンケア情報への接触が、化粧品の自己実験・皮膚の刺激・治療の非継続にどう関わりうるかを、観察された関連と検証されていない機序の推測を区別しながら検討したナラティブレビューです。PubMed・Embase・Google Scholar を 2026 年 7 月 22 日まで、2016 年以降の英語文献で検索しています。",
           "検討された文献全体では、痤瘡に伴う偏見（スティグマ）、抑うつ症状、身体醜形の症状、治療への期待が、心理的負担・治療満足度・続けようという意思と関連していました。別の研究では、患者さんがネット上の痤瘡の推奨を取り入れること、多段階の化粧品の手順に伴って医師が観察した皮膚疾患、皮膚の副作用と服薬継続の悪さとの関連が報告されていました。これらを合わせると、心理的な苦痛・改善の遅れ・ネットでの製品への接触・皮膚症状・継続の困難が互いに影響し合う概念モデルが支持されますが、入手できるエビデンスはこの順序を因果的にも経時的にも証明していません。デジタルへの接触・製品の追加・客観的なバリア機能の変化・症状の受け取り方・服薬の継続を同じ患者さんで測定した縦断研究はありませんでした。",
           "痤瘡の診療では、現実的な治療の見通し、塗り方の実演、手順の簡素化、早めの再診、処方薬と市販品の両方を詳しく確認することを重視すべきと述べられています。これらの結果はネットの情報や市販のスキンケアのすべてを有害と扱う根拠にはならず、医師が作る情報は患者教育を支えうること、選ばれたダーモコスメは組み立てられた痤瘡治療の補助として役割をもちうることも併せて述べられています。"],
      use:"痤瘡の初診で、効果が見えるまでの期間と塗り方をお伝えし、今お使いの市販品を一緒に確認する進め方の根拠になります（生活指導アシスタントの外用薬・当院製品のタブ）。" },
    { cat:"A", pmid:"42830029", journal:"Georgian Med News", year:2026, type:"症例対照（303 名）",
      tj:"慢性蕁麻疹と血中鉛：10 µg/dL 以上が 66.8% 対 33.7%（オッズ比 3.96）",
      te:"CHRONIC URTICARIA AND LEAD EXPOSURE: EVALUATION OF IMMUNOLOGICAL MARKERS.",
      sum:["慢性蕁麻疹はマスト細胞が主役となる病気で、炎症性および自己免疫性の機序が関わります。鉛は免疫の働きに影響しうることが知られていますが、慢性蕁麻疹との関係はこれまでほとんど調べられていないという背景です。西ジョージアの単一施設で、慢性蕁麻疹の患者さん 211 名と健常対照 92 名の計 303 名を対象に、誘導結合プラズマ質量分析で血中鉛濃度を測定し、好酸球・総 IgE・ヒスタミン・抗 IgE 自己抗体・FcεRIα 自己抗体を評価した症例対照研究です。血中鉛濃度 10 µg/dL 以上をあらかじめ定めた高曝露の解析上の閾値としています。",
           "血中鉛濃度は慢性蕁麻疹の方で対照より高く、10 µg/dL 以上は患者の 66.8%、対照の 33.7%（オッズ比 3.96、95% 信頼区間 2.36〜6.66、p<0.001）で、年齢で調整した後も有意でした（調整オッズ比 4.07、2.38〜6.96、p<0.001）。慢性蕁麻疹の群の中では、血中鉛濃度が高いほど好酸球増多、ヒスタミン・抗 IgE 抗体・FcεRIα 抗体の高値と関連しましたが、総 IgE とは関連しませんでした。採血の時点で膨疹が出ていることも、年齢で調整した後に関連していました（調整オッズ比 3.36、1.75〜6.45、p<0.001）。探索的な解析では、抗 IgE 抗体と FcεRIα 抗体の両方が高い群で、血中鉛濃度 10 µg/dL 以上（83.3%）と採血時の膨疹（92.4%）の頻度が最も高く、どちらも高くない群と比べて最も強い関連を示しました（調整オッズ比 5.49、2.38〜12.70、p<0.001）。",
           "慢性蕁麻疹の方は健常対照より血中鉛濃度が高く、慢性蕁麻疹の群内では鉛が高いほど好酸球・ヒスタミン・自己抗体・採血時の膨疹と関連し、総 IgE とは関連しませんでした。これらの関連は前向き研究での確認が必要であると述べられています。"],
      use:"長引く蕁麻疹の背景を考えるときの話題の一つになりますが、関連が示された段階であり、検査や治療を変える根拠ではありません。",
      note:"単施設の症例対照研究で、地域の鉛曝露の状況は日本と異なる可能性があります。因果関係は示されていません。" }
  ]
},
{
  date: "2026-10-05",

  items: [
    { cat:"A", pmid:"42828417", journal:"Br J Dermatol", year:2026, type:"システマティックレビュー・ネットワークメタ解析",
      tj:"乾癬の生物学的製剤は不安・抑うつも改善：8 研究 4,319 例のネットワークメタ解析",
      te:"Effect of Biologic Therapy on Depression and Anxiety Symptoms in Patients With Moderate-to-Severe Plaque Psoriasis: A Systematic Review and Network Meta-Analysis.",
      sum:["中等症から重症の尋常性乾癬では多くの生物学的製剤が広く使われている一方で、不安や抑うつの症状を改善する効果を薬剤間で比べた資料が不足しているという背景の研究です。PubMed・Web of Science・Embase・Cochrane Central Register of Controlled Trials を開始時から 2026 年 1 月 28 日まで検索し、成人の中等症から重症の乾癬を対象としたランダム化比較試験と前向きの比較コホート研究を組み入れました。作用機序ごとと薬剤ごとの二つの水準で頻度論的なランダム効果ネットワークメタ解析を行い、ネットワークの非一貫性・感度解析・バイアスのリスク・エビデンスの確実性を評価しています。",
           "8 研究・4,319 例が組み入れられました。作用機序の水準では、すべての生物学的製剤のクラスがプラセボと比べて抑うつと不安の症状を有意に改善しました。抑うつではインターロイキン（IL）-12/23 阻害薬の推定値が最も大きく（標準化平均差 0.677、95% 信頼区間 0.473〜0.881）、不安では IL-23 阻害薬（0.457、95% 信頼区間 0.304〜0.610）と IL-12/23 阻害薬（0.457、95% 信頼区間 0.335〜0.579）が同程度でした。薬剤の水準では複数の薬剤で有益性がみられましたが、ネットワークが疎で確実性が高いものから低いものまで幅があり、順位づけは不確実とされています。研究内および比較水準の探索的解析では、心理面の改善は概して皮膚の改善に伴っていましたが、両者は厳密に比例するわけではありませんでした。",
           "生物学的製剤による治療は、中等症から重症の乾癬における抑うつと不安の症状の短期的な改善と関連しており、治療全体の利益を考えるうえで心のケアも重要な要素であることを支持すると述べられています。作用機序間や個々の薬剤間の差は、より大規模で長期のランダム化試験での確認が必要とされています。"],
      use:"乾癬の治療をご相談するときに、皮膚だけでなく気分の落ち込みや不安もあわせて和らぐ可能性があるとご説明する材料になります。",
      note:"短期の評価で、薬剤どうしの優劣は確定していません。" },
    { cat:"A", pmid:"42829260", journal:"Allergol Int", year:2026, type:"レター（後方視・31 例）",
      tj:"アトピー性皮膚炎を併せもつ慢性特発性蕁麻疹へのウパダシチニブ：31 例の後方視",
      te:"Upadacitinib for chronic spontaneous urticaria in patients with concomitant atopic dermatitis: A retrospective study of 31 cases.",
      sum:["アトピー性皮膚炎を併せもつ慢性特発性蕁麻疹の患者さんにウパダシチニブを用いた 31 例について、後方視的に検討した報告です（タイトルから分かる範囲）。",
           "抄録が公開されていないため、有効性や安全性の数値はこの一覧では示せません。",
           "アトピー性皮膚炎と慢性特発性蕁麻疹が併存する場合の治療選択を扱った報告であることまでが、タイトルから読み取れる内容です。"],
      use:"アトピー性皮膚炎と蕁麻疹を併せもつ方の治療を考えるときに、原著を取り寄せて確認する候補になります。",
      note:"抄録なし（タイトルのみで要約）。原著確認が必要。" },
    { cat:"A", pmid:"42828452", journal:"Br J Dermatol", year:2026, type:"総説",
      tj:"慢性特発性蕁麻疹の診療に残る課題：BTK 阻害薬・抗 IL-4Rα 薬の位置づけを整理",
      te:"Gaps in Current Chronic Spontaneous Urticaria (CSU) Management.",
      sum:["治療の進歩にもかかわらず、慢性特発性蕁麻疹（CSU）は対応が難しく、生活への影響も大きい病気であるという背景で、現在の診療に残る課題を整理した総説です。抗ヒスタミン薬・抗 IgE 療法・免疫抑制薬が治療の基本である一方、診断、病型の分類（エンドタイピング）、治療反応の予測、国際ガイドラインの実践という点で大きな隔たりが残っていると述べられています。",
           "新たに承認された治療薬として、ブルトン型チロシンキナーゼ（BTK）阻害薬やインターロイキン 4 受容体 α（抗 IL-4Rα）を標的とする薬剤が、既存の治療で改善しない患者さんにとっての希望になると挙げられています。一方で、どの患者さんにどの治療を選ぶべきかを判断するための、病気に特異的な特徴を示す検証されたバイオマーカーが現時点では不足しており、これらの薬剤を治療の順序のどこに位置づけるのが最適かも定まっていないとされています。",
           "著者らは、より統合的で、個々の患者さんに合わせた、患者さん中心の進め方を提案しています。"],
      use:"長引く蕁麻疹で抗ヒスタミン薬を増やしても十分でない方に、次の手段が増えてきていることをご説明する材料になります。",
      note:"総説（論考）で、新しい治療の国内での適応は添付文書をご確認ください。" },
    { cat:"A", pmid:"42829747", journal:"Cureus", year:2026, type:"システマティックレビュー",
      tj:"肌の色が濃い方のアトピー性皮膚炎治療：15 研究で効果は同等、紅斑中心の評価に注意",
      te:"Efficacy and Safety of Topical and Systemic Therapies for Atopic Dermatitis in Patients With Skin of Colour: A Systematic Review.",
      sum:["アトピー性皮膚炎（AD）は肌の色が濃い方でより多く、しばしば重症になりやすい一方、現在の治療を形づくった臨床試験の参加者は主に白人であったという背景の研究です。濃い肌では見え方が異なり、紅斑を基にした重症度スコアでは活動性のある炎症を見落とす可能性があります。PRISMA 2020 と SWiM の手引きに従い、PubMed と Scopus を 2015 年から 2026 年 3 月まで検索し、人種・民族・Fitzpatrick 皮膚型で層別して有効性や安全性を報告した試験、その事前規定または事後のサブグループ解析、前向きコホートやレジストリ研究を組み入れました。研究デザインや評価指標の多様さのためメタ解析は行えませんでした。",
           "15 研究が基準を満たし、外用薬（タピナロフ、クリサボロール、ロフルミラスト）、インターロイキンを標的とする生物学的製剤（デュピルマブ、トラロキヌマブ、レブリキズマブ）、ヤヌスキナーゼ（JAK）阻害薬（アブロシチニブ、ウパダシチニブ、バリシチニブ）、レジストリでの従来の全身療法が対象でした。薬剤のクラスを通じて、肌の色が濃い患者さんの反応率は臨床的に意味のあるもので、肌の色が明るい層とおおむね同程度でした。タピナロフはアジア系・黒人またはアフリカ系アメリカ人・白人の患者さんで、また Fitzpatrick I〜III 群と IV〜VI 群で主要評価項目に到達しました。トラロキヌマブは最長 2 年で湿疹面積重症度指数の 75% 改善（EASI-75）をアジア系 78%、黒人 88%、白人 83% で達成しました。差を示唆する所見は小さく精度も低く、安全性は試験全体と同様でした。",
           "外用および全身の AD 治療は肌の色が濃い患者さんにも有効で忍容性も良好であり、効果が劣るという明らかな根拠はないと述べられています。ただしサブグループが小さいことによる限界があり、紅斑を基にした評価法では濃い肌の重症度を過小評価しうることが繰り返し指摘されています。"],
      use:"日焼けして色が濃くなっている時期や色素沈着が目立つ方で、赤みが目立たなくても炎症が残っていることがあるとご説明する材料になります。",
      note:"メタ解析は行われておらず、研究ごとの結果をまとめた記述的な統合です。" },
    { cat:"A", pmid:"42828676", journal:"Dermatol Ther (Heidelb)", year:2026, type:"横断研究（多施設）",
      tj:"敏感肌と生活環境：151 名で睡眠・ストレス・大気汚染により炎症指標が変化",
      te:"Lifestyle-Driven Phenotypes in Sensitive Skin: A Cross-Sectional, Multicenter Study Across Urbanization Tiers.",
      sum:["敏感肌は本来の生理と環境の影響の両方で形づくられるものの、同時に存在する生活要因がその現れ方をどう変えるのかはよく分かっていないという背景の研究です。35〜50 歳の女性 151 名を、大気汚染への曝露・睡眠の質・心理的ストレスの三つの指標から、都市化が高い地域の敏感肌でない群（NS-1）、都市化が高い地域の敏感肌群（SSS-1）、都市化が中程度の地域の敏感肌群（SSS-2）の三群に分け、臨床評価・VISIA-CR 画像・機器測定・バイオマーカーで横断的に比較しました。SSS-1 は全員が睡眠 7 時間未満かつストレススコア 18 以上、SSS-2 は全員が睡眠 7 時間超かつストレススコア 14 以下でした。",
           "同じ都市化の高い条件で比べた本来の生理の比較（SSS-1 対 NS-1）では、敏感肌でプロスタグランジン E2（PGE2）が 23.5% 高く、タンパク質のカルボニル化が 17.9% 高く、肌の色むらが 7.9%、しみの密度が 38.0% 大きくなっていました。生活環境の比較（SSS-1 対 SSS-2）では、都市化の高い生活で PGE2 が 185.0% 高く、皮脂が 22.5% 増え、毛穴の目立ちが 7.5% 大きい一方、都市化が中程度で紫外線が強い環境では色素沈着が 27.8%、酸化ストレスが 27.3% 高くなっていました。",
           "都市化の高い生活は炎症の活動性と皮脂の産生の増加と関連し、都市化が中程度で紫外線が強い環境は酸化ストレスと色素沈着の増加と関連していたと述べられています。横断研究であり二つの都市は複数の環境要因で異なるため、所見は関連を示すものであって仮説を生み出す段階のものとされています。"],
      use:"ひりつきや赤みを繰り返す方に、睡眠時間とストレス、紫外線対策の見直しをお伝えする材料になります（院内アプリの生活指導アシスタントの生活指導タブと合わせてご案内できます）。",
      note:"横断研究で因果関係は示していません。対象は 35〜50 歳の女性です。" },
    { cat:"A", pmid:"42828308", journal:"Front Med (Lausanne)", year:2026, type:"前向き前後比較",
      tj:"透析患者のかゆみ予防にアロママッサージ：新規発症 31.8% 対 65.1%",
      te:"Essential oil massage and incident chronic kidney disease-associated pruritus in maintenance hemodialysis patients without baseline pruritus: a prospective non-concurrent before-and-after study.",
      sum:["維持血液透析を受けていて開始時にかゆみのない患者さんで、標準的な透析ケアと基本的なスキンケアに精油（エッセンシャルオイル）マッサージを加えた場合に、慢性腎臓病に伴うそう痒（CKD-aP）の発症がどう変わるかを比べた、単施設の前向き前後比較研究です。2024 年 1 月から 12 月に 87 名が登録され、対照期（43 名）は通常の透析ケアと基本的なスキンケアを、介入期（44 名）はこれに精油マッサージを加えました。主要評価項目は新たなかゆみの発症で、外用薬の使用を探索的な副次評価としています。",
           "追跡期間中のかゆみの発症率は、介入群で対照群より有意に低く（31.8% 対 65.1%、P = 0.002）、外用薬の使用率も有意に低くなりました（13.6% 対 48.8%、P < 0.001）。かゆみが出た患者さんの中でも、介入群は視覚的評価尺度（VAS）の点数が低く、外用薬を使った期間も短いという結果でした（いずれも P < 0.01）。介入群の 2 名（4.5%）に軽い局所の有害反応が生じましたが、いずれも一時的な中止や対症的な対応で回復しています。",
           "介入期では新規発症の CKD-aP と外用薬の使用が少なく観察されたと述べられています。ただし介入を行った期間が暦の上の時期と完全に一致しているため、本研究では介入の効果と季節の影響を区別できず、この差を予防効果の根拠と解釈すべきではないと著者らは明記しています。"],
      use:"透析を受けていらっしゃる方の乾燥とかゆみについて、保湿やスキンケアを続ける意義をお話しするときの参考になります（季節の影響と区別できていない点も添えます）。",
      note:"前後比較で、介入期と季節が重なっており効果の証明にはなりません。" },
    { cat:"A", pmid:"42828242", journal:"World Allergy Organ J", year:2026, type:"横断研究",
      tj:"慢性特発性蕁麻疹 327 名：59.3% が睡眠不良、61.5% が睡眠時無呼吸のリスク",
      te:"Sleep quality, disturbance and the prevalence of obstructive sleep apnoea in chronic spontaneous urticaria and associated risk factors.",
      sum:["慢性特発性蕁麻疹（CSU）は生活の質を損なう一般的な皮膚疾患ですが、睡眠の質や閉塞性睡眠時無呼吸（OSA）への影響は明らかでないという背景の研究です。成人の CSU 患者さん 327 名を対象とした分析的な横断研究で、睡眠の障害をピッツバーグ睡眠質問票（PSQI）、OSA のリスクを STOP-Bang 質問票で評価し、蕁麻疹のコントロール状況や検査値との関連を調べました。",
           "睡眠の質が悪いと報告した方は 59.3%、OSA の中等度から高度のリスクを示した方は 61.5% でした。PSQI の点数は平均血小板容積と正の相関（P = 0.03）、年齢（P = 0.01）・BMI（P = 0.04）・蕁麻疹コントロールテスト（UCT）の点数（P = 0.01）と負の相関を示しました。STOP-Bang の点数は年齢（P < 0.001）・BMI（P < 0.001）・UCT の点数（P = 0.008）・血小板リンパ球比（P < 0.001）と正の相関、好酸球絶対数と負の相関（P = 0.0006）でした。症候性皮膚描記症があると睡眠不良のオッズが高くなり（オッズ比 2.4）、女性（オッズ比 12.3）・コントロール不良の蕁麻疹（オッズ比 2.7）・脂質異常症（オッズ比 3.1）は中等度から重度の OSA リスクの有意な予測因子でした。",
           "CSU の患者さんは睡眠の障害を経験することが多く、OSA を生じるリスクもあるため、これらの併存症を早期に見つけて適切に対応できるよう意識しておくことが重要だと述べられています。"],
      use:"蕁麻疹で眠れないとお話しされる方に、睡眠の状況やいびき・体重についてもうかがう根拠になります。",
      note:"横断研究で因果関係は示していません。OSA は質問票による risk 評価で、検査による診断ではありません。" },
    { cat:"A", pmid:"42828450", journal:"J Eur Acad Dermatol Venereol", year:2026, type:"全国コホート（デンマーク）",
      tj:"化膿性汗腺炎と GLP-1 受容体作動薬：12,581 例で開始が早く使用も多い",
      te:"Glucagon-like peptide-1 receptor agonists in hidradenitis suppurativa: A nationwide cohort study.",
      sum:["化膿性汗腺炎（HS）は肥満・代謝の不調・医療の利用の増加と関連し、グルカゴン様ペプチド 1 受容体作動薬（GLP-1RA）には抗炎症作用と HS の症状を軽くする効果が示されている一方、実臨床での使用状況の情報は限られているという背景の研究です。デンマークの全国登録を用い、2000 年 1 月 1 日から 2022 年 12 月 31 日までに、成人の HS 患者さんと、年齢・性別を一致させた乾癬の患者さんおよび一般対照を組み入れました。HS 12,581 名、乾癬 9,824 名、対照 12,581 名が対象です。",
           "追跡期間中に GLP-1RA を開始した方は HS で 8.2%、乾癬で 5.7%、対照で 3.2% でした。GLP-1RA 開始までの平均期間は HS（8.88 年）が乾癬（10.1 年、P < 0.001）や対照（10.2 年、P < 0.001）より短くなっていました。心血管代謝系および精神科の併存症は、診断時から治療開始時にかけてすべての群で増加しました。GLP-1RA の開始後は、手術や全身療法の使用の割合が低下して観察されましたが、同様の低下は開始しなかった対照群でも認められています。",
           "HS の患者さんは乾癬の患者さんや対照と比べて GLP-1RA をより早く、より多く使用しており、開始後は HS に特有の治療や手術の使用が減っていたと述べられています。ただし同程度の低下が開始しなかった群でもみられたとされています。"],
      use:"わきや足のつけ根の化膿を繰り返す方に、体重や代謝の管理も治療の一部としてご相談する材料になります。",
      note:"登録データの観察研究で、治療効果を示すものではありません（開始しなかった群でも同様の低下）。" },
    { cat:"A", pmid:"42827493", journal:"Front Immunol", year:2026, type:"RCT 事後解析（第 3 相）",
      tj:"乾癬へのキセリゲキマブ：12 週で理想的な治療目標 86.6%、52 週で 91.0%",
      te:"Multidimensional efficacy characterization of xeligekimab in moderate-to-severe plaque psoriasis: regional responses, treatment targets, and patient-reported outcomes from a randomized controlled trial.",
      sum:["キセリゲキマブはインターロイキン 17A（IL-17A）を標的とするモノクローナル抗体で、中等症から重症の尋常性乾癬に高い有効性が示されていますが、部位ごとの反応や治療目標の達成、患者さんご自身が報告する結果の詳細は十分に解明されていないという背景です。第 3 相のランダム化二重盲検プラセボ対照試験の事後解析で、中国の患者さん 420 名を 2 対 1 で、キセリゲキマブ 200 mg の 2 週ごと皮下投与またはプラセボに 12 週間割り付け、その後 52 週まで非盲検でキセリゲキマブを継続しました。四つの部位ごとの乾癬面積重症度指数（PASI）、治療目標の達成、皮膚科的生活の質指標（DLQI）の領域別の改善を解析しています。",
           "4 週までに PASI の各項目が速やかに改善し、硬化 −60.1%、鱗屑 −61.9%、紅斑 −50.3% に対しプラセボは −5.3% から −7.7% でした（いずれも P < 0.001）。12 週にはそれぞれ −91.1%、−90.9%、−82.3% に達しました。部位別では頭部の皮疹が最も速く反応し（12 週の PASI 90 が 84.2%）、52 週の部位別 PASI 90 は 81.2% から 92.1% でした。理想的な治療目標と許容できる治療目標の達成率は 12 週で 86.6% と 94.9%（プラセボは 4.6% と 9.9%、いずれも P < 0.001）、52 週で 91.0% と 98.0% に上昇しました。持続的な寛解までの期間の中央値は 48 週で、52 週と 60 週の持続的寛解率は 50.1% と 54.1% でした。DLQI は 4 週までに全領域で改善し、12 週には症状 97.0%、かゆみ 92.0%、心理的負担 98.0% などで影響が小さい状態の割合が 90% を超えました。",
           "キセリゲキマブは臨床的なすべての側面で速やかに症状を改善し、治療目標の高い達成と維持、生活の質の包括的な回復をもたらすと述べられています。"],
      use:"乾癬の治療目標を「PASI 90 や体表面積 1% 以下」といった具体的な数字でご説明するときの参考になります。",
      note:"事後解析で、対象は中国の患者さんです。国内での承認状況は別途ご確認ください。" }
  ]
},
{
  date: "2026-10-04",
  range: { A: "2026-10-02〜10-04", B: "2026-10-02〜10-04", C: "2026-09-04〜10-04" },
  items: [
    { cat:"A", pmid:"42827390", journal:"Br J Dermatol", year:2026, type:"システマティックレビュー・ネットワークメタ解析",
      tj:"アトピー性皮膚炎の全身療法の中止・減量・間隔延長：55 研究のネットワークメタ解析",
      te:"Assessment of the Sustained Response to Systemic Treatment for Atopic Dermatitis in Patients Who Achieved Disease Remission: A Systematic Review and Network Meta-Analysis Comparing Withdrawal, Dose Reduction and Dosing Interval Extension Versus Continuation Therapy.",
      sum:["近年の治療の進歩によりアトピー性皮膚炎（AD）の管理は大きく変わり、薬剤の中止・減量・投与間隔の延長が必要になる場面があるという背景の研究です。寛解に達した AD の患者さんにおいて、全身療法の中止・減量・投与間隔の延長が、継続した場合と比べて寛解をどの程度保てるかを比較しています。PubMed、Embase、Web of Science、Scopus を包括的に検索し、2 名の評価者が独立して研究を選び、相違は第 3 の評価者が解決しました。バイアスのリスクは無作為化試験には RoB-2、非無作為化研究には ROBINS-I を用い、エビデンスの確実性は GRADE で判定しています。主要評価項目は、中止・減量・間隔延長から 16〜52 週後に評価した湿疹面積重症度指数（EASI）の 75% 改善（EASI75）の維持と定義されました。",
           "初回の検索で 21,169 件が得られ、55 研究を表す 89 報が組み入れられました。生データの解析では、多くの活性治療で EASI75 維持のリスク比は同程度でしたが、内服治療の中止は AD の疾患活動性の早期の再燃につながっていました。9 研究・26 のペア比較・13 のレジメンにわたる 2,585 の観察に基づくネットワークメタ解析では、レブリキズマブの中止と投与間隔の延長が、他の活性治療の中止・減量・間隔延長よりも EASI75 の反応を失うリスクが低いことが示されました。サブグループ解析でも、プラセボへの切り替えや投与間隔の延長の後に EASI75 の反応が最もよく維持されたのは、レブリキズマブの導入投与でした。",
           "全身療法の中止は、ワクチン接種時や妊娠中など特定の状況で推奨される一方、内服治療の中止後には早期に再燃するリスクがあることが明らかになったと述べられています。これに対して生物学的製剤では、長期間の中止や投与間隔の延長の後でも寛解が持続していたとされています。"],
      use:"皮疹が落ち着いた方から「薬を減らせますか」とご相談を受けたときに、内服と注射とで中止後の経過が異なることをご説明する材料になります。",
      note:"複数の研究をまとめた解析で、個々の薬剤の比較は間接比較を含みます。" },
    { cat:"A", pmid:"42825994", journal:"Dermatol Ther (Heidelb)", year:2026, type:"後方視（多施設・実臨床）",
      tj:"慢性手湿疹にデルゴシチニブ 2% クリーム：16 週で HECSI が 71.5 から 6.8 へ",
      te:"D-CARE (Delgocitinib-Chronic hAnd Eczema Response Evaluation): A Retrospective, Multicenter, Real-World Study of Patients with Chronic Hand Eczema (CHE) Treated with Delgocitinib 2% Cream-Temporal Analysis of Symptom and Clinical Sign Response.",
      sum:["慢性手湿疹（CHE）は頻度が高く、しばしば難治で、生活の質への影響が大きい炎症性の皮膚疾患です。デルゴシチニブ 2% クリームは第 3 相試験で有効性が示されていますが、実臨床での根拠は限られているという背景で、その有効性と、臨床所見および症状の反応が時間とともにどう変化するかを評価した研究です。多施設の後方視的観察研究で、デルゴシチニブ 2% クリームで治療された成人の CHE の患者さん 58 名を 16 週間追跡し、ベースライン、4 週、16 週で臨床的重症度と患者さんご自身の報告による指標を評価しました。手湿疹重症度指数（HECSI）、全般評価、そう痒、疼痛、生活の質の変化と、部位ごとの HECSI の各構成要素の推移が解析されています。",
           "すべての臨床指標と患者報告の指標が追跡期間中に有意に改善しました（いずれも p < 0.001）。HECSI の平均はベースラインの 71.5 ± 29.2 から、4 週で 19.5 ± 15.1、16 週で 6.8 ± 8.9 まで低下しました。そう痒と疼痛もいずれも著明に減少しています。4 週の時点で小水疱と浮腫のスコアは各部位で 0.0〜0.1 でしたが、鱗屑は指尖と指で 1.0 ± 1.1 のままでした。16 週では亀裂のスコアが指尖と指でそれぞれ 0.2 と 0.3、鱗屑のスコアがそれぞれ 0.4 と 0.3 でした。生活の質も大きく改善しました。2 名（3.4%）が有害事象のために治療を中止しています。",
           "デルゴシチニブ 2% クリームは、実臨床においても速やかで臨床的に意味のある有効性を示したと述べられています。炎症の所見は、亀裂や鱗屑といった慢性の構造的な変化よりも早く改善しており、この反応の速さの違いは、早期の部分的な改善をどう解釈するか、また治療にどれくらいの期間がかかるかを患者さんにご説明するうえで役立つとされています。"],
      use:"手湿疹の外用治療を始めた方に、かゆみや赤みは比較的早く、指先の亀裂やかさつきはもう少し時間がかかることをご説明する材料になります。",
      note:"対照群のない後方視的な観察研究（58 名）です。" },
    { cat:"A", pmid:"42825995", journal:"Dermatol Ther (Heidelb)", year:2026, type:"第 3 相試験の長期成績",
      tj:"重症円形脱毛症にバリシチニブ：52 週の反応者の約 85% が 200 週まで SALT 20 以下を維持",
      te:"Baricitinib Efficacy Through 4 Years in Responders and Safety up to 5 Years in Adults with Severe Alopecia Areata: Final Results from BRAVE-AA1 and BRAVE-AA2.",
      sum:["重症の円形脱毛症（AA）は慢性の経過をたどり、効果が失われると患者さんにとって大きな打撃となるため、長期の有効性と安全性のデータが欠かせないという背景の研究です。バリシチニブは選択的な JAK 阻害薬で、成人の重症 AA に承認されており、小児でも検討が進められています。本研究は BRAVE-AA1 と BRAVE-AA2 の最終解析で、バリシチニブ 4 mg または 2 mg に割り付けられ、52 週時点で脱毛重症度ツール（SALT）スコア 20 以下の反応を達成し、同じ用量を 200 週まで継続した患者さん（4 mg 133 名、2 mg 72 名）で有効性を評価しました。安全性は All BARI AA 群（1,303 名）と Extended BARI AA 群（948 名）について、248 週までの曝露における 100 患者年あたりの発現率として報告されています。",
           "52 週時点の反応者のうち、4 mg では 115/133 名（86.5%）、2 mg では 61/72 名（84.7%）が 200 週時点でも SALT スコア 20 以下を維持していました。眉毛と睫毛の再生は 52 週以降も続き、200 週まで維持されました。最長 5 年のバリシチニブ曝露において、重篤な感染症、非黒色腫皮膚癌、深部静脈血栓症・肺塞栓症、主要な心血管イベントの発現率は、背景の発現率と比べて低いままでした。死亡例はなく、有害事象の発現率は経時的に安定していました。",
           "この集団では、反応された方の約 85% が約 4 年にわたって SALT スコア 20 以下を維持し、眉毛と睫毛についても効果が続いたとされています。バリシチニブの安全性プロファイルは 5 年間を通じて一貫しており、これまでの BRAVE プログラムの知見と一致していると述べられています。"],
      use:"円形脱毛症で内服治療を続けていらっしゃる方に、長期に続けたときの効果の持続と安全性の見通しをご説明する材料になります。",
      note:"有効性の解析は 52 週時点で反応が得られ、同じ用量を続けられた方に限られています。" },
    { cat:"A", pmid:"42825999", journal:"Dermatol Ther (Heidelb)", year:2026, type:"間接比較（MAIC）",
      tj:"手の症状が強いアトピー性皮膚炎：トラロキヌマブとデュピルマブの間接比較",
      te:"Tralokinumab Versus Dupilumab for the Treatment of Atopic Dermatitis with Moderate-to-Severe Hand Involvement: A Matching-Adjusted Indirect Comparison.",
      sum:["トラロキヌマブとデュピルマブはいずれも、手に中等症から重症の病変を伴うアトピー性皮膚炎（AD）に対して第 3 相の二重盲検試験で有効性を示していますが、直接比較した試験がないため、アンカー付きのマッチング調整間接比較（MAIC）が行われました。ADHAND 試験では、手に中等症から重症の病変を伴う成人の AD の患者さんがトラロキヌマブ 300 mg またはプラセボの 2 週ごと 16 週間投与に割り付けられ、LIBERTY-AD-HAFT 試験では、手および／または足に中等症から重症の病変を伴う 12 歳以上の患者さんがデュピルマブ 300 mg またはプラセボの 2 週ごと 16 週間投与に割り付けられています。ADHAND の個別患者データを、LIBERTY-AD-HAFT の年齢・性別・人種・ベースラインの手湿疹重症度指数（HECSI）の集計データに合わせて重み付けし、プラセボを共通のアンカーとして比較しました。",
           "LIBERTY-AD-HAFT は 133 名（デュピルマブ 67 名、プラセボ 66 名）、ADHAND は 235 名（トラロキヌマブ 156 名、プラセボ 79 名）で、マッチング後の有効サンプルサイズは 99（トラロキヌマブ 76 名、プラセボ 23 名）でした。16 週時点で、アンカー調整後の相対的な治療の差は、HECSI-90 を達成した方の割合（17.5%、95% 信頼区間 0.8〜34.2、p = 0.040）と、日常の活動の障害の割合の低下（16.0%、95% 信頼区間 4.8〜27.1、p = 0.005）において、有意にトラロキヌマブに有利でした。医師による全般評価 0/1、HECSI-75、HECSI の変化率、かゆみと痛みの軽減などその他の項目は、数値上はトラロキヌマブに有利でしたが、両者に有意差はありませんでした。",
           "このアンカー付き MAIC では、トラロキヌマブはデュピルマブと比べてプラセボ調整後の反応が高く、HECSI-90 を達成した方の割合が多く、ふだんの活動を行う能力の改善が有意に大きかったと述べられています。その他の項目も数値上はトラロキヌマブに有利でした。"],
      use:"手の湿疹が強いアトピー性皮膚炎の方で注射薬をご検討いただくときの、参考情報の一つになります。",
      note:"直接比較試験ではなく 2 つの試験の間接比較で、マッチング後の有効例数が 99 と小さい点にご留意ください。" },
    { cat:"A", pmid:"42826358", journal:"Curr Med Res Opin", year:2026, type:"システマティックレビュー",
      tj:"ステロイド外用薬の誤った使い方：23 研究 8,619 名の合併症をまとめた総説",
      te:"The hidden burden of topical corticosteroid misuse: a systematic review of dermatologic complications.",
      sum:["ステロイド外用薬は、抗炎症・免疫抑制・増殖抑制の作用から、アトピー性皮膚炎や接触皮膚炎などに広く処方されています。しかし症状がすぐに和らぐことが、とくに美容目的での誤った使用につながり、さまざまな有害事象を生じているという背景の研究です。本研究は、ステロイド外用薬の誤用に伴う合併症と、その背景にある要因を評価することを目的としています。PRISMA に従い、PubMed、Scopus、Web of Science で 2016 年 1 月から 2026 年 1 月までに公表された研究を系統的に検索し、誤用とその関連因子についての一次データを報告した研究を対象としました。研究の特徴、誤用の形態、合併症、誤用に関連する有害事象の頻度、関連因子が抽出され、バイアスのリスクは Joanna Briggs Institute のチェックリストで評価されています。",
           "23 研究・8,619 名が組み入れられました。誤用は美容目的で多く報告され、美白、肝斑、痤瘡、色白にすることが挙げられています。最も多く誤用されていた薬剤はベタメタゾン、モメタゾン、クロベタゾールでした。大半の方が少なくとも 1 つの有害事象を経験しており、痤瘡様の発疹、色素異常、紅斑、白癬の悪化が含まれていました。誤用に関連する因子としては、女性であること、若年であること、受診行動が乏しいこと、処方箋なしで購入できることが挙げられています。",
           "ステロイド外用薬の誤用は重要な公衆衛生上の問題であり、とくに強い製剤が処方箋なしで容易に手に入る地域で問題になると述べられています。誤用を減らすには、強いステロイド外用薬を処方に基づく入手に限ること、調剤時の薬剤師による説明、適切な強さと使用期間についての医師への教育、美容目的の誤用とその有害事象についての一般への啓発が必要とされています。"],
      use:"ステロイド外用薬をお使いの方に、部位・強さ・期間を決めてお使いいただくことの大切さと、自己判断で長く使った場合に起こりうる変化をご説明する材料になります。",
      note:"処方箋なしで強いステロイド外用薬が購入できる地域の研究を多く含みます。" },
    { cat:"A", pmid:"42826143", journal:"J Drugs Dermatol", year:2026, type:"システマティックレビュー",
      tj:"貨幣状湿疹とパッチテスト：陽性率の中央値は 47.8%（10 研究）",
      te:"Contact Allergens Associated With Nummular Eczema: A Systematic Review.",
      sum:["貨幣状湿疹（NE）は、かゆみを伴う貨幣状の湿疹局面を特徴とする、頻度の高い慢性の炎症性皮膚疾患です。接触アレルゲンへの感作がその成り立ちに関与している可能性があるという背景で、2026 年 4 月 30 日に PubMed、Embase、Cochrane Library を PRISMA に従って検索し、パッチテストによって NE の誘因や増悪因子を検討した研究が集められました。",
           "特定された 287 研究のうち、10 の観察研究が選択基準を満たしました。NE の患者さんにおけるパッチテストの陽性率は中央値 47.8%（範囲 26.7〜56.0%）でした。報告が多かったアレルゲンは、ニッケルおよび硫酸ニッケル、重クロム酸カリウム、塩化コバルト、香料ミックス、ネオマイシン、コロホニー、ホルムアルデヒド、パラフェニレンジアミン、ゴム関連のアレルゲンでした。併存するアレルギー性接触皮膚炎（ACD）を報告した研究では、NE の患者さんの中央値 33.5% に ACD の併存または既往がありました。",
           "現時点の観察研究の根拠からは、NE の患者さんで接触アレルゲンの陽性が多くみられることが示唆されます。重症または治療抵抗性の NE では、臨床的に意味のあるアレルゲンを同定し回避につなげるために、パッチテストを考慮すべきとされています。接触感作が病因なのか、増悪因子なのか、併存する所見なのかを明らかにするには、標準化されたパッチテストの手順と臨床的関連性の評価を用いたさらなる研究が必要と述べられています。"],
      use:"治りにくい貨幣状湿疹の方に、金属や香料、ゴムなどのパッチテストを一度ご提案する根拠になります（院内アプリのパッチのタブと合わせてご利用いただけます）。" },
    { cat:"A", pmid:"42826151", journal:"J Drugs Dermatol", year:2026, type:"専門家合意",
      tj:"アトピー性皮膚炎のスキンケア：保湿剤の選び方と続けやすさについての北欧の合意",
      te:"Nordic European Countries Atopic Dermatitis (NECAD) I: Importance of Concordance With Skincare for Atopic Dermatitis.",
      sum:["アトピー性皮膚炎（AD）は皮膚のバリア機能の障害を伴う慢性の疾患で、症状を抑え再燃を防ぐために継続的な管理が必要であり、外用治療がその要となります。本論文は、AD のスキンケアについての現在の推奨をまとめ、その課題と、治療を続けていただくための工夫を示すことを目的としています。北欧諸国アトピー性皮膚炎（NECAD）の皮膚科医のパネルが、調査、文献、専門家としての経験をもとに AD の管理におけるスキンケアについて議論し、5 つの合意声明がまとめられました。",
           "保湿剤によるスキンケアが AD の管理の基本として推奨されています。外用治療を続けていただくこと（コンコーダンス）は AD において大きな課題と考えられており、より新しく成分を充実させた保湿剤は、基本的な保湿剤と比べて、臨床的な効果と日々の生活での使いやすさの両面で優れていることを示す根拠があると述べられています。工夫として、根拠に基づく患者教育、AD のアクションプラン、対面やデジタルでのより密な経過観察が挙げられました。",
           "AD における外用治療の効果は、用いる保湿剤の種類と患者さんが続けられるかどうかに大きく左右されます。根拠が増え、患者教育への注目が高まることで、治療の継続と、それによる治療成績を改善できると述べられています。"],
      use:"保湿がなかなか続かないというお悩みに、使い心地のよい保湿剤を一緒に選び、再燃したときの手順を書いてお渡しする後押しになります（生活指導アシスタントのスキンケアのご案内と合わせてご利用いただけます）。",
      note:"北欧の皮膚科医のパネルによる合意声明で、新たな臨床試験の結果ではありません。" },
    { cat:"A", pmid:"42826150", journal:"J Drugs Dermatol", year:2026, type:"専門家合意（修正デルファイ法）",
      tj:"小児アトピー性皮膚炎と環境因子：生後早期からの低刺激の洗浄とセラミド保湿",
      te:"SAIGE III: The Role of Environmental Factors in the Development and Severity of Atopic Dermatitis in Young Children.",
      sum:["アトピー性皮膚炎（AD）は乳児期や幼少期に現れることが多く、生活の質に大きな影響を与え、成人期まで続くことがあります。環境因子は、AD に伴うかゆみ、バリア機能の障害、炎症に関与する重要な要因です。小児皮膚科の専門家 7 名のパネルが、対面の会議とその後のオンラインでのやり取りを含む修正デルファイ法を用いて現在の根拠を評価し、小児 AD の管理についての合意推奨をまとめました。",
           "パネルは、皮膚のバリア機能に影響し、小児 AD の発症と重症度に関与する環境因子を特定しました。合意推奨では、環境からの曝露を最小限にすることと、皮膚のバリアの破綻を減らす方策が強調されています。生後からの、やさしい非アルカリ性の洗浄剤とセラミドを含む保湿剤の早期かつ継続的な使用は、とくにリスクの高いお子さんにおいて、AD の発症リスクと重症度を和らげるのに役立つ可能性があるとされました。",
           "環境因子に気づき対応することは、小児 AD の管理の重要な要素です。修正可能な環境因子への対応と、早期からバリアを支えるスキンケアを始めることは、重症度と再燃を減らすための実際的な方法であり、環境のリスク因子とその対策についての医療者の認識を高める教育の重要性が示されたと述べられています。"],
      use:"湿疹のあるお子さんのご家族に、洗浄料の選び方と保湿を生後早期から続けていただくことをご説明する材料になります（生活指導アシスタントの小児のスキンケアのご案内と合わせてご利用いただけます）。",
      note:"専門家 7 名による修正デルファイ法の合意で、新たな臨床試験の結果ではありません。" },
    { cat:"A", pmid:"42826149", journal:"J Drugs Dermatol", year:2026, type:"総説",
      tj:"ネモリズマブの適応外使用：かゆみを伴う病態 16 研究を整理した総説",
      te:"Off-Label Uses of Nemolizumab: A Narrative Review.",
      sum:["ネモリズマブはインターロイキン 31 受容体 α（IL-31Rα）を標的とするヒト化モノクローナル抗体で、外用療法で十分にコントロールできない成人および 12 歳以上の小児のアトピー性皮膚炎（AD）と結節性痒疹に対して、かゆみと重症度を有意に減らした第 3 相試験を経て承認されています。承認された適応以外のさまざまなかゆみを伴う病態でも、速やかで持続的なかゆみの軽減が示されつつあるという背景で、2021 年から 2025 年までの文献から、適応外使用を検討した症例報告、症例集積、ランダム化比較試験、メタ解析を、皮膚科領域および全身性のかゆみを伴う病態にわたって検討した総説です。",
           "多様な診断を含む 16 の研究を通じて、ネモリズマブは皮膚アミロイドーシス、慢性単純性苔癬、尿毒症および透析に伴うそう痒、胆汁うっ滞性のそう痒、治療抵抗性の皮膚疾患を含む複数の適応外の病態で一貫した有効性を示しました。有害事象は添付文書に記載されているものと同様でした。",
           "現在の根拠は、治療抵抗性のかゆみを伴う病態に対する有望な治療選択肢としてネモリズマブを支持すると述べられています。効果発現の速さ、良好な忍容性、IL-31 のシグナルが高まった病態にわたる幅広い有効性は、臨床的な有用性が大きいことを示唆しますが、確定的な推奨にはより大規模なランダム化比較試験が必要とされています。"],
      use:"透析を受けていらっしゃる方やご高齢の方で原因のはっきりしないかゆみが続くときに、今後の選択肢として話題にする材料になります。",
      note:"承認された適応以外の使用についての総説で、症例報告を多く含みます。日本での適応は添付文書をご確認ください。" }
  ]
},

    { cat:"A", pmid:"42823606", journal:"Dermatol Ther (Heidelb)", year:2026, type:"後方視コホート",
      tj:"アトピー性皮膚炎に内服 JAK 阻害薬を続けた 41 名：260 週で EASI75 が 97.1%",
      te:"Long-Term Disease Control During Continuous Treatment with Upadacitinib and Baricitinib for Moderate-to-Severe Atopic Dermatitis: a Real-World Monocentric Retrospective Study.",
      sum:["アトピー性皮膚炎（AD）における経口ヤヌスキナーゼ（JAK）阻害薬の長期の有効性と安全性についての実臨床の根拠は限られているという背景の研究です。ウパダシチニブ 30 mg またはバリシチニブ 4 mg を継続して使用された中等症から重症の成人の AD の患者さんを対象に、単施設で後方視的に、長期の臨床評価と患者さんご自身の報告による疾患コントロール、ならびに安全性を評価しています。ベースラインの評価があり、割り付けられた JAK 阻害薬を続けながら縦断的な追跡を完了された方が対象で、ウパダシチニブは 260 週、バリシチニブは 312 週まで、湿疹面積重症度指数（EASI）75／90／100、EASI 7 以下・3 以下、医師による全般評価（IGA）0/1、平均 EASI、最大かゆみ数値評価尺度（PP-NRS）、睡眠障害数値評価尺度（SD-NRS）の改善と寛解の指標、安全性が評価されました。治療間の比較は探索的なものとされています。",
           "長期コホートは 41 名（ウパダシチニブ 34 名、バリシチニブ 7 名）でした。260 週時点でウパダシチニブ群では EASI75、EASI90、EASI 7 以下、EASI 3 以下をそれぞれ 97.1%、91.2%、100.0%、91.2% の方が達成されていました。バリシチニブ群では 32 週から 312 週まで全例で EASI75 が維持され、312 週時点で EASI90、EASI 7 以下、EASI 3 以下を全例が達成されていました。IGA 0/1 と平均 EASI も追跡期間中の低い疾患活動性の維持を示しました。260 週時点で PP-NRS の 4 点以上の改善は 82.4%、SD-NRS の 4 点以上の改善は 73.5% のウパダシチニブ使用者で維持され、バリシチニブ使用者ではそれぞれ 85.7%、71.4% で、バリシチニブでは 312 週時点でも同様の割合が維持されていました。有害事象はまれで、長期コホートでは重篤な有害事象、治療の中断、永続的な中止はありませんでした。",
           "継続して治療を受けられた選ばれた患者さんでは、ウパダシチニブとバリシチニブは中等症から重症の AD の臨床的および患者報告による長期のコントロールの維持と関連していたと述べられています。減量や中止の後の経過、より深い疾患の改善の可能性については、より大規模な前向き研究が必要とされています。"],
      use:"内服の JAK 阻害薬を長く続けていらっしゃる方に、かゆみや睡眠の改善が長期に保たれた報告があることをお伝えする材料になります。",
      note:"単施設の後方視研究で、治療を継続できた 41 名に限った解析です。" },
    { cat:"A", pmid:"42825739", journal:"J Am Acad Dermatol", year:2026, type:"後方視（実臨床）",
      tj:"高齢のアトピー性皮膚炎にアブロシチニブ：実臨床での成績と食欲の変化",
      te:"Abrocitinib in elderly patients with moderate-to-severe atopic dermatitis: A real-world study of clinical outcomes and appetite changes.",
      sum:["中等症から重症のアトピー性皮膚炎をお持ちのご高齢の患者さんにアブロシチニブ（経口 JAK1 阻害薬）を使用し、実臨床での臨床成績と食欲の変化を検討した研究であることが、標題から分かります。",
           "抄録が公開されていないため、対象となった人数、皮疹やかゆみの改善の程度、食欲の変化の具体的な内容はここでは確認できません。原著でのご確認が必要です。",
           "ご高齢の方への内服 JAK 阻害薬の効果と、食欲という全身状態に関わる変化に目を向けた報告であり、詳細は原著の確認が必要です。"],
      use:"ご高齢の方に内服 JAK 阻害薬をご検討いただく際、食欲など全身の様子にも目を配る手がかりになります（数値は原著でのご確認が必要です）。",
      note:"抄録なし（タイトルのみで要約）。原著確認が必要。" },
    { cat:"A", pmid:"42823603", journal:"Dermatol Ther (Heidelb)", year:2026, type:"総説",
      tj:"アトピー性皮膚炎の炎症の前奏曲：OX40L と OX40 の経路を整理した総説",
      te:"OX40 Ligand/OX40 Axis as the Inflammatory Prequel in Atopic Dermatitis: A Narrative Review.",
      sum:["アトピー性皮膚炎は、皮膚のバリア機能の障害と免疫の調節異常によって生じる、複雑で再発を繰り返す炎症性の皮膚疾患です。病像が多様で予測しにくいため、中等症から重症のアトピー性皮膚炎の治療は難しく、複数の炎症経路を調節できる治療薬が引き続き求められているという背景で、抗原提示細胞による T 細胞の活性化のうち、共刺激（二次）シグナルである OX40 リガンド（OX40L）と OX40 受容体の経路に注目して整理したナラティブレビューです。",
           "OX40L と OX40 のシグナル伝達経路は、明らかな免疫の不均衡が現れる前の免疫系の準備段階（本論文で炎症の前奏曲と呼ばれる時期）に働いており、この時期に OX40L と OX40 の相互作用が T 細胞の増殖・生存・サイトカインの産生と放出を促し、アトピー性皮膚炎の病態と発症の中心となる炎症経路を準備し増幅すると述べられています。シグナルが持続すると記憶 T 細胞の生成が進み、制御性 T 細胞の機能が抑えられ、慢性の炎症につながります。臨床研究では、治療を終えた後も続く皮膚のクリアランスとかゆみの改善が示されており、この経路の役割を支持するとされています。",
           "OX40L と OX40 は複数の炎症経路の交差点に位置しており、アトピー性皮膚炎や、他の T 細胞が主導する炎症性疾患に対する別の治療標的になりうると述べられています。OX40L または OX40 を標的とする抗体の臨床試験が進行中で、新しい根拠が今も現れている段階です。"],
      use:"今の治療で十分な改善が得られない方に、作用する点の異なる薬剤の開発が進んでいることをご説明する材料になります。" },
    { cat:"A", pmid:"42820605", journal:"J Eur Acad Dermatol Venereol", year:2026, type:"総説",
      tj:"皮膚に病変がないのに続くかゆみ：全身性のかゆみを神経免疫の障害として整理",
      te:"Systemic pruritus as a neuroimmune disorder: Mechanistic insights and target-driven therapy.",
      sum:["一次性の皮膚疾患がないのに続く慢性のかゆみは、頻度が高く、生活への支障が大きく、診断も複雑な症状で、全身性の病気の臨床症状に先行することがあります。腎、肝胆道、内分泌、代謝、血液、悪性腫瘍、神経、薬剤性の病態が慢性のかゆみの約 10〜15% を占め、多くの患者さんでは、かゆみが背景にある病態の最も早い臨床的なサインとなります。本総説は、全身性のかゆみの神経免疫的な基盤についての現在の機序の理解を、系統的な診断の進め方と機序に基づく治療の枠組みとあわせて整理しています。",
           "尿素や胆汁酸のような単独の循環するかゆみ物質に基づく従来の説明では、生化学的な指標とかゆみの強さの相関が乏しいことや、全身性のかゆみの多くで抗ヒスタミン薬の効果が限られることを説明できないと述べられています。慢性の免疫の活性化、サイトカインによる神経の感作、内因性オピオイドのバランスの変化、末梢神経の機能障害、中枢神経系での増幅が、一次・二次・三次のかゆみの経路にわたって相互に作用し、持続する、しばしば重いかゆみを生み出すという考えを支持する根拠が増えています。",
           "全身性のかゆみを神経免疫の障害として認識することで、背景にある病気をより早く見つけることができ、症状のコントロールと患者さんの生活の質の改善を目指した、理にかなった標的を定めた治療につながると述べられています。"],
      use:"皮疹がはっきりしないのにかゆみが続く方で、全身の病気や内服薬の確認を一度ご提案する根拠になります。" },
    { cat:"A", pmid:"42820589", journal:"J Eur Acad Dermatol Venereol", year:2026, type:"専門家合意（修正デルファイ法）",
      tj:"治りにくい白癬 Trichophyton indotineae：イトラコナゾールを第一選択とする合意",
      te:"IADVL consensus recommendations on Trichophyton indotineae infections: Using modified Delphi method.",
      sum:["Trichophyton indotineae は体部・股部・顔面の白癬を起こす重要な新しい菌種として現れており、一部の地域で定着が確認され、今後流行域が広がる可能性があると述べられています。本研究は、この感染症の疾患の定義、診断、治療についての合意を作ることを目的に、2017 年以降の関連文献を皮膚科の専門家パネルに提示し、全身投与と外用の治療の各側面を含む構造化した質問票を配布し、75% の合意に達しなかった領域では最大 3 回まで質問を修正して繰り返す修正デルファイ法で行われました。パネルは皮膚科医 14 名、真菌学者 2 名、薬理学者 1 名で構成されています。",
           "臨床的に判断に迷う場合には KOH 直接鏡検が推奨され、培養・抗真菌薬感受性試験・シークエンスは、専門の真菌検査室で流行している菌種と薬剤感受性の動向を監視する目的で推奨されました。治療については 14 名の皮膚科医に 87 の質問が行われ、主な推奨として、全身投与の第一選択はイトラコナゾール、第二選択はテルビナフィン（高用量）、4 週の時点で反応が不十分な場合は全身の抗真菌薬を変更すること、治癒するまで治療を延長すること、再発は初回と同じ治療法で治療することが挙げられています。小児、妊娠中、授乳中、腎や肝の機能障害、心不全、外用または全身のステロイドや免疫抑制薬を使用中の方といった特別な状況についての推奨も示されています。",
           "パネルは T. indotineae 感染症の臨床面と診断面について推奨を示し、これが患者さんの転帰の改善と、学術的な情報交換や研究の促進につながるとしています。"],
      use:"外用薬で治りにくい体部・股部の白癬で、KOH 直接鏡検をあらためて行い、内服薬の選択と治療期間を見直す材料になります。",
      note:"インド皮膚科性病ハンセン病学会（IADVL）の専門家合意で、抄録には一部の地域での定着と流行域の拡大の可能性が述べられています。" },
    { cat:"A", pmid:"42820094", journal:"Clin Cosmet Investig Dermatol", year:2026, type:"総説",
      tj:"成人女性の痤瘡にスピロノラクトン：内服 50〜200 mg/日 の根拠と外用の現状",
      te:"Oral and Topical Spironolactone in Adult Female Acne: A Narrative Review Comparing Systemic and Local Approaches.",
      sum:["成人女性の痤瘡（AFA）は 25 歳を超える女性の 12〜45% にみられ、従来の治療に抵抗性であることが多いと述べられています。スピロノラクトンは抗アンドロゲン作用から、抗菌薬に代わる有望な選択肢として位置づけられてきましたが、内服の研究が増える一方で外用の製剤は比較的検討が少なく、これまでの根拠の統合では AFA に特化した枠組みで両者を比較せず、まとめて扱われることが多かったとされています。本総説は 2025 年 9 月 1 日に PubMed と Google Scholar を検索し、成人女性の痤瘡とスピロノラクトンを組み合わせた検索語を用いて、原著の臨床研究（ランダム化比較試験、観察研究、症例集積）を対象に、内服と外用の有効性・安全性・実際上の考慮点を比較しています。",
           "内服のスピロノラクトン（50〜200 mg/日）は、炎症性および非炎症性の皮疹の数を一貫して有意に減らし、痤瘡に特化した生活の質を改善しました。直接比較試験では、ドキシサイクリンと同等かそれ以上の有効性が示され、経口抗菌薬より治療が長く続けられていました。外用のスピロノラクトン（2〜5%）は、全身への吸収が最小限で、面皰・丘疹・膿疹を減らし、全身治療の対象とならない方への選択肢となる可能性が示唆されています。ただし外用の製剤についての根拠は、少数例で研究設計も多様であることに加え、その多くが男女が混在する集団や AFA 以外の小規模な集団、健常者での薬物動態研究から得られたもので、AFA への当てはめは現時点では間接的で外挿によるものと述べられています。",
           "内服のスピロノラクトンは AFA に対する抗菌薬以外の有効な選択肢として確かな根拠に支えられ、中等症から重症に適するとされ、外用は有望ですが根拠は限られ一部間接的で、軽症から中等症の痤瘡や全身治療が禁忌の場合に適する可能性があるとまとめられています。両経路を直接比較した試験はないため、本総説の比較は必然的に間接的なものであると述べられています。"],
      use:"大人になってから繰り返す女性の痤瘡で、抗菌薬を長く続ける以外の選択肢を一緒に考える材料になります。",
      note:"海外のナラティブレビューで、内服と外用を直接比較した試験はなく、外用についての根拠は限られています。" },
    { cat:"A", pmid:"42824469", journal:"Drug Des Devel Ther", year:2026, type:"総説",
      tj:"円形脱毛症への JAK 阻害薬：第 3 相で有効率 40〜50%、残る課題を整理",
      te:"JAK Inhibitors for Alopecia Areata: Approved Therapies, Efficacy, and Unanswered Questions.",
      sum:["円形脱毛症（AA）は、瘢痕を残さない脱毛を特徴とする頻度の高い自己免疫性の疾患です。従来は T 細胞が介在する疾患と考えられてきましたが、近年の進歩によりヤヌスキナーゼ／シグナル伝達兼転写活性化因子（JAK/STAT）のシグナル伝達経路が病態で中心的な役割を担い、自ら持続する炎症のループを作ることが明らかにされました。この経路の同定により、治療の選択肢が限られていた疾患から標的治療のある疾患へと変わったという流れのなかで、過去 5 年の承認薬と臨床試験の結果を整理した総説です。",
           "JAK1/JAK2 選択的阻害薬であるバリシチニブが重症の AA に対する最初の FDA 承認の全身治療薬となり、続いて JAK3 と TEC ファミリーキナーゼを標的とするリトレシチニブ、JAK1/2 を標的とするデュルキソリチニブが続きました。イバルマシチニブや外用のデルゴシチニブなどの薬剤も活発に検討されており、選択性の profile と投与経路が異なります。従来の治療と比べて、バリシチニブとリトレシチニブといった JAK 阻害薬は第 3 相試験で 40〜50% の治療効果の割合を示しました。AA における JAK 阻害薬同士の直接比較試験はまだないため、本総説で論じられている比較は主に間接的な試験間の比較とネットワークメタ解析から導かれたものです。",
           "こうした著しい進歩がある一方で、治療反応のばらつき、重症の方での発毛の不完全さ、長期の安全性のリスクの可能性、患者さんの選択や治療効果の予測を導く検証されたバイオマーカーの不在といった大きな課題が残っていると述べられています。併用の戦略やバイオマーカーに基づく治療などの今後の方向性も、臨床判断の支援と未充足のニーズの提示のために論じられています。"],
      use:"広い範囲に広がった円形脱毛症のご相談で、内服の選択肢があることと、効き方の個人差や長期の安全性がまだ課題であることをあわせてご説明する材料になります。" },
    { cat:"A", pmid:"42822650", journal:"Clin Dermatol", year:2026, type:"総説",
      tj:"乾癬と GLP-1 受容体作動薬：併用で皮膚のクリアランスが上回った第 3b 相の報告",
      te:"GLP-1 receptor agonists in psoriasis management.",
      sum:["乾癬は、筋骨格、心血管、代謝、精神、消化器の合併症と関連する全身性の慢性炎症性の皮膚疾患です。グルカゴン様ペプチド-1 受容体作動薬（GLP-1 RA）と、グルコース依存性インスリン分泌刺激ポリペプチド（GIP）/GLP-1 の二重作動薬は、代謝への作用を超えて抗炎症作用を示し、サイトカインや炎症のバイオマーカーの発現を低下させうることから、乾癬の治療の補助となりうる薬剤として現れてきました。本総説は、乾癬の患者さんを対象に GLP-1 RA と GIP/GLP-1 二重作動薬を評価したランダム化試験と非ランダム化研究の現在の根拠を要約し、疾患の管理における位置づけを論じています。",
           "リラグルチド、セマグルチド、エキセナチド、デュラグルチド、チルゼパチドの観察研究では、概して乾癬の重症度、体重、代謝の指標、炎症のバイオマーカー、生活の質の改善が示されましたが、多くは少数例で対照のない研究設計という限界がありました。ランダム化試験も同様に皮膚科的な利益を示唆しており、とくに肥満または 2 型糖尿病のある方で顕著でした。最も注目されるのは第 3b 相の TOGETHER 試験で、中等症から重症の乾癬があり過体重または肥満のある方において、イキセキズマブにチルゼパチドを併用した場合に、イキセキズマブ単独よりも高い皮膚のクリアランスと体重の減少が示されました。TOGETHER-PsA 試験の結果もこれを補い、臨床的に意味のある体重減少が得られる前の 4 週という早い時点で乾癬性関節炎の疾患活動性の改善がみられ、これらの薬剤の体重に依存しない抗炎症作用の可能性を支持しています。",
           "今後の研究では、肥満や糖尿病のない患者さんも対象に含め、治療反応に対する体重減少と直接の抗炎症作用のそれぞれの寄与を明らかにし、GLP-1 に基づく治療の皮膚科的な利益が代謝の異常のない方にも及ぶかを明らかにすべきであると述べられています。"],
      use:"乾癬で体重や血糖が気になる方に、代謝の治療と皮膚の状態の関わりが検討されていることをお伝えし、内科の先生と連携する材料になります。" },
    { cat:"A", pmid:"42823874", journal:"Ewha Med J", year:2026, type:"総説",
      tj:"刺激性接触皮膚炎は除外診断ではない：自然免疫が関わる炎症として整理",
      te:"Irritant contact dermatitis: beyond a diagnosis of exclusion.",
      sum:["刺激性接触皮膚炎（ICD）は接触皮膚炎のなかで最も多い型で、職業性皮膚疾患の主要な原因ですが、アレルギー性接触皮膚炎（ACD）に比べて認識が十分でないと述べられています。ICD は化学的または物理的な表皮バリアの直接の障害によって生じ、曝露の強さや期間が皮膚の修復能力を超えれば、どなたにも起こりえます。本総説は ICD の機序、宿主の要因、臨床の病型、診断、管理を整理しています。",
           "ICD はバリアの破壊だけでなく、ケラチノサイト由来のサイトカイン、好中球の動員、CCL2-CCR2-IL-1β のシグナル、Toll 様受容体 3、インフラマソームの活性化が関わる、自然免疫が介在する炎症性の疾患として理解が進んでいます。宿主の要因としては、とくにアトピー性皮膚炎とフィラグリンの機能喪失型の多様体が感受性に影響します。臨床の病型は急性の刺激反応から慢性の累積性の皮膚炎まで幅があり、職業上の湿潤作業は予防可能な主要な曝露です。ICD と ACD は臨床像と病理像が重なり、併存することもあり、ICD によるバリアの障害がその後のアレルギーの感作を促しうるため、両者の区別は難しいとされています。したがって診断には、曝露歴、皮疹の分布、症状の性質、時間経過の評価と、ACD が疑われる場合のパッチテストが必要です。分子バイオマーカーのパネルや非侵襲的な画像・バリア評価の手法は診断の精度を高める可能性がありますが、まだ研究段階です。",
           "管理では、刺激物の同定と除去、曝露の減少、適切な防護の実施、表皮バリアの回復を優先すべきであり、ICD を単なる除外診断ではなく独立した臨床的な病態として認識することが、接触皮膚炎の正確な診断と効果的な管理に不可欠であると述べられています。"],
      use:"水仕事の多い方の手湿疹で、刺激の回避と手袋などの防護・保湿を生活指導の中心としてご説明し、アレルギーが疑われるときにパッチテストをご案内する材料になります。" },
    { cat:"A", pmid:"42820489", journal:"J Eur Acad Dermatol Venereol", year:2026, type:"前向きコホート",
      tj:"不安・うつと尋常性白斑の発症：ハザード比 1.78 と 1.46、遺伝的リスクが高いと 2.28",
      te:"Psychiatric morbidity, genetic susceptibility and the risk of vitiligo.",
      sum:["尋常性白斑は、遺伝的な素因と環境要因の影響を受ける複雑な自己免疫性の皮膚疾患です。精神疾患の併存は白斑に先行する要因または相関する要因として提案されてきましたが、新たな白斑の発症との前向きな関連は明らかではありませんでした。本研究は UK Biobank の参加者 379,589 名を対象に、精神疾患と白斑を ICD-10 のコードで同定し、白斑に特異的な polygenic risk score（PRS、遺伝的リスクスコア）を高い群と高くない群に分けて、Cox 比例ハザードモデルで関連を評価し、交互作用の解析と探索的な経路の解析を行っています。",
           "追跡期間の中央値 13.6 年のあいだに、十分に調整したモデルで、不安（ハザード比 1.78、95% 信頼区間 1.23-2.56）とうつ（ハザード比 1.46、95% 信頼区間 1.03-2.06）が新たな白斑の発症と関連していました。PRS が高いことも白斑のリスクの上昇と関連していました（ハザード比 1.48、95% 信頼区間 1.17-1.88）。層別の解析では、精神疾患の影響は遺伝的な背景によって異なり、精神疾患と高い PRS の両方をお持ちの方で点推定値が最も高くなりました（ハザード比 2.28、95% 信頼区間 1.06-4.88）。探索的な経路の解析では、リンパ球の割合が免疫に関連する指標となりうることが示唆されました。",
           "病院で記録された精神疾患と高い遺伝的な感受性は、新たな白斑の発症と前向きに関連していました。これらは観察研究の結果であり、白斑の全人的なケアで心の健康を考慮することを支持する一方、因果の機序については独立した検証が必要であると述べられています。"],
      use:"白斑のご相談の際に、お気持ちの負担についてもうかがい、心と体の両面から支えを考える材料になります（観察研究であり、因果関係は示されていません）。" }
  ]
},
{

  items: [
    { cat:"A", pmid:"42816838", journal:"BMC Nephrol", year:2026, type:"ランダム化比較試験の事後解析",
      tj:"透析中の糖尿病の方のかゆみ：アンリケフォンで 4 点以上の改善が 29.9% 対 15.2%",
      te:"Efficacy and safety of anrikefon in the treatment of diabetic hemodialysis patients with pruritus: a post hoc analysis.",
      sum:["糖尿病性腎臓病は世界的に慢性腎臓病の主要な原因であり、糖尿病はかゆみを起こしやすくするという背景の研究です。アンリケフォンは末梢に限定して作用する選択的κオピオイド受容体作動薬で、第 3 相 anrikefon-302 試験（ランダム化・プラセボ対照）のデータを用い、血液透析を受けておられる糖尿病の患者さんのかゆみに対する有効性と安全性を事後解析しています。アンリケフォン群 67 例、プラセボ群 79 例で、週平均の 24 時間最悪時かゆみ数値評価尺度（WI-NRS）がベースラインから 12 週で 4 点以上・3 点以上改善した方の割合を解析し、Skindex-10 と 5-D itch によるかゆみ関連の生活の質の変化も比較しています。",
           "ベースラインの背景は両群で概ね同様でした。臨床的に意味のある 4 点以上の改善は 29.9% 対 15.2%（p = 0.033）、3 点以上の改善は 41.8% 対 20.3%（p = 0.012）で、いずれもアンリケフォン群が有意に多くみられました。WI-NRS スコアの変化もアンリケフォン群で有意に大きく（-2.86（標準誤差 0.26）対 -1.63（標準誤差 0.21）、p = 0.001）、12 週時点の Skindex-10 のかゆみスコアの変化は -16.25（標準誤差 1.52）対 -8.49（標準誤差 1.36）（p < 0.001）、5-D itch スコアの変化は -5.41（標準誤差 0.45）対 -3.20（標準誤差 0.38）でした。治療中に発生した有害事象の頻度は両群で同程度でした。",
           "アンリケフォンは血液透析を受けておられる糖尿病の患者さんのかゆみで、かゆみの強さの明らかな軽減とかゆみに関連する生活の質の改善をもたらしたと述べられています。"],
      use:"透析を受けておられる方のかゆみのご相談で、末梢性のκオピオイド受容体作動薬という選択肢があることを腎臓内科の先生と共有する材料になります。",
      note:"第 3 相試験の事後解析で、糖尿病のある透析患者さんに限った部分集団の結果です。" },
    { cat:"A", pmid:"42813704", journal:"J Eur Acad Dermatol Venereol", year:2026, type:"総説",
      tj:"痤瘡の上流にある皮脂腺細胞を狙う：PPARγ・FoxO1-mTORC1 などを整理した総説",
      te:"Modulation of sebocyte function in acne: A pathway-inclusive review.",
      sum:["分子皮膚科学の進歩で痤瘡（ニキビ）の病態理解は深まりましたが、現在使える治療の多くは下流の炎症や細菌に向いており、発症・持続・再発を駆動する上流の皮脂腺細胞（sebocyte）の調節異常は直接の治療標的になりにくいままです。皮脂腺細胞の分子生物学的な制御についての現在のエビデンスを統合し、皮脂腺細胞を中心に置いた疾患モデルの治療上の意味を検討した総説です。",
           "PPARγ 依存性の転写制御、FoxO1-mTORC1 の栄養センサー軸、GATA6 を介した分化といった主要な制御経路に加え、ホルモン・遺伝・微生物・環境の因子が論じられています。単一細胞トランスクリプトームと空間プロファイリングの研究は、毛包脂腺単位のマイクロドメインに基づくモデルと整合し、部位による疾患の多様性・治療反応の差・再発を説明する助けになりうると述べられています。既存および新しい痤瘡治療が、皮脂腺細胞の調節異常・毛包の角化・微生物の調節・炎症という 4 つの古典的な病態領域で評価され、いくつかの非抗菌薬的な戦略が複数の病態軸に作用し、抗菌薬を節約する方針を支持しうると示されています。エビデンスは確立した臨床エビデンスと、橋渡し研究・前臨床・仮説を生む段階の知見とに分けて格付けされています。",
           "全身抗菌薬の投与期間を限定し、ホルモン療法と新しい外用薬を位置づける現行のガイドラインの推奨と整合すると述べられ、いま実行できることと、研究段階にとどまり第 3 相試験や比較試験の結果を待つ皮脂腺細胞標的の方針とを区別することを目的としています。単一の上流に働く薬剤が、現在は併用療法を要することの多い広く持続的な疾患制御を達成できるかは未確立としています。"],
      use:"ニキビで抗菌薬を長く続けたくないとお考えの方に、抗菌薬以外の外用薬やホルモン療法を組み合わせる方針の背景としてご説明する材料になります。" },
    { cat:"A", pmid:"42812972", journal:"Skin Health Dis", year:2026, type:"症例集積",
      tj:"タピナロフ外用中の面皰と毛孔周囲の色素沈着：8 例、発症は 1〜8 か月",
      te:"Localized comedones and perifollicular hyperpigmentation during tapinarof cream therapy: a case series.",
      sum:["タピナロフはアリル炭化水素受容体作動薬で、アトピー性皮膚炎と乾癬の治療薬として承認されています。よくみられる有害事象は頭痛と毛包炎ですが、面皰（コメド）と毛孔周囲の色素沈着は十分に認識されていないという背景から、治療中にこれらを生じたアトピー性皮膚炎または乾癬の 8 例を報告した症例集積です。",
           "病変は主に塗布部位に生じましたが、1 例では離れた部位にも出現しました。部位は顔面 6 例、下肢 1 例、上肢 1 例でした。発症までの期間はタピナロフ開始から 1〜8 か月でした。全例でタピナロフを中止しています。3 例にアダパレン／過酸化ベンゾイル外用を行い、1 例で部分的な改善、2 例でわずかな改善が得られました。1 例は追加治療なしで徐々に改善し、残る 5 例は経過観察中に改善なしかわずかな改善にとどまりました。",
           "本症例集積は、タピナロフ治療中の十分に認識されていない有害事象について重要な情報を提供すると述べられています。"],
      use:"タピナロフ外用中に顔のぶつぶつや毛穴まわりの色素沈着が出てきた方で、この副作用を疑って塗布部位との関係を確認する材料になります。",
      note:"8 例の症例集積で、どのくらいの頻度で起こるかは分かりません。" },
    { cat:"A", pmid:"42816063", journal:"Contact Dermatitis", year:2026, type:"成分表示の比較調査",
      tj:"ジェルネイルの HEMA は 3 年で約 75% 減、代わりに別の（メタ）アクリレートが増加",
      te:"Beyond HEMA: Shifts in the (Meth)acrylate Composition of Matched Nail Cosmetics Between 2023 and 2026.",
      sum:["ネイル化粧品によるアレルギー性接触皮膚炎は多く、ほとんどの患者さんは HEMA（2-ヒドロキシエチルメタクリレート）に対するアレルギーをお持ちです。一方で「HEMA フリー」と表示する製品が増えているという背景から、成分表示を用いて HEMA・Di-HEMA トリメチルヘキシルジカルバメート（Di-HEMA TMHDC）・その他の（メタ）アクリレートの使用の変化を評価し、HEMA と Di-HEMA TMHDC が業務用として販売されていない製品にも含まれるかを調べた研究です。2023 年の 394 製品をオンラインで検索し、同じブランド・同じ商品名の製品について 2023 年と 2026 年の成分表示を比較しています。",
           "一致した 127 製品では、HEMA は 65.4% から 16.5% へ（-75%）、Di-HEMA TMHDC は 27.6% から 7.1% へ（-74%）減少しました。トリメチロールプロパントリアクリレートは 63%、ウレタンアクリレートは 54% 減少しました。一方でベンジルメタクリレート・ウレタンメタクリレート・トリメチロールプロパントリメタクリレートは 100〜225% 増加していました。HEMA および／または Di-HEMA TMHDC を含む 24 製品のうち 4 製品（16.7%、全体の 3.1%）は、オンラインで業務用限定の制限が確認できないまま消費者向けに販売されているようでした。",
           "対応する製品の成分表示上、HEMA と Di-HEMA TMHDC の使用は 3 年間で約 75% 減少した一方、他のいくつかの（メタ）アクリレートの使用は大きく変化したと述べられています。HEMA および／または Di-HEMA TMHDC を含む製品が消費者に直接販売されている例は少なかったとしています。"],
      use:"ジェルネイルで手指の皮膚炎を起こされた方のパッチテストで、HEMA が陰性でも他の（メタ）アクリレートを検討する必要があるとご説明する材料になります。" },
    { cat:"A", pmid:"42816116", journal:"Contact Dermatitis", year:2026, type:"溶出試験",
      tj:"10K・14K の金ピアス：金は溶出するがニッケルは検出限界未満、銅は金より多く溶出",
      te:"Gold and Nickel Release From Jeweller-Purchased 10K and 14K Gold Earrings in Cysteine-Modified Artificial Sweat.",
      sum:["金の接触アレルギーは多くみられますが、その臨床的な意義はしばしば不明確です。低価格の金メッキピアスを調べた先行研究では、システインを加えた人工汗の条件でニッケルの溶出が多く、金の溶出も検出されていました。本研究では宝飾店で購入した 10K または 14K 表示のピアスについて、表面の組成と金・ニッケル・銅の溶出を評価しています。5 組を走査型電子顕微鏡とエネルギー分散型分光法（EDS）で調べ、pH 8.0±0.2・30℃・168 時間のシステイン添加人工汗で溶出試験を行い、誘導結合プラズマ質量分析で定量しています。",
           "表面は主に金・銅・銀・亜鉛で構成されていました。EDS で検出された金は 40〜63 wt%、ニッケルは 0.085〜0.20 wt% でした。ニッケルの溶出はすべての組で検出限界未満でした。金の溶出はすべての組で検出され（中央値 0.057 μg/cm2/週、範囲 0.016〜0.15）、銅の溶出はすべての試料で金の溶出を上回りました（中央値 0.53 μg/cm2/週、範囲 0.36〜2.2）。",
           "宝飾店で購入した 10K・14K の金ピアスは、システイン添加人工汗の条件下で測定可能な量の金を溶出した一方、ニッケルは検出されなかったと述べられています。金の溶出は曝露の経路としては説明がつきますが、感作や症状の誘発のリスクを立証するものではないとしています。"],
      use:"ピアスで耳の皮膚炎を起こされた方に、金そのものが溶け出すこともあるとお伝えしつつ、本研究は感作のリスクを示したものではないため、パッチテストの結果と合わせて判断する材料になります。" },
    { cat:"A", pmid:"42813193", journal:"Skin Health Dis", year:2026, type:"研究計画（プロトコル）",
      tj:"乳幼児の湿疹に食物 IgE 検査を使うか：英国の無作為化試験 TIGER のプロトコル",
      te:"Trial of food allergy IgE tests for Eczema Relief (TIGER): study protocol.",
      sum:["食物アレルギーは湿疹に関与する可能性がありますが、これを調べる検査の使い方にはばらつきがあり、利益と害についても不確実です。検査に基づく食事指導を標準治療と比較し、湿疹の管理における臨床的な有効性と費用対効果を明らかにすることを目的とした、実践的・多施設・並行群間の個別無作為化比較試験の計画です。英国の一般診療所から生後 3 か月以上 2 歳未満のお子さんを募り、標準治療群と介入群に 1 対 1 で割り付けます。両群に「良い湿疹ケア」の冊子をお渡しし、介入群にはさらに皮膚プリックテストと食事歴に基づいて、牛乳・鶏卵・小麦・大豆についての食事指導を行います。内部パイロットと遺伝サブスタディ、経済評価・プロセス評価が組み込まれています。",
           "主要評価項目は保護者が報告する湿疹のコントロール（RECAP）で、24 週にわたり 4 週ごとに記入されます。副次評価項目は湿疹の症状・生活の質・有害事象・授乳状況と食事・成長・保護者の不安です。主解析は参加者内に経時的な観察を入れ込んだ多階層混合モデルで行われます。費用効用分析では、お子さんと主たる介護者の質調整生存年を、国民保健サービス（NHS）に生じた費用と群間で比較し、NHS と NHS 以外の立場からの費用をさまざまなアウトカムと関連づける費用結果分析も行われます。組み込まれたプロセス評価では、介入の忠実度・因果の機序・アウトカムのばらつきに関わる文脈要因が評価されます。",
           "本試験は、この領域の臨床的なエビデンスの空白を埋めるものと述べられています。"],
      use:"乳児の湿疹で食物アレルギーの検査をご希望される保護者の方に、検査に基づく食事指導の有効性は現在検証されている段階であるとお伝えする材料になります。",
      note:"研究計画（プロトコル）論文で、結果はまだ報告されていません。" },
    { cat:"A", pmid:"42814435", journal:"JAMA Dermatol", year:2026, type:"国際デルファイ合意",
      tj:"12 歳未満の脱毛症に低用量経口ミノキシジル：9 か国の専門医で 84 項目が合意",
      te:"Low-Dose Oral Minoxidil Use for Pediatric Hair Disorders: An International Consensus Statement.",
      sum:["低用量経口ミノキシジル（LDOM）は小児の毛髪疾患に適応外で使われることが増えていますが、12 歳未満の患者さんでの患者選択・用量・安全性・モニタリングについての標準的な指針がありません。12 歳未満の毛髪疾患のお子さんにおける LDOM 使用についての専門家の合意推奨を策定した研究です。LDOM の薬理・安全性・臨床使用に関する文献のレビューに基づいて調査票が作成され、2025 年 6 月 30 日から 2026 年 3 月 7 日まで修正デルファイ法が実施されました。事前選別調査に回答した 98 名のうち、LDOM での小児治療が 10 例を超えるという適格基準を満たした 51 名が招かれ、REDCap を用いて多職種の意見を含む 3 回の調査が行われました。合意は 5 段階リッカート尺度で 70% 以上の一致と定義されています。",
           "51 名のうち 9 か国の 50 名が 1 回目と 2 回目を、49 名（保持率 98.0%）が 3 回目を完了しました。当初検討された 127 項目のうち 84 項目で合意が得られました。LDOM は 4 歳以上 12 歳未満のお子さんで、毛包のミニチュア化（100%）、毛周期の異常（100%）、毛幹の異常（84%）に対して支持され、一部の瘢痕性脱毛症では補助的な使用（98%）が支持されました。外用ミノキシジルよりも LDOM を選ぶ理由としては、手間がかかること、忍容性が不良なこと、効果が不十分なこと、介護者のご希望、びまん性の脱毛、感覚過敏、ペットへの毒性のリスクが挙げられました（74〜96%）。体重別の固定用量と mg/kg 換算の用量のいずれの方法も合意に達しました。固定用量は使用できる錠剤の規格に合わせたもの（20 kg 未満で 0.250〜0.625 mg、20〜40 kg で 1.250 mg、40 kg 超で 1.875 mg [80%]）で、開始用量 0.01〜0.02 mg/kg/日（73.5%）が柔軟な代替案として示されました。50〜100% の増量と 3〜6 か月ごとの再評価も合意に達しました。禁忌には心膜液貯留または心タンポナーデと褐色細胞腫が挙げられました。専門家の間では、リスクの低い患者さんでのベースラインの検査と血圧測定は全例に必要とはされませんでした。LDOM は漸減戦略を伴う長期療法として、また脱毛のサブタイプに応じてスピロノラクトン・副腎皮質ステロイド・ヤヌスキナーゼ阻害薬などの併用療法としても支持されました。",
           "本国際合意声明は小児に特化した LDOM 使用の枠組みを示し、免疫抑制を伴わない柔軟な治療戦略として支持するとともに、用量・安全性・モニタリングの重要な空白に対応すると述べられています。"],
      use:"お子さんの脱毛のご相談で経口ミノキシジルを検討する際に、年齢・体重ごとの用量と再評価の間隔の目安として参照できます。",
      note:"適応外使用についての専門家の合意であり、承認された用法を示したものではありません。" },
    { cat:"A", pmid:"42812956", journal:"Skin Health Dis", year:2026, type:"総説",
      tj:"アトピー性皮膚炎と食物アレルギーに共通するエピジェネティクス：皮膚と腸の軸の総説",
      te:"Shared epigenetic mechanisms in atopic dermatitis and food allergy: a review of immune dysregulation at the skin-gut axis.",
      sum:["アトピー性皮膚炎と食物アレルギーはしばしば併存し、湿疹からアレルギー性鼻炎・喘息へと進むアトピーマーチの中心的な特徴です。FLG 変異などの古典的な遺伝因子は疾患の感受性の一部しか説明しません。近年の研究では、DNA メチル化・ヒストン修飾・非コード RNA を含むエピジェネティックな制御が、免疫調節の乱れとバリア機能の障害の重要な決定因子として注目されています。本総説はアトピー性皮膚炎と食物アレルギーに共通するエピジェネティックな特徴を体系的に検討しています。",
           "とくにインターロイキン（IL）-4／IL-13 の軸、FOXP3 のメチル化、皮膚と腸の境界における上皮遺伝子の抑制に重点が置かれています。ゲノムワイドのメチル化研究とトランスクリプトーム研究のエビデンスを統合し、エピジェネティックな可塑性が、アトピーの併存を駆動する免疫とバリアの相互作用の基盤にあると提唱されています。",
           "これらの機序を解明することが、アレルギーと皮膚科の領域におけるバイオマーカーの探索と、個別化されたエピジェネティック治療の開発の基盤になると述べられています。"],
      use:"湿疹のあるお子さんの保護者の方に、皮膚のバリアと食物アレルギーがつながっている背景をご説明する材料になります（治療法としてはまだ研究段階です）。" },
    { cat:"A", pmid:"42812931", journal:"Allergol Select", year:2026, type:"前向き研究",
      tj:"小児の嗅覚障害：アトピー性皮膚炎とアレルギー性鼻炎に関連、喘息では関連なし（250 名）",
      te:"Olfactory dysfunction in children is associated with atopic dermatitis and allergic rhinitis, but not bronchial asthma.",
      sum:["小児の嗅覚障害と、アトピー性皮膚炎（AD）・アレルギー性鼻炎（AR）・気管支喘息（BA）との関連を調べた前向き研究です。6〜17 歳のお子さん 250 名（AD・AR・BA・アトピーの併存・健康な対照の各 50 名）を対象に、嗅覚検査（Sniffin Sticks、U-Sniff）、質問票、プリックテスト、スパイロメトリーで評価しています。",
           "アトピーのある患者さんは対照より匂いの同定が不良でした。AD のお子さんでは匂いの同定が障害されていました。AR の患者さんは閾値の検査で嗅覚低下がより多くみられましたが、平均スコアには有意差がありませんでした。BA の患者さんでは有意な障害はみられませんでしたが、肺機能は嗅覚の成績と正の相関を示しました。",
           "小児の AD と AR は特定の嗅覚障害と関連し、BA では関連しないと述べられています。これらの群では嗅覚の低下に注意を払うことが望まれ、AD については神経発達の側面をさらに検討すべきとしています。"],
      use:"アトピー性皮膚炎のお子さんで匂いが分かりにくいというお話が出たときに、関連がありうると受け止めて耳鼻咽喉科と相談する材料になります。" },
    { cat:"A", pmid:"42814804", journal:"Sci Transl Med", year:2026, type:"動物実験（ブタモデル）",
      tj:"疥癬に 1 回 4 時間の外用で虫体と卵が全滅：ブタモデルで内服イベルメクチン 2 回を上回る",
      te:"A single-dose topical therapy cures scabies in a human-relevant porcine model.",
      sum:["疥癬は年間およそ 4 億人に影響しますが、現在の治療は殺卵作用をもたず反復投与が必要で、治療失敗と薬剤耐性の影響が増しています。動いている虫体と卵の両方を 1 回の塗布で排除できる治療がないことが、疾患制御の重要な限界の一つです。本研究では、殺卵作用をもつメタロプロテアーゼ阻害薬のアバメタピルと、速やかな殺ダニ作用をもつβ-トリケトンのフラベソンを組み合わせ、神経毒性によらない異なる機序で複数の発育段階を標的とする外用治療を開発し、ヒトの疥癬をよく再現するブタのモデルで、外用後の有効性・かゆみの軽減・薬物の曝露を評価しています。",
           "重症の疥癬において、1 回 4 時間の治療によりすべての生存している虫体と卵が根絶され、かゆみも軽減し、標準的な内服イベルメクチン 2 回投与の治療を上回りました。皮膚の薬物動態では速やかに濃度に到達し、イベルメクチンより全身の半減期が短いにもかかわらず、1 回投与での有効性を裏づける曝露のプロファイルが示されました。",
           "この有望な薬剤の組み合わせは、疥癬の管理を簡略化し、耐性に対して強い可能性のある方針になりうると述べられています。"],
      use:"施設内での疥癬のご相談で、今後 1 回塗布型の外用薬が開発されうることを知っておく材料になります（ブタのモデルでの結果で、ヒトでの効果は未確認と添えます）。",
      note:"ブタのモデルでの研究です。ヒトでの効果は未確認です。" },
    { cat:"C", pmid:"42729354", journal:"Front Hum Neurosci", year:2026, type:"研究計画（プロトコル）",
      tj:"尿毒症性のかゆみに鍼：fNIRS で脳の反応をみる無作為化試験（96 名）のプロトコル",
      te:"Cerebral responses to acupuncture for uremic pruritus: study protocol for a randomized controlled trial based on fNIRS.",
      sum:["尿毒症性のかゆみ（UP）は末期腎不全によくみられる合併症で、患者さんの生活の質を大きく損ないます。鍼は UP の症状を効果的に和らげうるとされていますが、その中枢性の機序は明らかになっていません。本計画では UP の患者さん 96 名を、実際の鍼（VA）・偽鍼（SA）・待機リスト対照（WT）の 3 群に無作為に割り付けます。",
           "全参加者に cowhage（カウヒッジ）テストで急性のかゆみを誘発し、機能的近赤外分光法（fNIRS）での計測中に VA・SA の単回施術、または無介入（WT）を受けます。その後 VA 群と SA 群は 4 週間続けて鍼治療を受けます。前頭前野と一次体性感覚野の血行動態の変化を、単回施術中、ならびに長期治療の 6 回目と 12 回目の後に測定します。臨床アウトカムとして、かゆみの強さ・生活の質・心理状態も評価されます。",
           "本研究は、実際の臨床の場で fNIRS を用いて、鍼が UP に及ぼす即時的および長期的な効果の中枢性の機序を探ることを目的としています。実際の鍼がかゆみに関わる脳領域の神経活動のパターンを特異的に調節し、その変化が臨床症状の改善と相関するという仮説が立てられています。鍼の止痒効果について画像による根拠を示し、より適切な鍼治療につなげるとしています。"],
      use:"透析を受けておられる方のかゆみで鍼灸をご希望される際に、効果の機序を調べる研究が進んでいる段階であるとお伝えする材料になります。",
      note:"研究計画（プロトコル）論文で、結果はまだ報告されていません。" }
  ]
},
