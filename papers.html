  items: [
    { cat:"A", pmid:"42823606", journal:"Dermatol Ther (Heidelb)", year:2026, type:"後方視コホート",
      tj:"アトピー性皮膚炎に内服 JAK 阻害薬を続けた 41 名：260 週で EASI75 が 97.1%",
      te:"Long-Term Disease Control During Continuous Treatment with Upadacitinib and Baricitinib for Moderate-to-Severe Atopic Dermatitis: a Real-World Monocentric Retrospective Study.",
      sum:["アトピー性皮膚炎（AD）における経口ヤヌスキナーゼ（JAK）阻害薬の長期の有効性と安全性についての実臨床の根拠は限られているという背景の研究です。ウパダシチニブ 30 mg またはバリシチニブ 4 mg を継続して使用された中等症から重症の成人の AD の患者さんを対象に、単施設で後方視的に、長期の臨床評価と患者さんご自身の報告による疾患コントロール、ならびに安全性を評価しています。ベースラインの評価があり、割り付けられた JAK 阻害薬を続けながら縦断的な追跡を完了された方が対象で、ウパダシチニブは 260 週、バリシチニブは 312 週まで、湿疹面積重症度指数（EASI）75／90／100、EASI 7 以下・3 以下、医師による全般評価（IGA）0/1、平均 EASI、最大かゆみ数値評価尺度（PP-NRS）、睡眠障害数値評価尺度（SD-NRS）の改善と寛解の指標、安全性が評価されました。治療間の比較は探索的なものとされています。",
           "長期コホートは 41 名（ウパダシチニブ 34 名、バリシチニブ 7 名）でした。260 週時点でウパダシチニブ群では EASI75、EASI90、EASI 7 以下、EASI 3 以下をそれぞれ 97.1%、91.2%、100.0%、91.2% の方が達成されていました。バリシチニブ群では 32 週から 312 週まで全例で EASI75 が維持され、312 週時点で EASI90、EASI 7 以下、EASI 3 以下を全例が達成されていました。IGA 0/1 と平均 EASI も追跡期間中の低い疾患活動性の維持を示しました。260 週時点で PP-NRS の 4 点以上の改善は 82.4%、SD-NRS の 4 点以上の改善は 73.5% のウパダシチニブ使用者で維持され、バリシチニブ使用者ではそれぞれ 85.7%、71.4% で、バリシチニブでは 312 週時点でも同様の割合が維持されていました。有害事象はまれで、長期コホートでは重篤な有害事象、治療の中断、永続的な中止はありませんでした。",
           "継続して治療を受けられた選ばれた患者さんでは、ウパダシチニブとバリシチニブは中等症から重症の AD の臨床的および患者報告による長期のコントロールの維持と関連していたと述べられています。減量や中止の後の経過、より深い疾患の改善の可能性については、より大規模な前向き研究が必要とされています。"],
      use:"内服の JAK 阻害薬を長く続けていらっしゃる方に、かゆみや睡眠の改善が長期に保たれた報告があることをお伝えする材料になります。",
      note:"単施設の後方視研究で、治療を継続できた 41 名に限った解析です。" },
    { cat:"A", pmid:"42825739", journal:"J Am Acad Dermatol", year:2026, type:"後方視（実臨床）",
      tj:"高齢のアトピー性皮膚炎にアブロシチニブ：実臨床での成績と食欲の変化",
      te:"Abrocitinib in elderly patients with moderate-to-severe atopic dermatitis: A real-world study of clinical outcomes and appetite changes.",
      sum:["中等症から重症のアトピー性皮膚炎をお持ちのご高齢の患者さんにアブロシチニブ（経口 JAK1 阻害薬）を使用し、実臨床での臨床成績と食欲の変化を検討した研究であることが、標題から分かります。",
           "抄録が公開されていないため、対象となった人数、皮疹やかゆみの改善の程度、食欲の変化の具体的な内容はここでは確認できません。原著でのご確認が必要です。",
           "ご高齢の方への内服 JAK 阻害薬の効果と、食欲という全身状態に関わる変化に目を向けた報告であり、詳細は原著の確認が必要です。"],
      use:"ご高齢の方に内服 JAK 阻害薬をご検討いただく際、食欲など全身の様子にも目を配る手がかりになります（数値は原著でのご確認が必要です）。",
      note:"抄録なし（タイトルのみで要約）。原著確認が必要。" },
    { cat:"A", pmid:"42823603", journal:"Dermatol Ther (Heidelb)", year:2026, type:"総説",
      tj:"アトピー性皮膚炎の炎症の前奏曲：OX40L と OX40 の経路を整理した総説",
      te:"OX40 Ligand/OX40 Axis as the Inflammatory Prequel in Atopic Dermatitis: A Narrative Review.",
      sum:["アトピー性皮膚炎は、皮膚のバリア機能の障害と免疫の調節異常によって生じる、複雑で再発を繰り返す炎症性の皮膚疾患です。病像が多様で予測しにくいため、中等症から重症のアトピー性皮膚炎の治療は難しく、複数の炎症経路を調節できる治療薬が引き続き求められているという背景で、抗原提示細胞による T 細胞の活性化のうち、共刺激（二次）シグナルである OX40 リガンド（OX40L）と OX40 受容体の経路に注目して整理したナラティブレビューです。",
           "OX40L と OX40 のシグナル伝達経路は、明らかな免疫の不均衡が現れる前の免疫系の準備段階（本論文で炎症の前奏曲と呼ばれる時期）に働いており、この時期に OX40L と OX40 の相互作用が T 細胞の増殖・生存・サイトカインの産生と放出を促し、アトピー性皮膚炎の病態と発症の中心となる炎症経路を準備し増幅すると述べられています。シグナルが持続すると記憶 T 細胞の生成が進み、制御性 T 細胞の機能が抑えられ、慢性の炎症につながります。臨床研究では、治療を終えた後も続く皮膚のクリアランスとかゆみの改善が示されており、この経路の役割を支持するとされています。",
           "OX40L と OX40 は複数の炎症経路の交差点に位置しており、アトピー性皮膚炎や、他の T 細胞が主導する炎症性疾患に対する別の治療標的になりうると述べられています。OX40L または OX40 を標的とする抗体の臨床試験が進行中で、新しい根拠が今も現れている段階です。"],
      use:"今の治療で十分な改善が得られない方に、作用する点の異なる薬剤の開発が進んでいることをご説明する材料になります。" },
    { cat:"A", pmid:"42820605", journal:"J Eur Acad Dermatol Venereol", year:2026, type:"総説",
      tj:"皮膚に病変がないのに続くかゆみ：全身性のかゆみを神経免疫の障害として整理",
      te:"Systemic pruritus as a neuroimmune disorder: Mechanistic insights and target-driven therapy.",
      sum:["一次性の皮膚疾患がないのに続く慢性のかゆみは、頻度が高く、生活への支障が大きく、診断も複雑な症状で、全身性の病気の臨床症状に先行することがあります。腎、肝胆道、内分泌、代謝、血液、悪性腫瘍、神経、薬剤性の病態が慢性のかゆみの約 10〜15% を占め、多くの患者さんでは、かゆみが背景にある病態の最も早い臨床的なサインとなります。本総説は、全身性のかゆみの神経免疫的な基盤についての現在の機序の理解を、系統的な診断の進め方と機序に基づく治療の枠組みとあわせて整理しています。",
           "尿素や胆汁酸のような単独の循環するかゆみ物質に基づく従来の説明では、生化学的な指標とかゆみの強さの相関が乏しいことや、全身性のかゆみの多くで抗ヒスタミン薬の効果が限られることを説明できないと述べられています。慢性の免疫の活性化、サイトカインによる神経の感作、内因性オピオイドのバランスの変化、末梢神経の機能障害、中枢神経系での増幅が、一次・二次・三次のかゆみの経路にわたって相互に作用し、持続する、しばしば重いかゆみを生み出すという考えを支持する根拠が増えています。",
           "全身性のかゆみを神経免疫の障害として認識することで、背景にある病気をより早く見つけることができ、症状のコントロールと患者さんの生活の質の改善を目指した、理にかなった標的を定めた治療につながると述べられています。"],
      use:"皮疹がはっきりしないのにかゆみが続く方で、全身の病気や内服薬の確認を一度ご提案する根拠になります。" },
    { cat:"A", pmid:"42820589", journal:"J Eur Acad Dermatol Venereol", year:2026, type:"専門家合意（修正デルファイ法）",
      tj:"治りにくい白癬 Trichophyton indotineae：イトラコナゾールを第一選択とする合意",
      te:"IADVL consensus recommendations on Trichophyton indotineae infections: Using modified Delphi method.",
      sum:["Trichophyton indotineae は体部・股部・顔面の白癬を起こす重要な新しい菌種として現れており、一部の地域で定着が確認され、今後流行域が広がる可能性があると述べられています。本研究は、この感染症の疾患の定義、診断、治療についての合意を作ることを目的に、2017 年以降の関連文献を皮膚科の専門家パネルに提示し、全身投与と外用の治療の各側面を含む構造化した質問票を配布し、75% の合意に達しなかった領域では最大 3 回まで質問を修正して繰り返す修正デルファイ法で行われました。パネルは皮膚科医 14 名、真菌学者 2 名、薬理学者 1 名で構成されています。",
           "臨床的に判断に迷う場合には KOH 直接鏡検が推奨され、培養・抗真菌薬感受性試験・シークエンスは、専門の真菌検査室で流行している菌種と薬剤感受性の動向を監視する目的で推奨されました。治療については 14 名の皮膚科医に 87 の質問が行われ、主な推奨として、全身投与の第一選択はイトラコナゾール、第二選択はテルビナフィン（高用量）、4 週の時点で反応が不十分な場合は全身の抗真菌薬を変更すること、治癒するまで治療を延長すること、再発は初回と同じ治療法で治療することが挙げられています。小児、妊娠中、授乳中、腎や肝の機能障害、心不全、外用または全身のステロイドや免疫抑制薬を使用中の方といった特別な状況についての推奨も示されています。",
           "パネルは T. indotineae 感染症の臨床面と診断面について推奨を示し、これが患者さんの転帰の改善と、学術的な情報交換や研究の促進につながるとしています。"],
      use:"外用薬で治りにくい体部・股部の白癬で、KOH 直接鏡検をあらためて行い、内服薬の選択と治療期間を見直す材料になります。",
      note:"インド皮膚科性病ハンセン病学会（IADVL）の専門家合意で、抄録には一部の地域での定着と流行域の拡大の可能性が述べられています。" },
    { cat:"A", pmid:"42820094", journal:"Clin Cosmet Investig Dermatol", year:2026, type:"総説",
      tj:"成人女性の痤瘡にスピロノラクトン：内服 50〜200 mg/日 の根拠と外用の現状",
      te:"Oral and Topical Spironolactone in Adult Female Acne: A Narrative Review Comparing Systemic and Local Approaches.",
      sum:["成人女性の痤瘡（AFA）は 25 歳を超える女性の 12〜45% にみられ、従来の治療に抵抗性であることが多いと述べられています。スピロノラクトンは抗アンドロゲン作用から、抗菌薬に代わる有望な選択肢として位置づけられてきましたが、内服の研究が増える一方で外用の製剤は比較的検討が少なく、これまでの根拠の統合では AFA に特化した枠組みで両者を比較せず、まとめて扱われることが多かったとされています。本総説は 2025 年 9 月 1 日に PubMed と Google Scholar を検索し、成人女性の痤瘡とスピロノラクトンを組み合わせた検索語を用いて、原著の臨床研究（ランダム化比較試験、観察研究、症例集積）を対象に、内服と外用の有効性・安全性・実際上の考慮点を比較しています。",
           "内服のスピロノラクトン（50〜200 mg/日）は、炎症性および非炎症性の皮疹の数を一貫して有意に減らし、痤瘡に特化した生活の質を改善しました。直接比較試験では、ドキシサイクリンと同等かそれ以上の有効性が示され、経口抗菌薬より治療が長く続けられていました。外用のスピロノラクトン（2〜5%）は、全身への吸収が最小限で、面皰・丘疹・膿疹を減らし、全身治療の対象とならない方への選択肢となる可能性が示唆されています。ただし外用の製剤についての根拠は、少数例で研究設計も多様であることに加え、その多くが男女が混在する集団や AFA 以外の小規模な集団、健常者での薬物動態研究から得られたもので、AFA への当てはめは現時点では間接的で外挿によるものと述べられています。",
           "内服のスピロノラクトンは AFA に対する抗菌薬以外の有効な選択肢として確かな根拠に支えられ、中等症から重症に適するとされ、外用は有望ですが根拠は限られ一部間接的で、軽症から中等症の痤瘡や全身治療が禁忌の場合に適する可能性があるとまとめられています。両経路を直接比較した試験はないため、本総説の比較は必然的に間接的なものであると述べられています。"],
      use:"大人になってから繰り返す女性の痤瘡で、抗菌薬を長く続ける以外の選択肢を一緒に考える材料になります。",
      note:"海外のナラティブレビューで、内服と外用を直接比較した試験はなく、外用についての根拠は限られています。" },
    { cat:"A", pmid:"42824469", journal:"Drug Des Devel Ther", year:2026, type:"総説",
      tj:"円形脱毛症への JAK 阻害薬：第 3 相で有効率 40〜50%、残る課題を整理",
      te:"JAK Inhibitors for Alopecia Areata: Approved Therapies, Efficacy, and Unanswered Questions.",
      sum:["円形脱毛症（AA）は、瘢痕を残さない脱毛を特徴とする頻度の高い自己免疫性の疾患です。従来は T 細胞が介在する疾患と考えられてきましたが、近年の進歩によりヤヌスキナーゼ／シグナル伝達兼転写活性化因子（JAK/STAT）のシグナル伝達経路が病態で中心的な役割を担い、自ら持続する炎症のループを作ることが明らかにされました。この経路の同定により、治療の選択肢が限られていた疾患から標的治療のある疾患へと変わったという流れのなかで、過去 5 年の承認薬と臨床試験の結果を整理した総説です。",
           "JAK1/JAK2 選択的阻害薬であるバリシチニブが重症の AA に対する最初の FDA 承認の全身治療薬となり、続いて JAK3 と TEC ファミリーキナーゼを標的とするリトレシチニブ、JAK1/2 を標的とするデュルキソリチニブが続きました。イバルマシチニブや外用のデルゴシチニブなどの薬剤も活発に検討されており、選択性の profile と投与経路が異なります。従来の治療と比べて、バリシチニブとリトレシチニブといった JAK 阻害薬は第 3 相試験で 40〜50% の治療効果の割合を示しました。AA における JAK 阻害薬同士の直接比較試験はまだないため、本総説で論じられている比較は主に間接的な試験間の比較とネットワークメタ解析から導かれたものです。",
           "こうした著しい進歩がある一方で、治療反応のばらつき、重症の方での発毛の不完全さ、長期の安全性のリスクの可能性、患者さんの選択や治療効果の予測を導く検証されたバイオマーカーの不在といった大きな課題が残っていると述べられています。併用の戦略やバイオマーカーに基づく治療などの今後の方向性も、臨床判断の支援と未充足のニーズの提示のために論じられています。"],
      use:"広い範囲に広がった円形脱毛症のご相談で、内服の選択肢があることと、効き方の個人差や長期の安全性がまだ課題であることをあわせてご説明する材料になります。" },
    { cat:"A", pmid:"42822650", journal:"Clin Dermatol", year:2026, type:"総説",
      tj:"乾癬と GLP-1 受容体作動薬：併用で皮膚のクリアランスが上回った第 3b 相の報告",
      te:"GLP-1 receptor agonists in psoriasis management.",
      sum:["乾癬は、筋骨格、心血管、代謝、精神、消化器の合併症と関連する全身性の慢性炎症性の皮膚疾患です。グルカゴン様ペプチド-1 受容体作動薬（GLP-1 RA）と、グルコース依存性インスリン分泌刺激ポリペプチド（GIP）/GLP-1 の二重作動薬は、代謝への作用を超えて抗炎症作用を示し、サイトカインや炎症のバイオマーカーの発現を低下させうることから、乾癬の治療の補助となりうる薬剤として現れてきました。本総説は、乾癬の患者さんを対象に GLP-1 RA と GIP/GLP-1 二重作動薬を評価したランダム化試験と非ランダム化研究の現在の根拠を要約し、疾患の管理における位置づけを論じています。",
           "リラグルチド、セマグルチド、エキセナチド、デュラグルチド、チルゼパチドの観察研究では、概して乾癬の重症度、体重、代謝の指標、炎症のバイオマーカー、生活の質の改善が示されましたが、多くは少数例で対照のない研究設計という限界がありました。ランダム化試験も同様に皮膚科的な利益を示唆しており、とくに肥満または 2 型糖尿病のある方で顕著でした。最も注目されるのは第 3b 相の TOGETHER 試験で、中等症から重症の乾癬があり過体重または肥満のある方において、イキセキズマブにチルゼパチドを併用した場合に、イキセキズマブ単独よりも高い皮膚のクリアランスと体重の減少が示されました。TOGETHER-PsA 試験の結果もこれを補い、臨床的に意味のある体重減少が得られる前の 4 週という早い時点で乾癬性関節炎の疾患活動性の改善がみられ、これらの薬剤の体重に依存しない抗炎症作用の可能性を支持しています。",
           "今後の研究では、肥満や糖尿病のない患者さんも対象に含め、治療反応に対する体重減少と直接の抗炎症作用のそれぞれの寄与を明らかにし、GLP-1 に基づく治療の皮膚科的な利益が代謝の異常のない方にも及ぶかを明らかにすべきであると述べられています。"],
      use:"乾癬で体重や血糖が気になる方に、代謝の治療と皮膚の状態の関わりが検討されていることをお伝えし、内科の先生と連携する材料になります。" },
    { cat:"A", pmid:"42823874", journal:"Ewha Med J", year:2026, type:"総説",
      tj:"刺激性接触皮膚炎は除外診断ではない：自然免疫が関わる炎症として整理",
      te:"Irritant contact dermatitis: beyond a diagnosis of exclusion.",
      sum:["刺激性接触皮膚炎（ICD）は接触皮膚炎のなかで最も多い型で、職業性皮膚疾患の主要な原因ですが、アレルギー性接触皮膚炎（ACD）に比べて認識が十分でないと述べられています。ICD は化学的または物理的な表皮バリアの直接の障害によって生じ、曝露の強さや期間が皮膚の修復能力を超えれば、どなたにも起こりえます。本総説は ICD の機序、宿主の要因、臨床の病型、診断、管理を整理しています。",
           "ICD はバリアの破壊だけでなく、ケラチノサイト由来のサイトカイン、好中球の動員、CCL2-CCR2-IL-1β のシグナル、Toll 様受容体 3、インフラマソームの活性化が関わる、自然免疫が介在する炎症性の疾患として理解が進んでいます。宿主の要因としては、とくにアトピー性皮膚炎とフィラグリンの機能喪失型の多様体が感受性に影響します。臨床の病型は急性の刺激反応から慢性の累積性の皮膚炎まで幅があり、職業上の湿潤作業は予防可能な主要な曝露です。ICD と ACD は臨床像と病理像が重なり、併存することもあり、ICD によるバリアの障害がその後のアレルギーの感作を促しうるため、両者の区別は難しいとされています。したがって診断には、曝露歴、皮疹の分布、症状の性質、時間経過の評価と、ACD が疑われる場合のパッチテストが必要です。分子バイオマーカーのパネルや非侵襲的な画像・バリア評価の手法は診断の精度を高める可能性がありますが、まだ研究段階です。",
           "管理では、刺激物の同定と除去、曝露の減少、適切な防護の実施、表皮バリアの回復を優先すべきであり、ICD を単なる除外診断ではなく独立した臨床的な病態として認識することが、接触皮膚炎の正確な診断と効果的な管理に不可欠であると述べられています。"],
      use:"水仕事の多い方の手湿疹で、刺激の回避と手袋などの防護・保湿を生活指導の中心としてご説明し、アレルギーが疑われるときにパッチテストをご案内する材料になります。" },
    { cat:"A", pmid:"42820489", journal:"J Eur Acad Dermatol Venereol", year:2026, type:"前向きコホート",
      tj:"不安・うつと尋常性白斑の発症：ハザード比 1.78 と 1.46、遺伝的リスクが高いと 2.28",
      te:"Psychiatric morbidity, genetic susceptibility and the risk of vitiligo.",
      sum:["尋常性白斑は、遺伝的な素因と環境要因の影響を受ける複雑な自己免疫性の皮膚疾患です。精神疾患の併存は白斑に先行する要因または相関する要因として提案されてきましたが、新たな白斑の発症との前向きな関連は明らかではありませんでした。本研究は UK Biobank の参加者 379,589 名を対象に、精神疾患と白斑を ICD-10 のコードで同定し、白斑に特異的な polygenic risk score（PRS、遺伝的リスクスコア）を高い群と高くない群に分けて、Cox 比例ハザードモデルで関連を評価し、交互作用の解析と探索的な経路の解析を行っています。",
           "追跡期間の中央値 13.6 年のあいだに、十分に調整したモデルで、不安（ハザード比 1.78、95% 信頼区間 1.23-2.56）とうつ（ハザード比 1.46、95% 信頼区間 1.03-2.06）が新たな白斑の発症と関連していました。PRS が高いことも白斑のリスクの上昇と関連していました（ハザード比 1.48、95% 信頼区間 1.17-1.88）。層別の解析では、精神疾患の影響は遺伝的な背景によって異なり、精神疾患と高い PRS の両方をお持ちの方で点推定値が最も高くなりました（ハザード比 2.28、95% 信頼区間 1.06-4.88）。探索的な経路の解析では、リンパ球の割合が免疫に関連する指標となりうることが示唆されました。",
           "病院で記録された精神疾患と高い遺伝的な感受性は、新たな白斑の発症と前向きに関連していました。これらは観察研究の結果であり、白斑の全人的なケアで心の健康を考慮することを支持する一方、因果の機序については独立した検証が必要であると述べられています。"],
      use:"白斑のご相談の際に、お気持ちの負担についてもうかがい、心と体の両面から支えを考える材料になります（観察研究であり、因果関係は示されていません）。" }
  ]
},

    { cat:"A", pmid:"42816838", journal:"BMC Nephrol", year:2026, type:"ランダム化比較試験の事後解析",
      tj:"透析中の糖尿病の方のかゆみ：アンリケフォンで 4 点以上の改善が 29.9% 対 15.2%",
      te:"Efficacy and safety of anrikefon in the treatment of diabetic hemodialysis patients with pruritus: a post hoc analysis.",
      sum:["糖尿病性腎臓病は世界的に慢性腎臓病の主要な原因であり、糖尿病はかゆみを起こしやすくするという背景の研究です。アンリケフォンは末梢に限定して作用する選択的κオピオイド受容体作動薬で、第 3 相 anrikefon-302 試験（ランダム化・プラセボ対照）のデータを用い、血液透析を受けておられる糖尿病の患者さんのかゆみに対する有効性と安全性を事後解析しています。アンリケフォン群 67 例、プラセボ群 79 例で、週平均の 24 時間最悪時かゆみ数値評価尺度（WI-NRS）がベースラインから 12 週で 4 点以上・3 点以上改善した方の割合を解析し、Skindex-10 と 5-D itch によるかゆみ関連の生活の質の変化も比較しています。",
           "ベースラインの背景は両群で概ね同様でした。臨床的に意味のある 4 点以上の改善は 29.9% 対 15.2%（p = 0.033）、3 点以上の改善は 41.8% 対 20.3%（p = 0.012）で、いずれもアンリケフォン群が有意に多くみられました。WI-NRS スコアの変化もアンリケフォン群で有意に大きく（-2.86（標準誤差 0.26）対 -1.63（標準誤差 0.21）、p = 0.001）、12 週時点の Skindex-10 のかゆみスコアの変化は -16.25（標準誤差 1.52）対 -8.49（標準誤差 1.36）（p < 0.001）、5-D itch スコアの変化は -5.41（標準誤差 0.45）対 -3.20（標準誤差 0.38）でした。治療中に発生した有害事象の頻度は両群で同程度でした。",
           "アンリケフォンは血液透析を受けておられる糖尿病の患者さんのかゆみで、かゆみの強さの明らかな軽減とかゆみに関連する生活の質の改善をもたらしたと述べられています。"],
      use:"透析を受けておられる方のかゆみのご相談で、末梢性のκオピオイド受容体作動薬という選択肢があることを腎臓内科の先生と共有する材料になります。",
      note:"第 3 相試験の事後解析で、糖尿病のある透析患者さんに限った部分集団の結果です。" },
    { cat:"A", pmid:"42813704", journal:"J Eur Acad Dermatol Venereol", year:2026, type:"総説",
      tj:"痤瘡の上流にある皮脂腺細胞を狙う：PPARγ・FoxO1-mTORC1 などを整理した総説",
      te:"Modulation of sebocyte function in acne: A pathway-inclusive review.",
      sum:["分子皮膚科学の進歩で痤瘡（ニキビ）の病態理解は深まりましたが、現在使える治療の多くは下流の炎症や細菌に向いており、発症・持続・再発を駆動する上流の皮脂腺細胞（sebocyte）の調節異常は直接の治療標的になりにくいままです。皮脂腺細胞の分子生物学的な制御についての現在のエビデンスを統合し、皮脂腺細胞を中心に置いた疾患モデルの治療上の意味を検討した総説です。",
           "PPARγ 依存性の転写制御、FoxO1-mTORC1 の栄養センサー軸、GATA6 を介した分化といった主要な制御経路に加え、ホルモン・遺伝・微生物・環境の因子が論じられています。単一細胞トランスクリプトームと空間プロファイリングの研究は、毛包脂腺単位のマイクロドメインに基づくモデルと整合し、部位による疾患の多様性・治療反応の差・再発を説明する助けになりうると述べられています。既存および新しい痤瘡治療が、皮脂腺細胞の調節異常・毛包の角化・微生物の調節・炎症という 4 つの古典的な病態領域で評価され、いくつかの非抗菌薬的な戦略が複数の病態軸に作用し、抗菌薬を節約する方針を支持しうると示されています。エビデンスは確立した臨床エビデンスと、橋渡し研究・前臨床・仮説を生む段階の知見とに分けて格付けされています。",
           "全身抗菌薬の投与期間を限定し、ホルモン療法と新しい外用薬を位置づける現行のガイドラインの推奨と整合すると述べられ、いま実行できることと、研究段階にとどまり第 3 相試験や比較試験の結果を待つ皮脂腺細胞標的の方針とを区別することを目的としています。単一の上流に働く薬剤が、現在は併用療法を要することの多い広く持続的な疾患制御を達成できるかは未確立としています。"],
      use:"ニキビで抗菌薬を長く続けたくないとお考えの方に、抗菌薬以外の外用薬やホルモン療法を組み合わせる方針の背景としてご説明する材料になります。" },
    { cat:"A", pmid:"42812972", journal:"Skin Health Dis", year:2026, type:"症例集積",
      tj:"タピナロフ外用中の面皰と毛孔周囲の色素沈着：8 例、発症は 1〜8 か月",
      te:"Localized comedones and perifollicular hyperpigmentation during tapinarof cream therapy: a case series.",
      sum:["タピナロフはアリル炭化水素受容体作動薬で、アトピー性皮膚炎と乾癬の治療薬として承認されています。よくみられる有害事象は頭痛と毛包炎ですが、面皰（コメド）と毛孔周囲の色素沈着は十分に認識されていないという背景から、治療中にこれらを生じたアトピー性皮膚炎または乾癬の 8 例を報告した症例集積です。",
           "病変は主に塗布部位に生じましたが、1 例では離れた部位にも出現しました。部位は顔面 6 例、下肢 1 例、上肢 1 例でした。発症までの期間はタピナロフ開始から 1〜8 か月でした。全例でタピナロフを中止しています。3 例にアダパレン／過酸化ベンゾイル外用を行い、1 例で部分的な改善、2 例でわずかな改善が得られました。1 例は追加治療なしで徐々に改善し、残る 5 例は経過観察中に改善なしかわずかな改善にとどまりました。",
           "本症例集積は、タピナロフ治療中の十分に認識されていない有害事象について重要な情報を提供すると述べられています。"],
      use:"タピナロフ外用中に顔のぶつぶつや毛穴まわりの色素沈着が出てきた方で、この副作用を疑って塗布部位との関係を確認する材料になります。",
      note:"8 例の症例集積で、どのくらいの頻度で起こるかは分かりません。" },
    { cat:"A", pmid:"42816063", journal:"Contact Dermatitis", year:2026, type:"成分表示の比較調査",
      tj:"ジェルネイルの HEMA は 3 年で約 75% 減、代わりに別の（メタ）アクリレートが増加",
      te:"Beyond HEMA: Shifts in the (Meth)acrylate Composition of Matched Nail Cosmetics Between 2023 and 2026.",
      sum:["ネイル化粧品によるアレルギー性接触皮膚炎は多く、ほとんどの患者さんは HEMA（2-ヒドロキシエチルメタクリレート）に対するアレルギーをお持ちです。一方で「HEMA フリー」と表示する製品が増えているという背景から、成分表示を用いて HEMA・Di-HEMA トリメチルヘキシルジカルバメート（Di-HEMA TMHDC）・その他の（メタ）アクリレートの使用の変化を評価し、HEMA と Di-HEMA TMHDC が業務用として販売されていない製品にも含まれるかを調べた研究です。2023 年の 394 製品をオンラインで検索し、同じブランド・同じ商品名の製品について 2023 年と 2026 年の成分表示を比較しています。",
           "一致した 127 製品では、HEMA は 65.4% から 16.5% へ（-75%）、Di-HEMA TMHDC は 27.6% から 7.1% へ（-74%）減少しました。トリメチロールプロパントリアクリレートは 63%、ウレタンアクリレートは 54% 減少しました。一方でベンジルメタクリレート・ウレタンメタクリレート・トリメチロールプロパントリメタクリレートは 100〜225% 増加していました。HEMA および／または Di-HEMA TMHDC を含む 24 製品のうち 4 製品（16.7%、全体の 3.1%）は、オンラインで業務用限定の制限が確認できないまま消費者向けに販売されているようでした。",
           "対応する製品の成分表示上、HEMA と Di-HEMA TMHDC の使用は 3 年間で約 75% 減少した一方、他のいくつかの（メタ）アクリレートの使用は大きく変化したと述べられています。HEMA および／または Di-HEMA TMHDC を含む製品が消費者に直接販売されている例は少なかったとしています。"],
      use:"ジェルネイルで手指の皮膚炎を起こされた方のパッチテストで、HEMA が陰性でも他の（メタ）アクリレートを検討する必要があるとご説明する材料になります。" },
    { cat:"A", pmid:"42816116", journal:"Contact Dermatitis", year:2026, type:"溶出試験",
      tj:"10K・14K の金ピアス：金は溶出するがニッケルは検出限界未満、銅は金より多く溶出",
      te:"Gold and Nickel Release From Jeweller-Purchased 10K and 14K Gold Earrings in Cysteine-Modified Artificial Sweat.",
      sum:["金の接触アレルギーは多くみられますが、その臨床的な意義はしばしば不明確です。低価格の金メッキピアスを調べた先行研究では、システインを加えた人工汗の条件でニッケルの溶出が多く、金の溶出も検出されていました。本研究では宝飾店で購入した 10K または 14K 表示のピアスについて、表面の組成と金・ニッケル・銅の溶出を評価しています。5 組を走査型電子顕微鏡とエネルギー分散型分光法（EDS）で調べ、pH 8.0±0.2・30℃・168 時間のシステイン添加人工汗で溶出試験を行い、誘導結合プラズマ質量分析で定量しています。",
           "表面は主に金・銅・銀・亜鉛で構成されていました。EDS で検出された金は 40〜63 wt%、ニッケルは 0.085〜0.20 wt% でした。ニッケルの溶出はすべての組で検出限界未満でした。金の溶出はすべての組で検出され（中央値 0.057 μg/cm2/週、範囲 0.016〜0.15）、銅の溶出はすべての試料で金の溶出を上回りました（中央値 0.53 μg/cm2/週、範囲 0.36〜2.2）。",
           "宝飾店で購入した 10K・14K の金ピアスは、システイン添加人工汗の条件下で測定可能な量の金を溶出した一方、ニッケルは検出されなかったと述べられています。金の溶出は曝露の経路としては説明がつきますが、感作や症状の誘発のリスクを立証するものではないとしています。"],
      use:"ピアスで耳の皮膚炎を起こされた方に、金そのものが溶け出すこともあるとお伝えしつつ、本研究は感作のリスクを示したものではないため、パッチテストの結果と合わせて判断する材料になります。" },
    { cat:"A", pmid:"42813193", journal:"Skin Health Dis", year:2026, type:"研究計画（プロトコル）",
      tj:"乳幼児の湿疹に食物 IgE 検査を使うか：英国の無作為化試験 TIGER のプロトコル",
      te:"Trial of food allergy IgE tests for Eczema Relief (TIGER): study protocol.",
      sum:["食物アレルギーは湿疹に関与する可能性がありますが、これを調べる検査の使い方にはばらつきがあり、利益と害についても不確実です。検査に基づく食事指導を標準治療と比較し、湿疹の管理における臨床的な有効性と費用対効果を明らかにすることを目的とした、実践的・多施設・並行群間の個別無作為化比較試験の計画です。英国の一般診療所から生後 3 か月以上 2 歳未満のお子さんを募り、標準治療群と介入群に 1 対 1 で割り付けます。両群に「良い湿疹ケア」の冊子をお渡しし、介入群にはさらに皮膚プリックテストと食事歴に基づいて、牛乳・鶏卵・小麦・大豆についての食事指導を行います。内部パイロットと遺伝サブスタディ、経済評価・プロセス評価が組み込まれています。",
           "主要評価項目は保護者が報告する湿疹のコントロール（RECAP）で、24 週にわたり 4 週ごとに記入されます。副次評価項目は湿疹の症状・生活の質・有害事象・授乳状況と食事・成長・保護者の不安です。主解析は参加者内に経時的な観察を入れ込んだ多階層混合モデルで行われます。費用効用分析では、お子さんと主たる介護者の質調整生存年を、国民保健サービス（NHS）に生じた費用と群間で比較し、NHS と NHS 以外の立場からの費用をさまざまなアウトカムと関連づける費用結果分析も行われます。組み込まれたプロセス評価では、介入の忠実度・因果の機序・アウトカムのばらつきに関わる文脈要因が評価されます。",
           "本試験は、この領域の臨床的なエビデンスの空白を埋めるものと述べられています。"],
      use:"乳児の湿疹で食物アレルギーの検査をご希望される保護者の方に、検査に基づく食事指導の有効性は現在検証されている段階であるとお伝えする材料になります。",
      note:"研究計画（プロトコル）論文で、結果はまだ報告されていません。" },
    { cat:"A", pmid:"42814435", journal:"JAMA Dermatol", year:2026, type:"国際デルファイ合意",
      tj:"12 歳未満の脱毛症に低用量経口ミノキシジル：9 か国の専門医で 84 項目が合意",
      te:"Low-Dose Oral Minoxidil Use for Pediatric Hair Disorders: An International Consensus Statement.",
      sum:["低用量経口ミノキシジル（LDOM）は小児の毛髪疾患に適応外で使われることが増えていますが、12 歳未満の患者さんでの患者選択・用量・安全性・モニタリングについての標準的な指針がありません。12 歳未満の毛髪疾患のお子さんにおける LDOM 使用についての専門家の合意推奨を策定した研究です。LDOM の薬理・安全性・臨床使用に関する文献のレビューに基づいて調査票が作成され、2025 年 6 月 30 日から 2026 年 3 月 7 日まで修正デルファイ法が実施されました。事前選別調査に回答した 98 名のうち、LDOM での小児治療が 10 例を超えるという適格基準を満たした 51 名が招かれ、REDCap を用いて多職種の意見を含む 3 回の調査が行われました。合意は 5 段階リッカート尺度で 70% 以上の一致と定義されています。",
           "51 名のうち 9 か国の 50 名が 1 回目と 2 回目を、49 名（保持率 98.0%）が 3 回目を完了しました。当初検討された 127 項目のうち 84 項目で合意が得られました。LDOM は 4 歳以上 12 歳未満のお子さんで、毛包のミニチュア化（100%）、毛周期の異常（100%）、毛幹の異常（84%）に対して支持され、一部の瘢痕性脱毛症では補助的な使用（98%）が支持されました。外用ミノキシジルよりも LDOM を選ぶ理由としては、手間がかかること、忍容性が不良なこと、効果が不十分なこと、介護者のご希望、びまん性の脱毛、感覚過敏、ペットへの毒性のリスクが挙げられました（74〜96%）。体重別の固定用量と mg/kg 換算の用量のいずれの方法も合意に達しました。固定用量は使用できる錠剤の規格に合わせたもの（20 kg 未満で 0.250〜0.625 mg、20〜40 kg で 1.250 mg、40 kg 超で 1.875 mg [80%]）で、開始用量 0.01〜0.02 mg/kg/日（73.5%）が柔軟な代替案として示されました。50〜100% の増量と 3〜6 か月ごとの再評価も合意に達しました。禁忌には心膜液貯留または心タンポナーデと褐色細胞腫が挙げられました。専門家の間では、リスクの低い患者さんでのベースラインの検査と血圧測定は全例に必要とはされませんでした。LDOM は漸減戦略を伴う長期療法として、また脱毛のサブタイプに応じてスピロノラクトン・副腎皮質ステロイド・ヤヌスキナーゼ阻害薬などの併用療法としても支持されました。",
           "本国際合意声明は小児に特化した LDOM 使用の枠組みを示し、免疫抑制を伴わない柔軟な治療戦略として支持するとともに、用量・安全性・モニタリングの重要な空白に対応すると述べられています。"],
      use:"お子さんの脱毛のご相談で経口ミノキシジルを検討する際に、年齢・体重ごとの用量と再評価の間隔の目安として参照できます。",
      note:"適応外使用についての専門家の合意であり、承認された用法を示したものではありません。" },
    { cat:"A", pmid:"42812956", journal:"Skin Health Dis", year:2026, type:"総説",
      tj:"アトピー性皮膚炎と食物アレルギーに共通するエピジェネティクス：皮膚と腸の軸の総説",
      te:"Shared epigenetic mechanisms in atopic dermatitis and food allergy: a review of immune dysregulation at the skin-gut axis.",
      sum:["アトピー性皮膚炎と食物アレルギーはしばしば併存し、湿疹からアレルギー性鼻炎・喘息へと進むアトピーマーチの中心的な特徴です。FLG 変異などの古典的な遺伝因子は疾患の感受性の一部しか説明しません。近年の研究では、DNA メチル化・ヒストン修飾・非コード RNA を含むエピジェネティックな制御が、免疫調節の乱れとバリア機能の障害の重要な決定因子として注目されています。本総説はアトピー性皮膚炎と食物アレルギーに共通するエピジェネティックな特徴を体系的に検討しています。",
           "とくにインターロイキン（IL）-4／IL-13 の軸、FOXP3 のメチル化、皮膚と腸の境界における上皮遺伝子の抑制に重点が置かれています。ゲノムワイドのメチル化研究とトランスクリプトーム研究のエビデンスを統合し、エピジェネティックな可塑性が、アトピーの併存を駆動する免疫とバリアの相互作用の基盤にあると提唱されています。",
           "これらの機序を解明することが、アレルギーと皮膚科の領域におけるバイオマーカーの探索と、個別化されたエピジェネティック治療の開発の基盤になると述べられています。"],
      use:"湿疹のあるお子さんの保護者の方に、皮膚のバリアと食物アレルギーがつながっている背景をご説明する材料になります（治療法としてはまだ研究段階です）。" },
    { cat:"A", pmid:"42812931", journal:"Allergol Select", year:2026, type:"前向き研究",
      tj:"小児の嗅覚障害：アトピー性皮膚炎とアレルギー性鼻炎に関連、喘息では関連なし（250 名）",
      te:"Olfactory dysfunction in children is associated with atopic dermatitis and allergic rhinitis, but not bronchial asthma.",
      sum:["小児の嗅覚障害と、アトピー性皮膚炎（AD）・アレルギー性鼻炎（AR）・気管支喘息（BA）との関連を調べた前向き研究です。6〜17 歳のお子さん 250 名（AD・AR・BA・アトピーの併存・健康な対照の各 50 名）を対象に、嗅覚検査（Sniffin Sticks、U-Sniff）、質問票、プリックテスト、スパイロメトリーで評価しています。",
           "アトピーのある患者さんは対照より匂いの同定が不良でした。AD のお子さんでは匂いの同定が障害されていました。AR の患者さんは閾値の検査で嗅覚低下がより多くみられましたが、平均スコアには有意差がありませんでした。BA の患者さんでは有意な障害はみられませんでしたが、肺機能は嗅覚の成績と正の相関を示しました。",
           "小児の AD と AR は特定の嗅覚障害と関連し、BA では関連しないと述べられています。これらの群では嗅覚の低下に注意を払うことが望まれ、AD については神経発達の側面をさらに検討すべきとしています。"],
      use:"アトピー性皮膚炎のお子さんで匂いが分かりにくいというお話が出たときに、関連がありうると受け止めて耳鼻咽喉科と相談する材料になります。" },
    { cat:"A", pmid:"42814804", journal:"Sci Transl Med", year:2026, type:"動物実験（ブタモデル）",
      tj:"疥癬に 1 回 4 時間の外用で虫体と卵が全滅：ブタモデルで内服イベルメクチン 2 回を上回る",
      te:"A single-dose topical therapy cures scabies in a human-relevant porcine model.",
      sum:["疥癬は年間およそ 4 億人に影響しますが、現在の治療は殺卵作用をもたず反復投与が必要で、治療失敗と薬剤耐性の影響が増しています。動いている虫体と卵の両方を 1 回の塗布で排除できる治療がないことが、疾患制御の重要な限界の一つです。本研究では、殺卵作用をもつメタロプロテアーゼ阻害薬のアバメタピルと、速やかな殺ダニ作用をもつβ-トリケトンのフラベソンを組み合わせ、神経毒性によらない異なる機序で複数の発育段階を標的とする外用治療を開発し、ヒトの疥癬をよく再現するブタのモデルで、外用後の有効性・かゆみの軽減・薬物の曝露を評価しています。",
           "重症の疥癬において、1 回 4 時間の治療によりすべての生存している虫体と卵が根絶され、かゆみも軽減し、標準的な内服イベルメクチン 2 回投与の治療を上回りました。皮膚の薬物動態では速やかに濃度に到達し、イベルメクチンより全身の半減期が短いにもかかわらず、1 回投与での有効性を裏づける曝露のプロファイルが示されました。",
           "この有望な薬剤の組み合わせは、疥癬の管理を簡略化し、耐性に対して強い可能性のある方針になりうると述べられています。"],
      use:"施設内での疥癬のご相談で、今後 1 回塗布型の外用薬が開発されうることを知っておく材料になります（ブタのモデルでの結果で、ヒトでの効果は未確認と添えます）。",
      note:"ブタのモデルでの研究です。ヒトでの効果は未確認です。" },
    { cat:"C", pmid:"42729354", journal:"Front Hum Neurosci", year:2026, type:"研究計画（プロトコル）",
      tj:"尿毒症性のかゆみに鍼：fNIRS で脳の反応をみる無作為化試験（96 名）のプロトコル",
      te:"Cerebral responses to acupuncture for uremic pruritus: study protocol for a randomized controlled trial based on fNIRS.",
      sum:["尿毒症性のかゆみ（UP）は末期腎不全によくみられる合併症で、患者さんの生活の質を大きく損ないます。鍼は UP の症状を効果的に和らげうるとされていますが、その中枢性の機序は明らかになっていません。本計画では UP の患者さん 96 名を、実際の鍼（VA）・偽鍼（SA）・待機リスト対照（WT）の 3 群に無作為に割り付けます。",
           "全参加者に cowhage（カウヒッジ）テストで急性のかゆみを誘発し、機能的近赤外分光法（fNIRS）での計測中に VA・SA の単回施術、または無介入（WT）を受けます。その後 VA 群と SA 群は 4 週間続けて鍼治療を受けます。前頭前野と一次体性感覚野の血行動態の変化を、単回施術中、ならびに長期治療の 6 回目と 12 回目の後に測定します。臨床アウトカムとして、かゆみの強さ・生活の質・心理状態も評価されます。",
           "本研究は、実際の臨床の場で fNIRS を用いて、鍼が UP に及ぼす即時的および長期的な効果の中枢性の機序を探ることを目的としています。実際の鍼がかゆみに関わる脳領域の神経活動のパターンを特異的に調節し、その変化が臨床症状の改善と相関するという仮説が立てられています。鍼の止痒効果について画像による根拠を示し、より適切な鍼治療につなげるとしています。"],
      use:"透析を受けておられる方のかゆみで鍼灸をご希望される際に、効果の機序を調べる研究が進んでいる段階であるとお伝えする材料になります。",
      note:"研究計画（プロトコル）論文で、結果はまだ報告されていません。" }
  ]
},
{
  date: "2026-10-01",

  items: [
    { cat:"A", pmid:"42809766", journal:"Acta Dermatovenerol Alp Pannonica Adriat", year:2026, type:"システマティックレビュー・メタ解析",
      tj:"アトピー性皮膚炎に保湿剤：連続 2 週・4 週で水分蒸散量が有意に低下",
      te:"Effect of emollients on skin barrier function in patients with atopic dermatitis: a systematic review and meta-analysis.",
      sum:["アトピー性皮膚炎は皮膚バリア機能の障害が主体で、保湿剤（エモリエント）が治療の柱の一つですが、バリア修復効果や適切な使用期間についての結論は定まっていないという背景から、現在のエビデンスを統合した研究です。PubMed・Embase・Web of Science・Cochrane Library の 4 つのデータベースから関連する 14 件を選び、そのうちヒトのランダム化比較試験 10 件をメタ解析に含め、経表皮水分蒸散量（TEWL）・皮膚の水分量（静電容量）・皮膚の pH を主に評価し、使用期間ごとの TEWL の差もサブグループで比較しています。",
           "保湿剤を使用した方の TEWL は対照群より有意に低く、連続使用 2 週時点と 4 週時点で統計学的に有意でした。皮膚の静電容量は保湿剤群で対照群より有意に高く、皮膚の pH には両群で有意差がありませんでした。",
           "保湿剤は TEWL を下げて皮膚の水分量を改善し、その効果は連続使用 2 週・4 週で有意に認められると述べられています。一方で pH の改善は確認されず、6 週以上使用した場合の効果はエビデンスが限られており結論が出ていないとしています。"],
      use:"保湿剤は続けて 2〜4 週で皮膚の水分保持が数字として改善するとお伝えし、生活指導アシスタントのスキンケアを毎日続けていただく根拠になります。" },
    { cat:"A", pmid:"42806327", journal:"BMC Nephrol", year:2026, type:"システマティックレビュー・メタ解析",
      tj:"維持透析中のかゆみは 60.0%、血清リンと最も一貫した関連（25 研究 8,955 例）",
      te:"Prevalence and associated factors of chronic kidney disease-associated pruritus in maintenance hemodialysis patients: a systematic review and meta-analysis.",
      sum:["慢性腎臓病に伴うかゆみ（CKD-aP）は維持血液透析を受けておられる方に多く負担の大きい合併症ですが、報告される頻度や関連因子が研究間で一致していないという背景から、PRISMA 2020 に沿って 8 つのデータベースを 2026 年 3 月 11 日まで検索し、成人の維持血液透析患者さんでのかゆみの頻度と関連因子を報告した観察研究を統合した研究です。関連因子の解析には多変量調整済みオッズ比のみを用いています。",
           "25 研究・8,955 例が含まれました。何らかのかゆみの統合頻度は 60.0%（95% 信頼区間 57.0〜63.0%）でした。血清リンは連続変数としての解析（オッズ比 2.03、95% 信頼区間 1.44〜2.87）でも二値化した解析（オッズ比 2.93、95% 信頼区間 1.83〜4.69）でもかゆみと正の関連を示しました。糖尿病はかゆみのオッズが高いことと関連し（オッズ比 2.64、95% 信頼区間 1.69〜4.14）、ハイフラックス血液透析は逆の関連を示しました（オッズ比 0.31、95% 信頼区間 0.17〜0.56）。副甲状腺ホルモン・CRP・β2 ミクログロブリン・透析歴・年齢の関連は、変数の定義や研究の質によって変わりました。",
           "維持血液透析を受けておられる方の約 60% がかゆみを経験し、血清リンが最も一貫した関連を示したと述べられています。他の因子の推定値は定義・方法論的な質・研究間のばらつきによって変動し、アジアでリンとの関連が強いという地域差は仮説を生む段階の知見とすべきとしています。"],
      use:"透析を受けておられる方のかゆみのご相談で、頻度が高いこととリンや糖尿病の管理が関連しうることを腎臓内科の先生と共有する材料になります。" },
    { cat:"A", pmid:"42807181", journal:"Cureus", year:2026, type:"スコーピングレビュー",
      tj:"慢性特発性蕁麻疹と食事：8 研究で短期的な改善傾向、いずれも小規模",
      te:"The Role of Diet in the Management of Chronic Idiopathic Urticaria: A Scoping Review.",
      sum:["慢性特発性蕁麻疹（CIU）は、明らかな誘因が同定できないまま膨疹や血管性浮腫が 6 週間以上続く疾患で、皮膚でマスト細胞が自然に活性化して炎症性のメディエーターを放出することにより生じます。病態の解明が十分でなく負担も大きいことから、2015 年から 2025 年に発表された食事との関連についての文献を、食事介入・患者報告アウトカム・知識の不足点に注目して評価したスコーピングレビューです。PRISMA に沿って EMBASE・OVID Medline・Web of Science を検索しています。",
           "121 件のうち 9 件が適格基準を満たし、批判的吟味を経て 8 件が含まれました。地中海食、低偽アレルゲン食、偽アレルゲン除去食、ヒスタミンを含まない低偽アレルゲン食、低ヒスタミン食、および微量栄養素と炎症マーカーを検討した研究で、介入期間は 7 日から 39 日強でした。蕁麻疹活動性スコア・蕁麻疹コントロールテスト・慢性蕁麻疹の生活の質スコアなどで評価され、とくにヒスタミンや偽アレルゲンを制限する食事で短期的にアウトカムが改善する傾向がみられました。CIU と BMI 高値の関連、また CIU の方で一般集団よりビタミン D が高くビタミン B12 が低いという報告もありました。",
           "現在の文献は少数例・短い介入期間・免疫学的検討の不足という限界がありますが、地域や食文化を越えて患者報告での改善が一貫していることは、食事が CIU 管理の補助的な手段になりうる可能性を示すと述べられています。今後はより大きな例数・男女比の均衡・長期の試験・個人レベルの交絡の調整が必要としています。"],
      use:"慢性の蕁麻疹で食事を気にされている方に、除去食はあくまで補助的な位置づけで、短期間の小規模な研究にとどまるエビデンスであるとご説明する材料になります。" },
    { cat:"A", pmid:"42813195", journal:"Skin Health Dis", year:2026, type:"システマティックレビュー",
      tj:"痤瘡治療のアドヒアランス：大規模研究では 50〜65%、若い方で低い",
      te:"Treatment adherence in acne vulgaris: systematic review and narrative synthesis.",
      sum:["痤瘡（ニキビ）は頻度が高く生活の質への影響も大きい一方、治療を続けにくいこと（アドヒアランス不良）が治療成功の障壁になります。内服・外用の痤瘡治療のアドヒアランスの頻度、関連する因子、続けられない理由を検討したシステマティックレビューです。MEDLINE・PubMed・Embase・PsycINFO・CINAHL を開始時点から 2025 年 3 月 24 日まで言語制限なしで検索し、観察研究の結果を叙述的に統合しています。",
           "26 編が該当し、南北アメリカ・欧州・アジアの研究が含まれました。13 編は量的記述研究（調査参加者 8,111 名と電子診療録を用いた 2 研究）、13 編・12 研究・37,884 名は横断研究やコホート研究などでした。評価方法は自己申告 21 件、処方データによる服薬所持率 3 件、薬剤の再受け取り 3 件などとばらつきがありました。アドヒアランスの頻度の推定は 6% から 84% と幅があり、規模の大きい研究では 50〜65% でした。アドヒアランスは若い方で低く、男女差や外用・内服の差については一貫した所見が得られませんでした。続けられない理由には費用、副作用、効果が感じられないこと、症状が治まったことが挙げられました。",
           "痤瘡治療のアドヒアランス向上はとくに若い方で優先すべき課題であり、副作用への対処と効果が出るまでの期間に働きかける介入が有用かもしれないと述べられています。"],
      use:"ニキビの治療を始める方に、効果が出るまでの期間と副作用が出たときの対処を最初にお伝えして、途中でやめずに続けていただくための説明材料になります。" },
    { cat:"A", pmid:"42812759", journal:"Clin Cosmet Investig Dermatol", year:2026, type:"総説",
      tj:"ロサセアへの外用カルシニューリン阻害薬：エビデンスは限定的、ロサセア様皮膚炎の報告も",
      te:"Topical Calcineurin Inhibitors in Rosacea: Potential Benefit in Selected Clinical Settings and Risk of Rosaceiform Dermatitis.",
      sum:["ロサセアは、顔面中央を中心に持続する紅斑・ほてり・紅色丘疹・膿疱・毛細血管拡張を示す慢性の炎症性皮膚疾患です。タクロリムスとピメクロリムスなどの外用カルシニューリン阻害薬はアトピー性皮膚炎に承認されている一方、ロサセアやその他の顔面の炎症性皮膚疾患に適応外で使われてきたという背景から、その有益性と有害事象の臨床的エビデンスを整理した総説です。",
           "ロサセアに対する外用カルシニューリン阻害薬のエビデンスは限られており一貫していないと整理されています。少数の非対照研究ではとくにピメクロリムスで臨床的な改善が報告されている一方、タクロリムス・ピメクロリムスのいずれでも治療中にロサセア様皮膚炎が報告され、デモデックス（顔ダニ）の密度が増加した症例も含まれます。両薬剤は異なる臨床状況で検討されており、入手可能なエビデンスは両者を互換的に扱うことを支持しないとしています。現行のガイドラインや合意声明は、原発性のロサセアに対する使用について一致した推奨を示していません。",
           "これらの報告は、原発性のロサセアと、ステロイドによるロサセア様皮膚炎や外用療法に伴うその他のロサセア様の皮疹とを区別する必要性を示すと述べられています。選択された臨床状況では役割がありうるとしています。"],
      use:"顔の赤みにタクロリムス外用をご希望の方に、かえってロサセア様の皮膚炎が出ることがあるとお伝えし、これまでのステロイド外用による皮疹との区別を確認する材料になります。" },
    { cat:"A", pmid:"42806636", journal:"J Cutan Med Surg", year:2026, type:"システマティックレビュー",
      tj:"乾癬の生物学的製剤の減量：安定した寛解後に 50〜90% でコントロール維持",
      te:"Real-World Strategies for Biologic Dose Escalation and Reduction in Psoriasis and Psoriatic Arthritis: A Systematic Review.",
      sum:["生物学的製剤は中等症から重症の乾癬と乾癬性関節炎の治療を大きく改善しましたが、実地診療では効果不十分への対応、長期のコントロール維持、安全性や費用の管理のために標準的な用法から外れた投与が行われることがあります。増量と減量の頻度・理由・結果のデータは断片的であるという背景から、実臨床のエビデンスを定義・臨床基準・成功率に注目して整理したシステマティックレビューです。PubMed・Scopus・Embase・Cochrane Library を 2005 年 1 月 1 日から 2024 年 12 月 31 日まで検索し、TNF 阻害薬、インターロイキン 12/23 阻害薬、インターロイキン 17 阻害薬、インターロイキン 23 阻害薬を受けた成人で適応外の用量変更が報告された研究を対象としています。",
           "2,623 件から 63 研究が含まれました。用量調整の定義は臨床基準や時期の基準によってさまざまでした。増量は控えめかつ速やかに行われたときに最も成功しており、減量は安定した寛解の後に多く行われ、50% から 90% の方で疾患コントロールが維持されていました。最も多く用量調整されていた薬剤はアダリムマブで、インターロイキン 17 阻害薬とインターロイキン 23 阻害薬も柔軟性を示しました。定義とアウトカム報告が一貫していないため研究間の比較には限界がありました。",
           "用量調整は広く行われているものの定義が一貫しておらず、標準化された定義と臨床的な指針が必要であると述べられています。"],
      use:"乾癬で生物学的製剤が安定している方から間隔をあけられないかとご相談を受けたときに、実地診療での減量報告の状況をご説明する材料になります。",
      note:"適応外の用量変更に関する実地診療の報告をまとめた総説で、減量を推奨するものではありません。" },
    { cat:"A", pmid:"42806931", journal:"J Dermatolog Treat", year:2026, type:"薬事データベース解析（FAERS）",
      tj:"乾癬の全身療法と感染症報告：IL-17 阻害薬でカンジダのシグナル（ROR 8.67）",
      te:"Mechanism-based reporting patterns of infection-related adverse events with systemic psoriasis therapies in FAERS.",
      sum:["感染症に関連する有害事象は乾癬治療において重要な安全性の課題です。作用機序別の治療群で感染症関連の有害事象報告を比較するため、米国食品医薬品局の有害事象報告システム（FAERS）の乾癬を適応とする報告を 2014 年第 3 四半期から 2025 年第 3 四半期まで解析した研究です。16 の治療を TNF 阻害薬、インターロイキン 12/23 阻害薬、インターロイキン 17 阻害薬、インターロイキン 23 阻害薬、免疫抑制性の非生物学的製剤、非免疫抑制性の非生物学的製剤に分類し、報告オッズ比（ROR）と情報成分の下限（IC025）を算出しています。",
           "357,728 件の報告のうち 67,827 件に感染症の用語が含まれていました。シグナルは免疫抑制性の非生物学的製剤（ROR 2.51、IC025 0.88）とインターロイキン 12/23 阻害（2.43、0.83）で最も強く、次にインターロイキン 17 阻害薬（1.82、0.47）でした。TNF 阻害薬のシグナルは軽度（1.17、0.11）で、インターロイキン 23 阻害薬はほぼ中立（0.99、−0.04）でした。適応との紐づけを条件にすると免疫抑制性の非生物学的製剤のシグナルは ROR 1.14（IC025 0.09）に減弱しましたが、インターロイキン 12/23 とインターロイキン 17 のシグナルは残りました。インターロイキン 17 阻害薬ではカンジダのシグナルがみられました（ROR 8.67、IC025 1.55）。",
           "報告に基づく推定値は作用機序によって異なり、曝露の帰属のさせ方が免疫抑制性の非生物学的製剤の結果に大きく影響したと述べられています。"],
      use:"インターロイキン 17 阻害薬を使っておられる方に、口の中や皮膚のカンジダの症状が出たら早めにお知らせくださいとお伝える材料になります。",
      note:"自発報告データベースの解析で、発生率や因果関係を示すものではありません。" },
    { cat:"A", pmid:"42808209", journal:"J Dermatolog Treat", year:2026, type:"総説（臨床枠組みの提案）",
      tj:"皮膚科の全身療法と精神面の副作用：高用量ステロイドでは約 20% に",
      te:"Should we be monitoring patients on systemic dermatologic therapies for psychiatric adverse effects?: a proposed clinical framework.",
      sum:["全身療法は自己免疫疾患・炎症性疾患・重症の皮膚科救急など多くの状態に有効な治療をもたらしましたが、精神面の有害事象が臨床管理を複雑にすることがあります。ステロイド、免疫抑制薬、ヤヌスキナーゼ（JAK）阻害薬、抗ヒスタミン薬、抗マラリア薬、ダプソン、イソトレチノイン、生物学的製剤について精神面の有害事象を文献レビューで整理し、そのスクリーニングとモニタリングの臨床的な枠組みを提案した総説です。",
           "精神面の有害事象は治療によって異なると整理されています。ステロイドは気分の障害・精神症状・せん妄と関連し、高用量投与を受けた方のおよそ 20% に精神症状が生じると述べられています。イソトレチノインはうつや自殺傾向との関連の可能性から議論が続いています。その他の全身療法もさまざまな神経精神症状を生じうると報告されていますが、頻度とエビデンスの強さは薬剤によって異なるとしています。",
           "精神面の有害事象は皮膚科の全身療法を用いるうえで重要な検討事項であり、こうした合併症を知っておくことと適切なスクリーニング・モニタリングが早期の認識と対応に不可欠であると述べられています。"],
      use:"ステロイド内服やイソトレチノインを開始する方に、気分の変化があればご家族からでもお知らせくださいと最初にお伝えする根拠になります。" },
    { cat:"A", pmid:"42808033", journal:"Clin Cosmet Investig Dermatol", year:2026, type:"疾病負荷解析（GBD 2023）",
      tj:"円形脱毛症：日本・韓国は中国と世界平均より発症率・有病率が高い",
      te:"Burden, Trends, Associated Diseases and Predictions of Alopecia Areata in China, Japan, South Korea, and Globally: A GBD 2023 Analysis.",
      sum:["円形脱毛症は瘢痕を残さない脱毛を生じ心理社会的な負担も大きい疾患ですが、東アジアでの推移・併存疾患・将来の負荷は十分に検討されていません。世界疾病負荷研究（GBD）2023 の 1990 年から 2023 年のデータを用い、世界・中国・日本・韓国について年齢標準化した発症率・有病率・障害調整生存年（DALY）率を地域・性別・年齢別に評価した研究です。推移は joinpoint 回帰で定量し、併存疾患や社会人口統計指数（SDI）との生態学的な相関を検討し、国連の人口推計を用いて 2046 年までの負荷を予測しています。",
           "2023 年時点で、日本と韓国は中国および世界平均より年齢標準化発症率・有病率が高かったと報告されています。負荷は女性でより大きく、発症は若年から中年の成人で最も高くなりました。1990 年から 2023 年に世界の年齢標準化率は低下しましたが、中国では横ばい、日本と韓国では高いまま持続しました。円形脱毛症はアトピー性皮膚炎、鉄欠乏性貧血、甲状腺疾患と相関し、SDI が高いことは日本・韓国・世界では発症率の低さと関連しましたが、中国では関連しませんでした。2046 年までかなりの症例数が予測されています。",
           "円形脱毛症の負荷は地域・性別・年齢によって異なり、今後も重要な公衆衛生上の課題であり続けると述べられています。病因は多因子と考えられ個人レベルの因果関係は未確認としつつ、東アジアの高リスク集団ではより注意深いスクリーニングときめ細かい予防が支持されるとしています。"],
      use:"円形脱毛症の方に、アトピー性皮膚炎・鉄欠乏性貧血・甲状腺疾患の併存を確認しておく必要性をご説明する材料になります。",
      note:"集団レベルの生態学的な相関で、個人の因果関係を示すものではありません。" },
    { cat:"A", pmid:"42812452", journal:"J Res Nurs", year:2026, type:"システマティックレビュー",
      tj:"おむつ皮膚炎への母乳の外用：5 研究 238 例、確実性は低〜非常に低い",
      te:"Topical maternal breast milk versus commercial topical products for diaper dermatitis in infants: a systematic review.",
      sum:["おむつ皮膚炎は乳児期に多く、不快感・繰り返す皮膚の破綻・二次感染を生じることがあります。母乳の外用は入手しやすく費用のかからない介入として提案されてきましたが、その有効性と看護の関与については明らかでないという背景から、PRISMA 2020 に沿って 6 つのデータベースを 2015 年 1 月から 2025 年 11 月まで検索し、乳児のおむつ皮膚炎の予防または治療に母乳の外用を評価した研究を統合したシステマティックレビューです。バイアスのリスクは RoB 2 と ROBINS-I で評価し、研究間の異質性のため叙述的に統合しています。",
           "乳児 238 名を含む 5 件の原著研究が適格基準を満たし、2 件が予防、3 件が治療を評価していました。予防の研究ではおむつ皮膚炎の発生または重症度の低下が示唆され、治療の研究では母乳の外用単独または酸化亜鉛との併用で紅斑の改善や回復の早さが報告されました。ただし方法論上の限界と異質性のため、エビデンスの確実性は低から非常に低にとどまりました。看護の役割として評価・保護者への教育・介入の実施・観察と評価が挙げられましたが、報告は一貫していませんでした。",
           "母乳の外用は軽症から中等症のおむつ皮膚炎の予防と治療において、費用のかからない補助的な手段としての可能性を示すと述べられています。一方で標準的なケアに置き換えたり日常的に採用したりすることを支持するエビデンスは不十分であり、標準化されたプロトコルによる質の高い試験が必要としています。"],
      use:"おむつ皮膚炎のお子さんのご家族から母乳を塗ってよいかとご相談を受けたときに、通常のケアの代わりにはならないとご説明する材料になります。" },
    { cat:"B", pmid:"42810461", journal:"J Ethnopharmacol", year:2026, type:"動物実験・in vitro",
      tj:"茯苓杏仁甘草湯：ラット心筋虚血再灌流障害でカルシウム過負荷と炎症を抑制",
      te:"Fuling Xingren Gancao Decoction ameliorates myocardial ischemia/reperfusion injury by attenuating calcium overload and modulating inflammatory signaling mediated by calcium/calmodulin-dependent protein kinase II delta.",
      sum:["茯苓杏仁甘草湯は金匱要略に由来する古典処方で、胸のつまりと痛みに伝統的に用いられ、中医学と日本の漢方の実践において虚血性心疾患に臨床応用されてきたと述べられています。心筋虚血再灌流障害に対する作用機序が明らかでないことから、その保護効果と分子機構を調べた研究です。液体クロマトグラフィー質量分析で成分を同定し、ラットの左前下行枝を可逆的に結紮した心筋虚血再灌流障害モデルと、H9c2 細胞の低酸素再酸素化モデルを用いています。",
           "茯苓杏仁甘草湯の前投与は心筋梗塞の範囲と心筋障害のバイオマーカー（心筋トロポニン I・心筋トロポニン T・乳酸脱水素酵素・クレアチンキナーゼ MB）を有意に低下させ、心筋の構造的な障害を軽減し心機能を改善しました。延長した QT 間隔と QRS 幅を短縮し、心筋の電気伝導を改善し、不整脈の生じやすさを低下させました。パッチクランプでは L 型カルシウム電流を濃度依存性に阻害し、半数阻害濃度は 0.026 mg/mL でした。また活性酸素種とマロンジアルデヒドを減らし、抗酸化酵素の活性を回復させ、炎症性因子の産生と心筋細胞のアポトーシスを抑制し、CaMKIIδ／NF-κB／NLRP3 経路を阻害しました。",
           "茯苓杏仁甘草湯はカルシウム過負荷の軽減と CaMKIIδ／NF-κB／NLRP3 シグナルの調節を介して心筋虚血再灌流障害に対する心保護効果を示す可能性があると述べられています。ただし薬理学的な検証は単一の標準化されたロットで行われており、ロット・収穫年・産地を越えた再現性の確認が必要としています。"],
      use:"漢方の古典処方が循環器領域でも基礎研究の対象になっていることをご紹介する話題になりますが、ヒトでの効果は未確認と添えてお伝えします。",
      note:"動物実験・細胞実験のみで、皮膚科領域外の内容です。ヒトでの有効性は確認されていません。" }
  ]
},
{
  date: "2026-09-30",

  items: [
    { cat:"A", pmid:"42806629", journal:"J Dermatol", year:2026, type:"第 3 相 RCT（二重盲検・プラセボ対照）",
      tj:"日本の伝染性軟属腫：カンタリジン 0.7% で 85 日目の完全消失 50.0%",
      te:"Investigation of the Efficacy and Safety of TO-208 in Patients 2 Years of Age or Older With Molluscum Contagiosum in Japan: A Randomized, Double-Blind, Placebo-Controlled, Phase 3 Study (208-3-1) and Its Open-Label Extension.",
      sum:["伝染性軟属腫（みずいぼ）は小児に多いウイルス性の皮膚感染症です。海外の第 3 相試験（CAMP-1・CAMP-2）で外用の水疱形成薬であるカンタリジン 0.7% の薬剤・機器の組み合わせがプラセボより有意に高い完全消失を示したことを受け、日本の患者さんで TO-208（カンタリジン 0.7% w/v）の有効性と安全性をプラセボと比較した第 3 相二重盲検試験とその非盲検継続試験です。2 歳以上でベースラインに 5 個以上の病変がある方を 1 対 1 で割り付け、21 日ごとに最大 4 回塗布し、主要評価項目は 85 日目の完全消失（ベースラインの病変と新生病変の両方）の割合としています。",
           "TO-208 群 148 例、プラセボ群 155 例が投与を受けました。85 日目に完全消失を達成した方の割合は 50.0% 対 23.2%（p < 0.001）でした。病変数のベースラインからの変化率は −88.35% 対 −44.57%（p < 0.001）でした。TO-208 群で多く報告された有害事象は、塗布部位の軽度または中等度の水疱、そう痒、疼痛、紅斑でした。",
           "TO-208 はプラセボより有意に高い完全消失を示し、有害事象は主に軽度から中等度で塗布部位に限られ、概ね忍容性は良好であったと述べられています。"],
      use:"みずいぼのお子さんのご家族に、ピンセットで摘除する以外の外用の選択肢が国内でも検討されている段階であることをご説明する材料になります。" },
    { cat:"A", pmid:"42808463", journal:"Clin Transl Allergy", year:2026, type:"前向きコホート（レジストリ）",
      tj:"デュピルマブ 2 年以上：眼表面の所見は 90.9%、悪化は 22.7% に",
      te:"Long-Term Ocular Outcomes of Dupilumab in Atopic Dermatitis: Results From the BioDay Registry.",
      sum:["デュピルマブに関連する眼表面疾患（DAOSD）はアトピー性皮膚炎でデュピルマブを使う方に最も多く報告される副作用であることを背景に、長期投与が眼表面疾患・結膜の杯細胞・涙液中のデュピルマブ濃度と蛋白に及ぼす影響を調べた前向き研究です。オランダ・ユトレヒト大学医療センターの中等症から重症のアトピー性皮膚炎の方のうち、2020 年 2 月から 2022 年 10 月にデュピルマブを開始した方を対象に、皮膚科の定期受診に合わせてベースライン・28 週・最終観察（2 年以上）に眼科診察を行い、UTOPIA スコアで重症度を評価し、ベースラインから 3 点以上の上昇を DAOSD と定義しました。杯細胞の量と機能は圧痕細胞診で評価しています。",
           "44 例が組み入れられました。眼表面疾患は全ての受診時点で 90.9%（40/44）に認められ、DAOSD は 22.7%（10/44）に生じ、そのうち 40.0%（4/10）は最終観察時に持続または新たに発症していました。涙液層破壊時間は短縮し、涙液の分泌は増加しました。涙液中のデュピルマブ濃度とアトピー性皮膚炎に関連する炎症蛋白は経時的に低下し、結膜の杯細胞はベースラインと比べ最終観察時に減少しました。CK19-CD45-MUC5AC 陽性細胞での MUC5AC の産生は 28 週で低下し、その後は横ばいでした。",
           "長期のデュピルマブ治療中も眼表面疾患は多くみられ、遅発性のものを含め悪化する方がいることから、眼の副作用への継続的な注意が必要であると述べられています。MUC5AC 産生の低下と炎症蛋白の減少は、結膜の恒常性と眼の炎症の変化を示唆するとしています。"],
      use:"デュピルマブを長く続けておられる方に、目の乾きや充血は後から出ることもあるので気づいたらお知らせくださいとお伝えする根拠になります。" },
    { cat:"A", pmid:"42806983", journal:"Front Med (Lausanne)", year:2026, type:"後方視（実地診療）",
      tj:"CKD ステージ 3〜5 のアトピー性皮膚炎 29 例：24 週で EASI-50 が 100%",
      te:"Efficacy and safety of dupilumab in moderate-to-severe atopic dermatitis with stage 3-5 chronic kidney disease: a retrospective real-world study.",
      sum:["ステージ 3 から 5 の慢性腎臓病（CKD）を合併した中等症から重症のアトピー性皮膚炎の方におけるデュピルマブの有効性と安全性を評価した後方視研究です。12 週と 24 週の経過観察を終えた 29 例を対象に、EASI、そう痒の数値評価スケール（NRS）、睡眠 NRS、DLQI、臨床虚弱スケール（CFS）、好酸球、インターロイキン 10（IL-10）、制御性 T 細胞の割合、腎機能（推算糸球体濾過量・血清クレアチニン・尿蛋白クレアチニン比）と有害事象を評価しています。",
           "12 週時点で EASI は 34.94 ± 7.96 から 19.31 ± 6.09 へ 44.7% 低下し、76.0% が EASI-50 を達成しました。そう痒 NRS は 7.72 ± 1.75 から 3.72 ± 1.75 へ 51.8% 低下し、88.0% が 4 点以上の改善を得ました。DLQI は 52.1% 改善し、100% が 4 点以上改善、CFS は 17.5% 低下しました。好酸球数は 25.0% 減少し、IL-10 と制御性 T 細胞の割合はそれぞれ 49.9%、50.8% 増加しました。24 週時点の EASI-50・EASI-75・EASI-90 の達成率は 100%・76.9%・7.7% で、そう痒 NRS と DLQI はいずれも 100% が 4 点以上改善しました。腎機能は 24 週を通じて安定しており、推算糸球体濾過量は 37.93 ± 14.88 から 36.39 ± 14.77 mL/min/1.73 m2（P = 0.073）で、血清クレアチニンと尿蛋白クレアチニン比にも有意な変化はありませんでした。有害事象は軽度から中等度の注射部位反応と結膜炎の 2 件のみで、いずれも対症療法で軽快し、中止や死亡、腎機能の悪化はありませんでした。",
           "ステージ 3 から 5 の CKD を伴う中等症から重症のアトピー性皮膚炎の方で、デュピルマブは皮疹・そう痒・睡眠・生活の質・虚弱を改善し、安全性の面でも良好であったとしています。腎機能障害だけを絶対的な禁忌と考えるべきではないが、進行した CKD の方には慎重な経過観察が必要と述べられています。"],
      use:"腎臓の働きが低下しているためにデュピルマブをためらっておられる方に、慎重な経過観察を前提とした選択肢になりうるとご説明する材料になります。",
      note:"29 例の後方視研究で、対照群はありません。" },
    { cat:"A", pmid:"42804788", journal:"Skin Therapy Lett", year:2026, type:"総説",
      tj:"慢性手湿疹にデルゴシチニブ 2% クリーム：非ステロイドの外用 JAK 阻害薬",
      te:"Delgocitinib Cream for Chronic Hand Dermatitis: Efficacy, Safety and Clinical Application.",
      sum:["慢性手湿疹（慢性手指湿疹）は、紅斑・亀裂・鱗屑・苔癬化に加え、強いそう痒と痛みを伴う持続性の炎症性皮膚疾患です。手は摩擦・洗剤・刺激物・環境ストレスに絶えずさらされるため負担が大きく、従来のステロイド外用薬・カルシニューリン阻害薬・光線療法・全身性免疫調整薬は、安全性の懸念・効果の不十分さ・長期の忍容性の面で限界があるという背景から、病態と臨床エビデンスを整理した総説です。",
           "デルゴシチニブ 2% クリームは非ステロイド性の外用汎ヤヌスキナーゼ（JAK）阻害薬で、成人の中等症から重症の慢性手湿疹に対して承認された最初の標的治療とされています。JAK1・JAK2・JAK3 とチロシンキナーゼ 2 を阻害し、手湿疹の病態に関わる複数のサイトカイン経路を広く抑制します。臨床試験では医師による全般評価、手湿疹重症度指数、そう痒、痛み、生活の質の有意な改善が示され、長期継続試験でも効果が持続しました。安全性については全身への吸収が少なく、ステロイドに伴う皮膚萎縮がなく、枠組み警告のない良好な忍容性が報告されています。",
           "ステロイドを減らせる有効な治療選択肢として、デルゴシチニブを支持する臨床エビデンスが整理されたと述べられています。"],
      use:"水仕事や医療のお仕事で手湿疹が治りにくく、ステロイド外用を続けることが心配な方に、非ステロイドの外用という選択肢をご説明する材料になります。",
      note:"総説です。個々の試験の具体的な数値は抄録に記載がありません。" },
    { cat:"A", pmid:"42806327", journal:"BMC Nephrol", year:2026, type:"系統的レビュー・メタ解析",
      tj:"維持血液透析のかゆみは 60.0%：血清リンが最も一貫した関連因子",
      te:"Prevalence and associated factors of chronic kidney disease-associated pruritus in maintenance hemodialysis patients: a systematic review and meta-analysis.",
      sum:["慢性腎臓病に伴うそう痒（CKD-aP）は維持血液透析を受ける方によくみられ負担の大きい合併症ですが、報告される有病率や関連因子が研究間で一致していません。PRISMA 2020 に従い 8 つの電子データベースを 2026 年 3 月 11 日まで検索し、成人の維持血液透析患者のそう痒の有病率や関連因子を報告した観察研究を対象としました。関連因子の解析には多変量で調整されたオッズ比のみを用い、連続変数と二分変数の推定は別々に解析し、可能な範囲で質の高い研究に限った感度分析も行っています。",
           "25 研究・8,955 名が組み入れられました。何らかのそう痒の統合有病率は 60.0%（95% 信頼区間 57.0〜63.0%）でした。血清リンは連続変数（オッズ比 2.03、95% 信頼区間 1.44〜2.87）でも二分変数（オッズ比 2.93、95% 信頼区間 1.83〜4.69）でもそう痒と正の関連を示しましたが、連続変数の解析では異質性が大きく残りました。PTH/iPTH、CRP、β2 ミクログロブリン、透析歴、年齢の関連は、変数の定義や研究の質によって結果が変わりました。糖尿病はそう痒のオッズが高いことと関連し（オッズ比 2.64、95% 信頼区間 1.69〜4.14）、ハイフラックス透析は逆の関連を示しました（オッズ比 0.31、95% 信頼区間 0.17〜0.56）。リンを連続変数とした研究の探索的メタ回帰では地域差が示唆され（P = 0.002）、アジアの研究で関連が強い傾向でしたが、非アジアの研究は 2 件のみでした。",
           "維持血液透析を受ける方のおよそ 60% がそう痒を経験し、血清リンが最も一貫した関連を示す一方、他の因子の推定は定義・方法の質・研究間の異質性によって変わると述べられています。地域差の所見は仮説を生む段階のものとされています。"],
      use:"透析を受けておられる方のかゆみのご相談で、採血のリンの値や糖尿病の有無もあわせて確認する材料になります。" },
    { cat:"A", pmid:"42807012", journal:"Front Endocrinol (Lausanne)", year:2026, type:"後方視コホート",
      tj:"重症ざ瘡の治療後の再発 25.9%：8 因子の統合モデルで AUC 0.824",
      te:"Association of baseline peripheral sex hormone profiles and metabolic parameters with recurrence after oral isotretinoin treatment in patients with severe acne.",
      sum:["経口イソトレチノインの後のざ瘡の再発は依然として多いものの、臨床・治療・ホルモン・代謝に関わる要因は十分に定義されていません。2021 年 4 月から 2025 年 4 月に経口イソトレチノインによる治療を受けた重症ざ瘡の 351 例（男性 185 例・女性 166 例）を、中止後の経過により再発群と非再発群に分けた後方視コホート研究です。背景、ざ瘡に関する臨床像、治療に関する変数、末梢の性ホルモンプロファイル、代謝指標を収集し、単変量および多変量ロジスティック回帰で再発に関連する因子を検討し、統合予測モデルを ROC 曲線・較正・ブートストラップによる内部検証で評価しています。",
           "追跡期間の中央値 20.0 か月の間に 91 例が再発し、全体の再発率は 25.9% でした。多変量解析では、罹病期間が長いこと、イソトレチノインの累積投与量が少ないこと、遊離アンドロゲン指数が高いこと、デヒドロエピアンドロステロン硫酸抱合体が高いこと、性ホルモン結合グロブリンが低いこと、HOMA-IR が高いこと、中性脂肪が高いこと、HDL コレステロールが低いことが、それぞれ独立して再発と関連していました。個々のホルモンや代謝の指標の識別能は限定的でしたが、これらを統合したモデルは曲線下面積 0.824、感度 76.9%、特異度 76.2% を示し、ブートストラップ内部検証後の補正済み曲線下面積は 0.812 でした。",
           "個々の指標の識別能は限られ、罹病期間・累積投与量・遊離アンドロゲン指数・DHEA-S・性ホルモン結合グロブリン・HOMA-IR・中性脂肪・HDL コレステロールを統合したモデルの方が良好でしたが、累積投与量は治療中にしか分からないため、探索的な動的リスク層別化の道具と位置づけるべきで、日常診療での使用の前に外部の前向き検証と明確な管理の流れが必要と述べられています。"],
      use:"ざ瘡の治療後の再発を心配される方に、インスリン抵抗性や脂質など生活習慣に関わる数値も再発と関連しうることをお話しする材料になります。",
      note:"海外の後方視研究です。経口イソトレチノインは国内では承認されていません。" },
    { cat:"A", pmid:"42806636", journal:"J Cutan Med Surg", year:2026, type:"系統的レビュー",
      tj:"乾癬の生物学的製剤：減量後も 50〜90% でコントロールを維持",
      te:"Real-World Strategies for Biologic Dose Escalation and Reduction in Psoriasis and Psoriatic Arthritis: A Systematic Review.",
      sum:["生物学的製剤は中等症から重症の乾癬と乾癬性関節炎の治療を大きく改善しましたが、実地診療では効果が不十分なとき、長期のコントロールを保ちたいとき、安全性や費用に配慮するときに、標準の用法から外れた投与がしばしば行われます。増量と減量の頻度・理由・成績のデータは断片的であることから、定義・臨床基準・成功率に焦点を当てて実地のエビデンスを系統的にレビューしました。PubMed・Scopus・Embase・Cochrane Library を 2005 年 1 月 1 日から 2024 年 12 月 31 日まで検索し、TNF 阻害薬、IL-12/IL-23 阻害薬、IL-17 阻害薬、IL-23 阻害薬を受けた成人で適応外の用量変更を報告した研究を対象としています。",
           "2,623 件から 63 研究が選ばれました。用量調整の定義は臨床的な基準や時期の基準がさまざまでした。増量は適度な幅で速やかに行ったときに最も成功しやすく、減量は安定した寛解の後に行われることが多く、50% から 90% の方で疾患のコントロールが維持されました。最も多く用量が調整されていたのはアダリムマブで、IL-17 阻害薬と IL-23 阻害薬も調整の柔軟性を示しました。定義とアウトカムの報告が一定でないため、研究間の比較には限界がありました。",
           "用量の調整は広く行われているものの定義が一定でなく、標準化された定義と臨床的な指針が必要であると述べられています。"],
      use:"乾癬が落ち着いた方から注射の間隔を空けられないかとご相談を受けたときに、専門施設での減量の実際をご説明する材料になります。" },
    { cat:"A", pmid:"42807181", journal:"Cureus", year:2026, type:"スコーピングレビュー",
      tj:"慢性特発性蕁麻疹と食事：8 研究で低ヒスタミン食などが短期的に改善",
      te:"The Role of Diet in the Management of Chronic Idiopathic Urticaria: A Scoping Review.",
      sum:["慢性特発性蕁麻疹は、はっきりした誘因がないまま 6 週間を超えて膨疹や血管性浮腫、あるいはその両方を繰り返す皮膚疾患で、皮膚での肥満細胞の自発的な活性化と炎症性メディエーターの放出によって生じます。病態の理解が十分でなく、罹患による負担が大きく、治療にも限界があることから食事との関連が指摘されており、2015 年から 2025 年に発表された文献を、食事介入・患者報告アウトカム・知識の空白に重点を置いて評価した PRISMA 準拠のスコーピングレビューです。EMBASE・OVID Medline・Web of Science を検索しています。",
           "最初の検索で 121 件が同定され、適格基準を満たした 9 件のうち批判的吟味を経た 8 件が採用されました。地中海食、低偽アレルゲン食、偽アレルゲン除去食、ヒスタミン除去かつ低偽アレルゲンの食事、低ヒスタミン食、さらに微量栄養素と炎症マーカーが検討されていました。介入期間は 7 日から 39 日あまりでした。蕁麻疹活動性スコア、蕁麻疹コントロールテスト、慢性蕁麻疹の生活の質スコアで評価され、特にヒスタミンや偽アレルゲンの摂取を制限する食事で、短期的に改善する傾向がみられました。あわせて、慢性特発性蕁麻疹と高い BMI の関連が示され、1 つの研究では一般集団と比べてビタミン D が高くビタミン B12 が低いと報告されていました。",
           "現在の文献は症例数が少なく、介入期間が短く、免疫学的な検討も限られていますが、地域や食文化が異なっても患者さんの報告する改善が一貫していることから、食事は慢性特発性蕁麻疹の管理の補助的な方法となりうると述べられています。今後はより大規模で長期の試験が必要とされています。"],
      use:"慢性蕁麻疹の方から食事について尋ねられたときに、補助的な位置づけで短期の小規模な研究が中心である現状をお伝えする材料になります。" },
    { cat:"A", pmid:"42805319", journal:"Clin Dermatol", year:2026, type:"ナラティブレビュー",
      tj:"飲みものと皮膚：アルコールの関連が最も一貫、甘い飲料と牛乳はざ瘡と",
      te:"Dietary Beverages and Cutaneous Health: Mechanisms, Clinical Evidence, and Practical Implications for Dermatologists.",
      sum:["飲みものの摂取は、皮膚の健康に関わりうる身近で変えられる生活習慣です。よく飲まれる飲料と皮膚科領域のアウトカムについて、臨床とメカニズムのエビデンスを統合したナラティブレビューです。PubMed/MEDLINE の的を絞った検索に皮膚科・栄養学の情報源のスクリーニングを加え、ランダム化試験・前向きコホート・系統的レビュー・メタ解析・メンデルランダム化研究を優先して整理しています。",
           "アルコールは、酒さの誘発、乾癬、蕁麻疹、皮膚がんのリスクなど、皮膚への有害な関連が最も一貫して報告されていましたが、因果を示すエビデンスは一様ではありませんでした。加糖飲料と牛乳は観察研究でざ瘡と関連しますが、現行のざ瘡のガイドラインは正式な食事の推奨を行っていません。コーヒーは皮膚の老化とメラノーマについて観察研究とメンデルランダム化の所見が一致していません。緑茶はざ瘡のランダム化試験で主に外用の抽出物で効果が示され、経口では限定的で、抹茶は主にメカニズムからの外挿にとどまります。スペアミント茶は多嚢胞性卵巣症候群の女性の遊離テストステロンを下げますが、客観的な臨床的有益性は証明されていません。カモミール、ルイボス、ハイビスカス、エナジードリンク、コンブチャ、植物性ミルクのエビデンスは限られるか間接的です。柑橘を含むカクテルとセントジョーンズワートは、臨床的に問題となる光線過敏を起こしうるとされています。",
           "飲料と皮膚の関連はエビデンスの強さも因果性も大きく異なります。飲みものの聞き取りは、標準的な皮膚科治療に加える低リスクの補助として個別の生活指導を支えうる一方、観察研究や抽出物・サプリメントに由来する所見を、実際に飲まれている飲料の効果として過大に述べないことが重要と述べられています。"],
      use:"生活指導アシスタントの食事・生活のご案内で、お酒や甘い飲みものについてお話しするときの裏づけになります。" },
    { cat:"A", pmid:"42808033", journal:"Clin Cosmet Investig Dermatol", year:2026, type:"疫学（GBD 2023 解析）",
      tj:"円形脱毛症：日本・韓国は世界平均より高く、2046 年まで高止まりの予測",
      te:"Burden, Trends, Associated Diseases and Predictions of Alopecia Areata in China, Japan, South Korea, and Globally: A GBD 2023 Analysis.",
      sum:["円形脱毛症は瘢痕を残さない脱毛を来し、心理社会的な負担が大きい疾患ですが、東アジアでの推移・併存疾患・将来の負担は十分に検討されていません。世界疾病負担（GBD）研究 2023 の 1990 年から 2023 年のデータを用いて、世界・中国・日本・韓国について、年齢標準化した発生率・有病率・障害調整生存年（DALY）率を地域・性・年齢別に評価し、ジョインポイント回帰で経時的な推移を定量化し、併存疾患や社会人口統計指数（SDI）との生態学的な相関を検討し、国連の人口推計を用いて 2046 年までの負担を予測しています。",
           "2023 年の時点で、日本と韓国は中国および世界平均より年齢標準化発生率と有病率が高いという結果でした。負担は女性でより大きく、発生のピークは若年から中年の成人にありました。世界の年齢標準化率は 1990 年から 2023 年にかけて低下した一方、中国では横ばい、日本と韓国では高いまま推移しました。円形脱毛症はアトピー性皮膚炎、鉄欠乏性貧血、甲状腺疾患と相関していました。高い SDI は日本・韓国・世界では発生率の低さと関連しましたが、中国では関連しませんでした。2046 年までに相当数の症例が生じると予測されています。",
           "円形脱毛症の負担は地域・性・年齢によって異なり、今後も大きな公衆衛生上の課題であり続けると述べられています。病因は多因子と考えられ個人レベルでの因果は今後の確認が必要としながらも、東アジアの高リスクの集団では、より注意深いスクリーニングと個別化した予防が支持されるとしています。"],
      use:"円形脱毛症で受診された方に、アトピー性皮膚炎・貧血・甲状腺の確認をあわせてご提案する材料になります。",
      note:"集団単位の生態学的な相関で、個人レベルの因果は示されていません。" },
    { cat:"C", pmid:"42808530", journal:"Mol Pain", year:2026, type:"動物実験・細胞実験",
      tj:"電気鍼は AMPK とオートファジーを介して炎症部の iNOS・IL-1β を抑制",
      te:"Electroacupuncture alleviates inflammatory pain through AMPK-autophagy signaling and suppression of iNOS and IL-1β in inflamed tissues.",
      sum:["電気鍼は炎症性の痛みを和らげますが、その仕組みは十分に解明されていません。AMP 活性化プロテインキナーゼ（AMPK）とオートファジーが炎症の調節に関わることを示す報告が増えていることから、電気鍼がマクロファージの AMPK を活性化してオートファジーを引き起こし、炎症を起こした組織で炎症性メディエーター（iNOS と IL-1β）を抑えるという仮説を検証した研究です。完全フロイントアジュバント（CFA）で炎症性疼痛を起こしたマウスで痛み行動と炎症マーカーを評価し、AMPK 阻害薬 Compound C、AMPK 活性化薬 AICAR、オートファジー阻害薬 3-メチルアデニンを用いて経路を解析し、オートファジーのレポーターを導入した NR8383 マクロファージによる培養実験も行っています。",
           "電気鍼は CFA による痛覚過敏を軽減するとともに、AMPK のリン酸化を高め、オートファジーの流れを促進し、損傷した皮膚での iNOS と IL-1β を低下させました。AICAR 単独でも鎮痛作用、オートファジーの増加、サイトカイン発現の低下がみられました。一方 Compound C は電気鍼のオートファジーと炎症マーカーへの作用を阻害し、3-メチルアデニンは電気鍼の鎮痛作用と抗炎症作用を打ち消しました。マクロファージの実験でも、AMPK の活性化がオートファジーを促し、続いて iNOS と IL-1β が抑えられることが確認されました。",
           "電気鍼がマクロファージの AMPK を介してオートファジーを高め、iNOS と IL-1β の産生を抑えることで炎症性の痛みを和らげるという機序が示され、AMPK とオートファジーが疼痛管理の治療標的となりうると述べられています。"],
      use:"鍼がなぜ痛みや炎症をやわらげるのかをお尋ねになった方への説明の材料になりますが、ヒトでの効果は未確認と添えてお話しします。",
      note:"マウスと培養細胞の実験です。皮膚疾患そのものを対象とした研究ではありません。" }
  ]
},

  date: "2026-09-29",

  items: [
    { cat:"A", pmid:"42802511", journal:"Contact Dermatitis", year:2026, type:"後方視（27 年・単施設）",
      tj:"ゴム添加剤による職業性接触皮膚炎 80 例：チウラム 74%、手袋が 88%",
      te:"Occupational Allergic Contact Dermatitis due to Rubber Additives in Tunisia: A 27-Year Retrospective Study of Clinical and Occupational Characteristics.",
      sum:["ゴム添加剤は職業性アレルギー性接触皮膚炎の原因として確立していますが北アフリカからの報告が乏しいことを背景に、チュニジアの三次紹介施設で 1998 年から 2025 年にゴム添加剤による職業性アレルギー性接触皮膚炎と診断された成人全例を対象とした後方視研究です。ヨーロッパ標準シリーズでパッチテストを行い、必要に応じてゴムのシリーズを追加し、臨床・職業・アレルギー学的なデータを解析しています。",
           "80 例が組み入れられました。最も多い感作物質はチウラム 74%、次いでベンゾチアゾール誘導体 24%、パラフェニレンジアミン誘導体 14% でした。職種は医療分野が 51% と最も多く、曝露源は手袋が 88% を占めました。複数のゴム添加剤の系統に感作されていた方が 19% いました。補正後は MOAHLFA 指数との有意な関連は認められず、経年的な有意な傾向もありませんでした。全例で職場の調整が必要となり、92% が職業病としての補償の基準を満たしました。",
           "ゴム添加剤による職業性アレルギー性接触皮膚炎は依然として多く、職業上の影響が大きいことから、予防策の必要性が強調されると結論されています。"],
      use:"手袋を使うお仕事の方の手湿疹が治りにくいときに、ゴム添加剤へのかぶれを疑ってパッチテストをご提案する根拠になります。" },
    { cat:"A", pmid:"42802530", journal:"J Dermatol", year:2026, type:"診療ガイドライン",
      tj:"日本皮膚科学会：糖尿病性皮膚潰瘍・壊疽 診療ガイドライン第 3 版",
      te:"Wound/Pressure Ulcer/Burn Guidelines (2023)-3 Guidelines for the Diagnosis and Treatment of Diabetic Skin Ulcer/Gangrene (3rd Edition).",
      sum:["日本皮膚科学会の創傷・褥瘡・熱傷ガイドライン策定委員会が作成した、糖尿病性足潰瘍・壊疽の診断と治療に関するガイドラインの全面改訂第 3 版です。GRADE の手法を用い、系統的かつ透明性のある手順で作成されています。",
           "メタ解析を行った 3 つのクリニカルクエスチョン、すなわち骨髄炎に対する画像検査、局所陰圧閉鎖療法、多血小板血漿療法は、いずれも糖尿病性足潰瘍・壊疽の診断と治療において弱い推奨とされました。あわせて、診断・予防・評価と、標準的ではない治療についての一般的な情報も示されています。",
           "日本の実情に沿った糖尿病性足潰瘍・壊疽の診療の指針として利用できると述べられています。"],
      use:"糖尿病をお持ちの方の足の傷を診るときに、日本のガイドラインに沿って評価と紹介のタイミングを判断する材料になります。" },
    { cat:"A", pmid:"42803744", journal:"Acta Derm Venereol", year:2026, type:"エビデンス統合（系統的レビュー）",
      tj:"SJS/TEN の創傷管理：14 文献から 7 領域・28 のベストエビデンス",
      te:"Summary of Best Evidence for Wound Management in Stevens-Johnson Syndrome and Toxic Epidermal Necrolysis.",
      sum:["スティーブンス・ジョンソン症候群（SJS）と中毒性表皮壊死症（TEN）は、広い範囲の表皮剥離と全身の合併症を伴う、まれですが生命に関わる皮膚粘膜の反応です。創傷管理が生存と長期の予後の中心であるにもかかわらず標準化された診療の流れが定まっていないことから、最良のエビデンスを系統的に統合した研究です。2010 年 1 月から 2025 年 5 月までの主要な国際・中国のデータベースと公的なサイトを検索し、臨床判断・ガイドライン・専門家のコンセンサス・系統的レビュー・エビデンスサマリーを収集し、2 名が独立に選定・評価したうえで JBI のグレーディングで整理しています。",
           "質の高い 14 文献が選定基準を満たし、創傷の評価、保存的管理、外科的なアプローチ、被覆材の選択、疼痛管理、感染の予防と監視、入院環境という 7 領域にわたって 28 のベストエビデンスが得られました。このうち 11 が強い推奨、17 が弱い推奨と評価されています。",
           "この統合は SJS/TEN の創傷管理の実践的な指針となり、標準化されたケアの手順づくりを支えて、上皮の回復を促し合併症を減らし生活の質を改善することにつながると述べられています。"],
      use:"薬疹が重くなり SJS・TEN が疑われる方を高次施設へお送りするときに、そこでどのような創傷の管理が行われるかをご説明する材料になります。" },
    { cat:"A", pmid:"42800553", journal:"Ann Hepatol", year:2026, type:"第 2 相 RCT",
      tj:"胆汁うっ滞性のかゆみへの EP547：61 例の第 2 相で有効性は示されず",
      te:"EP547 (MRGPRX4 inverse agonist) for cholestatic pruritus due to primary biliary cholangitis or primary sclerosing cholangitis: Results from the phase 2 randomized, placebo-controlled PACIFIC study.",
      sum:["胆汁酸によって活性化される受容体 MRGPRX4 が胆汁うっ滞性のかゆみに関与すると考えられていることから、その逆作動薬である EP547 を、原発性胆汁性胆管炎（PBC）または原発性硬化性胆管炎（PSC）で中等症から重症のかゆみがある方に検討した第 2 相のランダム化プラセボ対照試験です。1 日平均の最もつらいかゆみの数値評価スケール（WI-NRS）が 4 以上の方を 1 対 1 で 1 日 1 回経口 100 mg かプラセボに割り付け、6 週間の二重盲検期の後、全員が 6 週間の非盲検期で EP547 の投与を受けました。主要評価項目は 6 週時点の WI-NRS のベースラインからの変化です。",
           "61 例（PBC 44 例、PSC 17 例、年齢中央値 54.0 歳、女性 78.7%）が EP547 31 例、プラセボ 30 例で投与を受けました。6 週時点の WI-NRS の変化は最小二乗平均で −1.8 対 −2.2 であり、プラセボに対する明らかな改善は認められず、副次評価項目もいずれも達成されませんでした。忍容性は概ね良好で、二重盲検期にグレード 3 以上の治療下発現有害事象はなく、試験期間を通じて有害事象による休薬や中止もありませんでした。",
           "PBC や PSC の方のかゆみには、MRGPRX4 の活性化以外の機序が関与していることが示唆されると述べられています。"],
      use:"肝臓や胆道の病気に伴うかゆみでお困りの方に、原因となる仕組みがまだ一つに定まっていないことをご説明する材料になります。" },
    { cat:"A", pmid:"42800464", journal:"J Pharm Biomed Anal", year:2026, type:"探索的研究",
      tj:"アトピー性皮膚炎にプロバイオティクス 90 日：SCORAD・EASI・DLQI が低下",
      te:"Metabolomic signatures associated with probiotic use in atopic dermatitis: An exploratory study.",
      sum:["アトピー性皮膚炎は免疫の調節異常と皮膚バリアの破綻が複雑に関わる慢性の炎症性皮膚疾患で、腸内細菌叢が自然経過に関与しうることを背景に、90 日間のプロバイオティクス補充が全身に及ぼす影響を、臨床評価・血清サイトカイン・GC-MS を用いたメタボロミクスを統合して評価した探索的研究です。",
           "プロバイオティクスの補充後に臨床的な改善がみられ、重症度を評価する主な指標である SCORAD・EASI・DLQI が低下しました。同じ方々で炎症性サイトカイン（IL-1β・IL-6・IL-8）の血清値も低下し、全身の炎症が和らいだことが示されました。メタボロミクスでは補充前と補充後で血清のプロファイルが明らかに変化し、炎症のシグナルの低下と臨床状態の改善に一致する所見でした。",
           "プロバイオティクスの補充に伴う意味のある代謝の変化が示され、アトピー性皮膚炎の補助的な方法としてさらに検討する価値を支持すると述べられています。"],
      use:"食事や腸内環境をご相談されるアトピー性皮膚炎の方に、あくまで補助的な位置づけとして研究が進んでいる段階ですとお伝えする材料になります。",
      note:"探索的研究です。対照群の設定や菌株の詳細は抄録に記載がありません。" },
    { cat:"A", pmid:"42802835", journal:"Cureus", year:2026, type:"症例報告",
      tj:"JAK1 阻害薬中のアトピー性皮膚炎に広範な水いぼ：顔の丘疹はざ瘡様発疹と紛らわしい",
      te:"Eczema Molluscatum in a Patient With Atopic Dermatitis on Upadacitinib and Methotrexate.",
      sum:["アトピー性皮膚炎の方に伝染性軟属腫（水いぼ）が広い範囲に生じる eczema molluscatum について、長年治療抵抗性であったアトピー性皮膚炎が選択的 JAK1 阻害薬ウパダシチニブとメトトレキサートで良好にコントロールされていた 29 歳男性の症例報告です。6 か月の経過で、両頬と前額に中心臍窩を伴うピンク色のドーム状丘疹が多発しました。",
           "病変はクリンダマイシンと過酸化ベンゾイルの外用ゲルに反応しませんでした。鑑別には eczema coxsackium、カポジ水痘様発疹症、発疹性汗管腫、難治性の JAK 阻害薬関連ざ瘡様発疹が挙げられましたが、疼痛・全身症状・水疱形成・毛包性の形態がないことから eczema molluscatum と診断されました。各病変に冷凍凝固を行い、1 か月後の再診で著明に改善しました。",
           "アトピー性皮膚炎自体が伝染性軟属腫の危険因子である一方、JAK1 阻害薬による全身性の免疫抑制、とくにメトトレキサートとの併用が I 型インターフェロンを介した抗ウイルス防御をさらに損ない、感染しやすさを重ねる可能性があると述べられています。JAK 阻害薬を使用中のアトピー性皮膚炎の方に顔の新しい丘疹が出た場合は、ざ瘡様発疹と取り違えて治療が遅れないよう本症を疑うべきとされています。"],
      use:"JAK 阻害薬を使っているアトピー性皮膚炎の方に顔の丘疹が出たとき、ざ瘡様発疹と決めつけず水いぼも疑う材料になります。",
      note:"1 例の症例報告です。" },
    { cat:"A", pmid:"42801247", journal:"Cureus", year:2026, type:"症例報告",
      tj:"JAK 阻害薬に伴う顔のざ瘡：重症アトピーの 18 歳女性、外用で継続できた 1 例",
      te:"Tofacitinib-Associated Acne in a Young Patient With Severe Atopic Dermatitis.",
      sum:["中等症から重症、あるいは難治性のアトピー性皮膚炎では全身療法が必要になることを背景に、JAK 阻害薬トファシチニブで治療した重症アトピー性皮膚炎の 18 歳女性の症例報告です。",
           "湿疹の病変とそう痒は著明に改善しましたが、数週間の治療の後、重症ざ瘡の既往や他に特定できる誘因のないまま顔面に炎症性のざ瘡が出現しました。診察では顔の中央部を中心に炎症性の丘疹と膿疱が多発し、面皰と微小嚢腫を伴っていました。血液検査に特記すべき異常はありませんでした。ざ瘡は適切な外用療法で管理でき、トファシチニブは継続できました。",
           "JAK 阻害薬による治療に伴う皮膚の有害事象としてざ瘡が注目されつつあり、早期に気づいて適切に対応することで、生活の質の低下や治療の中断を防ぎながら重症アトピー性皮膚炎に有効な全身療法を続けられる可能性があると述べられています。"],
      use:"JAK 阻害薬を始めた方にニキビが出ても、外用でととのえながら治療を続けられる場合があるとご説明する材料になります。",
      note:"1 例の症例報告です。" },
    { cat:"A", pmid:"42799185", journal:"Cureus", year:2026, type:"症例報告",
      tj:"難治性の硬化性苔癬のかゆみにネモリズマブ：4 週で 8/10 から 0/10 へ",
      te:"Rapid Improvement of Refractory Pruritus in Extragenital and Perianal Lichen Sclerosus With Nemolizumab: A Case Report.",
      sum:["硬化性苔癬は肛門や外陰部の皮膚に生じることが多い慢性の炎症性皮膚疾患ですが、それ以外の部位に生じることもあり、かゆみが強く標準的な抗炎症治療を行っても続くことがあります。インターロイキン 31 受容体 α を標的とする抗体であるネモリズマブを用いた、上背部・胸部・肩・肛門周囲に生検で確認された硬化性苔癬のある 68 歳女性の症例報告です。体幹の病変のいくつかは、以前の減量後のボディコンチュアリング手術の瘢痕の部位に一致していました。",
           "かゆみは睡眠と日中の活動に支障をきたすほど強く、これまでにベタメタゾンジプロピオン酸エステル 0.05% クリーム、トリアムシノロンアセトニドの病変内注射、ナローバンド UVB 療法（2021 年から 2026 年初めまで寛解を得たのち再燃）が行われていました。再燃した強いかゆみに対し、適応外でネモリズマブ 60 mg の皮下投与で導入し、以後 4 週ごとに 30 mg を継続しました。開始後 8 週までは他の外用・全身療法・光線療法は併用していません。4 週後の再診でかゆみは 10 段階で 8 から 0 に改善し、8 週後も著明な改善が保たれていました（途中、肛門周囲の灼熱感の一過性の悪化があり、その後軽快）。有害事象はありませんでした。診察では光沢のある白色局面が残っており、形態としての寛解は明らかではありませんでした。",
           "ネモリズマブは、形態としての改善が早期には得られなくても、硬化性苔癬に伴う難治性のかゆみをすみやかに和らげる可能性があると述べられています。"],
      use:"通常の抗炎症治療でもかゆみが取れない硬化性苔癬の方に、かゆみそのものを標的にする治療という考え方があるとご説明する材料になります。",
      note:"適応外使用の 1 例の症例報告です。" },
    { cat:"A", pmid:"42799822", journal:"Dermatol Ther (Heidelb)", year:2026, type:"後方視観察研究",
      tj:"顔の血管病変への広帯域光治療 111 例：初回で 5 割改善した方は全例が奏効",
      te:"Real-World Broadband Light Treatment Strategies and Early Treatment Response in Facial Vascular Lesions: A Retrospective Observational Study.",
      sum:["広帯域光（BBL）治療は顔面の血管病変に用いられることが増えている一方、個々に合わせた治療戦略や成績に関わる要因についての実臨床のデータが限られています。2023 年 3 月から 2025 年 9 月に三次皮膚科施設で BBL 治療を受けた 111 例を対象に、実際の治療の進め方と、初回の反応が全体の成績とどう関係するかを検討した後方視の観察研究です。診断は酒さ 59 例、顔面の毛細血管拡張 37 例、血管腫 11 例、ポートワイン母斑 4 例で、有効性は 2 名の盲検下の皮膚科医が標準化された写真で評価しています。",
           "治療成績は診断群の間で有意に異なり（p<0.001）、酒さと血管腫で最も良好、顔面の毛細血管拡張は比較的低い反応率でした。初回と全体の反応には中等度の正の相関がみられ（ρ=0.533、p<0.001）、初回治療後に 50% 以上改善した早期反応者は全員が最終的に治療成功に至ったのに対し、早期反応者でない方では 46.5% でした（p<0.001）。早期反応者は必要な治療回数も少なくなっていました（p<0.001）。限局した微小な痂皮が 17.1% に生じましたが後遺症なく軽快し、重篤な有害事象はありませんでした。",
           "BBL 治療は顔面の血管病変の日常診療に組み込みうるものであり、早期の反応はその後の成績と治療の負担を見通すうえで臨床的に有用な情報となりうると述べられています。"],
      use:"顔の赤みでご相談を受けたときに、光による治療は初回の効き方がその後の見通しの目安になりうるとご説明する材料になります。" },
    { cat:"C", pmid:"42732822", journal:"Complement Ther Med", year:2026, type:"RCT（検証研究）",
      tj:"新しい偽鍼デバイスの検証：健常 66 例で従来品と差なし",
      te:"Validation study comparing a novel sham acupuncture technique with Park sham acupuncture: A randomized controlled trial.",
      sum:["偽鍼は、鍼の臨床試験でプラセボ効果を最小限に抑え方法論的な厳密さを高めるための対照として用いられますが、市販されている Park 式の偽鍼デバイスにはいくつかの制約があります。そこで新たに開発された非侵襲の偽鍼デバイスの妥当性を、広く使われている Park 式と比較した検証的なランダム化比較試験です。健常成人 66 名を 1 対 1 で新しいデバイス群と Park 式群に割り付け、合谷（LI4）と足三里（ST36）に施術しています。",
           "施術の直後に、刺入感（皮膚を刺されたと感じる感覚）・痛み・得気を各経穴について 11 段階の数値評価スケール（0 は感覚や痛みなし、10 は耐えられないほど）で評価しました。両群で刺入感・痛み・得気に有意差はなく（いずれも p>0.05）、平均値はすべて 1.0 未満で、いずれのデバイスもごくわずかな感覚しか生じませんでした。新しいデバイスは 3 項目すべてで Park 式に対して統計学的に非劣性でした。有害事象の報告はありませんでした。",
           "新しい偽鍼デバイスは市販の Park 式と同等の妥当性をもち、鍼の効果を評価する臨床研究の対照として使用できると結論され、鍼治療の科学的な根拠づくりに寄与することが期待されると述べられています。"],
      use:"鍼の効果に関する研究の読み方をご説明するときに、比較の対照（偽鍼）の作り方が結果の解釈に関わるとお伝えする材料になります。",
      note:"皮膚疾患そのものを扱った研究ではなく、健常者を対象とした鍼の臨床研究の方法（偽鍼）に関する報告です。" }
  ]
},
{
  date: "2026-09-28",
  range: { A: "2026-09-26〜09-28", B: "2026-09-26〜09-28", C: "2026-08-29〜09-28" },
  items: [
    { cat:"A", pmid:"42797344", journal:"Pharmaceutics", year:2026, type:"総説",
      tj:"慢性特発性蕁麻疹の標的治療：オマリズマブの次に来る薬の整理",
      te:"Chronic Spontaneous Urticaria in the Era of Targeted Therapy: From Pathogenic Mechanisms to Precision Medicine.",
      sum:["6 週間以上にわたり膨疹（みみず腫れ）や血管性浮腫（くちびるやまぶたの腫れ）をくり返す慢性特発性蕁麻疹について、第二世代の抗ヒスタミン薬を使っても症状が残る方が多いことを背景に、病気の成り立ち（免疫学的な機序）と、その機序を狙った治療薬の最新の臨床試験データを、個別化医療の観点から整理した総説です。",
           "慢性特発性蕁麻疹は、I 型（自己アレルギー型）と IIb 型（自己免疫型）など異なる免疫学的なタイプ（エンドタイプ）をもつ不均一な病気として認識されつつあり、これが治療への反応に影響しうるとされています。二次治療の中心はオマリズマブですが、完全にコントロールできない方も少なくありません。新しい治療として、抗 IL-4Rα 抗体（デュピルマブ）、ブルトン型チロシンキナーゼ阻害薬（レミブルチニブなど）、抗 c-KIT 抗体（バルゾルボリマブ、ブリキリマブなど）が有望な有効性を示し、一部は効果の発現が速いと報告されています。ただし、どのタイプに特によく効くかは未確定です。総 IgE、抗 TPO 抗体、自己血清皮内テスト（ASST）、好塩基球の反応性、好塩基球減少、好酸球減少、アトピー素因の併存などがタイプや治療反応の目印として検討されていますが、治療選択に使えるほどの検証はされていないと述べられています。",
           "病態の理解が進んだことで標的治療の開発が可能になり、疾患のコントロールが改善しうる一方、治療選択のために臨床的に検証された目印はまだ限られており、前向きな検証が必要と結論されています。"],
      use:"抗ヒスタミン薬を増やしても蕁麻疹が残る方に、次の段階として狙いを定めた治療の選択肢が広がりつつあるとご説明する材料になります。" },
    { cat:"A", pmid:"42795995", journal:"J Clin Med", year:2026, type:"横断研究（探索的）",
      tj:"慢性蕁麻疹 30 例：重症では生活習慣への影響 90.5%、仕事 84.2%",
      te:"Impact of Chronic Spontaneous Urticaria on Major Life-Changing Decisions: An Exploratory Cross-Sectional Study.",
      sum:["強い痒みと予測できない再燃によって生活の質が大きく損なわれる慢性特発性蕁麻疹が、職業の選択・家族計画・人間関係といった人生の大きな決断にどう影響するかを調べた探索的な横断研究です。6 か月以上続く活動性の慢性特発性蕁麻疹の成人を三次病院で連続的に組み入れ、患者さんご自身が回答する 7 日間の蕁麻疹活動性スコア（UAS7）で重症（28 以上）と軽症〜中等症（28 未満）に分け、4 段階の尺度で各領域への影響を評価しています。",
           "30 例（平均罹病期間 5.6 年、平均 UAS7 30.47）が評価されました。影響が大きかったのは生活習慣 70%、仕事の成績 63.3%、国内の旅行・余暇 60%、服装の選択 60% でした。重症の方は軽症〜中等症の方に比べ、職業の選択 52.6% 対 25.0%（p=0.030）、仕事の成績 84.2% 対 37.5%（p=0.036）、学業 25.0% 対 0.0%（p=0.038）、家族関係 71.5% 対 11.1%（p=0.022）、生活習慣 90.5% 対 22.2%（p=0.002）と、いずれも強く影響を受けていました。",
           "この探索的なコホートでは、慢性特発性蕁麻疹は人生の大きな決断に相当の支障と関連し、とくに疾患活動性が高い方で頻度が高いことから、皮膚症状の制御とあわせて生物心理社会的な視点を診療に取り入れる価値があると述べられています。"],
      use:"命に関わらないから我慢すると言われる蕁麻疹の方に、仕事や生活への影響も治療目標に含めて一緒に決めていきましょうとお伝えする材料になります。" },
    { cat:"A", pmid:"42799315", journal:"Acta Paediatr", year:2026, type:"後方視マッチドコホート",
      tj:"小児の食物アレルギー 2 万例：アトピー性皮膚炎の併存が 2.04 倍",
      te:"Food Allergies Are Associated With a Substantially Higher Burden of Atopic Comorbidities and Increased Healthcare Use.",
      sum:["食物アレルギーのあるお子さんで、アトピー素因の併存疾患と医療機関の利用がどの程度多いかを調べた研究です。国民に広く医療を提供する大規模な健康保険組織のデータを用い、2001 年から 2019 年に食物アレルギーと診断された 0〜18 歳を、アレルギーのない対照と 1 対 1 でマッチさせた後方視コホートで、背景・併存疾患の割合・医療の利用を比較し、補正オッズ比（aOR）を算出しています。",
           "食物アレルギーのお子さん 20,418 例と同数の対照が比較されました。アレルギー性の併存疾患が有意に多く、アレルギー性鼻炎 aOR 2.09（95% 信頼区間 1.95〜2.25）、アトピー性皮膚炎 aOR 2.04（1.94〜2.14）、好酸球性食道炎 aOR 15.4（6.04〜39.55、104 件対 5 件）でした。処方の割合も多くで明らかに高く、とくに加水分解乳が aOR 12.32（10.83〜14.0）でした。専門科の受診も多く、増加が大きかったのは消化器 aOR 2.23（2.09〜2.37）と呼吸器 aOR 2.03（1.90〜2.17）で、救急受診や入院を含む医療全般の利用も多くなっていました。",
           "小児の食物アレルギーは、この大規模な全国コホートにおいて、アトピー素因の併存疾患の負担が明らかに大きいことと医療の利用が多いことに関連していたと結論されています。"],
      use:"食物アレルギーのあるお子さんの保護者の方に、湿疹や鼻炎も一緒に診ていく必要があるとご説明し、院内アプリの食物アレルギーのタブと合わせてお伝えする材料になります。" },
    { cat:"A", pmid:"42801002", journal:"Cureus", year:2026, type:"単施設・後方視（17 年）",
      tj:"日本の紅皮症 147 例：原因不明 34.0%、悪性腫瘍が背景に 9.5%",
      te:"Erythroderma: A Retrospective Study From a Single Institution.",
      sum:["体表面積の 90% を超えて広がることもある重症で慢性の状態である紅皮症について、日本からの報告が限られることを背景に、2008 年から 2024 年に同院で紅皮症と診断された患者さんの臨床的特徴・基礎疾患・治療を後方視的に検討した研究です。",
           "147 例（男性 122 例、女性 25 例、平均 69.2 歳）が同定されました。原因は特発性（原因が特定できないもの）が最も多く 50 例（34.0%）、次いで慢性湿疹 30 例（20.4%）、乾癬 22 例（15.0%）、薬疹 19 例（12.9%）、悪性腫瘍 14 例（9.5%）、水疱性疾患 9 例（6.1%）でした。悪性腫瘍の内訳は血液の悪性腫瘍 3 例（2.0%）と固形がん 11 例（7.5%）です。血清の TARC と IL-25 は紅皮症の患者さんで有意に高く、紅皮症が Th2 優位の状態に傾くという考えを支持する所見でした。",
           "紅皮症は悪性腫瘍に伴って生じうるため、背景に炎症性の疾患がない症例では内臓の悪性腫瘍のスクリーニングを行い、見つからない場合でも慎重な経過観察が必要と述べられています。"],
      use:"全身が赤くなって皮がむける状態が続くご高齢の方に、皮膚だけでなく全身の検査と経過観察が必要だとご説明する根拠になります。" },
    { cat:"A", pmid:"42798646", journal:"Front Pharmacol", year:2026, type:"薬剤安全性データベース解析＋症例集積",
      tj:"イソトレチノインの筋骨格系副作用 30 シグナル：思春期・男性で強い",
      te:"Sex- and age-specific musculoskeletal adverse events of isotretinoin: disproportionality analysis of the FAERS database combined with a clinical case series.",
      sum:["痤瘡（にきび）の治療に広く用いられるイソトレチノインは、筋骨格系と結合組織の有害事象との関連が指摘されてきましたが、大規模で系統的な検討は限られていました。本研究は、米国 FDA の有害事象報告システム（FAERS）、カナダの有害反応データベース（CVARD）、および臨床データを用いて、報告オッズ比（ROR）による不均衡分析で安全性のシグナルを探索し、性別・年齢・用量で層別、経口避妊薬・テトラサイクリン系・プレドニゾンの併用でも層別し、Weibull 分布などで発現までの時間を評価したものです。",
           "30 件の陽性シグナルが同定されました。最も強かったのは骨端の早期閉鎖（ROR 216.92）、SAPHO 症候群（76.41）、骨端の障害（51.42）、仙腸関節炎（45.36）です。層別解析では、SAPHO 症候群・骨端の早期閉鎖・仙腸関節炎・関節炎・関節痛が男性に多く（ROR 比 1.42〜7.85）、腱炎・椎間板変性・肋軟骨炎・背部痛・関節痛は思春期で成人より高く報告されていました（ROR 比 2.30〜7.41）。骨端の早期閉鎖は思春期での報告が大半（66 件対成人 2 件）でしたが、データが少ないため思春期と成人を比べた ROR は算出できませんでした。いずれの群も投与早期に集中して報告される型でした。",
           "性別と年齢で報告のされ方に探索的な違いがあり、これらは仮説を生み出す知見であって、前向きの臨床研究での検証が必要と述べられています。"],
      use:"にきびで内服治療のご相談を受けた際に、関節や背中の痛みが出たら早めにお知らせくださいとお伝えする材料になります（報告データの解析であり、因果関係が証明されたものではない点を添えます）。",
      note:"イソトレチノインは日本では痤瘡に対して承認されていません。" },
    { cat:"A", pmid:"42797512", journal:"Pharmaceuticals (Basel)", year:2026, type:"ナラティブレビュー",
      tj:"妊娠中の乾癬と生物学的製剤 290 妊娠：72.7% が健康な生児出産",
      te:"Biologic Therapy in Pregnant Women with Plaque Psoriasis: A Narrative Review of Maternal and Fetal Safety Considerations.",
      sum:["妊娠中の乾癬は世界的にみても頻度の高い炎症性の病気で、病気そのものと服用する薬が胎児の健康や妊娠の経過にどう影響するかを患者さんが心配されます。本論文は、生物学的製剤・尋常性乾癬・妊娠を検索語として文献を探し、選定基準を満たした 11 編を選んだナラティブレビューです。",
           "11 のケースシリーズで、生物学的製剤を使用していた 290 の妊娠が記録され、そのうち約 72.7% にあたる 211 が健康な生児出産に至りました。最もよく研究されているのはウステキヌマブで 241 妊娠、抗 TNF 療法は 42 妊娠でした。多くは妊娠初期に治療が中断されており、妊娠期間を通じて生物学的製剤を継続していたのは 24 妊娠で、その多くはセルトリズマブとアダリムマブ（それぞれ 33.3%）でした。290 の妊娠では、自然流産 33、人工的な中絶 20、早産 17、死産 4、低出生体重児 8、先天異常 4（3 件は詳細不明、1 件は胎児の外脳症）が報告されましたが、曝露の時期や薬剤ごとの関連までは明らかにされていません。セルトリズマブは妊娠期間を通じて安全と考えられ、有害事象の発生も少なく、既存のガイドラインと一致していました。",
           "現在の根拠では、乾癬の女性が妊娠中に生物学的製剤を使用することは概ね良好な母体・胎児の転帰と関連し、流産・先天異常・生児出産の割合は一般の集団や他の炎症性疾患でみられる値と同程度であるとされています。個々の治療方針が妊娠の転帰に影響するかを明らかにするには、さらに大規模で前向きの登録研究が必要と述べられています。"],
      use:"妊娠を考えていらっしゃる乾癬の方に、治療を続けるか休むかを主治医と相談していただく際の一般的な安全性の情報としてお伝えする材料になります（個別の判断は主治医が行います）。" },
    { cat:"A", pmid:"42796402", journal:"Medicina (Kaunas)", year:2026, type:"ナラティブレビュー",
      tj:"乾癬に HIV・B 型／C 型肝炎が併存するとき：全身療法の考え方",
      te:"Psoriasis and Chronic Viral Infections (HIV, HBV, and HCV): Therapeutic Approach and Safety.",
      sum:["乾癬は長期の全身療法を必要とすることが多い免疫が関わる慢性の炎症性疾患で、HIV・B 型肝炎ウイルス・C 型肝炎ウイルスの感染が併存すると、皮膚と関節の炎症を抑えることと、日和見感染・ウイルスの増殖や再活性化・肝障害・薬物相互作用のリスクとの釣り合いを取る必要が生じます。本論文は、ガイドライン・システマティックレビュー・コホート研究・症例集積・専門家の推奨・規制当局の情報をまとめたナラティブレビューです。",
           "HIV 感染では、血中の HIV RNA が抑制され、CD4 数が安定または回復し、活動性の日和見感染がなく、確実に経過をみられる方であれば、個別のリスク評価を行ったうえで、生物学的製剤を含む一部の全身療法を検討しうるとされています。B 型肝炎ウイルス感染では、抗ウイルス薬の予防投与や綿密なモニタリングによる再活性化の予防が中心になります。C 型肝炎ウイルス感染では、線維化の程度・活動性の肝炎の有無・薬物相互作用・直接作用型抗ウイルス薬を使う時期を踏まえて管理を組み立てるべきとされています。",
           "慢性のウイルス感染があることは、現代の乾癬治療を行えない絶対的な障壁とみなすべきではないと結論されています。"],
      use:"肝炎の既往がある乾癬の方に、事前の検査と対策を整えれば治療の選択肢があるとご説明する材料になります（実際の適応の判断は主治医が行います）。" },
    { cat:"A", pmid:"42800564", journal:"J Am Acad Dermatol", year:2026, type:"総説",
      tj:"皮膚科を受診する方の 3 分の 1 に精神科的な併存：見分け方と対応",
      te:"A Clinical Approach to Psychodermatologic Conditions: From Recognition to Treatment.",
      sum:["皮膚科を受診される方の 3 分の 1 に精神科的な併存があるにもかかわらず、心と皮膚が関わる病態は見落とされやすく、診断と管理が難しいという現状があります。本論文は、2023 年の EADV／ESDaP／APMNA の合意が示した、心と皮膚の双方向の関係をより正確に反映し診断と治療を結びつける 2 分類に基づき、認識・診断・管理の進め方を根拠に基づいて整理した総説です。",
           "心と皮膚をつなぐ神経免疫の機序を土台に、妥当性が検証された評価尺度を組み込んだ段階的な診断の枠組みが示されています。治療は、皮膚症状を伴う一次性の精神疾患（カテゴリー 1）と、精神面に影響を及ぼす一次性の皮膚疾患（カテゴリー 2）に分けて整理され、皮膚科医が行ってよい向精神薬処方の範囲と、精神科に相談すべき明確な目安が示されています。診療の妨げとなる障壁に対する多層的な解決策も提案されています。",
           "心と皮膚の評価を日常の診療に組み込む皮膚科医は、相当数の患者さんの転帰を改善しうると述べられています。"],
      use:"掻くのがやめられない、皮膚の症状が頭から離れないとおっしゃる方に、皮膚の治療と並行して心身のご負担を伺う枠組みとして使えます。" },
    { cat:"A", pmid:"42794826", journal:"Int J Mol Sci", year:2026, type:"総説",
      tj:"アトピー性皮膚炎と脂溶性ビタミン A・D・E・K：補助療法としての可能性",
      te:"The Role of Fat-Soluble Vitamins in the Prevention and Management of Atopic Dermatitis.",
      sum:["アトピー性皮膚炎は、表皮バリアの障害・免疫の調節異常・酸化ストレスの増加を特徴とする慢性の炎症性皮膚疾患です。現在の治療はステロイド外用薬・カルシニューリン阻害薬・全身性の免疫調節薬が中心ですが、ステロイドなどの長期使用には望ましくない副作用があるため、自然由来の補完的な方法に関心が移りつつあることを背景に、脂溶性ビタミン（A・D・E・K）の役割を整理した総説です。",
           "植物由来の抗酸化物質がアトピー性皮膚炎の予防に役立つ可能性を示す研究があり、なかでも脂溶性ビタミンは、抗酸化防御・免疫の調節・表皮バリアの保持に強く関わることから、アトピー性皮膚炎の制御において意義があると示した研究がいくつかあると述べられています。本総説では、ビタミン A・D・E・K がアトピー性皮膚炎の成り立ちに関わる複数の機序にどう影響しうるか、補助療法としての可能性とあわせて論じられています。",
           "ただし根拠は限られた前臨床および臨床のデータに基づくものであり、治療効果を確立するには、さらに適切に設計された機序の研究と臨床試験が必要と述べられています。"],
      use:"サプリメントで治せないかとお尋ねの方に、脂溶性ビタミンはまだ研究段階で外用治療の代わりにはならないとご説明する材料になります。" },
    { cat:"A", pmid:"42800563", journal:"J Am Acad Dermatol", year:2026, type:"長期継続試験（96 週）",
      tj:"アトピー性皮膚炎にアブロシチニブ 96 週：単剤と外用併用を比較",
      te:"Long-Term Efficacy of Abrocitinib For Atopic Dermatitis: 96 Week Results of the JADE EXTEND Study Comparing Patients Receiving Monotherapy With Those Receiving Combination Therapy Including Topical Medications.",
      sum:["アトピー性皮膚炎に対する経口 JAK1 阻害薬アブロシチニブの長期継続試験（JADE EXTEND）から、96 週時点の有効性を報告した論文です。アブロシチニブを単独で使用した方と、外用薬を含む併用療法を受けた方を比べた内容であることが、標題から分かります。",
           "抄録が公開されていないため、96 週時点の湿疹面積・重症度の指標などの具体的な数値はここでは確認できません。原著でのご確認が必要です。",
           "長期に内服を続けたときの有効性が、単剤の場合と外用薬を併用した場合とで異なるのかという外来で生じやすい疑問を扱った報告であり、詳細は原著の確認が必要です。"],
      use:"アブロシチニブを長く続けていらっしゃる方に、外用薬を併用した場合の長期成績を確認する手がかりになります（数値は原著でのご確認が必要です）。",
      note:"抄録なし（タイトルのみで要約）。原著確認が必要。" }
  ]
},
{
  date: "2026-09-27",

  items: [
    { cat:"A", pmid:"42791206", journal:"Br J Dermatol", year:2026, type:"第3相試験",
      tj:"小児乾癬にリサンキズマブ 137 例：16 週で PASI75 85.2%、52 週も維持",
      te:"Efficacy and Safety of Risankizumab in Paediatric Patients With Psoriasis in the OptIMMize-1 Phase III Study.",
      sum:["小児の乾癬では使える治療の選択肢が限られることを背景に、中等症から重症の小児乾癬 137 例を対象に、インターロイキン 23 を標的とするリサンキズマブの有効性と安全性を 52 週まで評価した第 3 相・多施設・4 部構成の試験（OptIMMize-1、NCT04435600）です。第 2 部は 16 週の初期治療期（リサンキズマブとウステキヌマブに 2 対 1 で割り付け）と、反応例を最長 36 週間ランダムに継続または休薬する期間、再燃例への 16 週の再治療期からなり、医師による全般評価（sPGA）で皮疹がほぼ消えた割合や PASI の 75%・90%・100% 改善率、痒み、生活の質、安全性を評価しています。",
           "第 2 部（リサンキズマブ 54 例、ウステキヌマブ 28 例）の 16 週時の成績は両群で同程度で、sPGA 0/1 は 79.6% 対 75.0%、2 段階以上の改善を伴う sPGA 0/1 は 68.5% 対 67.9%、PASI75 は 85.2% 対 85.7%、PASI90 は 64.8% 対 60.7% でした。皮疹が完全に消える PASI100 はリサンキズマブ 40.7% に対しウステキヌマブ 17.9% と高い結果でした。第 4 部（30 例）では 16 週時に sPGA 0/1 が 90.0%、PASI75 が 86.7%、PASI90 が 76.7%、PASI100 が 43.3% で、52 週時にはこれらが維持または改善しました。痒みと生活の質も 16 週・52 週で改善し、安全性はこれまでの成人の試験と同様でした。",
           "リサンキズマブは小児でも良好な忍容性を示し、皮疹・痒み・生活の質を大きく改善して 52 週まで効果が保たれたことから、中等症から重症の小児乾癬に対する使用を支持すると結論されています。"],
      use:"お子さんの乾癬がなかなか治まらないご家族に、全身療法という選択肢があり皮疹だけでなく痒みや生活の質も改善しうるとご説明する材料になります。" },
    { cat:"A", pmid:"42791196", journal:"Br J Dermatol", year:2026, type:"非盲検・評価者盲検の実施可能性試験",
      tj:"掌蹠膿疱症にウパダシチニブ 8 週：PP-PASI 20.3 → 4.6",
      te:"Upadacitinib for Palmoplantar Pustulosis: An Open-label, Assessor-blinded Feasibility Study Using Historic Control Data (JAKPPPOT).",
      sum:["治療の選択肢が乏しい掌蹠膿疱症（手のひら・足の裏に膿をもった皮疹をくり返す病気）の成人 20 例に、ウパダシチニブ 30mg を 1 日 1 回 8 週間（リスクの高い方は 15mg）投与した、英国の専門施設による非盲検・評価者盲検の実施可能性試験です。主要評価項目は組み入れ率・服薬遵守・受け入れやすさで、過去に行われた同様の試験のプラセボ群のデータと比較できるよう手順をそろえ、副次評価項目として掌蹠膿疱症の重症度指標（PP-PASI）の変化と安全性をみています。",
           "あらかじめ定めた実施可能性の基準はすべて満たされました。連絡した 67 名のうち 28 名（41.8%）が同意し 20 名が投与を開始（平均 46.0 歳、85% が女性）、80% 以上の服薬遵守は 19/20 例（95%）、治療を受け入れられると答えたのは 18/19 例（94.7%）でした。PP-PASI の平均は投与前 20.3 から 8 週で 4.6 へ低下し、過去のプラセボ群は 18.0 から 15.4 でした。ベースラインで補正した 8 週時の PP-PASI 変化量の差は -12.3（95% 信頼区間 -15.8〜-8.9）でウパダシチニブが優れ、PP-PASI50 は 100% 対 16.1%、PP-PASI75 は 65.0% 対 3.2% でした。主な有害事象は頭痛・痤瘡・上気道感染でした。",
           "掌蹠膿疱症に対する JAK 阻害薬の本格的な比較試験が実施可能であり、有効性を期待させる探索的な結果が得られたため、多施設の実薬対照ランダム化比較試験に進むことを支持すると述べられています。"],
      use:"手足の膿疱がくり返す方に、まだ探索的な段階ながら JAK 阻害薬という選択肢が検討されつつあるとご説明する材料になります（この試験は比較試験の準備段階であり、有効性の確定ではない点を添えます）。" },
    { cat:"A", pmid:"42790781", journal:"J Am Acad Dermatol", year:2026, type:"多施設・後方視",
      tj:"生物学的製剤の中止後に膿疱型の再燃 7.2%：くり返す中止が危険因子",
      te:"Clinical characteristics and risk factors for a distinct pustular psoriasis flare after withdrawal of biologics in plaque psoriasis.",
      sum:["尋常性乾癬で生物学的製剤が効いた後に中止した患者について、2011 年から 2025 年の治療エピソードを集めた多施設の後方視研究です。中止後に生じる特徴的な膿疱型乾癬の再燃について臨床像を整理し、一般化推定方程式を用いて関連する因子を評価しています。",
           "この膿疱型の再燃は 1,198 治療エピソードのうち 86 件（7.2%）にみられ、痛みを伴うびまん性の強い赤みに膿疱と腫れを伴い、主に下肢に生じるという特徴がありました。生物学的製剤の中止と再燃をくり返した回数が多いほど発生が増え、独立して関連した因子は、乾癬の家族歴、乾癬性関節炎の併存、以前に同じ型の再燃を起こしたこと、過去の中止・再燃の回数が多いこと、治療中に PASI 50 に達するまでの期間が長かったことでした。なお治療の割り付けはランダム化されておらず、組織学的・分子生物学的なデータがない点が限界として挙げられています。",
           "これらの危険因子をもつ方では、生物学的製剤の中止後に注意深く経過をみて、早めに治療を再開することが推奨されると述べられています。"],
      use:"生物学的製剤をいったんお休みしたいとご希望の方に、中止後に膿疱を伴う強い再燃が起こりうること、とくに中止をくり返している方では早めの受診が大切だとご説明する根拠になります。" },
    { cat:"A", pmid:"42796232", journal:"Medicina (Kaunas)", year:2026, type:"単施設・後方視（10 年）",
      tj:"手湿疹に内服アリトレチノイン：成功 66.7%、脂質上昇が最多の副作用",
      te:"Real-World Effectiveness and Safety of Oral Alitretinoin in Chronic Hand Eczema with Exploratory Off-Label Indications: A 10-Year Single-Center Korean Study.",
      sum:["強いステロイド外用で治まらない重症の慢性手湿疹に承認されている内服アリトレチノインについて、韓国の大学病院で 2016 年 1 月から 2025 年 12 月に処方された 161 例を調べた後方視研究です。1 か月以上の評価可能な治療を受けた 99 例（女性 50 例・男性 49 例、平均 50.7 歳）を対象に、処方の実態、有効性、忍容性、脂質の変化を評価し、最終の医師全般評価が 0/1 になることを治療成功としています。",
           "適応は慢性手湿疹が 70/99 例（70.7%）で最も多く、以下、掌蹠膿疱症 14 例、菌状息肉症 6 例、類乾癬、汗孔角化症、掌蹠部の角化症、ダリエ病でした。平均 12.4 か月の治療で全体の成功率は 66.7%（66/99）、慢性手湿疹では 77.1% と最も高く、適応外では掌蹠膿疱症 42.9%、菌状息肉症 33.3% とばらつきがありました。30mg で開始した方は 10mg より成功率が高く見えましたが（71.1% 対 43.8%、p=0.044）、年齢・性別・適応で補正すると有意ではありませんでした。有害事象は 21 例（21.2%）で、脂質異常症 12 例と頭痛 7 例が多く、中性脂肪は平均 42.1mg/dL、総コレステロールは 14.0mg/dL 上昇し（いずれも p<0.001）、開始前に正常だった方の 25.8%・27.5% が基準値を超えました。30 例（30.3%）が中止し、理由は効果不十分が最多でした。",
           "アリトレチノインは慢性手湿疹に良好な効果を示し、適応外の使用では反応が一定しないとされています。脂質の上昇が多いため、定期的な血液検査での確認が望ましいと述べられています。"],
      use:"外用で治まらない手湿疹に内服薬をご検討する際、効果が期待できる一方で中性脂肪やコレステロールの定期チェックが必要だとご説明する根拠になります（生活指導アシスタントの手湿疹・スキンケアの項目と合わせて）。" },
    { cat:"A", pmid:"42789235", journal:"Dermatol Ther (Heidelb)", year:2026, type:"前向き観察",
      tj:"アトピーの治療目標：EASI 3 以下かつ DLQI 0/1、48 週で 46.0% が到達",
      te:"48-Week Real-World Atopic Dermatitis Study on Minimal Disease Activity, Associated Factors, and Agreement Between Clinician- and Patient-Reported Outcomes.",
      sum:["中等症から重症のアトピー性皮膚炎で生物学的製剤または JAK 阻害薬を新たに開始した 12 歳以上の 96 例を、実際の診療のなかで開始前と 16・24・48 週に評価した前向き観察研究です。医師の評価と患者ご自身の評価を組み合わせた最小疾患活動性（MDA）の達成割合、関連因子、医師評価と患者評価の一致度を調べ、実用的な MDA の定義を提案することを目的としています。",
           "MDA を達成したのは 16 週で 42.7%、24 週で 52.6%、48 週で 46.0% でした。MDA の達成と関連したのは、開始前の重症度が低いこと、それまでの全身療法の数が少ないこと、アトピーに関連する併存症が少ないことでした（いずれも p<0.05）。一致度は医師評価どうしでは高く、患者評価どうしではばらつきがあり、医師評価と患者評価の間ではより低い結果でした。候補となる定義のうち、EASI 3 以下と DLQI 0/1 の組み合わせが外部の指標に対して最も良好な成績を示しました。",
           "新しい全身療法はアトピー性皮膚炎で最小疾患活動性の達成に有効であり、EASI 3 以下かつ DLQI 0/1 という組み合わせが日常診療で使いやすい実用的な定義になりうると結論されています。"],
      use:"新しい全身療法を使っている方との目標設定で、皮疹の広がりと生活のしづらさの両面が落ち着いた状態を目安にすると共有する材料になります。" },
    { cat:"A", pmid:"42786733", journal:"Aliment Pharmacol Ther", year:2026, type:"メタ解析",
      tj:"胆汁性の痒み：プラセボでも 30.0% が改善、指標で差が出る",
      te:"Meta-Analysis: The Placebo Response in Modern Treatments for Cholestatic Pruritus: A Systematic Review and Meta-Analysis of Randomized Controlled Trials.",
      sum:["胆汁がうまく流れないことで起こる痒み（胆汁性のかゆみ）を対象に、回腸胆汁酸トランスポーター阻害薬または PPAR 作動薬を評価したプラセボ対照ランダム化比較試験を集め、プラセボ群でどれだけ痒みが軽くなるかを定量化した系統的レビューとメタ解析です（2026 年 3 月までの検索、同年 7 月 11 日に追加検索）。13 試験・548 例を解析し、痒みの強さの標準化平均変化量、プラセボでの反応率、数値評価スケール（NRS）と最悪時の痒み NRS の平均差を主要評価項目としています。",
           "プラセボ群でも最長 52 週の観察期間を通じて痒みの強さは有意に低下し、標準化平均変化量は全体で -0.49（95% 信頼区間 -0.72〜-0.27）、中等症から重症では -0.57（同 -0.81〜-0.33）でした。反応率は全体 30.0%、中等症から重症 27.4% でした。中等症から重症では NRS は -1.62 と有意に低下した一方、最悪時の痒み NRS の変化（-0.65）は有意ではありませんでした。PBC-40 の痒みの領域（-2.02）と全体スコア（-9.13）は有意に低下し、5-D Itch の変化は有意ではありませんでした。検討したいずれの調整因子も有意ではありませんでした。",
           "プラセボによる改善の大きさは用いる評価指標によって異なり、胆汁性の痒みを扱う試験の効果推定や解釈に影響しうるため、今後の試験設計における評価項目の選択に役立つと述べられています。"],
      use:"痒みの治療効果を評価するときに、自覚的な痒みは治療以外の要因でも 3 割ほど軽くなりうることを念頭に置き、複数の指標で経過をみる材料になります（対象は胆汁性の痒みで、皮膚疾患のかゆみそのものではない点にご留意ください）。",
      note:"皮膚疾患ではなく胆汁性のかゆみを対象とした試験のメタ解析です。" },
    { cat:"A", pmid:"42795746", journal:"J Clin Med", year:2026, type:"検証研究（観察）",
      tj:"疥癬の活動性を示すダーモスコピー所見：治療後は 0/30 で消える",
      te:"The Tunnel Window Sign Identifies Active Scabies Infestation: A Validation Study.",
      sum:["疥癬は世界的に増え、第一選択の駆虫薬に対する抵抗性から治療失敗も増えていますが、治癒を判定できるダーモスコピーの指標は確立していません。そこで、トンネル（疥癬トンネル）に沿って丸い穴のように見えるトンネル窓サイン（TWS）が活動性の指標になるかを、活動性の疥癬 33 例（コホート 1、駆虫薬を守った 30 例の 106 本のトンネルと、守れなかった 3 例の 11 本）と、掻き壊しを伴う痒みのある他の皮膚疾患 30 例（コホート 2、150 病変）で比較した単施設の観察研究です。コホート 1 は治まるまで 4 週ごとに再評価し、偏光ダーモスコピーと紫外線蛍光ダーモスコピー（UVFD）の画像を 4 名（うち 3 名は盲検）が判定しました。",
           "TWS は痒みのある他疾患の 30 例すべてと、治療を守って終えた 30 例すべてで検出されませんでした（いずれも 0/30）。有効な治療により 4 週目以降は検出されなくなり、これは痒みが治まるより先でした。一方、駆虫薬を守れなかった方では再治療まで残存しました。トンネル単位でみると UVFD は偏光ダーモスコピーより検出感度が高く（68/106 対 60/106、p=0.0078、補正オッズ比 1.38、95% 信頼区間 1.07〜1.79）、判定者間の一致はほぼ完全（Fleiss のκ=0.872）でした。",
           "TWS は活動性の疥癬を示す所見としてふるまい、治療が成功すると消え、失敗すると残り、治療後の皮膚や疥癬以外の痒みのある皮膚疾患と区別できると結論されています。検出には UVFD が有利とされています。"],
      use:"疥癬の治療後に痒みだけが続いている方で、ダーモスコピーでこの所見が消えていれば虫はいないと判断する手がかりになります（痒みが治まるより先に所見が消えることも説明材料になります）。" },
    { cat:"A", pmid:"42794167", journal:"Children (Basel)", year:2026, type:"推奨（GRADE・専門家合意）",
      tj:"小児アレルギーの検査の使いどころ：感作検査だけでは食物アレルギーと決めない",
      te:"Evidence-Based Clinical Recommendations on the Appropriateness of Prescriptions and Diagnostic Tests in Paediatric Allergology: Focus on IgE-Mediated and Non-IgE Mediated Food Allergy, Eosinophilic Gastrointestinal Disease, Urticaria, Angioedema and Atopic Dermatitis.",
      sum:["小児の食物アレルギー、好酸球性消化管疾患、蕁麻疹、血管性浮腫、アトピー性皮膚炎について、専門医への紹介と検査の適切な使い方をまとめた推奨です。イタリア国立衛生研究所のもとで多職種の委員会が PICO 形式で臨床上の問いを設定し、2015 年から 2026 年の文献の系統的レビューをもとに、GRADE 手法でエビデンスの確実性を評価して作成されています。",
           "食物アレルギーでは、感作を調べる検査（血液や皮膚のテスト）だけでは診断できず、食物経口負荷試験が診断確定の中心であるとされました。好酸球性消化管疾患では内視鏡による生検が必須、慢性蕁麻疹では専門医への相談が推奨される一方、疑わせる病歴がないまま画一的にアレルギー検査を行うことは避けるべきとされています。血管性浮腫ではヒスタミンによるものかブラジキニンによるものかの区別が重要で、遺伝性・後天性が疑われる場合に的を絞った検査を行うこと、アトピー性皮膚炎では標準化した重症度評価をもとに治療方針と生物学的製剤の検討を進め、ご本人とご家族への教育が診療の中心的な要素であるとされました。",
           "これらの推奨は、不要な検査を減らし医療資源を適切に使いながら、小児アレルギー診療の質と公平性を高める枠組みになると結論されています。"],
      use:"血液検査の数値だけを心配されるご家族に、感作の検査だけでは食物アレルギーとは決められず、症状の経過と負荷試験で判断すると丁寧にご説明する根拠になります（食物アレルギーのタブと合わせて）。" },
    { cat:"A", pmid:"42795306", journal:"Life (Basel)", year:2026, type:"総説",
      tj:"イソトレチノインの眼の副作用：ドライアイが最多、夜間視力低下にも注意",
      te:"Highlighting Ophthalmic Adverse Effects Associated with Isotretinoin.",
      sum:["中等症から重症の尋常性痤瘡に有効なイソトレチノインには幅広い眼の副作用が知られています。本論文は、PubMed と Embase で 2026 年 6 月 1 日までの文献を検索し、全身投与に伴う眼の副作用について、機序・臨床像・回復性のエビデンス・実践的な注意点を整理した構造化された総説です。",
           "最も多い眼の合併症はマイボーム腺の機能低下による乾性眼（ドライアイ）で、涙液の安定性が損なわれ蒸発しやすくなる仕組みが示されています。そのほか、暗いところで見えにくくなる夜盲（杆体視細胞の機能低下による確立した副作用で、夜間視力が必要な職業では重要）、角膜の変化（コンタクトレンズ使用者や屈折矯正・角膜移植を検討する方でとくに問題になる）、網膜の変化、特発性頭蓋内圧亢進症、視神経炎といった、まれですが視力を脅かしうる合併症も報告されています。多くは中止後に回復しますが、症状が続く方もいるとされています。",
           "イソトレチノインを処方する際は視覚に関する症状を日常的に尋ね、必要なら早めに眼科へ紹介することが望ましく、皮膚科・一般医・眼科の連携が視機能の障害を最小限にするうえで重要であると述べられています。"],
      use:"内服レチノイドをお使いの方に、目の乾きや夜間の見えにくさが出たらお知らせいただくようご説明し、必要に応じて眼科へご紹介する根拠になります。" },
    { cat:"A", pmid:"42790783", journal:"J Am Acad Dermatol", year:2026, type:"ランダム化比較試験",
      tj:"痤瘡の外用：処方を簡単にすると続けやすい（3 剤配合の利点）",
      te:"Adherence to Topical Acne Treatment Improves with Reduced Regimen Complexity: Benefits of a Fixed-Dose Triple-Combination Approach in a Randomized Trial.",
      sum:["尋常性痤瘡の外用療法について、処方の複雑さを減らすと治療の継続（アドヒアランス）が改善するかをランダム化比較試験で検討し、3 剤を 1 つにまとめた配合外用薬の利点を報告した論文です。",
           "抄録が公開されていないため、具体的な対象者数・比較した処方・継続率の数値は本文で確認する必要があります。",
           "タイトルの範囲では、外用薬の本数や塗る回数を減らすことが治療の継続につながると示されたと読み取れます。"],
      use:"外用薬を塗り続けられないとお困りの方に、まとめられる薬は 1 本にする、塗る回数を減らすといった工夫をご提案する材料になります（外用薬のタブと合わせて）。",
      note:"抄録なし（タイトルのみで要約）。原著確認が必要。" },
    { cat:"B", pmid:"42788636", journal:"J Eval Clin Pract", year:2026, type:"論考（概念分析）",
      tj:"漢方と西洋医学の二本立てで診る：日本の医師免許の特徴という論考",
      te:"Duagnosis: Locating Clinical Uncertainty in the Diagnostic Framework.",
      sum:["診療上の不確かさ（はっきり診断がつかない状態）は患者さんの病態だけでなく、医師が用いる診断の枠組みの届く範囲にも由来するのではないか、という視点から書かれた概念分析の論文です。著者は、1 人の医師のなかで独立した 2 つの診断体系が同時に働く認知を「デュアグノーシス（dual＋gnosis）」と名づけ、概念の定義、近い枠組みとの区別、認識論的な議論、東アジアの制度比較という順で論を進めています。",
           "中心的な主張は、ある枠組みでは言葉にできないものが別の枠組みでは認識可能で対応可能なパターンとして整理されうる、つまり不確かさは患者さんの側だけでなく枠組みの側の性質でもあるという点です。デュアグノーシスには、家族医療が患者さんを複数の視点で読む営みに連続する広い意味と、エビデンスの基準そのものが変わる狭い意味の 2 つがあるとされます。東アジアの制度比較では、日本は医師免許が一本化されているため、すべての医師が自身の認知のなかに診断の二重性を抱えることになるが、医学教育はその能力を育ててこなかったと指摘されています。",
           "不確かさに耐えることよりも診断の持ち札を増やすことが、臨床的な見立てのつかない受診の割合を減らしうると述べられ、この捉え直しは特定の医療制度を超えて、説明や紹介のあり方にも示唆をもつとされています。"],
      use:"西洋医学的な検査で説明がつかないご症状のときに、漢方の見立てという別の枠組みを加えてご相談する当院の診療の考え方を、言葉にして共有する材料になります。",
      note:"臨床研究ではなく概念分析（論考）です。" },
    { cat:"B", pmid:"42793550", journal:"Healthcare (Basel)", year:2026, type:"スコーピングレビュー",
      tj:"漢方を電子カルテの国際規格にどう載せるか：該当 10 件、漢方は 0 件",
      te:"Representing Traditional East Asian Medicine in International Health Informatics Standards: A Scoping Review.",
      sum:["韓医学・中医学・日本の漢方を含む東アジア伝統医学の診療内容が電子カルテに記録されるようになる一方、そのデータを共有するには相互運用の規格が必要です。本論文は、伝統医学の概念が国際的な医療情報の規格にどう対応づけられ、モデル化されてきたかを、JBI の方法と PRISMA-ScR に沿って PubMed・Embase・Scopus・IEEE Xplore で 2016 年 1 月から 2026 年 3 月の英語文献を検索して整理したスコーピングレビューです。",
           "16,763 件から 10 件が採用され、うち 7 件が中医学、3 件が韓医学で、漢方を扱ったものはありませんでした。作業の多くは用語の対応づけ（SNOMED CT・UMLS・MeSH）で、データモデルは OMOP 共通データモデルのみ、HL7 FHIR のような交換規格を扱った報告はありませんでした。表現しやすさは対象によって差があり、経穴（ツボ）は用語体系に直接対応づけられた一方、ICD-11 第 26 章の 260 の証（パターン）のうち SNOMED CT に対応する語があったのは 1 つだけでした。症状や病名は部分的にしか当てはまらず、複数の生薬からなる方剤は拡張または分解が必要でした。多くの研究は各施設で規格を補っており、その追加が正式な規格に取り込まれたものはありませんでした。",
           "これまでの取り組みは、システム間でデータを動かすことよりも共通の意味づけを確立することに重きがあり、補いが規格の外に留まるため同じ課題がくり返されていると述べられています。今後は伝統医学の内容を規格本体に反映させ、交換規格に載せ、証に対応する内容を整備することが優先課題とされています。なお検索は英語の国際的な文献に限られ、漢方が 0 件なのは日本語などの国内文献を含まない結果であるとされています。"],
      use:"漢方の証や方剤はカルテの標準的な項目に収まりにくいという現状を踏まえ、当院の記録では方剤名と見立てを自院の書式で丁寧に残しておく必要があると確認する材料になります。",
      note:"臨床研究ではなく医療情報の規格に関するレビューです。" },
    { cat:"C", pmid:"42787198", journal:"Front Public Health", year:2026, type:"単施設・後方視",
      tj:"鍼の針刺し事故：職業曝露 188 件中 48 件（25.5%）が伝統医学の手技",
      te:"Characteristics of occupational exposure associated with traditional Chinese medicine-related clinical procedures and comparison with non-TCM clinical practice: a single-center retrospective study.",
      sum:["ある三次病院で 2022 年 1 月から 2025 年 12 月に報告された職業曝露（針刺しなどの事故）188 件を対象に、伝統中国医学に関連する手技で起きたものとそれ以外を比べた後方視研究です。背景・曝露の状況・事故後の対応を記述的に整理し、両群を探索的に比較しています。",
           "188 件のうち 48 件（25.53%）が伝統医学の手技に関連していました。曝露を受けた医療者は女性が 74.47%、勤務 5 年未満が 76.06% を占め、全体の 87.77% が鋭利器材による損傷でした。伝統医学関連の事故は鍼の手技中に多く、鍼による刺し傷が中心でした。年齢・性別・発生年・事故後の対応に関する指標には有意差がなく、職種、曝露が起きた工程、曝露の種類、鋭利器材の種類、受傷部位、手袋の着用には有意差がありました（いずれも p<0.05）。事故後はすべての事例で直ちに創部の洗浄と消毒が行われ、99.47% が 24 時間以内に報告されていましたが、推奨される 6 か月間の追跡検査を完了したのは 29.26% にとどまりました。追跡検査を完了した医療者に B 型・C 型肝炎ウイルスや HIV の感染は確認されませんでした。",
           "報告された職業曝露の大半は鋭利器材による損傷であり、伝統医学に関連する曝露には固有の特徴があるとされています。追跡検査の完了率が低いことが課題として示されています。"],
      use:"鍼の施術で針刺し事故が起きたときの手順（ただちに洗浄・消毒し、その日のうちに記録し、6 か月の追跡検査まで完了する）を院内で確認する材料になります。",
      note:"皮膚疾患そのものではなく、鍼の手技に伴う針刺し事故（職業曝露）の報告です。" }
  ]
},
