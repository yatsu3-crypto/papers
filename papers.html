    { cat:"A", pmid:"42776548", journal:"JAMA Dermatol", year:2026, type:"RCT",
      tj:"扁平苔癬にルキソリチニブ 1.5% クリーム：16 週で IGA 成功 50%",
      te:"Efficacy and Safety of Ruxolitinib Cream in Patients With Cutaneous Lichen Planus: A Randomized Clinical Trial.",
      sum:["皮膚を主体とする扁平苔癬の成人 64 例（IGA 3 または 4、痒み NRS 4 以上、罹患体表面積 20% 以下）を対象に、ルキソリチニブ 1.5% クリーム 1 日 2 回と基剤を 1:1 で 16 週間比較し、その後 16 週間の非盲検継続投与を行った第 2 相・二重盲検・基剤対照のランダム化比較試験です。米国・カナダの 19 施設で 2022 年 11 月から 2024 年 2 月に実施され、女性 72%、年齢中央値 57.0 歳（18〜78 歳）でした。",
           "16 週時の IGA 治療成功（0 または 1 かつベースラインから 2 段階以上の改善）は、ルキソリチニブ群 50.0%（95%CI 31.9〜68.1）に対し基剤群 21.9%（95%CI 9.3〜40.0）で、反応率の差は 29.4%（95%CI 7.6〜51.3、p=0.01）でした。痒み NRS が 4 点以上改善した割合も 48.4%（95%CI 30.2〜66.9）対 16.1%（95%CI 5.5〜33.7、差 33.5%、p=0.004）で、32 週までさらに改善しました。重篤な治療下発現有害事象や有害事象による中止はみられませんでした。",
           "ルキソリチニブクリームは扁平苔癬の皮疹と痒みを有意に減らし、皮膚型扁平苔癬の治療選択肢になりうると述べられています。"],
      use:"外用ステロイドで治まりにくい扁平苔癬の方に、外用の JAK 阻害薬という方向で研究が進んでいるとご説明する材料になります（外用薬のタブ）。" },
    { cat:"A", pmid:"42778510", journal:"Dermatitis", year:2026, type:"多施設観察研究",
      tj:"レブリキズマブ実臨床 91 例：EASI75 は 16 週 49.5%、24 週 58.6%",
      te:"Lebrikizumab in Atopic Dermatitis: Associations of Patient Characteristics and Treatment History with Clinical Outcomes.",
      sum:["イタリアの 8 つの大学病院で 2025 年 3 月から 12 月にかけて、中等症〜重症のアトピー性皮膚炎に対しレブリキズマブを 16 週以上使用した成人 91 例（男性 56%、平均 37.9 歳、ベースラインの平均 EASI 21.2）を対象とした多施設の観察研究です。主要評価項目は 16 週時の EASI75 で、EASI90・EASI100、痒みと睡眠の NRS、DLQI、安全性も評価しています。",
           "16 週時の EASI75・EASI90・EASI100 はそれぞれ 49.5%・20.9%・9.9%、24 週時には 58.6%・32.8%・25.9% に上昇しました。痒み・睡眠障害・生活の質にも臨床的に意味のある改善がみられました。生物学的製剤や JAK 阻害薬を使ったことがない方は既治療の方より数値上は反応率が高く、年齢・性別・アトピー関連の併存症・罹病期間による有意差はありませんでした。治療下発現有害事象は 23.1% で大半が軽度〜中等度、最も多かったのは結膜炎でした。",
           "実臨床でもレブリキズマブは 16 週の時点で有効かつ安全性は良好で、24 週まで臨床所見と患者報告アウトカムの改善が保たれたと結論されています。"],
      use:"レブリキズマブをご検討の方に、効果は 16 週より 24 週でさらに上がること、結膜炎に気をつけることをお伝えする材料になります。" },
    { cat:"A", pmid:"42777833", journal:"J Infect", year:2026, type:"ネットワークメタ解析",
      tj:"JAK 阻害は重症感染症が 1.44 倍：261 研究・86,844 人年の解析",
      te:"Comparative serious infection and sepsis risks with advanced therapies in IMIDs: a Bayesian network meta-analysis.",
      sum:["関節リウマチ、乾癬・乾癬性関節炎、炎症性腸疾患、およびそれらを合わせた免疫介在性炎症性疾患（IMID）全体の 4 つのネットワークで、先進的な治療薬による重症感染症と敗血症の発生率をベイズ流のネットワークメタ解析で比較した研究です。261 研究、曝露 86,844 人年が対象です。",
           "全体ネットワークでは、JAK 阻害は対照（プラセボまたはメトトレキサート）より重症感染症の発生率比が高く（率比 1.44、95%信用区間 1.12〜1.89、事後確率 99% 超）、高リスク集団では 100 人年あたり 2.1 件（95%信用区間 0.6〜4.3）の上乗せに相当しました。JAK 阻害は TNF 阻害よりも高く（率比 1.34、95%信用区間 1.00〜1.81、事後確率 97.3%）、TNF 阻害は対照より敗血症が少ない結果でした（率比 0.54、95%信用区間 0.30〜0.99、事後確率 98%）。関節リウマチにおける CTLA4 阻害、乾癬・乾癬性関節炎と炎症性腸疾患における IL-23 阻害が最も安全と順位づけられました。",
           "疾患をまたいで JAK 阻害は TNF 阻害や対照より重症感染症のリスクが高く、治療選択にあたっては薬剤ごとのリスクと疾患ごとのリスクの両方をふまえるべきと述べられています。"],
      use:"乾癬やアトピー性皮膚炎で JAK 阻害薬を始める方に、感染症への注意と受診の目安をご説明する根拠になります。" },
    { cat:"A", pmid:"42777916", journal:"J Allergy Clin Immunol Pract", year:2026, type:"後方視コホート",
      tj:"喘息でのデュピルマブ、眼の有害事象は 2.6% 対 2.1%（7,073 組）",
      te:"Ocular Safety of Dupilumab Compared With IL-5 Inhibitors in Asthma.",
      sum:["米国の TriNetX US Collaborative Network（2018〜2025 年）を用い、デュピルマブまたは IL-5 阻害薬（メポリズマブ・ベンラリズマブ）を開始した成人喘息患者を対象に、開始前 12 か月に眼の有害事象があった方を除外し、1:1 の傾向スコアマッチング後に 6 か月間の眼の有害事象を比較した後方視コホート研究（target trial emulation）です。",
           "マッチ後は 7,073 組で、アトピー性皮膚炎の合併は 0.9% と少なく、COPD の合併は約 30% でした。眼の有害事象全体はデュピルマブ 2.6% 対 IL-5 阻害薬 2.1%（調整ハザード比 1.25、95%CI 1.01〜1.55）、結膜炎は 1.5% 対 1.1%（調整ハザード比 1.38、95%CI 1.03〜1.86）で、ドライアイには有意差がありませんでした（調整ハザード比 1.15、95%CI 0.80〜1.66）。年齢・性別・アレルギー性鼻炎・COPD による効果修飾はみられませんでしたが、若年成人でリスクが高く、結膜炎は若年および男性で目立ちました。",
           "喘息におけるデュピルマブの眼の有害事象は、アトピー性皮膚炎で報告されている 8〜28% よりかなり低い頻度ながら IL-5 阻害薬よりわずかに高く、主に結膜炎によるもので、特にこれらの層では眼の経過観察を続けることが望ましいとされています。アトピー性皮膚炎そのものもこの有害事象に寄与している可能性が示唆されています。"],
      use:"デュピルマブ使用中に目の症状が出た方へ、頻度の目安と、アトピー性皮膚炎があると起こりやすい可能性をお伝えする材料になります。" },
    { cat:"A", pmid:"42776961", journal:"PLoS One", year:2026, type:"後方視コホート",
      tj:"中等症〜重症の慢性蕁麻疹で関節リウマチが 1.34 倍（各 16,413 例）",
      te:"Moderate-to-severe chronic spontaneous urticaria is associated with increased risk of immune-mediated diseases: A population-based study.",
      sum:["米国の TriNetX US Collaborative Network（2014〜2026 年）を用いた後方視コホート研究です。特発性蕁麻疹の ICD-10 診断が 2 回以上あり、オマリズマブ・デュピルマブ・シクロスポリンのいずれかで治療された方（中等症〜重症）を、年齢・性別・人種・民族・併存症・家族歴でマッチさせた、生物学的製剤もシクロスポリンも使用していない方（軽症）と比較し、その後の免疫介在性疾患の発症リスクを検討しています。",
           "マッチ後は各群 16,413 例でした。中等症〜重症群では関節リウマチの発症リスクが有意に高く（オッズ比 1.34、95%CI 1.12〜1.60、p=0.001）、シェーグレン症候群も有意に高いと報告されています（抄録の表記はオッズ比 1.04、95%CI 1.63〜2.56、p<0.0001）。いずれも臨床的因子の調整と多重比較の補正（Bonferroni、α≤0.00333）を行ったうえでの結果です。",
           "中等症〜重症の慢性特発性蕁麻疹は、軽症と比べて関節リウマチとシェーグレン症候群の発症と関連すると結論されています。"],
      use:"治りにくい蕁麻疹の方に、関節の痛みや口・目の乾きが出てきたらお知らせいただくようお伝えする材料になります。",
      note:"シェーグレン症候群のオッズ比は、抄録内で数値と信頼区間の表記が一致していません。原著の確認が必要です。" },
    { cat:"A", pmid:"42778533", journal:"Expert Opin Biol Ther", year:2026, type:"総説",
      tj:"慢性蕁麻疹の生物学的製剤：オマリズマブが基準、経口 BTK 阻害薬も",
      te:"Biologic therapies for adult chronic urticaria: what works, what doesn't, and why.",
      sum:["抗ヒスタミン薬と抗 IgE 療法でも抑えきれない成人の慢性特発性蕁麻疹について、2026 年 7 月 20 日までの PubMed/MEDLINE と ClinicalTrials.gov から、ガイドライン・ランダム化試験・規制情報・システマティックレビュー・コホート研究を集めて整理した総説です。抗 IgE 療法、IL-4／IL-13 の阻害、KIT 受容体を標的とした肥満細胞の除去、その他の生物学的経路、比較のための低分子薬を取り上げ、バイオマーカー・安全性・否定的な試験・疾患修飾について検討しています。",
           "オマリズマブが引き続き基準となる薬剤と位置づけられ、デュピルマブは IL-4／IL-13 のシグナルを阻害し慢性特発性蕁麻疹を含む複数の疾患で承認されています。経口の BTK 阻害薬レミブルチニブは IgE で定義したサブグループを越えて有効性を示し、抗 KIT 療法が開発中の有力な戦略とされています。",
           "バイオマーカーは処方を機械的に決めるものではなく、反応しやすさの見込みを示すものとして使うべきであり、疾患そのものを変える効果（disease modification）は依然として証明されていないと述べられています。"],
      use:"抗ヒスタミン薬で治まらない蕁麻疹の方に、次の選択肢の全体像と今後の見通しをご説明する材料になります。" },
    { cat:"A", pmid:"42777532", journal:"J Mycol Med", year:2026, type:"診断精度研究",
      tj:"皮膚糸状菌のマルチプレックス PCR：鏡検陰性でも陰性的中率 96.4%",
      te:"Diagnostic performance of the EurobioPlex DermaScreen multiplex PCR assay for routine dermatophyte detection in clinical practice: a single-center comparative study.",
      sum:["日常検査の場で EurobioPlex DermaScreen マルチプレックス PCR の診断能を、直接鏡検と真菌培養と比較した単施設の実践的研究です。疫学解析に 1,383 検体、診断評価に連続 134 検体を用い、培養を主たる基準、培養および／または鏡検陽性を複合基準として感度・特異度・予測値・κ 係数を算出しています。",
           "培養の陽性率は 22.9% で、分離株の 68.5% が Trichophyton rubrum でした。培養を基準とした PCR の感度は、鏡検陽性の検体で 96.2%（95%CI 80.4〜99.9）、鏡検陰性の検体で 88.2%（95%CI 63.6〜98.5）、鏡検陰性検体での陰性的中率は 96.4%（95%CI 87.7〜99.6）でした。PCR と培養の一致は fair 程度（κ=0.21〜0.39）で、主に PCR 陽性・培養陰性という食い違いによるものでした。複合基準での感度は 89.5%（95%CI 78.5〜96.0）です。",
           "日常検査においてマルチプレックス PCR は感度が高く、特に鏡検陰性の検体で「否定する力」が強いため、従来の真菌検査と補い合う形で用いることが支持されると結論されています。"],
      use:"爪白癬を疑うのに鏡検で菌が確認できない方に、遺伝子検査という選択肢があるとご説明する材料になります。" },
    { cat:"A", pmid:"42778194", journal:"Contact Dermatitis", year:2026, type:"後方視",
      tj:"スズ感作は連続患者の 6.7%：口囲・眼囲の皮膚炎で疑う",
      te:"Tin Sensitization in Belgium and the Netherlands: Complementary Findings From Two Independent Retrospective Studies.",
      sum:["スズは知られてはいるものの頻度は低いとされてきた接触アレルゲンです。本研究はベルギーとオランダの独立した 2 つの後方視コホートで、連続してパッチテストを受けた患者 1,919 例（アントワープ大学病院、複数のスズ製剤で検査）と、金属アレルギーの疑いまたは口囲・口腔の症状で紹介された 536 例（Amsterdam UMC、塩化スズで検査）を対象に、スズ感作の頻度と臨床的関連性を調べています。",
           "連続コホートでは 128/1,919 例（6.7%）が少なくとも 1 つのスズ製剤に陽性で、そのうち 35 例（27.3%）が臨床的に関連ありと判定されました。紹介例のコホートでは 61/536 例（11.4%）が感作され、評価された 50 例のうち 16 例（32.0%）が臨床的に関連ありでした。臨床的に関連する症例では口囲・口腔の症状が最も多く、連続コホートではそれに次いで眼囲皮膚炎がみられました。",
           "スズの感作はこれまで考えられていたより多く、主な症状は口囲ですが、眼囲皮膚炎もしばしばみられると述べられています。"],
      use:"原因のはっきりしない口のまわり・目のまわりの皮膚炎の方に、歯磨き剤などに含まれるスズを念頭に置いてパッチテストを検討する材料になります（パッチのタブ）。" },
    { cat:"C", pmid:"42779397", journal:"Zhen Ci Yan Jiu", year:2026, type:"動物実験",
      tj:"電気鍼が乾癬の再燃を抑制（マウス）：CD8+ 記憶 T 細胞が低下",
      te:"[Mechanism of electroacupuncture inhibiting psoriasis recurrence by regulating CD8+ memory T cells based on the TRAF2/NF-κB signaling pathway].",
      sum:["背部へのイミキモド外用で再燃性乾癬モデルを作った BALB/c マウスを、無処置対照群・モデル群・電気鍼群・メトトレキサート（MTX）群・電気鍼＋MTX 群に分け、曲池（LI11）と足三里（ST36）に疎密波（2 Hz／30 Hz、1 mA）を 1 日 1 回 15 分、7 日間行って、PASI スコア・HE 染色・皮疹部のサイトカイン・記憶 T 細胞の割合・TRAF2／NF-κB 経路のタンパクを比較した動物実験です。NF-κB の阻害薬と作動薬を加えた検証実験も行っています。",
           "モデル群では対照群に比べ PASI スコア、IL-6・TNF-α・IL-17A、CD8+ および CD4+ 組織常在記憶 T 細胞（TRM）の割合、IL-15・CXCL9・CXCL10・CXCR3 の mRNA、p-TRAF2・p-NF-κB p65・NF-κB p52 のタンパクがいずれも増加し、電気鍼群と電気鍼＋MTX 群ではこれらが有意に改善しました（CD4+ TRM の割合を除く）。CD4+ TRM と IL-17A を除く指標は、電気鍼を含む 2 群で MTX 群より低い値でした。検証実験では NF-κB 阻害薬の併用でこれらの指標がさらに低下し、作動薬の併用では上昇しました。",
           "電気鍼は再燃性乾癬の症状を和らげ、その機序として TRAF2／NF-κB 経路の活性化を抑え、CD8+ 記憶 T 細胞を特異的に低下させることが関与する可能性があると述べられています。"],
      use:"乾癬で鍼灸をご希望の方に、動物モデルで再燃を抑える方向の報告があるとお伝えする材料になります（ヒトでの効果は未確認と添えてご説明ください）。",
      note:"マウスを用いた動物実験です。ヒトでの有効性は確認されていません。" }
  ]
},
{
  date: "2026-09-24",
  range: { A: "2026-09-22〜09-24", B: "2026-09-22〜09-24", C: "2026-08-25〜09-24" },
  items: [
    { cat:"A", pmid:"42774942", journal:"J Allergy Clin Immunol Glob", year:2026, type:"系統的評価",
      tj:"慢性蕁麻疹の検査 16 種を評価：多くは追加の価値が乏しい",
      te:"Evaluation of the clinical utility of medical tests in chronic urticaria.",
      sum:["慢性蕁麻疹で一般的に行われる検査について、文献レビューと国際的な専門家への聴取で 16 の検査を同定し、STARD に沿って精度を評価したうえで、診療上の判断や患者アウトカムへの影響という観点から臨床的有用性を検討した 3 段階の研究です。",
           "診断面では、写真による記録と誘発試験が誤診を減らし、IgE 感作の評価は不要な制限を避けるのに役立つとされました。自己免疫性のエンドタイプの同定では、急性期反応物質・自己血清皮内反応・IgG 抗 TPO 抗体・総 IgE が中等度の精度で、IgE 抗 TPO 抗体が最も良好でした。一方、よく依頼される検査の多くは精度が限られ、アウトカムへの明らかな有用性は示されませんでした。",
           "病態の理解と治療選択は進んだものの、臨床的に有用な診断ツールの開発と検証は限られており、今後は患者中心のアウトカムを改善する検査を優先すべきと述べられています。"],
      use:"蕁麻疹で「原因を調べてほしい」とご希望があったときに、皮疹の写真記録と誘発試験を優先し、やみくもな採血は必ずしも役に立たないとご説明する材料になります。" },
    { cat:"A", pmid:"42775713", journal:"Contact Dermatitis", year:2026, type:"後方視",
      tj:"パッチテストの再現性は抗原しだい：HEMA・MBT は高く、ラノリン系は低め",
      te:"Reproducibility of Patch Test Reactions and Interpretation of Doubtful Results: A Retrospective Study of Identical Haptens Tested Simultaneously in Different Series.",
      sum:["2015〜2025 年に連続してパッチテストを受けた患者のデータを後方視的に解析し、同一の抗原が異なるシリーズで同時に貼られたときの陽性反応の再現性と、疑陽性（?+）の解釈を、対になる共反応のパターンから検討した研究です。対象は HICC（Lyral）5%、Amerchol L-101 50%、ラノリンアルコール 30%、HEMA 2%、MBT 2%、ペルーバルサム 25%（いずれもワセリン基剤）の 6 抗原です。",
           "再現性は抗原によって異なり、HEMA と MBT は一致度が高く（substantial〜almost perfect）、HICC も一致度は高いものの、香料シリーズでの陽性率がベースラインシリーズより有意に高いという結果でした。Amerchol L-101・ラノリンアルコール・ペルーバルサムは一致度が低め（fair〜moderate）でした。疑陽性の多くは単独の反応でしたが、ベースラインシリーズの HICC の疑陽性のうち 43.8% は香料シリーズの反応に裏づけられていました。",
           "再現性は抗原に強く依存し、対になる共反応の情報が、食い違う陽性や疑陽性を解釈する手がかりになると結論されています。"],
      use:"パッチテストで判定が微妙だった抗原について、別シリーズの同一抗原の反応も併せて見る、あるいは再検査を検討する根拠になります（パッチのタブ）。" },
    { cat:"A", pmid:"42775584", journal:"J Dermatolog Treat", year:2026, type:"実臨床コホート",
      tj:"小児発症の乾癬は IL-17 阻害薬で PASI90 到達が良好（1,873 例）",
      te:"Treatment response to systemic therapies in pediatric-onset versus adult-onset psoriasis: a longitudinal real-world study.",
      sum:["IL-17 阻害薬、IL-23 または IL-12/23 阻害薬、メトトレキサート、光線療法を受けた乾癬患者 1,873 例で、小児発症群と成人発症群の治療反応を 1・2・3・6 か月後に比較した実臨床の縦断研究です。主要評価項目は PASI90 と DLQI 0/1 で、一般化推定方程式（GEE）により交絡を調整しています。",
           "IL-17 阻害薬を受けた 576 例では、PASI90 達成率が小児発症群 26.1〜62.2% に対し成人発症群 14.6〜51.2%、DLQI 0/1 は 30.6〜45.0% 対 20.3〜40.0% でした。調整後も成人発症群は PASI90 達成のオッズが低い結果でした（調整オッズ比 0.62、95%CI 0.42–0.89、p=0.011）。IL-23・IL-12/23 阻害薬、メトトレキサート、光線療法では有意差はみられませんでした。",
           "小児発症の乾癬は IL-17 阻害薬での経過が良好である可能性が示されましたが、発症年齢を治療選択に生かせるかどうかは今後の比較研究が必要とされています。"],
      use:"若いころから乾癬がある方に全身療法をご相談する際、発症年齢によって効き方が異なる可能性があるとお伝えする参考になります。" },
    { cat:"A", pmid:"42775803", journal:"J Eur Acad Dermatol Venereol", year:2026, type:"前向きコホート",
      tj:"デュピルマブで EASI は 28→2、でも共焦点顕微鏡の所見は残る（37 例）",
      te:"Prospective reflectance confocal microscopy monitoring in dupilumab-treated atopic dermatitis.",
      sum:["中等症〜重症のアトピー性皮膚炎で生後 6 か月以上の小児・成人 37 例（小児 51.4%、男性 67.6%）を対象に、デュピルマブ開始時・12 週・24 週に臨床評価と反射共焦点顕微鏡（RCM）による観察を行った、単施設・実臨床の前向きコホート研究です。",
           "開始時の EASI 中央値は 28.0（IQR 19.0–33.0）で、全例に表皮の構築の乱れ・海綿状態・血管拡張がみられ、37 例中 34 例（91.9%）に真皮表皮接合部の炎症がありました。24 週で EASI 中央値は 2（IQR 1–6）まで低下し、EASI-75 達成は 76.2%。棘細胞層肥厚（81.8%）・過角化（72.7%）・錯角化（66.7%）・表皮の炎症性細胞浸潤（64.7%）は消退した一方、表皮の構築の乱れ・海綿状態・血管拡張は EASI-75 達成者でも残っていました。",
           "臨床的な改善が必ずしも微細構造の正常化と一致するとは限らず、RCM が補足的な情報を与えうると述べられています。"],
      use:"見た目が落ち着いても皮膚の状態は回復の途中であることを説明し、自己判断での治療中断を避けていただく材料になります。" },
    { cat:"A", pmid:"42771826", journal:"Photodermatol Photoimmunol Photomed", year:2026, type:"メタ解析",
      tj:"ニキビ跡：レーザーが効果で優位、針治療は色素沈着が少ない（27 研究 1,137 例）",
      te:"Comparative Efficacy and Safety of Needling-Based Therapies Versus Ablative Fractional Lasers for Scar Management: A Systematic Review and an Exploratory Meta-Analysis.",
      sum:["瘢痕に対する針を用いた治療（マイクロニードリング等）とアブレイティブ・フラクショナルレーザーを比較した研究 27 件・1,137 例（RCT 17 件、非ランダム化比較 2 件、コホート 8 件）を、PRISMA 2020 と Cochrane ハンドブックに沿って統合したシステマティックレビューと探索的メタ解析です。多くは萎縮性・肥厚性のざ瘡瘢痕（18 件・870 例）を扱っています。",
           "いずれの治療も瘢痕の外観を改善しました。萎縮性のざ瘡瘢痕では、フラクショナル CO2 レーザー（一部の研究では Er:YAG）がマイクロニードリングより大きな改善を示す比較が多い一方、針を用いた治療はダウンタイムが短く忍容性が良好で、色素異常の副作用が少ない結果でした。マイクロニードリング高周波はレーザーに近い効果とより良好な安全性を示しました。",
           "どちらも瘢痕を改善しうるものの、レーザーは効果、針を用いた治療は忍容性と色素の安全性で優れる可能性があり、研究間の異質性のため慎重な解釈が必要とされています。"],
      use:"ニキビ跡の治療をご相談いただいた際に、効果の大きさとダウンタイム・色素沈着のリスクを比べてご案内する材料になります。" },
    { cat:"A", pmid:"42770647", journal:"Clin Pediatr (Phila)", year:2026, type:"システマティックレビュー",
      tj:"小児のプロバイオティクスは菌株しだい、アトピー性皮膚炎は中等度",
      te:"Probiotics as Functional Dietary Interventions for Gut Health, Immune Modulation, and Overall Well-Being: A Systematic Review.",
      sum:["小児における菌株別のプロバイオティクス介入について、PubMed・Scopus・Web of Science で 2006〜2024 年の研究を検索し、臨床効果・安全性・作用機序を PRISMA 2020 に沿って系統的に評価したレビューです。",
           "急性下痢症には Lactobacillus rhamnosus GG と Saccharomyces boulardii の根拠が強く、アトピー性皮膚炎では複数菌株の併用が中等度の効果を示しました。ピロリ菌の除菌率は補助的な併用で改善し、喘息や自閉スペクトラム症についての根拠は予備的な段階にとどまります。菌株・用量・研究デザインの異質性が大きく、一般化には限界があります。",
           "プロバイオティクスの効果は菌株と病態に依存するため、標準化された RCT と精密な微生物叢アプローチが必要と述べられています。"],
      use:"「乳酸菌はアトピーに効きますか」と尋ねられたときに、菌株によって差があり過度な期待は避けたいとお伝えする材料になります（生活指導のタブ）。" },
    { cat:"A", pmid:"42771767", journal:"Clin Exp Dermatol", year:2026, type:"比較研究",
      tj:"乾癬の全身療法：AI は網羅性で専門医と同等以上、重大な誤りは多い",
      te:"Guideline-Based Evaluation of Large Language Models in Psoriasis Treatment.",
      sum:["中等症〜重症の乾癬の全身療法について、EuroGuiDerm の生きたガイドラインをもとにリスク階層別の 40 シナリオの問題集を作り、5 つの大規模言語モデル（LLM）と専門医 5 名の回答を網羅性と安全性の観点から採点して比較した研究です。",
           "正規化した網羅性スコアは群間で有意に異なり（χ2=20.55、df=5、P<0.001、ε2=0.066）、一部の LLM は専門医より高得点でした。必ず押さえるべき項目の的中率は専門医 68% に対し LLM は 79〜90%（P=0.003）で、低リスクの場面では LLM が上回りました（χ2=17.54、P=0.004）が、高リスクでは差がなくなりました（P=0.293）。一方、重大な誤りは専門医 1 件に対し各 LLM は 5〜9 件（Q=17.10、P=0.004）で、高リスクの場面では全ての LLM が少なくとも 1 件の重大な誤りを犯しました。",
           "現在の LLM はガイドラインに沿った網羅性では皮膚科医に匹敵しうるが、複雑で重大な場面では安全性に関わる誤りを起こしやすいと結論されています。"],
      use:"院内で AI を使う際に、下調べには役立つが最終的な判断は必ず医師が行うという運用を裏づける材料になります。" },
    { cat:"A", pmid:"42771994", journal:"EBioMedicine", year:2026, type:"基礎研究（ヒト検体＋動物実験）",
      tj:"高齢者のアトピー性皮膚炎では NK2（FCGR3A+）NK 細胞が減っている",
      te:"Age-related changes of FCGR3A+ natural killer cells and their association with elderly atopic dermatitis.",
      sum:["高齢者のアトピー性皮膚炎（eAD）における NK 細胞の役割を、皮疹部の single-cell RNA シークエンス・フローサイトメトリー・免疫蛍光染色に加え、MC903 誘発 AD マウスでの NK 細胞除去と移入、線維芽細胞・マクロファージとの共培養系を用いて調べた研究です。",
           "若年の AD の皮疹では活性化 NK 細胞が増えており、マウスでは NK 細胞を除去すると皮膚炎が悪化し、活性化 NK 細胞を移入すると軽快しました。高齢者の AD では NK 細胞の数・機能がいずれも低下し、皮膚の NK 細胞 3 亜型のうち NK2（FCGR3A+）が有意に減っていました。老化した線維芽細胞が CXCL14 と CXCL12 のバランスを乱して NK2 細胞の集積を妨げており、NK2 細胞は M2 マクロファージへの分極を抑えていました。",
           "NK 細胞、とくに NK2 亜型が AD の病態に関わり、高齢者の AD において意義を持ちうると述べられています。"],
      use:"高齢の方のアトピー性皮膚炎が若い方と同じ病態ではない背景を説明する参考になります。基礎研究が中心で、ヒトでの治療効果は未確認と添えてください。" },
    { cat:"A", pmid:"42772595", journal:"J Invest Dermatol", year:2026, type:"原著",
      tj:"かゆみが主体のアトピー性皮膚炎は心理社会的な負担が大きい",
      te:"The itch-dominant phenotype of atopic dermatitis carries a disproportionate psychosocial burden.",
      sum:["アトピー性皮膚炎のうち「かゆみが主体の表現型（itch-dominant phenotype）」に注目し、その心理社会的な負担を検討した報告です。",
           "タイトルでは、この表現型が不釣り合いに大きな心理社会的負担を抱えていると述べられています。",
           "抄録が公開されていないため、対象・方法・具体的な数値は原著の確認が必要です。"],
      use:"皮疹が軽くてもかゆみが強い方のつらさを受け止め、睡眠や気分への影響も併せてお伺いする姿勢の裏づけになります。",
      note:"抄録なし（タイトルのみで要約）。原著確認が必要。" },
    { cat:"A", pmid:"42768820", journal:"Pediatr Allergy Immunol", year:2026, type:"レター",
      tj:"家庭のほこり中のクルミ・カシュー・ピーナッツ蛋白と乳幼児 AD の感作",
      te:"Walnut, cashew, and peanut proteins in household dust and sensitization in young children with atopic dermatitis.",
      sum:["アトピー性皮膚炎のある幼い子どもについて、家庭のほこりに含まれるクルミ・カシューナッツ・ピーナッツの蛋白と、これらへの感作との関連を扱った報告（レター）です。",
           "タイトルからは、室内のほこり中のナッツ蛋白と感作を結びつけて検討したことが分かります。",
           "抄録が公開されていないため、測定方法・対象数・関連の強さは原著の確認が必要です。"],
      use:"湿疹のあるお子さんのご家庭で、ナッツを扱った後の掃除など室内環境についてお尋ねするきっかけになります（食物アレルギーのタブ）。",
      note:"抄録なし（タイトルのみで要約）。原著確認が必要。" },
    { cat:"B", pmid:"42771814", journal:"JMIR Res Protoc", year:2026, type:"RCT プロトコル",
      tj:"黄連解毒湯で大腸憩室出血の再出血を防げるか：二重盲検 RCT の計画",
      te:"Prevention of Rebleeding in Colonic Diverticular Bleeding Using Orengedokuto: Protocol for a Double-Blind Randomized Controlled Trial.",
      sum:["大腸憩室出血で自然止血が得られ、出血源が同定できず内視鏡的止血が行えなかった患者を対象に、黄連解毒湯による再出血予防の有効性と安全性を探索的に評価する、二重盲検ランダム化比較試験の実施計画です。",
           "最小化法による動的割付で 1:1 に割り付け、登録から 24 時間以内に、黄連解毒湯＋標準治療またはプラセボ（コーンスターチ）＋標準治療を 1 回 2 カプセル・1 日 3 回で 14 日間投与し、その後 31 日間観察します。標準治療は絶食と輸液です。主要評価項目は再出血した患者の割合、副次評価項目は在院日数・経口摂取再開までの時間・再出血の重症度（時期と貧血の程度を含む）・二次的な再出血の頻度です。",
           "黄連解毒湯は鼻出血・吐血・下血などの出血性病態に用いられてきた処方で、再出血予防に有効であれば入院や内視鏡の再施行を減らせる可能性があるとされています（本論文は計画であり、結果はまだ報告されていません）。"],
      use:"黄連解毒湯をお出しする際に、日本で臨床試験が進んでいる処方だとお伝えする材料になります。結果が出るのはこれからという点も添えてください。",
      note:"プロトコル論文（結果は未発表）。皮膚領域外。" },
    { cat:"B", pmid:"42772620", journal:"J Ethnopharmacol", year:2026, type:"動物実験",
      tj:"当帰芍薬散が高齢妊娠ラットの着床後損失を減らし sFlt-1 を低下",
      te:"Tokishakuyakusan Ameliorates Age-Related Pregnancy Loss by Modulating Endocrine, Inflammatory, and Placental Factors in an Advanced Maternal Age Rat Model.",
      sum:["婦人科領域で広く用いられる漢方薬・当帰芍薬散について、高齢妊娠モデル（36 週齢の雌ラット）と若齢対照（12 週齢）を比較し、妊娠の転帰と内分泌・炎症・胎盤形成に関わる因子への影響を調べた動物実験です。交配前の 4 週間、3% 当帰芍薬散を含む飼料または対照飼料を与え、妊娠 19 日目に評価しました。",
           "高齢群では生存胎仔率の低下・着床後損失の増加・胎仔発育不全・胎盤効率の低下に加え、血漿プロゲステロンの低下、炎症性サイトカイン/ケモカインの上昇、胎盤 Flt1・Pgf mRNA の低下、血中 sFlt-1 の上昇がみられました。当帰芍薬散の投与により、生存胎仔率の上昇、着床後損失の減少、胎盤効率の改善、プロゲステロンの上昇、炎症性因子の抑制、胎盤 Flt1 発現の増加、血中 sFlt-1 の低下が認められました。",
           "加齢に伴う流産には内分泌のバランス・炎症・胎盤機能の障害が関わっており、当帰芍薬散がこれらを改善して治療戦略になりうると述べられています。"],
      use:"当帰芍薬散をご希望の方に、基礎研究が進められている処方だとお伝えする材料になります。ラットでの実験であり、ヒトでの効果は未確認と添えてください。",
      note:"皮膚領域外（産科領域の基礎研究）。" }
  ]
},

  items: [
    { cat:"A", pmid:"42770913", journal:"Acta Derm Venereol", year:2026, type:"レジストリ研究",
      tj:"慢性蕁麻疹 8,784 人：36%が全身ステロイド併用、オマリズマブは 8.5%",
      te:"Chronic Spontaneous Urticaria in Finland - A Nationwide Registry Study on Epidemiology and Treatment Patterns in Secondary Care.",
      sum:["フィンランドの二次医療レジストリ（2001〜2023 年）で成人の慢性特発性蕁麻疹（CSU）8,784 例を同定し、有病率・発症率と治療パターンを調べた全国研究です。女性 70%、平均年齢 45.3 歳でした。",
           "2022 年の時点有病率は 0.21%、年齢調整発症率は 10 万人年あたり 9.34。抗ヒスタミン薬は 85.8% が受け、36.1% が並行して全身ステロイドを要した一方、オマリズマブの投与は 8.5% にとどまりました。喘息・高血圧・うつ病の併存が多くみられました。",
           "全身ステロイドの使用割合が高くオマリズマブの導入が遅れている点が管理上の課題であり、償還制度や受診経路の影響も考えられると述べられています。"],
      use:"なかなか治まらない蕁麻疹で全身ステロイドを繰り返す前に、抗ヒスタミン薬の調整やオマリズマブの適応を早めに検討する根拠になります。" },
    { cat:"A", pmid:"42770623", journal:"Clin Exp Allergy", year:2026, type:"総説",
      tj:"オマリズマブの次へ：慢性蕁麻疹の新規治療の現在地",
      te:"Beyond Omalizumab: Emerging Biologic and Small Molecule Therapies in Chronic Spontaneous Urticaria.",
      sum:["抗ヒスタミン薬とオマリズマブでは十分に制御できない慢性特発性蕁麻疹（CSU）について、IgE 非依存性の肥満細胞活性化にも関わる BTK・IL-4/IL-13・KIT・MRGPRX2・JAK-STAT を標的とする新規薬剤を、機序・有効性・安全性の観点から整理した総説です。",
           "経口 BTK 阻害薬レミブルチニブが米国・EU で成人に承認され、デュピルマブは 2025 年に 12 歳以上、2026 年に 2〜11 歳へ広がりました。バルゾルボリマブは成人 1,939 例の第 3 相組み入れを完了し、リゲリズマブはオマリズマブに対する優越性を示せませんでした。",
           "制約はもはや標的の数ではなくエビデンスの偏り（成人中心で小児・高齢者のデータが乏しい）であり、直接比較試験や年齢を含めた試験設計、長期安全性データが急務とされています。"],
      use:"抗ヒスタミン薬で治まらない蕁麻疹の方に、今後選べる薬が増えていく見通しを伝える材料になります。日本での承認状況は別に確認が必要です。" },
    { cat:"A", pmid:"42769701", journal:"Dermatol Res Pract", year:2026, type:"メタ解析",
      tj:"抗OX40抗体ロカチンリマブ：EASI-75 は改善も開発は中止",
      te:"Efficacy and Safety of Subcutaneous Rocatinlimab in Adults With Moderate-to-Severe Atopic Dermatitis: A Systematic Review and Meta-Analysis of Randomised Placebo-Controlled Trials.",
      sum:["中等症〜重症のアトピー性皮膚炎（AD）の成人を対象に、皮下投与の抗 OX40 抗体ロカチンリマブとプラセボを比較した RCT 3 件・1,767 例（うち 1,305 例が実薬）を統合したシステマティックレビューとメタ解析です。",
           "16 週時点の EASI-75 達成はロカチンリマブで有意に多く（OR 3.58、95%CI 1.53–8.40、p=0.02）、vIGA-AD 0/1 は方向性は良好でも有意差なし（OR 4.06、95%CI 0.56–29.47、p=0.09）。重篤な有害事象（OR 1.60）と有害事象による中止（OR 1.28）に有意差はありませんでしたが、信頼区間は広いものでした。",
           "短期の有効性は示唆されるものの寛解の持続や長期の有益性・リスクは確立しておらず、安全性レビュー後に開発計画が中止された経緯を踏まえ慎重に解釈すべきとされています。"],
      use:"新しい注射薬について尋ねられたときに、開発段階の薬は途中で中止されることもあると丁寧に説明する材料になります。" },
    { cat:"A", pmid:"42770912", journal:"Acta Derm Venereol", year:2026, type:"コホート",
      tj:"運動習慣のある人は自己免疫性水疱症が 31% 少ない（47.6万人）",
      te:"Physical Activity and Risk of Autoimmune Bullous Skin Diseases: A Prospective Cohort Study.",
      sum:["UK Biobank の 476,057 人で、習慣的な身体活動と自己免疫性水疱症（天疱瘡・類天疱瘡）の発症との関連を、多変量調整 Cox モデルで検討した前向きコホート研究です。",
           "中央値 15.21 年の追跡で 272 例（天疱瘡 61 例・類天疱瘡 211 例）が発症。活動的な群は不活発な群より発症リスクが 31% 低く（調整 HR 0.69、95%CI 0.54–0.88）、遺伝リスクが高く不活発な人は遺伝リスクが低く活動的な人より高リスクでした（HR 2.12、95%CI 1.47–3.07）。BMI が関連の 8.86% を媒介していました。",
           "遺伝的素因やその他の危険因子を調整しても、定期的な運動は自己免疫性水疱症の発症リスクの低さと関連すると示されています（観察研究であり因果関係を示すものではありません）。"],
      use:"生活指導で運動習慣をすすめる際に、皮膚疾患との関連を示す一例として紹介できます。" },
    { cat:"A", pmid:"42770339", journal:"Contact Dermatitis", year:2026, type:"後方視",
      tj:"PPD パッチテスト陽性 4.3%、「PPDフリー」10製品中 9 製品に交差抗原",
      te:"Paraphenylenediamine Contact Allergy and Post-Diagnostic Outcomes: A Single-Centre Study From the United Kingdom.",
      sum:["英国の大学病院で 2018〜2025 年に PPD（パラフェニレンジアミン）のパッチテストを受けた 1,306 例を後方視的に調べ、あわせて英国で販売される「PPD フリー」表示の永久染毛剤 10 製品の成分表に交差反応性アミンが含まれるかを確認した研究です。",
           "PPD 陽性は 56 例（4.3%）で平均 49 歳・女性 82%、曝露源は毛染めが 77%、職業性が 14%。パラトルエンジアミン（PTD）を追加検査した 37 例中 10 例（27%）が陽性でした。電話で追跡できた 31 例中 24 例（77%）が回避により寛解していました。",
           "「PPD フリー」10 製品のうち交差反応性アミンを含まないものは 1 製品のみで、表示の改善と丁寧な指導が必要と結論されています。"],
      use:"毛染めによるかぶれでパッチテスト陽性が出た方に、PPD フリー表示でも安心とは限らないため成分表の確認をお願いする根拠になります。" },
    { cat:"A", pmid:"42769107", journal:"Front Pediatr", year:2026, type:"症例対照＋介入研究",
      tj:"小児ADの環境要因：黄色ブドウ球菌定着で AOR 4.08、PM2.5 で 2.48",
      te:"The role and management of dietary and environmental factors in pediatric atopic dermatitis.",
      sum:["小児アトピー性皮膚炎（AD）535 例と年齢・性をマッチさせた健常児 535 例で食事・環境要因を調べ、続いて 66 例を在宅ケア＋アレルゲン別の食事指導群（33 例）と通常介入群（33 例）に分けて 3 か月後を比較した二段階の研究です。",
           "AD 発症と関連したのは牛乳・卵の早期感作（AOR 3.18、95%CI 2.08–4.78）、冬季の室内湿度 40% 未満（AOR 1.92）、PM2.5 35 μg/m³ 超（AOR 2.48）、黄色ブドウ球菌の定着率 50% 超（AOR 4.08）でした。介入群の有効率は 81.82% 対 45.45%、疾患コントロール（ADCT）は 6.73 対 12.58 と良好で、QOL・睡眠も改善しました。",
           "食事制限は感作が確認されたものに限り栄養評価とあわせて行い、環境面では湿度の管理と皮膚の細菌環境の是正に重点を置くべきと述べられています。"],
      use:"冬の加湿と保湿、そして「調べずに食べ物を止めない」という指導を、生活指導・食物アレルギーのタブで伝える裏づけに使えます。" },
    { cat:"A", pmid:"42770385", journal:"Clin Exp Dermatol", year:2026, type:"メタ解析",
      tj:"ビタミンD サプリはメラノーマを減らさない（RCT 5件・5.7万人）",
      te:"Vitamin D Supplementation and Melanoma Incidence and Recurrence: A Meta-analysis of Randomized Controlled Trials.",
      sum:["経口ビタミン D 補充（カルシウム併用を含む）とメラノーマの発症・再発を報告した RCT 5 件・56,901 人を統合した、PRISMA 準拠のシステマティックレビューとメタ解析です。",
           "再発（統合 HR 1.23、95%CI 0.29–5.18）も発症（統合 RR 0.94、95%CI 0.71–1.24）もビタミン D 補充と有意な関連はなく、用量や追跡期間が異なっても結果は一貫していました。",
           "現在のランダム化エビデンスは、メラノーマの発症・再発を減らす目的でのビタミン D 補充を支持しないとされています（多くの試験でメラノーマは副次評価項目であり、イベント数も少ない点に留意）。"],
      use:"ビタミン D のサプリメントで皮膚がんを予防できるかと尋ねられたときに、現時点の根拠としてお答えする材料になります。" },
    { cat:"A", pmid:"42769163", journal:"Front Immunol", year:2026, type:"動物実験",
      tj:"AD のかゆみに関わる表皮脂質代謝 PLA2G2F／P-LPE 経路",
      te:"PLA2G2F/lysoplasmalogen axis links epidermal lipid metabolism to type 2 inflammation and itch in atopic dermatitis.",
      sum:["2 型サイトカインで誘導される分泌性ホスホリパーゼ A2（PLA2G2F）が角化細胞でリゾプラスマローゲン（P-LPE）を産生する経路について、マウスの AD モデルとヒトの角層検体で解析した基礎研究です。",
           "Pla2g2f を欠損させたマウスでは角化細胞の IL-33 発現・表皮肥厚・血清 IgE・2 型炎症・搔破行動が減り、分泌性 PLA2 阻害薬の外用や P-LPE の酵素的分解でも搔破が抑えられました。AD 患者の角層では P-LPE が有意に高く、重症度と正の相関を示しました。",
           "表皮の脂質代謝と IL-33 を介した 2 型炎症・かゆみをつなぐ経路として、新たな治療標的およびバイオマーカーの候補になりうると述べられています。"],
      use:"かゆみが皮膚のバリアや脂質の状態とも結びつくことを説明する参考になります。動物実験が中心で、ヒトでの効果は未確認と添えてください。" },
    { cat:"A", pmid:"42767840", journal:"J Dermatol", year:2026, type:"レター",
      tj:"膿疱性乾癬に似た海綿状膿疱を示した白癬（tinea incognito）",
      te:"Tinea Incognito Caused by Trichophyton mentagrophytes With Spongiform Pustule: A Histopathological Pitfall Mimicking Pustular Psoriasis.",
      sum:["Trichophyton mentagrophytes による tinea incognito（外用などで修飾されて典型像を失った白癬）の 1 例を、病理診断上の落とし穴として報告したレターです。",
           "病理組織で海綿状膿疱（spongiform pustule）がみられ、膿疱性乾癬と紛らわしかったとタイトルに示されています。",
           "抄録が公開されていないため、経過・診断根拠・治療については原著の確認が必要です。"],
      use:"ステロイド外用で改善しない環状・膿疱性の皮疹では、まず真菌鏡検を行うことを思い出す材料になります。",
      note:"抄録なし（タイトルのみで要約）。原著確認が必要。" },
    { cat:"C", pmid:"42768220", journal:"Support Care Cancer", year:2026, type:"単群試験",
      tj:"日本式鍼灸 12 回でタキサン後の神経障害性疼痛が −1.2（30例）",
      te:"Multimodal Japanese-style acupuncture and moxibustion for taxane-related chemotherapy-induced peripheral neuropathy in breast cancer survivors.",
      sum:["乳がんの根治治療を終えて 3 か月以上経ち、中等度以上のタキサン関連末梢神経障害（CIPN）の痛み（BPI 項目 5 が 4 以上）が残る女性 30 例に、毫鍼・鍉鍼・運動鍼・間接灸・温罨法・セルフケア指導を組み合わせた多面的日本式鍼灸（MJAM）を週 1 回・計 12 回行った単施設の単群試験です。",
           "28 例（93.3%）が完遂し、有害事象は 9 例（30.0%）でいずれも軽度（グレード 1）でした。BPI 項目 5 のベースラインからの変化は 4 週 −0.1（p=0.56）、8 週 −0.7（95%CI −1.2〜−0.2、p=0.008）、12 週 −1.1、16 週 −1.2（p<0.0001）と経時的に改善しました。",
           "安全で実施可能であり痛みの軽減と関連したが、確認のためのランダム化比較試験が必要とされています。"],
      use:"がん治療後のしびれや痛みで鍼灸を希望される方への説明材料になります。単群試験のため、効果の確認はこれからという点も添えてください。",
      note:"皮膚領域外（がん支持療法）。日本式鍼灸の臨床研究として収載しました。" },
    { cat:"C", pmid:"42744639", journal:"Zhongguo Zhen Jiu", year:2026, type:"症例報告",
      tj:"火鍼＋吸角で難治性の糖尿病性潰瘍が 3 週間で上皮化（1例）",
      te:"[Refractory diabetic ulcer induced by recurrent herpes simplex treated with shallow lining-up fire needling therapy with filiform needle].",
      sum:["再発性の単純ヘルペスを契機に生じた難治性の糖尿病性潰瘍 1 例に対し、毫鍼（0.30mm×40mm）を 5〜15 本並べて加熱し、創面に浅く速く刺す排刺火鍼に吸角を併用し、3 日に 1 回・週 2 回行った症例報告です。",
           "初回治療の 3 日後に痂皮が形成され、2 週間で潰瘍は著明に縮小して新生肉芽が出現、3 週間で色素沈着を残して完全に上皮化しました。治療中は血糖も安定して低下し、1 か月の追跡で再発はありませんでした。",
           "難治性創傷に対する火鍼療法の有用性を示す 1 例として報告されています（単一症例であり一般化はできません）。"],
      use:"治りにくい皮膚潰瘍で鍼灸の併用を相談された際の参考になりますが、1 例報告であり、糖尿病性潰瘍の標準的な創傷管理が前提です。" }
  ]

    { cat:"A", pmid:"42766442", journal:"Cornea", year:2026, type:"後方視コホート",
      tj:"デュピルマブの眼合併症：6.4万人の実臨床データ",
      te:"Ocular Adverse Events Associated With Dupilumab: Analysis From a Real-World Database.",
      sum:["米国の電子カルテ網 TriNetX で、デュピルマブ開始後 2 年以上追跡できた 64,497 例の眼合併症の累積発生割合を調べ、アトピー性皮膚炎（AD）と非 AD 適応を傾向スコアマッチで比較。",
           "2 年累積は結膜炎 1.39%・ドライアイ 1.20%・眼瞼炎 0.39%・角膜炎 0.32% と低頻度。AD 群は非 AD 群より眼瞼炎（0.46 vs 0.22%）・結膜炎（1.97 vs 1.52%）・角膜炎（0.43 vs 0.23%）が有意に多かった。",
           "全例の定期的な眼科スクリーニングは不要かもしれないが、AD 患者では眼表面の炎症に注意し、症状が出たら速やかに眼科へ紹介する。"],
      use:"デュピルマブ導入時の説明（「目のかゆみ・充血・目やにが出たらすぐ教えてください」）と眼科連携の目安に使える。診療記録ベースのため治験より頻度が低く出ている可能性を添える。" },
    { cat:"A", pmid:"42764419", journal:"Pediatr Allergy Immunol", year:2026, type:"コホート",
      tj:"乳児期の食品多様性が高いほどアトピー性皮膚炎が少ない（韓国 26.8万人）",
      te:"Eating the rainbow early: Food diversity in infancy and the risk of atopic dermatitis in 267,935 Korean children.",
      sum:["韓国の国民健康保険データで 2009–10 年生まれ 267,935 人を追跡。生後 12 か月時点の食品多様性（6 食品群）を低・中・高に分け、その後の AD 発症（診断 2 回以上＋外用ステロイド処方 2 回以上）との関連を母のアレルギー歴などで調整して解析。",
           "高多様性群（56.8%）に比べ、低群 aHR 1.08（95%CI 1.04–1.12）、中群 aHR 1.11（1.09–1.13）で AD リスクが有意に高かった。性別や母の喘息・AD 歴による差はなし。",
           "1 歳までの離乳食の多様性が高いほど AD が少ない。効果量は小さく観察研究のため因果は未確定だが、早期の多様な補完食を支持する。"],
      use:"乳児湿疹・AD 児の保護者に「離乳食は怖がらず幅広く」と伝える根拠の一つ。食物アレルギー疑いがある児は個別に対応する（食物アレルギータブと整合）。" },
    { cat:"A", pmid:"42765197", journal:"Br J Dermatol", year:2026, type:"コホート",
      tj:"汎発性膿疱性乾癬（GPP）の疫学と死亡リスク：英国 15 年",
      te:"Incidence, prevalence, and life expectancy of patients with generalised pustular psoriasis in England: a population-based cohort study exploring ethnic and sex variations.",
      sum:["英国 CPRD 連結データ（2,580 万人）から 2008–2022 年の GPP 991 例を同定し、有病率・発症率・全死亡と原因別死亡・余命損失を、非 GPP 対照（最大 1:10）と比較。",
           "有病率は 20.9→32.5/百万人へ 50% 以上増加。女性・アジア系・高齢で高く、アジア系は発症が早い。全死亡 aHR 3.19（2.58–3.91）、敗血症は aHR 9.76。若年発症ほど余命損失が大きい。",
           "GPP は希少だが死亡リスクが約 3 倍と高く、特に感染症（敗血症）への警戒と早期の専門的治療が重要。"],
      use:"乾癬患者で膿疱・発熱・全身倦怠を伴う悪化を見たら GPP を念頭に置き、ためらわず基幹病院へつなぐ判断材料になる。" },
    { cat:"A", pmid:"42765188", journal:"Br J Dermatol", year:2026, type:"総説",
      tj:"日焼け止めの「実際の効き目」を決めるもの：SPF だけでは語れない",
      te:"Determinants of real-world sunscreen effectiveness: from ultraviolet radiation photobiology to human behaviour.",
      sum:["日焼け止めの実効性を、UVB/UVA/可視光の光生物学、SPF 測定と規制の限界、全身吸収・環境影響の議論、使用者の行動や誤情報まで含めて整理した総説。",
           "実際の防御効果は製品性能だけでなく、塗布量・塗り直し・使い方に大きく左右され、SPF 単独では説明できない。リスク層別した明確な指導が一貫した使用につながる。",
           "「SPF の数字」より「毎日十分量を塗り、塗り直す」こと、患者ごとのリスクに応じた説明が鍵。"],
      use:"生活指導タブの日焼け止め説明（塗る量・塗り直し・PA 表示）を補強する根拠。光線過敏や色素沈着の患者ほど具体的に指導する。" },
    { cat:"A", pmid:"42766280", journal:"Am J Clin Dermatol", year:2026, type:"総説",
      tj:"色素の濃い肌の酒さ：見逃さない診かたと治療",
      te:"Rosacea in Patients with Skin of Color: Diagnosis and Management.",
      sum:["有色人種（Black・Asian・Hispanic など）における酒さの診断と治療を整理した総説。",
           "有色人種でも 2–4% に酒さがあり、紅斑や毛細血管拡張が見えにくく見逃されやすい。ほてり・灼熱感・乾燥・化粧品への低耐性・眼症状などの副次基準の問診と、患者自身に「基準となる肌色」を確認してもらうことが診断を助ける。治療は表現型に応じ、色素沈着を招かないよう刺激を最小化。",
           "紅斑が分かりにくい患者では、視診より症状の問診を重視して酒さを拾い上げる。"],
      use:"「顔がほてる・ヒリヒリする・化粧品がしみる」を訴える患者で酒さを疑うチェック項目として使える。日本人でも紅斑が目立たない例に当てはまる。" },
    { cat:"A", pmid:"42765561", journal:"J Eur Acad Dermatol Venereol", year:2026, type:"総説",
      tj:"化膿性汗腺炎の画像診断と AI：超音波が第一選択",
      te:"Clinically relevant evidence on imaging and artificial intelligence in hidradenitis suppurativa.",
      sum:["化膿性汗腺炎（HS）における超音波・ダーモスコピー・MRI・CT・PET-CT・OCT・赤外サーモグラフィ・RCM と AI の役割と証拠レベルを整理。",
           "超音波のみが妥当性検証済みの診断基準・重症度スコアと多施設エビデンスを持ち、診断・病期分類・術前マッピング・治療方針決定の第一選択。他のモダリティは補助的。AI は早期発見や重症度の標準化に期待されるが検証途中。",
           "HS では触診だけでは皮下トンネルを見逃すため、超音波を診療に組み込む価値がある。"],
      use:"腋窩・鼠径に膿瘍を繰り返す患者で、エコーで皮下病変を確認する、または連携先に超音波評価を依頼する根拠になる。" },
    { cat:"A", pmid:"42767466", journal:"J Am Acad Dermatol", year:2026, type:"前向き観察（レジストリ）",
      tj:"小児 AD の全身療法 4 年：肌の色によらずデュピルマブが最も改善",
      te:"Real-World Systemic Treatment Outcomes for Moderate-to-Severe Atopic Dermatitis in Children by Skin Color: 4-Year Results from the observational, international, real-world PEDISTAD Registry.",
      sum:["国際的な実臨床レジストリ PEDISTAD で、中等症〜重症 AD の 12 歳未満の小児 500 例（白人 314 例／非白人 186 例：黒人・アフリカ系、アジア系、アメリカ先住民、多人種）を肌の色で 2 群に分け、全身療法（デュピルマブ・メトトレキサート・シクロスポリン）の 4 年間の成績を比較。",
           "EASI はいずれの群でも有意に改善し、非白人ではデュピルマブ 13.6 点・MTX 8.2 点・シクロスポリン 9.2 点、白人ではそれぞれ 14.2 点・10.1 点・4.5 点の改善。かゆみスコアはデュピルマブで両群とも有意に改善し、シクロスポリンが最も改善が小さかった。有害事象率（100 人年あたり）は白人で高く、デュピルマブ 33.33／MTX 33.24／シクロスポリン 58.33、非白人で 28.28／20.86／28.72。",
           "肌の色・人種によらず、デュピルマブが医師評価・患者報告アウトカムのいずれでもメトトレキサート・シクロスポリンより良好だった。"],
      use:"小児の中等症〜重症 AD で全身療法を相談されたとき、「デュピルマブはかゆみと生活の質の改善が大きい」と保護者に説明し、専門施設へつなぐ判断材料になる。",
      note:"観察研究であり、治療は無作為に割り付けられていない。" },
    { cat:"A", pmid:"42767465", journal:"J Am Acad Dermatol", year:2026, type:"総説",

           "VAS は 8→3→1→0、IGA は 3→2→1→0 と改善し、軽度の色素沈着を残してほぼ消退。有害事象なし。治療後 4・12 週で再発なし。",
           "難治性の貨幣状湿疹に鍼が補助的に有効だった 1 例。対照研究が必要。"],

];

/* ===== 状態と保存（localStorage キーは <app>_<item>_v1 の形式） ===== */
var LS_READ="papers_read_v1", LS_LATER="papers_later_v1", LS_STATE="papers_state_v1";
var store={
  get:function(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } },
  set:function(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
var readMap = store.get(LS_READ) || {};    /* pmid -> 既読にした日時 */
var laterMap = store.get(LS_LATER) || {};  /* pmid -> 追加した日時 */
var state = store.get(LS_STATE) || { tab:"a", filter:"all" };
function save(){ store.set(LS_READ, readMap); store.set(LS_LATER, laterMap); store.set(LS_STATE, state); }

var $  = function(s){ return document.querySelector(s); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
var CAT = { A:{name:"皮膚科", color:"var(--shu)"}, B:{name:"漢方", color:"var(--ai)"}, C:{name:"鍼灸×皮膚", color:"var(--matsu)"} };
var TABS = ["a","b","c","later"];

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function fmtDate(iso){
  var p=iso.split("-"), d=new Date(+p[0],+p[1]-1,+p[2]);
  return p[0]+"年"+(+p[1])+"月"+(+p[2])+"日（"+"日月火水木金土"[d.getDay()]+"）";
}
function isLater(p){ return !!laterMap[p]; }
function isRead(p){ return !!readMap[p]; }

/* ===== 描画 ===== */
function paperHTML(it){
  var c=CAT[it.cat];
  var pm="https://pubmed.ncbi.nlm.nih.gov/"+it.pmid+"/";
  return '<article class="paper'+(isRead(it.pmid)?' read':'')+'" data-pmid="'+it.pmid+'">'
    +'<span class="catband" style="background:'+c.color+'"></span>'
    +'<div class="meta"><span class="pill" style="color:'+c.color+';border-color:'+c.color+'">'+c.name+'</span>'
    +'<span class="pill type">'+esc(it.type)+'</span>'
    +(it.note?'<span class="pill warn">注</span>':'')
    +'<span class="jn">'+esc(it.journal)+'</span><span>'+it.year+'</span><span>PMID '+it.pmid+'</span></div>'
    +'<h3 class="tj">'+esc(it.tj)+'</h3>'
    +'<div class="te">'+esc(it.te)+'</div>'
    +'<dl class="sum"><dt>調べたこと</dt><dd>'+esc(it.sum[0])+'</dd><dt>結果</dt><dd>'+esc(it.sum[1])+'</dd><dt>示唆</dt><dd>'+esc(it.sum[2])+'</dd></dl>'
    +'<div class="use"><b>当院の診療で</b>'+esc(it.use)+'</div>'
    +(it.note?'<div class="notea">※ '+esc(it.note)+'</div>':'')
    +'<div class="acts">'
    +'<a class="abtn link" href="'+pm+'" target="_blank" rel="noopener">PubMed ↗</a>'
    +'<button class="abtn read-btn'+(isRead(it.pmid)?' on':'')+'" data-act="read">'+(isRead(it.pmid)?'既読 ✓':'既読にする')+'</button>'
    +'<button class="abtn later'+(isLater(it.pmid)?' on':'')+'" data-act="later">'+(isLater(it.pmid)?'★ あとで':'☆ あとで')+'</button>'
    +'</div></article>';
}
function passFilter(it){ return state.filter!=="unread" || !isRead(it.pmid); }

function renderCat(cat){
  var html="", total=0;
  DIGEST.forEach(function(day){
    var items=day.items.filter(function(it){ return it.cat===cat && passFilter(it); });
    var all=day.items.filter(function(it){ return it.cat===cat; }).length;
    if(!items.length) return;
    total+=items.length;
    var rg = day.range[cat] || "";
    html+='<div class="day"><h2>'+fmtDate(day.date)+'</h2><span class="cnt">'+items.length+'<small>/ '+all+'本</small></span></div>'
        +'<div class="range">PubMed 登録日 '+esc(rg)+'（日本時間）</div>'
        +items.map(paperHTML).join("");
  });
  if(!total) html='<div class="listempty"><div class="big">🌼</div>'+(state.filter==="unread"?"未読の論文はありません":"まだ論文がありません")+'</div>';
  return html;
}
function renderLater(){
  var list=[];
  DIGEST.forEach(function(day){ day.items.forEach(function(it){ if(isLater(it.pmid) && passFilter(it)) list.push(it); }); });
  if(!list.length) return '<div class="listempty"><div class="big">🌼</div>「☆ あとで」を押した論文がここに集まります</div>';
  return '<div class="sectitle">あとで読む　'+list.length+'本</div>'+list.map(paperHTML).join("");
}
function counts(){
  var n={A:0,B:0,C:0,later:0};
  DIGEST.forEach(function(d){ d.items.forEach(function(it){ if(!isRead(it.pmid)) n[it.cat]++; if(isLater(it.pmid)) n.later++; }); });
  $("#n-a").textContent=n.A?n.A:""; $("#n-b").textContent=n.B?n.B:""; $("#n-c").textContent=n.C?n.C:""; $("#n-later").textContent=n.later?n.later:"";
}
function render(){
  $("#v-a").innerHTML=renderCat("A"); $("#v-b").innerHTML=renderCat("B"); $("#v-c").innerHTML=renderCat("C"); $("#v-later").innerHTML=renderLater();
  counts();
  $$(".chip[data-f]").forEach(function(b){ b.classList.toggle("on", b.dataset.f===state.filter); });
}

/* ===== タブ・ルート（URL ハッシュ #a / #b / #c / #later） ===== */
function showTab(v, noHash){
  if(TABS.indexOf(v)<0) v="a";
  state.tab=v; save();
  $$(".tab").forEach(function(b){ b.classList.toggle("on", b.dataset.v===v); });
  $$(".view").forEach(function(s){ s.classList.toggle("on", s.id==="v-"+v); });
  if(!noHash && location.hash!=="#"+v){ try{ history.replaceState(null,"","#"+v); }catch(e){} }
}
$$(".tab").forEach(function(b){ b.addEventListener("click", function(){ showTab(b.dataset.v); window.scrollTo(0,0); }); });
window.addEventListener("hashchange", function(){ showTab(location.hash.replace("#",""), true); });

/* ===== 操作 ===== */
document.addEventListener("click", function(e){
  var btn=e.target.closest("button[data-act]"); if(!btn) return;
  var pmid=btn.closest(".paper").dataset.pmid, now=new Date().toISOString();
  if(btn.dataset.act==="read"){
    if(readMap[pmid]) { delete readMap[pmid]; toast("未読に戻しました"); } else { readMap[pmid]=now; toast("既読にしました"); }
  } else {
    if(laterMap[pmid]) { delete laterMap[pmid]; toast("「あとで読む」から外しました"); } else { laterMap[pmid]=now; toast("あとで読むに追加しました"); }
  }
  save(); render();
});
$$(".chip[data-f]").forEach(function(b){ b.addEventListener("click", function(){ state.filter=b.dataset.f; save(); render(); }); });
$("#markAllRead").addEventListener("click", function(){
  var now=new Date().toISOString(), n=0;
  $$("#v-"+state.tab+" .paper").forEach(function(a){ if(!readMap[a.dataset.pmid]){ readMap[a.dataset.pmid]=now; n++; } });
  save(); render(); toast(n?n+"本を既読にしました":"すでに全て既読です");
});

var toastTimer;
function toast(msg){ var t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove("on"); },1600); }

/* ===== 起動 ===== */
$("#upd").textContent="最終更新 "+DIGEST_UPDATED+"　／　収載 "+DIGEST.reduce(function(a,d){ return a+d.items.length; },0)+"本";
render();
showTab(location.hash ? location.hash.replace("#","") : state.tab, !location.hash);
</script>
</body>
</html>
