<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF5E6">
<title>論文ダイジェスト｜やまもと皮膚科・漢方クリニック</title>
<!-- 唯一許可された外部リソース: Google Fonts（オフライン時はシステムフォントに自動フォールバック） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ===== 和紙デザインシステム トークン ===== */
:root{
  --washi:#FBF5E6;--washi-d:#F2E9D2;--card:#FFFCF4;--line:#D9CDB3;
  --sumi:#332C25;--sumi2:#5B5247;--usu:#8C8073;
  --shu:#C1432E;--shu-d:#9A3A2E;--kin:#C08A22;--kin-d:#8A6410;--matsu:#2E5D4B;--ai:#22376B;--akane:#8A4A5A;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px -10px rgba(60,45,25,.35);--r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",-apple-system,sans-serif;
  color:var(--sumi);background:var(--washi);
  background-image:
    radial-gradient(circle at 18% 12%,rgba(192,138,34,.05),transparent 40%),
    radial-gradient(circle at 82% 78%,rgba(34,55,107,.05),transparent 42%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix type='matrix' values='0 0 0 0 0.45 0 0 0 0 0.38 0 0 0 0 0.25 0 0 0 0.025 0'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
  font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,.mincho{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;letter-spacing:.02em}

/* ===== ヘッダー ===== */
header{position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg,rgba(251,245,230,.97),rgba(251,245,230,.9));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px}
.brand{display:flex;align-items:center;gap:11px}
.brand h1{font-size:18px;margin:0}
.brand .sub{font-size:11px;color:var(--sumi2);letter-spacing:.04em;margin-top:1px}
.tampopo{width:34px;height:34px;flex:0 0 auto}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--sumi2);
  padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.tab.on{background:var(--ai);color:#fff;border-color:var(--ai)}
.tab .n{font-size:11px;opacity:.75;font-weight:700}
.tab.on .n{opacity:.9}

/* ===== レイアウト ===== */
main{max-width:760px;margin:0 auto;padding:14px 14px 90px}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sectitle{font-size:12px;letter-spacing:.16em;color:var(--matsu);font-weight:700;margin:20px 2px 8px}
.lead{color:var(--sumi2);font-size:13px;margin:4px 2px 12px;line-height:1.6}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--sumi2);padding:6px 11px;border-radius:999px;
  font-size:12px;cursor:pointer;font-weight:600;font-family:inherit;min-height:32px}
.chip.on{background:var(--shu);color:#fff;border-color:var(--shu)}

/* ===== 日付見出し ===== */
.day{display:flex;align-items:baseline;gap:10px;margin:22px 2px 10px;padding-bottom:6px;border-bottom:3px double var(--kin)}
.day h2{font-size:19px;margin:0;font-weight:800}
.day .cnt{font-family:"Shippori Mincho",serif;font-weight:800;color:var(--kin);font-size:15px;margin-left:auto;white-space:nowrap}
.day .cnt small{font-family:inherit;font-size:11px;color:var(--sumi2);font-weight:600;margin-left:2px}
.range{font-size:11px;color:var(--usu);margin:-4px 2px 10px;letter-spacing:.02em}

/* ===== 論文カード ===== */
.paper{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px 11px 17px;margin-bottom:10px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.paper .catband{position:absolute;left:0;top:0;bottom:0;width:4px}
.paper.read{opacity:.62}
.paper.read .tj::before{content:"✓ ";color:var(--matsu)}
.paper .meta{display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center;font-size:11px;color:var(--sumi2);margin-bottom:6px}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--washi);color:var(--sumi2);white-space:nowrap}
.pill.type{color:var(--kin-d);border-color:rgba(192,138,34,.45)}
.pill.warn{color:var(--shu);border-color:rgba(193,67,46,.45)}
.paper .tj{font-size:15px;font-weight:700;line-height:1.45;margin:0 0 3px}
.paper .te{font-size:12px;color:var(--sumi2);line-height:1.45;margin-bottom:9px;font-style:normal}
.paper .jn{color:var(--matsu);font-weight:700}
.sum{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:auto 1fr;gap:5px 9px;font-size:13.5px;line-height:1.6}
.sum dt{color:var(--kin-d);font-size:11px;font-weight:700;letter-spacing:.06em;padding-top:4px;white-space:nowrap}
.sum dd{margin:0}
.use{margin:10px 0 0;background:linear-gradient(0deg,rgba(46,93,75,.06),rgba(46,93,75,.06)),var(--card);
  border:1px solid var(--line);border-left:3px solid var(--matsu);border-radius:10px;padding:8px 11px;font-size:13px;line-height:1.55}
.use b{color:var(--matsu);font-size:11px;letter-spacing:.08em;display:block;margin-bottom:1px}
.notea{margin:8px 0 0;font-size:11.5px;color:var(--shu-d);line-height:1.5}
.acts{display:flex;gap:6px;margin-top:11px;align-items:center}
.abtn{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--washi);color:var(--sumi2);font-size:12.5px;font-weight:700;
  cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 8px;text-decoration:none;white-space:nowrap}
.abtn.link{border-color:var(--ai);color:var(--ai);background:var(--card)}
.abtn.on{background:var(--ai);color:#fff;border-color:var(--ai)}
.abtn.later.on{background:var(--kin);border-color:var(--kin);color:#fff}
.abtn:active{transform:scale(.98)}

/* ===== その他 ===== */
.note{background:linear-gradient(0deg,rgba(192,138,34,.06),rgba(192,138,34,.06)),var(--card);
  border:1px solid var(--line);border-left:3px solid var(--kin);border-radius:10px;padding:10px 13px;font-size:13px;margin:10px 0 16px}
.note b{color:var(--shu-d)}
.listempty{text-align:center;color:var(--sumi2);padding:40px 20px;font-size:14px}
.listempty .big{font-size:40px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--sumi);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:80;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.disc{font-size:11.5px;color:var(--sumi2);border-top:1px dashed var(--line);margin-top:24px;padding-top:14px;line-height:1.6}
.foot{text-align:center;font-size:11px;color:var(--sumi2);margin-top:18px}
.upd{text-align:center;font-size:11px;color:var(--usu);margin-top:6px}

@media print{
  header,.filters,.acts,.disc,.foot{display:none!important}
  body{background:#fff;background-image:none}
  .view{display:block!important}
  .paper{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="tampopo" viewBox="0 0 48 48" aria-hidden="true">

          <line x1="24" y1="18" x2="38" y2="18"/><line x1="24" y1="18" x2="34" y2="28"/>
          <line x1="24" y1="18" x2="14" y2="8"/><line x1="24" y1="18" x2="10" y2="18"/>

        <g fill="#fff8e8"><circle cx="24" cy="4" r="2.1"/><circle cx="34" cy="8" r="2.1"/><circle cx="38" cy="18" r="2.1"/><circle cx="34" cy="28" r="2.1"/><circle cx="14" cy="8" r="2.1"/><circle cx="10" cy="18" r="2.1"/><circle cx="14" cy="28" r="2.1"/><circle cx="31" cy="3" r="1.8"/><circle cx="17" cy="3" r="1.8"/><circle cx="39" cy="11" r="1.8"/><circle cx="9" cy="11" r="1.8"/></g>

    <div>
      <h1>論文ダイジェスト</h1>

  <nav class="tabs" id="tabs">

    <button class="tab" data-v="b">漢方 <span class="n" id="n-b"></span></button>

  </nav>
</header>

<main>
  <div class="filters" id="filters">
    <button class="chip on" data-f="all">すべて</button>
    <button class="chip" data-f="unread">未読のみ</button>
    <span style="flex:1"></span>
    <button class="chip" id="markAllRead" title="表示中の論文を既読にする">表示中を既読に</button>
  </div>
  <section class="view on" id="v-a"></section>
  <section class="view" id="v-b"></section>
  <section class="view" id="v-c"></section>
  <section class="view" id="v-later"></section>

  <div class="disc">※このページは院内スタッフ向けの文献情報です。要約は抄録に基づく Claude の作成で、原著の確認を前提とします。診療方針の最終判断は医師が行います。</div>
  <div class="foot mincho">やまもと皮膚科・漢方クリニック　🌼 たんぽぽちゃん</div>
  <div class="upd" id="upd"></div>
</main>

<div class="toast" id="toast">保存しました</div>

<script>
/* =====================================================================

   - use: 当院の診療でどう使えるか（一文）
   - note: 補足・注意（任意。抄録なし・皮膚領域外など）
   ===================================================================== */
var DIGEST_UPDATED = "2026-10-24 06:10 JST";
var DIGEST = [
/* @@DIGEST_TOP@@ ← 新しい日はこの行の直後に挿入する */
{
  date: "2026-10-24",
  range: { A: "2026-10-22〜10-24", B: "2026-10-22〜10-24", C: "2026-09-24〜10-24" },
  items: [
    { cat:"A", pmid:"42909197", journal:"Front Immunol", year:2026, type:"総説（アトピー性皮膚炎の標的治療）",
      tj:"アトピー性皮膚炎の標的治療：効き方は臨床像より免疫のエンドタイプと関連",
      te:"Targeted therapies in atopic dermatitis: toward endotype-driven precision medicine and disease modification.",
      sum:["アトピー性皮膚炎は、遺伝的な素因、表皮バリア機能の低下、免疫の調節の乱れ、神経の炎症シグナルの異常、環境因子が組み合わさって生じる、再発を繰り返す慢性の炎症性皮膚疾患です。本総説は、病態の分子機序、現在の標的治療の戦略とその臨床応用の進捗、そして残された課題と今後の方向を体系的に整理したものです。バリアに関わる分子の遺伝子変異、とりわけフィラグリン（FLG）の機能喪失型変異が、表皮の保たれやすさとアレルゲンの侵入を左右する重要な遺伝的決定因子とされています。",
           "現在の知見では2型免疫炎症が病態の中心軸であり、インターロイキン（IL）-4、IL-13、IL-31、TSLP（胸腺ストローマ由来リンパポエチン）、および JAK-STAT シグナル経路が、表皮バリアの破綻と炎症の増幅、かゆみと掻き壊しの悪循環にかかわると述べられています。これを踏まえた IL-4 受容体α拮抗薬、抗 IL-13 抗体、IL-31 経路阻害薬、JAK 阻害薬、および開発中の OX40/OX40L を標的とする薬剤が、ランダム化比較試験と実診療下の研究で有意な有効性を示しています。一方で、治療反応のばらつき、長期安全性データの不足、エンドタイプ別の層別化が進んでいないこと、治療へのアクセスの差が課題として挙げられています。",
           "治療反応は従来の臨床的な表現型よりも免疫学的なエンドタイプとより密接に関連しており、単一の経路を阻害するだけでは持続的な病態の改変には至らないとされています。バイオマーカー、マルチオミクス、実診療データ、人工知能による意思決定支援を統合することで、症状の抑え込みから持続的な緩解と真の病態改変へと進む可能性があると結んでいます。"],
      use:"生物学的製剤や JAK 阻害薬をご提案する際に、同じ重症度でも効き方に差が出るのは免疫のタイプの違いが関係すると報告されていると、お話しする材料になります。",
      note:"総説です。エンドタイプに基づく治療選択はまだ確立していません。" },
    { cat:"A", pmid:"42905233", journal:"Dermatol Ther (Heidelb)", year:2026, type:"第3相試験の長期継続解析（ADvocate1/2 → ADjoin・152週）",
      tj:"レブリキズマブ3年：16週時の反応者の 88.6% が EASI 90 を維持",
      te:"Lebrikizumab Provides Stable and Deep Long-Term Response with No/Minimal Fluctuations up to 3 Years in Patients with Moderate-to-Severe Atopic Dermatitis.",
      sum:["中等症から重症のアトピー性皮膚炎の方で、レブリキズマブによる皮膚所見とかゆみの改善が長期にどれだけ安定して維持されるかを調べた解析です。ADvocate1 および ADvocate2 試験で16週時に反応（救済治療を使わずに、治療者総合評価（IGA）0 または 1 かつ2点以上の改善、あるいは EASI 75）を得た方のうち、継続試験 ADjoin で4週ごと（Q4W）または2週ごと（Q2W）の維持投与を続けた方を152週（3年）まで追い、深い反応（IGA 0、EASI 90、EASI 100、EASI が1以下、POEM および POEM のかゆみ項目 0/1 など）と、安定性（16週から152週の受診回の 80% 以上で維持）、および再燃（フレア）の頻度を3つの定義で評価しています。",
           "152週の連続投与後、16週時の反応者の 88.6%（Q4W）および 80.0%（Q2W）が EASI 90 を維持し、64.3%（Q4W）および 68.8%（Q2W）が EASI 100 を維持していました。16週時に EASI 90 または EASI 100 を達成した方の大半が152週まで安定した反応を保っていました（Q4W：77.8% および 57.9%、Q2W：81.1% および 63.6%）。安定した EASI 75 反応者（Q4W）の 72.8% は152週まで再燃を経験せず、発生率は1患者年あたり 0.19 回（5患者年におよそ1回）でした。かゆみの改善も経時的に維持され、皮膚所見と同様の推移をたどっていました。",
           "レブリキズマブの継続投与により、3年にわたって皮膚所見とかゆみの両方で安定した病勢のコントロールが得られ、再燃はまれであったと述べられています。"],
      use:"治療をいつまで続けるのかというご質問に対して、16週でよく反応した方の大半は3年後まできれいな状態が維持したと報告されているとご説明する材料になります。",
      note:"16週時の反応者に限った解析で、投与を続けられなかった方は含まれていません。" },

      tj:"結節性痒疹の全身治療を比較：かゆみの反応率はネモリズマブが最上位",
      te:"Comparative efficacy and safety of targeted systemic therapies for prurigo nodularis: a systematic review and network meta-analysis.",
      sum:["結節性痒疹（prurigo nodularis）は、強いかゆみを伴う慢性の炎症性皮膚疾患です。複数の標的生物学的製剤がプラセボに対する有効性を示していますが、薬剤同士を直接比較した試験はなく、相対的な有効性と安全性ははっきりしていませんでした。本研究は PubMed、Embase、Cochrane、ClinicalTrials.gov を検索し、成人の結節性痒疹を対象にデュピルマブ・ネモリズマブ・ビキサレリマブ・セルロピタントを評価したランダム化試験8件（1652名、平均年齢 53.5歳）を集め、頻度論的なネットワークメタ解析を行ったものです。",
           "4週時にかゆみの重症度を最も大きく下げたのはビキサレリマブ 540 mg（標準化平均差 -2.36、95% 信頼区間 -3.28〜-1.44）で、16週時も維持されていました（-1.26、95% 信頼区間 -1.96〜-0.55）。臨床的に意味のあるかゆみの改善（PP-NRS 4点以上）の割合が4週時で最も高かったのはネモリズマブ 60 mg（リスク比 6.77、95% 信頼区間 2.85〜16.13）で、12〜16週時でも優位が持続した唯一の薬剤でした（リスク比 3.37、95% 信頼区間 1.45〜7.84）。治療者総合評価の達成ではネモリズマブ 30 mg が最上位（リスク比 4.24、95% 信頼区間 2.46〜7.29）でした。有害事象全体・重篤な有害事象・感染の増加はどの薬剤でも有意ではなく、ただしデュピルマブは治療中止が多く（リスク比 13.01、95% 信頼区間 4.12〜41.06）、セルロピタントは鼻咽頭炎が多い（リスク比 5.41、95% 信頼区間 1.25〜23.45）という結果でした。",
           "かゆみの重症度ではビキサレリマブ、臨床的に意味のあるかゆみの改善ではネモリズマブが最上位で、デュピルマブはすべての評価項目で安定した有効性を示したと述べられています。ただし比較の推定値は間接的な証拠に基づくため直接比較試験による確認が必要で、証拠の確かさは多くの項目で低いとされています。"],
      use:"掻き壊しを繰り返す硬い結節性痒疹の方を専門施設へご紹介するときに、どの薬剤がかゆみに効くと報告されているかをあらかじめ整理しておく材料になります。",
      note:"直接比較でない間接比較（ネットワークメタ解析）で、本邦未承認の薬剤を含みます。" },
    { cat:"A", pmid:"42909147", journal:"JID Innov", year:2026, type:"臨床・免疫病理学的研究（軽等症〜中等症の乾癬25名・4週間）",
      tj:"乾癬のかゆみ：配合泡状外用剤4週で IL-31 などが血清・皮疹で低下",
      te:"Calcipotriol-betamethasone foam modulates serum and tissue IL-17A, IL-31, IL-31RA, and substance P in mild-to-moderate psoriatic itch: A clinical and immunopathological study.",
      sum:["かゆみは乾癬でよくみられる症状ですが、その発生機序は十分に解明されていません。本研究は、軽症から中等症の乾癬の方 25名にカルシポトリオール・ベタメタゾン配合泡状外用剤を4週間使用して、かゆみの臨床的な特徴と、血清および皮疹組織のサイトカインプロファイルを評価したものです。臨床スコアは PASI、皮膚科的生活の質指数（DLQI）、かゆみの視覚的アナログスケール（VAS）、かゆみ重症度スケールを用い、IL-17A、IL-31、IL-31RA、サブスタンスP を治療前後で測定しています。",
           "多くの方が強いかゆみと著しい生活の質の低下を持っていました。PASI は DLQI と有意に関連した一方で、かゆみのスコアとは関連しませんでした。かゆみのスコアには有意な性差がみられ、Body Mass Index と皮疹の部位は特定の臨床スコアと関連していました。治療により血清と皮疹組織の両方でこれらのサイトカインが明らかに減少しましたが、臨床スコアとの相関はみられませんでした。免疫組織化学と蛍光抗体法では各仲介因子に異なる皮膚内の分布が示され、神経と免疫の経路が相互に関わり、エクリン汗腺がその解剖学的な要となりうることが示唆されました。",
           "この配合泡状外用剤が皮膚局所の神経・免疫の軸を調節している可能性が示唆され、外用剤であることを踏まえると、皮疹のかゆみの動態を表す指標としては血清より組織レベルの測定のほうが適していると述べられています。"],
      use:"乾癬のかゆみを訴える方に、外用剤を丁寧に続けることでかゆみにかかわる物質が皮膚で減っていくと報告されているとお話しする材料になります（院内アプリ「生活指導アシスタント」の外用薬のタブと合わせてご案内いただけます）。",
      note:"25名の小規模な単群研究で、サイトカインの減少とかゆみの改善の間に相関は示されていません。" },
    { cat:"A", pmid:"42908253", journal:"Clin Transl Allergy", year:2026, type:"単盲検・プラセボ対照負荷試験（142名）",
      tj:"蕁麻疹が落ち着けば NSAIDs は再び使えるか：負荷試験陽性は 20.4%",
      te:"NSAID Tolerance Can Be Restored in NECD Even in the Absence of Complete Remission of Urticaria.",
      sum:["非ステロイド抗炎症薬（NSAIDs）で蕁麻疹が悪化する病態（NSAID 悪化性皮膚疾患、NECD）の経過についてのデータは限られています。本研究は、蕁麻疹がよくコントロールされている NECD の方における NSAIDs の耐容性を調べる目的で行われました。蕁麻疹コントロールテスト（UCT）が12以上、および7日間の蕁麻疹活動スコア（UAS7）が6以下の142名が、単盲検・プラセボ対照でアセチルサリチル酸（ASA）の負荷試験を受け、治療内容によりオマリズマブ群・抗ヒスタミン薬群・無治療群の3群に分けられました。年齢の中央値は40歳、79.6% が女性で、慢性特発性蕁麻疹の罹病期間の中央値は4年でした。",
           "ASA 負荷試験が陽性であったのは29名（20.4%）でした。陽性の方は UCT が低く UAS7 が高く（いずれも p<0.001）、陽性率は抗ヒスタミン薬群でオマリズマブ群（p=0.001）および無治療群（p<0.001）より高かったとされています。ROC 解析では UCT が15以下であることが感度 72.4%・特異度 83.2% で、UAS7 が4以上であることが感度 72.4%・特異度 86.7% で負荷試験陽性を予測し、陰性的中率（陽性でないことを言い当てる確率）はそれぞれ 92.2%・92.5% と高値でした。",
           "完全な緩解に至っていなくても、蕁麻疹がよくコントロールされていれば、治療方法にかかわらず NSAIDs の耐容性が得られ得るとされています。UCT が15以下、UAS7 が4以上といった指標は、とくに陽性を除外するときに有用と述べられています。"],
      use:"蕁麻疹が落ち着いている方から痛み止めを使ってよいかとご相談を受けたときに、コントロールが良好であれば陽性の可能性は低いと報告されているとご説明する材料になります。",
      note:"投与の可否は負荷試験を含めて専門施設での判断が必要で、外来での自己判断には結びつけられません。" },
    { cat:"A", pmid:"42903800", journal:"J Inflamm Res", year:2026, type:"総説（慢性特発性蕁麻疹の2型炎症）",
      tj:"慢性特発性蕁麻疹と2型炎症：エンドタイプを決めるマーカーは未確立",
      te:"Type 2 Inflammation in Chronic Spontaneous Urticaria: Presentation, Role, and Management.",
      sum:["慢性特発性蕁麻疹（CSU）は、繰り返す膨疹・血管浮腫・かゆみを特徴とする多様な炎症性皮膚疾患で、生活の質を大きく損ないます。本総説は、肥満細胞の活性化が中核であることを前提にした上で、CSU に2型炎症経路がどう関わるか、既知の自己免疫エンドタイプとの関係、関連するバイオマーカー、および現在・将来の治療への意味を整理したものです。CSU はアトピー性皮膚炎・喘息・慢性痒疹・鼻茸を伴う慢性副鼻腔炎などの2型炎症疾患と生物学的な特徴を共有するという知見が蓄積しています。",
           "IL-4、IL-5、IL-13、IL-31 などの2型サイトカインが、上皮細胞由来のアラーミンや神経免疫経路とともに、IgE 依存性・自己免疫性などの機序と相互に作用して肥満細胞の活性化とかゆみを増幅するとされています。ただし2型炎症は従来の分類に取って代わるものでなく、一部重なりあって発現の強弱も様々な軸として扱うべきと述べられています。現時点で2型炎症が強いエンドタイプを定義したり治療選択を確実に導ける妥当なバイオマーカーはなく、総 IgE・好酸球・好塩基球・自己抗体・好塩基球活性化試験は補完的な情報にとどまるとされています。治療としてはオマリズマブが IgE 依存性の活性化を、デュピルマブが IL-4/IL-13 シグナルを、レミブルチニブなどの BTK 阻害薬が細胞内シグナルを標的とし、KIT を標的とする薬剤も発展していると紹介されています。",
           "サイトカインのプロファイルと治療反応は多様で、CSU を一様に2型炎症主導の疾患とすることはできないと述べられています。今後は前向きに妥当性を検証したバイオマーカーの組み合わせと、それに基づく層別化試験が必要とされています。"],
      use:"慢性蕁麻疹の方に、血液検査で原因や最適な薬が決まるわけではないとご説明する材料になります。",
      note:"総説です。本邦未承認の薬剤を含みます。" },
    { cat:"A", pmid:"42908038", journal:"BMC Pharmacol Toxicol", year:2026, type:"前向き登録の観察研究（ドイツ Embryotox・妊娠44例）",
      tj:"妊娠初期の JAK 阻害薬暴露44例：生存出生32例中、大きな先天異常2例",
      te:"Pregnancy outcome after first-trimester exposure to JAK inhibitors - an evaluation of the German Embryotox cohort.",
      sum:["JAK 阻害薬はリウマチ・消化器・皮膚科の自己免疫疾患で妊娠の可能性のある年齢の女性にも用いられるようになり、投与中の妊娠も増えていますが、妊娠中の安全性はなお不確かで、胎児へのリスクを十分に評価できるヒトのデータはありません。本研究はドイツの妊娠薬物情報データベース Embryotox に 2017年1月1日から 2025年11月15日に前向きに登録された、妊娠初期に JAK 阻害薬に暴露された妊娠44例（バリシチニブ17例、フィルゴチニブ3例、トファシチニブ8例、ウパダシチニブ16例）を解析し、大きな先天異常・妊娠の帰趨・新生児の指標を調べたものです。",
           "44例のうち生存出生は32例で、そのうち大きな先天異常が2例（心室中隔欠損1例、尿道下裂1例）みられました。自然流産は5例（胎児無脳症1例を含む）、人工妊娠中絶は7例でした。新生児の評価では、36週の早産が2例、在胎週数に対して小さい児が3例、大きい児が2例でした。",
           "現在の証拠では JAK 阻害薬の暴露と胎児の有害な帰趨との関連を確立することも除外することもできず、データが限られているため有害な影響の可能性は否定できないと述べられています。したがって妊娠中の日常的な使用は推奨されず、さらなるデータが得られるまでは慎重に、利益とリスクを十分に検討して扱う必要があるとされています。"],
      use:"妊娠の可能性のある方に JAK 阻害薬を始めるとき、妊娠を希望される場合の計画をあらかじめ話し合っておくことの根拠になります。",
      note:"44例と少数で、リスクの有無を結論づけられる規模ではありません。" },
    { cat:"A", pmid:"42907260", journal:"Therapie", year:2026, type:"症例報告（42歳男性・文献考察つき）",
      tj:"ビメキズマブ投与11か月後の顔面白斑：抗 IL-17 薬のクラス効果の可能性",
      te:"Onset of vitiligo during bimekizumab treatment for psoriasis.",
      sum:["乾癬に対してはセクキヌマブ・イキセキズマブ・ビメキズマブなどの IL-17 阻害薬が用いられ、その安全性プロファイルには感染症・消化器症状・頭痛・湿疹などの皮膚症状が含まれます。本報告は、ビメキズマブ投与中に白斑（尋常性白斑）を生じた最初の症例として、42歳男性の経過を報告したものです。",
           "この方はビメキズマブにより乾癬皮疹の完全な消退を得ていましたが、11か月の投与後に顔面に白斑が出現しました。白斑はビメキズマブの中止とミニパルス療法、ルキソリチニブクリームの外用により消退しています。白斑の発生はセクキヌマブ・イキセキズマブなど他の IL-17 阻害薬でもこれまでに11例報告されており、IL-17 は白斑の病態に関わると考えられていますが、正確な機序はなお不明です。",
           "逆説的な白斑は IL-17 阻害薬のクラス効果である可能性があり、とくに白斑や他の脱色素性疾患の既往・家族歴がある方では考慮すべきと述べられています。一方で、抗 IL-17 治療を続けた方でも白斑の安定や再色素沈着がみられたとされ、乾癬への有効性を踏まえて利益とリスクのバランスを丁寧に話し合う必要があると結んでいます。"],
      use:"IL-17 阻害薬で乾癬がきれいになった方に色の抜けた斑が出てきたときに、薬剤との関連を疑って診察するきっかけになります。",
      note:"1例の症例報告で、因果関係を示すものではありません。" }
  ]
},
{
  date: "2026-10-23",
  range: { A: "2026-10-21〜10-23", B: "2026-10-21〜10-23", C: "2026-09-23〜10-23" },
  items: [
    { cat:"A", pmid:"42903092", journal:"Front Immunol", year:2026, type:"スコーピングレビュー・系統的レビュー（18文献・39例）",
      tj:"生物学的製剤後に生じた尋常性白斑39例：発症は投与開始から中央値5か月",
      te:"Vitiligo onset following anti-inflammatory biological therapy: a scoping review.",
      sum:["尋常性白斑はメラノサイトが後天的に失われる慢性の自己免疫性の色素脱失症で、病態は多因子性です。発症を促しうる因子として、モノクローナル抗体を含む一部の薬剤が関連づけられてきました。本レビューは、炎症性サイトカインを標的とする生物学的製剤の使用後に新たに生じた（de novo）白斑について、現在の文献の知見をまとめて考察する目的で行われたスコーピングレビューです。18文献が適格とされ、背景・臨床的特徴・白斑の病型と部位・投与された生物学的製剤・治療の転帰が整理されています。",
           "39例の平均年齢は43歳（±16.3）で、男性が62%と多くを占めました。疑われた薬剤として最も多かったのは腫瘍壊死因子α（TNFα）阻害薬（インフリキシマブ・アダリムマブ・セルトリズマブペゴル）で患者さんの50%を超え、次に抗IL-17A抗体（イキセキズマブ・セクキヌマブ）、抗IL-12/23抗体（ウステキヌマブ）が続きました。4例は抗IL-4/13抗体（デュピルマブ）に関連していました。白斑の発症は投与開始から中央値5か月（範囲1.5〜24か月）で、3分の1の症例が顔面と頸部に生じ、分節型白斑が2例ありました。生物学的製剤の中止または変更は26%の症例で行われ、転帰は41%が安定化、36%が程度の差はあるものの再色素化し、8%が進行しました。",
           "新たに生じる白斑は生物学的製剤の有害事象となりうると報告されている一方、直接の因果関係を示す根拠はなお弱く、抗TNFα以外の薬剤による症例は散発的なものにとどまると述べられています。これらの患者さんに自己免疫性の併存疾患がみられることは、因果関係ではなく偶発的な併存を示唆しており、この関連を明らかにするにはさらなる研究が必要とされています。"],
      use:"生物学的製剤を続けている患者さんに白斑が出てきたときに、薬剤との関連は否定できないものの因果関係の根拠は弱く、報告された症例の多くは安定化または再色素化したとご説明する材料になります。",
      note:"18文献・39例を集めたレビューで、因果関係を検証した研究ではありません。" },
    { cat:"A", pmid:"42903057", journal:"Clin Cosmet Investig Dermatol", year:2026, type:"横断研究（女子学部生549名の質問紙調査）",
      tj:"化粧品の有害作用：使用92.3%・有害事象の経験48.3%、パッチテスト実施は33.3%",
      te:"Knowledge, Attitude, and Practice Towards the Harmful Effects of Cosmetics: A Cross-Sectional Study Among Undergraduate Female Students at Umm Al-Qura University, Saudi Arabia.",
      sum:["サウジアラビアでは化粧品が広く使われていますが、一部の成分は皮膚および全身の健康上の危険をもたらします。サウジ食品医薬品庁（SFDA）の規制があるにもかかわらず、使用量の多い集団における消費者の認識と予防的な行動は十分に把握されていません。本研究は、メッカのウンム・アルクラー大学の女子学部生における化粧品の有害作用に関する知識・態度・行動（KAP）を評価し、化粧品の使用行動に関連する因子を明らかにする目的で、2025年1月〜6月に自記式の電子質問紙を用いて行われた横断研究です。質問紙は妥当性が確認されたKAP尺度を基にした29項目（知識12・態度5・行動11、および化粧品による皮膚トラブルの経験1項目）で、5段階のリッカート尺度で回答を得ています。",
           "549名の回答が解析されました。年齢は17〜30歳（17〜20歳41.2%、21〜25歳56.5%、26〜30歳2.4%）で、化粧品の使用は92.3%と広くみられ、48.3%が少なくとも1つの有害作用を経験しており、最も多かったのは痤瘡を含む皮膚の吹き出物でした。アレルギーを起こしうる成分を認識していた方は52.1%、発がん性の可能性のある成分を認識していた方は32.8%にとどまり、アレルギーのパッチテストを受けたことがある方は33.3%、成分表示を読む方は41.2%でした。使用の多さは年齢（p<0.001）と婚姻状況（p=0.004）と関連し、インフルエンサーの推奨を支持すること（38.1%が同意・42.4%が不同意）は高価な化粧品の購入と独立して関連していました（調整オッズ比1.59、95%信頼区間1.08〜2.33、p=0.019）。パッチテストの実施と関連する因子はありませんでした。",
           "安全性についての知識は必ずしも予防的な行動に結びついておらず、若い女性において知識と行動の隔たりがあることが示されました。成分レベルの理解を深め、化粧品の安全性監視（コスメトビジランス）への関与を促す、的を絞った教育が必要と述べられています。"],
      use:"化粧品による吹き出物や接触皮膚炎のご相談で、成分表示の確認やパッチテストの意義をご説明する材料になります（院内アプリ「生活指導アシスタント」のパッチテストのタブと合わせてご案内いただけます）。",
      note:"サウジアラビアの女子学部生を対象とした質問紙調査で、日本の患者さんにそのまま当てはまるとは限りません。" },
    { cat:"A", pmid:"42902235", journal:"BMC Pediatr", year:2026, type:"単施設の後方視研究（乳児569名・ノモグラムの作成と内部検証）",
      tj:"乳児マイコプラズマ肺炎の喘鳴：湿疹の既往がオッズ比1.95の危険因子",
      te:"Development of a nomogram for risk factors of wheezing in infants with Mycoplasma pneumoniae pneumonia.",
      sum:["乳児のマイコプラズマ肺炎（MPP）における喘鳴の危険因子を解析するノモグラム（予測図）を作成し、臨床的な介入の根拠を示す目的で行われた研究です。蘇州大学附属児童病院の呼吸器内科・感染症科に入院した乳児569名の診療データを後方視的に解析し、症状により喘鳴群204例と非喘鳴群365例に分けました。背景・臨床症状・検査所見・気管支鏡の施行回数・胸部画像所見を収集し、LASSO回帰で候補を絞ったのちロジスティック回帰で独立した危険因子を同定し、ノモグラムを作成してROC曲線と決定曲線分析（DCA）で性能を評価しています。",
           "多変量ロジスティック回帰では、喘鳴の既往（オッズ比5.894、95%信頼区間3.541〜9.812）、湿疹の既往（オッズ比1.951、95%信頼区間1.295〜2.939）、IgGの上昇（オッズ比1.166、95%信頼区間1.074〜1.266）、CK-MBの上昇（オッズ比1.083、95%信頼区間1.007〜1.164）、ヒトRSウイルスの重複感染（オッズ比3.430、95%信頼区間1.819〜6.468）が危険因子で、発熱（オッズ比0.389、95%信頼区間0.252〜0.599）は喘鳴に対する保護因子でした。この6項目で作成したノモグラムの曲線下面積は学習セットで0.7862（感度72.4%・特異度78.1%）、内部検証セットで0.6863（感度53.7%・特異度79.5%）、200回のブートストラップで楽観的な偏りを補正した曲線下面積は0.705（95%信頼区間0.662〜0.748）でした。",
           "アトピー素因と複数のウイルスの重複感染が乳児MPPにおける喘鳴の危険因子であり、このノモグラムは喘鳴の予測に臨床的な価値があると述べられています。学習セットから補正後の曲線下面積が低下したことについては、単施設の後方視デザインと限られた症例数によるある程度の過剰適合が考えられると著者らも指摘しています。"],
      use:"湿疹のあるお子さんの保護者から、かぜのあとの咳や喘鳴についてご相談を受けたときに、湿疹の既往が喘鳴と関連するという報告があるとお伝えする材料になります（院内アプリ「生活指導アシスタント」の生活指導のタブと合わせてご案内いただけます）。",
      note:"皮膚領域外（小児呼吸器）の単施設の後方視研究です。" },
    { cat:"A", pmid:"42902367", journal:"J Nanobiotechnology", year:2026, type:"基礎研究・動物実験（イミキモド誘発乾癬モデルマウス）",
      tj:"乾癬の新規ナノゲル：マウスで皮膚の厚み・紅斑・鱗屑が従来の抗炎症治療より改善",
      te:"A programmable nanoplatform for inflammatory-state reprogramming in psoriasis treatment.",
      sum:["乾癬は慢性の免疫を介した炎症性皮膚疾患です。現在の治療は症状を和らげますが、主に単一の標的に対する炎症の抑制にとどまり、複雑な病態の乱れに包括的には対応できないという課題があります。本研究は、タンニン酸（TA）・セリウム（Ce）・ルテオリン（Lut）からなるナノ複合体を、塗った部位でゲル化するハイドロゲル（TA-Ce-Lut-Gel）に組み込んだ送達システムを開発し、酸化ストレス・免疫応答・皮膚の細菌叢を調整する多面的な治療戦略を検討した基礎研究です。配位結合で作られたナノ粒子の大きさは177.30±0.55nm、封入率は72.89±5.32%で、ハイドロゲルに組み込むことで局所に持続する薬剤の貯留が得られたとしています。",
           "イミキモドで乾癬を誘発したマウスの耳と背部のモデルにおいて、TA-Ce-Lut-Gelは皮膚の炎症を有意に軽減し、皮膚の厚み・紅斑・鱗屑を改善し、従来の抗炎症治療と比べて優れた効果を示しました。活性酸素種（ROS）の量を低下させ、マクロファージのM2への分化を調整して免疫応答を変化させ、TRAF6/NF-κB/STAT3の経路を調整して炎症性サイトカインの分泌を有意に抑制したと報告されています。近赤外線の照射と組み合わせることで経皮的な薬剤の送達と抗酸化作用が高まり、皮膚の細菌叢の回復も促されました。",
           "本研究は乾癬の局所の精密な治療のための基盤を示し、従来の単一標的の抗炎症療法の限界を越えうるもので、他の免疫を介した疾患の治療への応用も期待されると述べられています。"],
      use:"乾癬の外用療法の研究が、炎症を抑えるだけでなく酸化ストレスや皮膚の細菌叢まで含める方向に進んでいることをご紹介する材料になりますが、マウスの実験であり、ヒトでの効果は未確認と添えてご説明ください。",
      note:"イミキモド誘発モデルマウスを用いた基礎研究です。ヒトでの有効性・安全性は確認されていません。" },
    { cat:"A", pmid:"42902483", journal:"Dermatitis", year:2026, type:"レター（詳細は原著確認が必要）",
      tj:"水で誘発される難治のかゆみ：プレガバリンで抑制できたとの報告（タイトルのみ）",
      te:"Letter: Refractory Aquagenic Pruritus Controlled with Pregabalin.",
      sum:["PubMed上で抄録が公開されていないため、タイトルから分かる範囲にとどめます。水に触れることで生じる難治性のかゆみ（aquagenic pruritus、水原性のかゆみ）が、プレガバリンの投与で抑制できたというレターです。",
           "対象となった患者さんの背景・用量・投与期間・経過・有害事象については、抄録がないため分かりません。",
           "タイトルの範囲では、通常の治療で改善しない水によるかゆみに対してプレガバリンという選択肢がありうることが示唆されますが、詳細は原著の確認が必要です。"],
      use:"入浴やシャワーのあとに強いかゆみが出て抗ヒスタミン薬で改善しない患者さんを診るときに、原著を取り寄せて確認する価値のある報告です。",
      note:"抄録なし（タイトルのみで要約）。原著確認が必要。" },
    { cat:"A", pmid:"42902511", journal:"Int J Dermatol", year:2026, type:"レター（詳細は原著確認が必要）",
      tj:"診断が遅れた線状IgA水疱性皮膚症：ダプソンとデュピルマブで治療（タイトルのみ）",
      te:"Linear IgA Bullous Dermatosis With Delayed Diagnosis Treated With Dapsone and Dupilumab.",
      sum:["抄録が公開されていないため、タイトルから分かる範囲にとどめます。診断が遅れた線状IgA水疱性皮膚症について、ダプソン（ジアフェニルスルホン）とデュピルマブを用いて治療したというレターです。",
           "患者さんの背景・診断までの経過・両剤の用い方・効果と安全性については、抄録がないため分かりません。",
           "タイトルの範囲では、ダプソンに加えてデュピルマブを用いた治療が報告されたことが分かりますが、詳細は原著の確認が必要です。"],
      use:"環状に並ぶ水疱や緊満性の水疱で診断に迷う患者さんを診るときに、線状IgA水疱性皮膚症を念頭に置き、原著を確認する材料になります。",
      note:"抄録なし（タイトルのみで要約）。原著確認が必要。" },
    { cat:"C", pmid:"42903032", journal:"Front Neurol", year:2026, type:"無作為化・偽鍼対照試験（軽度認知障害30名・健常対照15名、12週間）",
      tj:"鍼と軽度認知障害の不眠：12週で実鍼群のみMoCAとPSQIがともに有意に改善",
      te:"Efficacy of acupuncture for sleep disorders in amnestic mild cognitive impairment: a randomized controlled trial with fMRI.",
      sum:["健忘型軽度認知障害（aMCI）の患者さんの睡眠障害に対する鍼治療の効果と、その機序を検討した研究です。睡眠障害のあるaMCIの患者さん30名と健常対照15名を登録し、患者さんを実鍼群（VA）と偽鍼群（SA）に無作為に割り付けて12週間治療しました。評価はモントリオール認知評価（MoCA）、ピッツバーグ睡眠質問票（PSQI）、安静時機能的MRI（rs-fMRI）で行っています（試験登録 ITMCTR2026000708）。",
           "治療前、aMCIの患者さんは健常対照と比べて側頭・前頭・頭頂・小脳の領域に異常な脳活動を示していました。治療後、実鍼群ではMoCAとPSQIがともに有意に改善しましたが、偽鍼群では改善しませんでした。安静時fMRIの解析では、実鍼に関連して左の鳥趾溝の低周波振幅（ALFF）と小脳虫部の局所一貫性（ReHo）に有意な変化がみられました。これらの画像指標の変化はMoCAの変化と有意に相関しましたが、PSQIの変化とは相関しませんでした。また実鍼群では、MoCAの変化とPSQIの変化が負の相関を示しました（r=-0.536、p=0.039）。",
           "鍼治療はaMCIの患者さんの睡眠と認知機能を効果的に改善しうると述べられています。治療に伴う脳機能の変化は、皮膚分節（デルマトーム）の層と脳・小脳皮質の回路の変化に関連する可能性があると考察されています。"],
      use:"物忘れが気になり眠りも浅いとご相談いただいた患者さんに鍼をご希望された場合、偽鍼と比較した小規模な試験で睡眠と認知機能の改善が報告されているとご説明する材料になります。",
      note:"皮膚領域外（睡眠・認知機能）の試験で、患者さん30名を2群に分けた小規模な研究です。" },
    { cat:"C", pmid:"42891676", journal:"Neuromodulation", year:2026, type:"単盲検・偽刺激対照の被験者内比較試験（健常成人59名）",
      tj:"経皮的耳介迷走神経刺激で作業記憶が向上：皮膚のひりつきは電気刺激で多い",
      te:"Transcutaneous Auricular Vagus Nerve Stimulation for Working Memory Enhancement: A Comparative Study of Electrical and Ultrasound Stimulation.",
      sum:["経皮的耳介迷走神経刺激（taVNS）は非侵襲的な神経調整の手法で、作業記憶を含む認知機能を高める可能性が示されています。本研究は、電気によるtaVNS（E-taVNS）と超音波によるtaVNS（U-taVNS）の急性の効果を、健常な若年成人の3-back課題を用いて検討したものです。59名が単盲検・偽刺激対照・被験者内比較のデザインで参加し、刺激の前後に作業記憶の成績を評価しました。主要な指標は全体の正答率と感度指標d'、副次的な指標は正棄却率・ヒット正答率・平均反応時間で、気質と刺激への反応性の関係も回帰分析と相関分析で検討しています。",
           "実刺激のtaVNSは刺激の前後で作業記憶の成績を有意に高め、これは感度（d'）の有意な改善として示されました。効果はU-taVNSとE-taVNSのあいだで有意差がなく（3要因の交互作用が有意でない）、ただし信頼区間は刺激法ごとの意味のある差が存在する可能性も残していました。ベースラインの不安の程度は、個々のtaVNSへの反応性を有意に予測しました。耐容性については、皮膚の刺激感（skin irritation）を報告した方の割合は、E-taVNSのほうがU-taVNSより高い結果でした。",
           "taVNSは作業記憶の成績を急性に高めうるもので、U-taVNSはE-taVNSと同程度の効果でより耐容性の良い代替となりうると述べられています。刺激法ごとの効果の違いを明らかにし、刺激の条件を最適化するにはさらなる研究が必要とされています。"],
      use:"耳への刺激（耳鍼や耳介への経皮的な刺激）をご希望される患者さんに、電気を用いる方法では皮膚のひりつきが出やすいと報告されている点をお伝えする材料になります。",
      note:"皮膚領域外（作業記憶）で、健常成人に1回の刺激を行った急性効果の検討です。鍼灸そのものではなく、機器による耳介迷走神経刺激の研究です。" },
    { cat:"C", pmid:"42857188", journal:"J Pain Res", year:2026, type:"動物実験（膝関節症モデルウサギ24匹）",
      tj:"熱が伝わる経穴への灸：ウサギの膝関節症でLequesneスコア3.17対5.00と機能改善が優位",
      te:"Moxibustion Regulates the Imbalance of Cartilage Degradation and Repair in Knee Osteoarthritis Rabbits via the SDF-1/CXCR4 Axis: Is Stimulating Heat-Sensitized Acupoints More Efficacious?",
      sum:["灸、とくに熱に敏感になった経穴（熱敏化した経穴）への灸が膝関節症（KOA）に治療効果をもたらすか、またその効果が軟骨の代謝を調節するSDF-1/CXCR4シグナル軸の調整と関連するかを検討した動物実験です。ウサギに膝関節症のモデルを作り、対照群（6匹）・モデル群（6匹）・灸群に無作為に分け、14日間の灸の介入の後、赤外サーモグラフィで測定した熱反応により灸群を熱敏感灸（HSM、6匹）と非熱敏感灸（NSM、6匹）に分類しました。熱敏化は治療中に遠位の皮膚温が1℃以上持続して上昇することと定義しています。評価はLequesne MG指数・病理組織・RT-qPCR・ウエスタンブロット・マイクロCTで行っています。",
           "モデル群（Lequesneスコア9.667±1.633）と比べ、HSM（3.167±0.753、p<0.01）とNSM（5.000±0.894、p<0.01）はいずれも関節機能を有意に改善し、HSMはNSMより有意に優れていました（p<0.05）。分子レベルでは、HSMはNSMと比べSDF-1（1.570±0.131対1.957±0.301、p<0.05）、CXCR4（1.902±0.318対2.313±0.277、p<0.05）、MMP-13（2.166±0.312対2.608±0.340、p<0.05）のmRNA発現を有意に低下させ、SOX9（0.774±0.086対0.638±0.089、p<0.05）とCol2a1（0.728±0.091対0.601±0.078、p<0.05）を有意に上昇させました。軟骨下骨については、両方の灸群がモデル群より有意に改善しましたが（いずれもp<0.05）、骨密度・骨体積率・骨梁数・骨梁幅・骨梁間隙についてHSMとNSMのあいだに有意差はありませんでした（いずれもp>0.05）。",
           "灸は膝関節症を改善し、その効果はSDF-1/CXCR4シグナル軸の抑制と、軟骨の分解と合成の均衡の回復を伴うとされています。熱敏化した経穴への刺激は、機能の回復と軟骨修復の分子指標について非熱敏感の経穴より優れた効果をもたらしましたが、軟骨下骨の指標ではこの優位性はみられなかったと述べられています。"],
      use:"膝の痛みで灸をご希望される患者さんに、施灸中に温かさが伝わる部位を選ぶという考え方が研究されているとご紹介する材料になりますが、ウサギの実験であり、ヒトでの効果は未確認と添えてご説明ください。",
      note:"皮膚領域外（膝関節症）の動物実験です。ヒトでの効果は未確認です。" }
  ]
},

  items: [
    { cat:"A", pmid:"42901423", journal:"J Am Acad Dermatol", year:2026, type:"第2相・多施設・無作為化二重盲検プラセボ対照の用量設定試験（成人200名）",
      tj:"経口JAK1/TYK2阻害薬QY201：12週のEASI-75が10mg群84.7%、偽薬18.5%",
      te:"Efficacy and safety of QY201, an oral dual Janus kinase 1/tyrosine kinase 2 inhibitor, in adults with moderate-to-severe atopic dermatitis: a multicenter, randomized, double-blind, placebo-controlled phase 2 dose-finding trial.",
      sum:["QY201は新規の経口ヤヌスキナーゼ1（JAK1）・チロシンキナーゼ2（TYK2）阻害薬です。中等症〜重症のアトピー性皮膚炎の成人における複数用量の有効性を評価し、第3相試験の用量選択に役立てる目的で行われた多施設・無作為化・二重盲検・プラセボ対照の第2相試験です。成人200名をQY201の5mg・10mg・20mg1日2回投与または偽薬の4群に1対1対1対1で割り付け、12週間投与しました。主要評価項目は12週時に湿疹面積・重症度指数（EASI）が75%以上改善した方の割合（EASI-75）です。",
           "12週時のEASI-75達成率は5mg1日2回群72.9%、10mg1日2回群84.7%、20mg1日2回群81.4%で、偽薬群18.5%に対しいずれもP<0.0001でした。医師による全般評価（IGA）の反応率はそれぞれ44.7%（P=0.0011）、64.3%（P<0.0001）、71.3%（P<0.0001）で、偽薬群は12.4%でした。治療期間中に発現した有害事象はQY201の各群で74.0%・75.5%・90.4%、偽薬群で69.4%に生じ、ほとんどは軽度または中等度でした。",
           "限界として観察期間が短いことと単一国の集団であることが挙げられています。この第2相の結果は、10mg1日2回と20mg1日2回を検証的な第3相試験でさらに評価することを支持すると述べられています。"],
      use:"注射が難しい、あるいは飲み薬をご希望される中等症〜重症のアトピー性皮膚炎の患者さんに、経口薬の開発が進んでいることをご説明する材料になります。",
      note:"国内未承認の開発中の薬剤で、単一国での第2相試験の結果です。" },
    { cat:"A", pmid:"42902282", journal:"BMC Pediatr", year:2026, type:"単施設の前向き観察研究（生後6か月〜6歳未満50名）",
      tj:"6か月〜6歳未満のデュピルマブ：16週でEASI75が87.1%、食物アレルギーの改善率84.6%",
      te:"Dupilumab efficacy in children aged 6 months to younger than 6 years with moderate-to-severe atopic dermatitis and clinical characteristics of early super-responders.",
      sum:["生後6か月から6歳未満の中等症〜重症アトピー性皮膚炎に対するデュピルマブの有効性と、早期に非常によく反応する方（early super-responder、eSR）の臨床的特徴を調べた前向き研究です。寧夏医科大学総合病院皮膚科で2023年1月〜2025年3月に治療を受けた小児を登録し、年齢と体重に応じてデュピルマブ200〜300mgを4週ごとに皮下注射しました。ベースライン・4週・12週・16週にEASI、IGA、最大の痒みの数値評価尺度（PP-NRS）、小児および乳児の皮膚疾患生活の質指標（CDLQI／IDQoL）、家族への影響（DFI）で評価し、併存症はRCAT・小児喘息コントロールテスト・経口食物負荷試験で評価、有害事象も系統的に記録しています。",
           "50名（男児21名42.0%・女児29名58.0%、年齢4.24±1.81歳）が対象となりました。皮疹と痒みに関するスコアは4週・12週・16週でベースラインより有意に低下しました（いずれもP<0.001）。4週時に主要評価項目（EASI75・PP-NRSの4点以上の低下・CDLQI／IDQoLの4点以上の改善を同時に満たすこと）を達成した方は40.0%（20/50）で、16週時のEASI75は87.10%（27/31）、IGA 0/1は90.32%（28/31）でした。DFIが中等度〜重度の方はベースラインの100%から9.68%へ著明に減少しました（P<0.001）。繰り返す上気道感染の頻度が有意に低下し（P=0.017）、アレルギー性鼻炎の改善率は84.21%（P<0.001）、食物アレルギーの改善率は84.61%（P<0.001）でした。多変量ロジスティック回帰では好塩基球絶対数（オッズ比0.104、95%信頼区間0.021〜0.506、P=0.005）とアレルギー性鼻炎があること（オッズ比0.223、95%信頼区間0.055〜0.896、P=0.035）がeSRの独立した予測因子とされ、ROC解析の曲線下面積は0.773（P=0.001）、ベースラインの好塩基球絶対数が0.035×10⁹/L未満であることがより良いeSRと関連していたと記載されています。治療期間中に重篤な有害事象はみられませんでした。",
           "生後6か月〜6歳未満の中等症〜重症アトピー性皮膚炎に対し、デュピルマブは有意な有効性と良好な安全性を示しました。治療中にアレルギー併存症が軽減し、繰り返す上気道感染の頻度が低下し、お子さんとご家族の生活の質が改善したと述べられています。"],
      use:"乳幼児のアトピー性皮膚炎でデュピルマブを検討される際、皮疹と痒みだけでなく鼻炎や食物アレルギー、ご家族の負担の改善も期待できる点をご説明する材料になります（院内アプリ「生活指導アシスタント」の食物アレルギー・生活指導のタブと合わせてご案内いただけます）。",
      note:"単施設・対照なしの前向き観察研究で、16週時の解析対象は31名です。好塩基球数の向き（高いことと0.035×10⁹/L未満であること）は抄録内の記載が一致していないため、原著の確認が必要です。" },
    { cat:"A", pmid:"42900024", journal:"J Am Acad Dermatol", year:2026, type:"診療ガイドライン（系統的レビューとGRADEに基づく37の推奨）",
      tj:"米国AAD／HS財団の化膿性汗腺炎ガイドライン：生物学的製剤4剤と痛みの定期評価を強く推奨",
      te:"Joint American Academy of Dermatology-Hidradenitis Suppurativa Foundation guidelines of care for the management of hidradenitis suppurativa.",
      sum:["化膿性汗腺炎は世界の人口の0.7〜1.5%に生じ、著しい身体機能の障害をきたし生活の質を大きく損ないます。その管理についてエビデンスに基づく推奨を示す目的で、作業部会が系統的レビューを行い、GRADE（推奨・評価・開発・評価の格付け）の手法でエビデンスの確実性を評価して推奨を作成したものです。",
           "本ガイドラインは37のエビデンスに基づく推奨を示しています。強い推奨は、アダリムマブ・ビメキズマブ・インフリキシマブ・セクキヌマブと、痛みの定期的な評価について行われました。条件付きの推奨は、外用のクリンダマイシン・レゾルシノール・ルキソリチニブ、内服のドキシサイクリン・テトラサイクリン・クリンダマイシンとリファンピシンの併用、経静脈のエルタペネム、スピロノラクトン、短期の全身ステロイド、ウパダシチニブ、特定の手術的処置、禁煙、支持的な疼痛管理、亜鉛の補充とビタミンDの補充について行われました。",
           "解析は系統的レビューで得られた最良のエビデンスに限られるという限界がありますが、化膿性汗腺炎の管理についてエビデンスに基づく推奨を提供するものと述べられています。"],
      use:"腋窩や鼠径に繰り返すしこり・瘻孔のご相談で、痛みの評価を診察に組み込み、禁煙を含む生活面と薬物療法の見通しをご説明する材料になります。",
      note:"米国のガイドラインで、国内の保険適用とは異なる点にご留意ください。" },
    { cat:"A", pmid:"42899822", journal:"Indian Dermatol Online J", year:2026, type:"無作為化・評価者盲検の比較試験（17名69爪、完了13名65爪）",
      tj:"爪乾癬の局所注射：メトトレキサートはトリアムシノロンと同等で、中止後8週の効果がより持続",
      te:"Comparison of the Efficacy of Intralesional Methotrexate and Triamcinolone in the Treatment of Nail Psoriasis: A Randomized, Investigator-Blind, Controlled Trial.",
      sum:["爪乾癬は頻度が高く治療の難しい乾癬の病型で、複数の薬剤について効果が検討されてきましたが結果は一定していません。本試験はメトトレキサートの局所注射をトリアムシノロンの局所注射と比較し、爪乾癬に対する治療効果と安全性を評価した評価者盲検の無作為化比較試験です。17名（69爪）を登録し13名（65爪）が試験を完了しました。重症度は修正爪乾癬重症度指数（mNAPSI）で、治療開始前・各注射後・最終注射から8週後に評価しています。33爪をメトトレキサート、32爪をトリアムシノロンに無作為に割り付け、希釈したトリアムシノロン（5mg/mL）0.1mL（0.5mg）またはメトトレキサート0.05mL（1.25mg）を3週ごとに4回、各点に注射しました（イラン臨床試験登録 IRCT20140212016557N7）。",
           "いずれの治療もmNAPSIを有意に低下させました（P<0.001）。治療終了時のmNAPSIの低下率はトリアムシノロンを注射した爪でより大きかった一方（P=0.015）、8週後の追跡では有意差はありませんでした（P=0.906）。治療中止から8週後のmNAPSIの悪化は、トリアムシノロン群にのみみられました（P=0.01）。",
           "限界として比較的少ない症例数、長期の追跡の欠如、爪母と爪床を分けた反応の評価がないことが挙げられています。メトトレキサートの局所注射は爪乾癬に有効かつ安全で、トリアムシノロンの局所注射と同程度の効果を示し、効果の持続はより良好であったと述べられています。"],
      use:"外用や内服で改善しにくい爪乾癬の患者さんに、局所注射という選択肢と、中止後の効果の持ち方の違いについてご説明する材料になります。",
      note:"13名65爪の小規模な試験です。" },
    { cat:"A", pmid:"42899432", journal:"Eur Ann Allergy Clin Immunol", year:2026, type:"単群の逐次介入研究（89名）",
      tj:"慢性蕁麻疹とグルテン：3週間の除去で48.3%が改善し、再摂取で悪化",
      te:"Exploring gluten sensitivity in chronic spontaneous urticaria.",
      sum:["慢性特発性蕁麻疹（CSU）は頻度が高く対応の難しい疾患で、通常は生活の質を損ないます。現在の薬物療法は主に症状を抑えるもので、なお症状に悩む方が多くいます。グルテン感受性がCSUに関わる可能性を示す根拠は限られ結論も一定でなく、現在の国際的なガイドラインもグルテン除去食を標準的な治療としては推奨していません。本研究はグルテン除去食（GFD）がCSUの疾患活動性に与える影響を評価する目的で、Ain Shams大学病院のCSUの患者さん89名を対象に行われた単群の逐次介入研究です。セリアック病の方は除外し、抗TTG抗体が陰性の方のみを対象として、小麦とグルテンの皮膚プリックテストを行い、3週間のGFDの後にグルテンを再摂取して約1週間の短期の追跡で再評価しました。重症度は蕁麻疹活動性スコア7（UAS7）で評価し、血液検査も実施しています。",
           "3週間のGFDの後、43名（48.3%）でグルテンの除去により蕁麻疹の活動性が改善し、その後のグルテンの再摂取で症状が悪化しました。これはUAS7の有意な変動として記録されています（P<0.001）。CRPはグルテン感受性でない群で有意に高く、その他の検査項目は同程度でした。",
           "グルテンの除去は、CSUの一部の患者さんで蕁麻疹の活動性の低下と関連していました。ただし有効性を確立するには対照をおいた研究が必要であると述べられています。"],
      use:"食事との関連を気にされる慢性蕁麻疹の患者さんに、一部の方では関係する可能性があるものの、標準的な治療として推奨される段階ではないとご説明する材料になります（院内アプリ「生活指導アシスタント」の食物アレルギー・生活指導のタブと合わせてご案内いただけます）。",
      note:"対照群のない単群の介入研究で、盲検化もされていません。" },
    { cat:"A", pmid:"42901516", journal:"Contact Dermatitis", year:2026, type:"職業性皮膚アレルギー外来での横断研究（126名・機械学習モデルの構築と検証）",
      tj:"角層バイオマーカーで刺激性とアレルギー性を区別：パッチテストでAUC0.85、手の湿疹では0.51",
      te:"Stratum Corneum Biomarkers for Differentiating Irritant and Allergic Contact Dermatitis.",
      sum:["職業性の手の皮膚炎には刺激性接触皮膚炎（ICD）とアレルギー性接触皮膚炎（ACD）が含まれ、臨床像が似通って重なり合い、アトピー性皮膚炎と併存することもあって診断を難しくします。本研究の目的は、角層のバイオマーカーがICDとACDを区別できるかを探索することです。アムステルダム大学医療センターの職業性皮膚アレルギー外来から126名を集め、手の皮膚炎の病変部、ニッケル・クロム・メチルイソチアゾリノン・ラウリル硫酸ナトリウム（刺激物質）に対するパッチテスト反応部、および対照部位から角層の試料を採取し、33のバイオマーカーを解析しました。ランダムフォレストと罰則付き回帰のモデルをパッチテストのデータで学習させて手の皮膚炎で検証し、さらに手の皮膚炎のなかで学習・検証するモデルも作成しています。",
           "パッチテストのモデルはICDとACDを良好に判別し（平均の曲線下面積0.85、95%信頼区間0.82〜0.87）、これは主に皮膚バリアに関連するバイオマーカーによるものでした。手の皮膚炎では性能が低下し（平均の曲線下面積0.51、95%信頼区間0.26〜0.76）、ACDに対する感度は88%でした。手の皮膚炎のなかで学習・検証したモデルの平均の曲線下面積は0.60（95%信頼区間0.57〜0.64）、個々のアレルゲン間の判別の平均の曲線下面積は0.75（95%信頼区間0.72〜0.77）でした。",
           "角層のバイオマーカーは急性のパッチテスト反応ではICDとACDを良好に区別しましたが、手の皮膚炎では判別力が限られており、これは急性の炎症と慢性の炎症の違いを反映していると述べられています。"],
      use:"手あれのご相談で、パッチテストの反応はアレルギー性と刺激性の区別に役立つ一方、実際の慢性の手の湿疹では両者の見分けが難しいことをご説明する材料になります（院内アプリ「生活指導アシスタント」のパッチテストのタブと合わせてご活用いただけます）。",
      note:"研究用のバイオマーカー解析で、日常診療で使える検査として確立したものではありません。" },
    { cat:"A", pmid:"42897703", journal:"Adv Rheumatol", year:2026, type:"多施設の横断研究（172名・エラストグラフィとの比較）",
      tj:"メトトレキサート内服中のFIB-4：カットオフ1.62、65歳未満で進行した肝線維症の除外に有用",
      te:"Diagnostic performance of FIB-4 in detecting advanced liver fibrosis in patients with rheumatoid arthritis, psoriatic arthritis and psoriasis using methotrexate.",
      sum:["メトトレキサート（MTX）は関節リウマチ・乾癬性関節炎・乾癬の第一選択の治療ですが、長期の使用は肝線維症と関連づけられており、有効なスクリーニングの方法が求められています。肝生検の限界や、エラストグラフィの費用と利用できる施設の限りを踏まえ、非侵襲的なスクリーニングとして最も広く使われているのがFIB-4スコアです。本研究はリウマチ科・皮膚科の専門施設に通院し、MTXを長期に内服している関節リウマチ・乾癬性関節炎・乾癬の患者さんで、FIB-4が進行した肝線維症を予測する精度を評価した多施設の横断研究です。診療記録・面談・身体所見から背景・臨床・検査・生活習慣・治療の情報を集め、年齢で調整したFIB-4を算出し、疾患活動性は妥当性が確認された指標で評価しました。肝線維症と脂肪化は振動制御式一過性エラストグラフィで評価し、年齢層別のROC曲線と多変量ロジスティック回帰で解析しています。",
           "172名（多くは女性、平均年齢58歳、最も多い基礎疾患は関節リウマチ）が対象となり、エラストグラフィで進行した線維症が11%に同定されました。FIB-4の値は線維症の病期が進むにつれ段階的に上昇し、ROC解析では、これまでMTX治療を受けている患者さんでは報告されていなかったカットオフ値1.62が同定されました。この値は65歳未満の方でより良い成績を示し（曲線下面積0.68、65歳以上は0.64）、とくに進行した線維症を除外する用途で有用でした。多変量解析では、FIB-4の高リスク区分、肥満、糖尿病、進行した肝脂肪化が進行した線維症と独立して関連し、炎症性疾患の活動性と累積のMTX投与量は関連していませんでした。",
           "FIB-4は65歳未満のMTX治療を受けている患者さんで進行した肝線維症を除外するのに利用しやすく有用となりうる指標で、この集団でまずまずの成績を示しました。進行した線維症は主にMTXの曝露や炎症性疾患の活動性ではなく、代謝性の要因によって生じていたと述べられています。"],
      use:"MTXを続けている乾癬の患者さんの定期的な検査で、FIB-4を肝線維症の除外に用いつつ、体重・糖尿病・脂肪肝の管理もあわせてご説明する材料になります。" },
    { cat:"A", pmid:"42900646", journal:"Dermatology", year:2026, type:"全国規模の後方視コホート研究（単胎の生産児21万5,280例）",
      tj:"妊娠中の母体糖尿病と小児乾癬：21万例の追跡で関連なし（ハザード比1.17）",
      te:"Maternal Diabetes during Pregnancy and Risk of Childhood Psoriasis in Offspring: A National Retrospective Cohort Study.",
      sum:["妊娠中の母体の糖尿病は、児の長期的な代謝や免疫に関わる転帰と関連します。乾癬は後年の代謝性の併存症と強く結びついていますが、子宮内で母体の糖尿病に曝露されることが児の乾癬のリスクに与える影響は分かっていません。本研究は、妊娠中の母体の糖尿病が児の小児乾癬の発症と関連するかを検討したものです。イスラエル最大の健康維持機構であるClalit Health Servicesの電子診療記録を用いた住民ベースの後方視コホート研究で、2010〜2023年の単胎の生産児21万5,280例を2024年まで追跡しました。妊娠中の母体の糖尿病はICD-10コードで同定し、妊娠糖尿病・1型糖尿病・2型糖尿病に分類、主要評価項目は児の小児乾癬として、母体・妊娠・児の背景を調整した多変量Cox比例ハザード解析で関連を推定しています。",
           "全体の5.4%の児が、妊娠中に糖尿病のあった母から生まれていました。追跡期間中に1,557名（0.7%）が乾癬と診断されました。乾癬の割合は母体の糖尿病に曝露された児と曝露されなかった児で差がなく（0.7%対0.7%）、糖尿病の病型・治療の方法・血糖コントロールの程度による関連もみられませんでした。調整後の解析でも、母体の糖尿病は児の小児乾癬と関連していませんでした（ハザード比1.17、95%信頼区間0.90〜1.54、P=0.246）。",
           "妊娠中の母体の糖尿病は、児の小児乾癬のリスクの上昇と関連しませんでした。本研究の結果は、小児乾癬の発症において出生前の代謝の乱れが大きな役割を果たすという考えを支持しないと述べられています。"],
      use:"妊娠中に糖尿病を指摘されたお母さまから、お子さんの皮膚の病気についてご心配を伺ったときに、少なくとも乾癬については関連がみられなかったとお伝えする材料になります。" },
    { cat:"A", pmid:"42899233", journal:"Cureus", year:2026, type:"症例集積（メキシコの成人5名）",
      tj:"既治療のアトピー：ウパダシチニブで2週にEASIが40〜54.5%低下、デュピルマブ再燃例でも改善",
      te:"Clinical Response to Upadacitinib in Treatment-Experienced Patients With Atopic Dermatitis: A Case Series From Latin America.",
      sum:["アトピー性皮膚炎は慢性の炎症性皮膚疾患で、疾患活動性が持続する方やこれまでの治療への反応が不十分な方には全身療法が必要になることがあります。選択的なJAK1阻害薬であるウパダシチニブは中等症〜重症のアトピー性皮膚炎で速やかな有効性が示されていますが、ラテンアメリカの集団における実地のデータは限られています。本報告は、外用および／または全身療法を受けた後に経口ウパダシチニブを投与されたメキシコの成人5名について、臨床反応と治療の経過を記述したものです。臨床反応はEASI、痒みの数値評価尺度（NRS）、皮膚疾患生活の質指標（DLQI）を用いてベースラインと2週時に評価し、その後6か月〜2年の追跡を行っています。",
           "4名は15mg1日1回で開始し、1名は当初30mg1日1回を投与された後、肝酵素の上昇のため15mgに減量されました。2週時には5名全員に臨床的な改善がみられ、EASIの低下は40〜54.5%、NRSの低下は50〜80%、DLQIは1〜3点まで低下しました。全員が追跡期間中も改善を維持し、最終的にEASI 3以下・DLQI 0に達しました。デュピルマブの治療中に再燃を経験していた2名も、ウパダシチニブへの切り替え後に著明に改善しました。1名で基準値上限の約1.5倍の肝酵素の上昇がみられましたが減量後に回復し、その他の有害事象の報告はありませんでした。",
           "これらの症例は、デュピルマブ治療後に再燃した方を含む既治療のアトピー性皮膚炎において、ウパダシチニブが役割を果たしうることを示しています。有効性と安全性のさらなる評価には、より大規模な前向き研究が必要であると述べられています。"],
      use:"デュピルマブで効果が落ちてきた患者さんに、JAK阻害薬への切り替えという選択肢と、肝酵素の確認が必要なことをご説明する材料になります。",
      note:"5名の症例集積で、対照はありません。" },
    { cat:"A", pmid:"42900474", journal:"JAMA Netw Open", year:2026, type:"単施設の後方視コホート（185名・時間依存Cox解析）",
      tj:"尿路上皮がん治療で生じた皮膚症状：出現した方で全生存が良好（ハザード比0.34）",
      te:"Skin Toxic Effects and Survival With Enfortumab Vedotin-Pembrolizumab in Advanced Urothelial Carcinoma.",
      sum:["エンホルツマブ ベドチンとペムブロリズマブの併用（EVP）療法では皮膚症状が早期によくみられる有害事象ですが、一次治療を受ける患者さんでの臨床転帰との関連は明らかではありません。本研究は、一次治療としてEVP療法を受ける患者さんで、治療中に生じた皮膚症状と臨床転帰の関連を評価したものです。テキサス大学MDアンダーソンがんセンターで2022年3月3日〜2025年7月31日に、局所進行または転移のある尿路上皮がんに対し一次EVP療法を受けた成人を対象とした後方視コホート研究で、不死時間バイアスを避けるため皮膚症状を時間依存の曝露としてCox比例ハザード回帰に組み込み、あらかじめ定めた逐次調整モデルと30日のランドマーク解析で結果の頑健性を確認しています。皮膚症状（発疹または痒み）は診療記録から同定し、主要評価項目は全生存（OS）、副次評価項目は無増悪生存（PFS）と客観的奏効率（ORR）です。",
           "185名（年齢中央値73歳、四分位範囲67〜79、男性140名75.7%）のうち98名（53.0%）に皮膚症状が生じ、発症までの期間の中央値は開始後14日（四分位範囲7〜28）でした。グレード3以上の皮膚症状は10名（5.4%）にみられ、皮膚症状により31名（16.8%）が減量、20名（10.8%）が休薬、9名（4.9%）が中止に至りました。追跡期間中央値17.7か月（四分位範囲11.3〜24.2）で、皮膚症状のあった層は全体および内臓転移のある方においてOSとPFSが長い曲線を示しました。調整後の時間依存Cox回帰では、皮膚症状はOSが長いことと関連し（ハザード比0.34、95%信頼区間0.20〜0.57）、逐次調整モデルと30日ランドマーク解析でも一貫していました。30日ランドマーク解析では、PFSとORRとの関連も好ましい方向でしたが、多変量調整後は弱まりました。",
           "一次EVP療法を受けた185名のコホートにおいて、治療中に生じた皮膚症状はOSが長いことと関連していました。皮膚症状を治療効果の早期の指標とすることについて、さらなる前向きの検証と、この関連の背景にある生物学的な機序の検討を支持すると述べられています。"],
      use:"がん治療中の発疹や痒みで紹介された患者さんに、皮膚症状を管理しながら治療を続けていただけるよう支える際の背景知識になります（関連を示した観察研究で、因果関係を示すものではありません）。" }
  ]
},
{
  date: "2026-10-21",
  range: { A: "2026-10-19〜10-21", B: "2026-10-19〜10-21", C: "2026-09-21〜10-21" },
  items: [
    { cat:"A", pmid:"42895682", journal:"Dermatol Ther (Heidelb)", year:2026, type:"国際アンケート調査（皮膚科医150名）＋専門家による推奨作成（AMAZEプロジェクト）",
      tj:"アトピーの生物学的製剤の始め方：開始法は国ごとに大きく異なり、12〜16週での評価を推奨",
      te:"Initiating Biologics in Atopic Dermatitis: Global Practices and Recommendations from the AMAZE Project.",
      sum:["生物学的製剤は中等症〜重症のアトピー性皮膚炎の治療選択を広げましたが、日常診療での開始と継続の実際的な指針は限られているとして行われた調査です。北米・欧州・日本の皮膚科医150名にオンラインで実地の進め方を尋ね、その結果を国際的な運営委員会が解釈し、専門家の討議と文献のナラティブレビューを加えて推奨をまとめています。",
           "生物学的製剤の開始の仕方には大きなばらつきがみられました。全体では47%の医師が長期使用を想定していた一方、日本の医師は4〜12か月という短めの投与期間をより多く想定しており、これは国内のガイドラインの推奨を反映していると述べられています。従来の全身療法からの切り替え方も様々で、49%が併用期間を置き、33%は併用せず直接切り替え、18%は休薬期間を設けていました。欧州の医師は開始前に従来の全身療法を中止することが多く、北米と日本では重ねる方法がより一般的でした。4週以内の早めの再診は36%が行っており、医療制度上の要件もあって日本で最も多くみられました。",
           "推奨として、長期の疾患コントロールを見据えた患者さん中心の治療目標を立てること、従来の全身療法からの切り替えは個別に方針を決めること、開始から12〜16週前後に治療反応を正式に評価する構造化された経過観察を行うこと、保湿剤と外用抗炎症薬を続けることで再燃に先回りして対応することが挙げられています。"],
      use:"生物学的製剤を始める患者さんに、12〜16週を目安に効果を評価する見通しと、その間も保湿と外用薬を続けていただく必要性をご説明する材料になります（院内アプリ「生活指導アシスタント」の生活指導・外用薬のタブと合わせてご案内いただけます）。" },
    { cat:"A", pmid:"42898453", journal:"J Psoriasis Psoriatic Arthritis", year:2026, type:"第3相試験3件（ICONIC-LEAD／ICONIC-ADVANCE 1・2）の事後プール解析（216名）",
      tj:"経口ペプチドのイコトロキンラ：乾癬＋関節症状で16週に痛み半減45.5%対偽薬16.1%",
      te:"Icotrokinra, a Targeted Oral Peptide, in Participants With Moderate-to-Severe Plaque Psoriasis and Self-Reported Psoriatic Arthritis: Results From a Pooled Analysis of the Phase 3 ICONIC-LEAD, ICONIC-ADVANCE 1, and ICONIC-ADVANCE 2 Trials.",
      sum:["イコトロキンラはインターロイキン23受容体を的を絞って阻害する経口の標的ペプチドで、中等症〜重症の尋常性乾癬に対し成人と12歳以上・体重40kg以上の小児で承認されています。本解析は、乾癬性関節炎の既往を自己申告した参加者について16週までの関節に関する成績を調べたもので、3つの第3相試験のデータをプールし、イコトロキンラ200mg1日1回または偽薬に無作為化された216名（実薬149名・偽薬67名）を対象としています。評価項目は患者さんご自身による乾癬性関節炎の疾患活動性の全般評価（PtGA）と痛みの評価の変化および50%以上の改善、ならびに爪乾癬の修正NAPSI（mNAPSI）のベースラインからの変化率です。p値は名目値と注記されています。",
           "8週時点で、イコトロキンラ群は偽薬群に比べPtGAが-18.5対-4.8（P<0.001）、乾癬性関節炎の痛みが-17.1対-4.6（P<0.001）と大きく改善し、16週時点でも-19.2対-0.8（P<0.001）、-19.5対-7.8（P=0.003）と効果が持続しました。16週時に50%以上の改善を達成した割合は、PtGAで47.0%対10.7%、痛みで45.5%対16.1%（いずれもP<0.001）でした。16週時のmNAPSIはイコトロキンラ群で41.6%改善した一方、偽薬群では118.6%悪化していました（P<0.001）。有害事象の発生率は両群で同程度でした。",
           "イコトロキンラは、乾癬性関節炎を併せもつ患者さんにおいて、患者さんご自身が報告する関節の活動性と痛み、および爪乾癬を早期から大きく改善させ、16週までの安全性も良好であったと述べられています。"],
      use:"爪の変化や関節の痛みを伴う乾癬の患者さんに、注射以外に飲み薬の選択肢も開発が進んでいることをご説明する材料になります。" },
    { cat:"A", pmid:"42898708", journal:"Cureus", year:2026, type:"多施設・後方視の観察研究（インド477施設・2,066名）",
      tj:"ニキビ施術後のセラミド保湿＋SPF50+：7日で乾燥61.2%・痒み61.4%が「完全に改善」",
      te:"Patient-Reported Outcomes With Episoft® AC SPF 50+, a Ceramide-Based Moisturizer, in Acne-Related Post-procedural Care: A Real-World Multicenter Observational Study From India (PROCEED Study).",
      sum:["ニキビに対する施術の後は皮膚のバリアが乱れ、不快感と紫外線への過敏さが増します。セラミドを配合し広域の紫外線防御を兼ねた製品はバリア修復と日焼け止めを一度に行えますが、この場面での患者さんご自身の評価による裏づけは限られているとして行われた研究です。インドの477の皮膚科施設で、ニキビ関連の施術後に当該のセラミド配合・SPF50+の保湿剤を7日以上処方された18〜45歳の患者さんを後方視的に集め、7日目に10点の数値尺度で評価しました。主要評価項目は乾燥と灼熱感・ピリピリ感の軽減、副次評価項目は痒み・赤みの軽減、鎮静効果、ニキビの悪化、満足度、使用継続の意向などです。",
           "2,066名（女性55.3%／n=1,143、最多年齢層は26〜30歳で42.7%／n=882）が登録されました。施術の内訳は上位からケミカルピーリング56.7%（n=1,172）、Qスイッチレーザートーニング10.9%（n=226）、マイクロニードリング8.9%（n=183）で、バリアの乱れは中等度が56.7%（n=1,172）、重度が10.8%（n=223）でした。7日目に「完全に改善（9〜10点）」と回答した割合は、乾燥61.2%（n=1,265、平均8.64±1.14）、灼熱感・ピリピリ感58.6%（n=1,210、平均8.63±1.14）、痒み61.4%（n=1,268）、赤み62.1%（n=1,283）、鎮静効果61.2%（n=1,264）でした。非常に満足と答えた方は62.6%（n=1,293）、使用継続の意向は65.6%（n=1,356）、今後も施術を受けたいという意向は67.2%（n=1,388）で、ニキビの悪化がなかった方は67.9%（n=1,403）でした。研究期間中に有害事象の報告はありませんでした。",
           "この大規模な実地の多施設研究では、セラミド配合のSPF50+保湿剤は、施術の種類やバリアの乱れの程度を問わず、患者さんの症状の緩和と高い満足度に結びつき、ニキビの悪化も少なかったとして、ニキビ関連の施術後のスキンケアにセラミド配合のSPF50+の保湿を日常的に取り入れることを支持すると述べられています。"],
      use:"ピーリングなどの施術後のスキンケアで、保湿と日焼け止めを一つで済ませたいという患者さんへのご説明の材料になります。",
      note:"特定製品を単群で後方視的に観察した研究で、他製品や無治療との比較はありません。" },
    { cat:"A", pmid:"42895563", journal:"Support Care Cancer", year:2026, type:"単施設の後方視コホート（143名・逆確率重み付け解析）",
      tj:"ドセタキセルの皮膚症状：デスロラタジン予防併用で46.2%対70.7%、特に痒みが低下",
      te:"Association between prophylactic desloratadine use and docetaxel-induced skin toxicities in patients with early-stage breast cancer: an inverse probability-weighted retrospective cohort study.",
      sum:["ドセタキセルはデキサメタゾンによる支持療法を行っても皮膚症状を起こしますが、確立した補助的な一次予防はありません。末梢のH1受容体拮抗薬で抗炎症作用も併せもつデスロラタジンが、早期乳がんの患者さんのドセタキセルによる皮膚症状と関連するかを調べた研究です。ステージI〜IIIの乳がんで周術期にドセタキセル（75mg/m2・3週ごと）を含む化学療法とデキサメタゾンの前投薬を受けた143名を対象とし、49名（34.3%）には初回投与の翌朝から治療終了までデスロラタジン5mgが無作為ではない形で処方され、94名は予防的な抗ヒスタミン薬を受けていません。主要評価項目は患者さんが報告した皮膚症状（発疹・痒み・手足症候群）のいずれかで、安定化した逆確率重み付け（IPTW）による主解析と、2,000回のブートストラップによる95%信頼区間を用いています。",
           "安定化IPTW後の皮膚症状の発生率は、デスロラタジンあり46.2%、なし70.7%で、リスク差は-24.6ポイント（95%信頼区間-43.0〜-5.3）、リスク比0.65（95%信頼区間0.42〜0.92）でした。記述的な推定では痒みの発生がより低く（リスク比0.36、95%信頼区間0.08〜0.79）、発疹も低いものの推定は精度を欠き（リスク比0.70、95%信頼区間0.43〜1.03）、手足症候群は低下しませんでした（5.9%対5.4%）。導入後の期間に限った解析でも同様の結果で（リスク比0.61、95%信頼区間0.42〜0.90）、陰性対照とした末梢神経障害は低下していませんでした（リスク比1.19、95%信頼区間0.52〜2.58）。",
           "デスロラタジンの予防投与は皮膚症状のリスク低下、とくに痒みの低下と関連していました。発疹のリスクは低い傾向でしたが推定の精度は不十分で、手足症候群は低下しませんでした。仮説を生み出す段階の知見であり、前向きの無作為化試験での検証が必要であると述べられています。"],
      use:"がん治療に伴う痒みや発疹のご相談を受けたときに、抗ヒスタミン薬の予防的な使用についての知見として参考になります（観察研究に基づく関連で、効果が確かめられたものではありません）。" },
    { cat:"A", pmid:"42895571", journal:"Pediatr Nephrol", year:2026, type:"多施設・非盲検の薬物動態試験（12〜17歳8名、解析は7名）",
      tj:"ジフェリケファリン単回静注：12〜17歳の血液透析で成人と同程度の血中曝露",
      te:"The pharmacokinetics of a single intravenous dose of difelikefalin in adolescents aged 12 to 17 years on hemodialysis.",
      sum:["維持血液透析を受けている12〜17歳の方を対象に、ジフェリケファリンを単回静注したときの薬物動態・安全性・忍容性を評価した多施設・非盲検の試験です。透析終了時に乾燥体重あたり0.5μg/kgを単回ボーラス投与し、3日間にわたり血中濃度を測定、7〜10日間有害事象を観察しました。主な指標は最高血中濃度（Cmax）、投与後0〜48時間の曲線下面積（AUC0-48h）、無限大まで外挿したAUC（AUCinf）で、血液透析中の成人を対象とした既存の試験のデータとあらかじめ定めた数値比較を行っています。",
           "8名が試験を完了し、7名（男性3名・女性4名、12〜17歳、平均15.1歳）で薬物動態が解析可能でした。平均（標準偏差）のCmaxは6.03（1.81）ng/mL、AUC0-48hは63.4（17.4）h·ng/mL、AUCinfは72.5（23.7）h·ng/mLで、全身の曝露量は青年と成人で同程度でした。1名に治療に関連する軽度の有害事象（頭痛とめまい）が2件みられましたが、重篤な有害事象や中止に至った有害事象はありませんでした。",
           "単回0.5μg/kg投与での青年の曝露は成人の既存データと同程度で、新たな安全性上の懸念もみられず、中等症〜重症の慢性腎臓病に伴う痒みのある青年でこの用量をさらに検討することを支持すると述べられています。"],
      use:"透析を受けている若い患者さんの強い痒みについて、専門科と連携する際の治療開発の状況として把握しておく材料になります（本試験は薬物動態と安全性の評価で、痒みへの効果は評価されていません）。" },
    { cat:"A", pmid:"42897500", journal:"BMC Ophthalmol", year:2026, type:"前向き・非無作為化の比較研究（内服32名／非内服28名）",
      tj:"イソトレチノイン6か月で涙液分泌が低下：Schirmer値14.27対20.38mm",
      te:"Effects of systemic isotretinoin therapy on tear function and choroidal thickness in nodulocystic acne patients: a prospective comparative study.",
      sum:["硬結性・嚢胞性のニキビの患者さんで、イソトレチノインの全身投与が中心窩下の脈絡膜厚と網膜の血管密度（表層・深層・脈絡膜毛細血管）にどう影響するかを、光干渉断層血管撮影（OCTA）で評価した前向き非無作為化比較研究です。2024年4月〜2025年7月に、6か月のイソトレチノイン内服を完了した32名（第1群）と全身療法を受けていない28名（第2群）を対象とし、両群でOCTAの指標とSchirmer試験を測定しました。5つの主要な群間比較に対してはBonferroni補正（閾値0.01）も併せて適用しています。",
           "第1群の平均治療期間は5.66±1.10か月、平均用量は33.44±10.66mg/日、累積用量は98.6±44.7mg/kgでした。平均脈絡膜厚は第1群314.75±55.72μm、第2群282.70±48.46μmで有意差がありましたが（p=0.022）、Bonferroni補正の閾値は満たしませんでした。表層・深層・脈絡膜毛細血管の血管密度には有意差がありませんでした（いずれもp>0.05）。Schirmer値の平均は第1群14.27±6.76mm、第2群20.38±6.71mmで、補正後も有意差が保たれました（p<0.001）。第1群では治療期間が長いほどSchirmer値が低い関連がみられました（年齢と用量を含む多変量モデルでB=-2.96、p=0.009、ただしモデル全体はp=0.055）。",
           "イソトレチノインの全身投与は基礎涙液分泌の有意な低下と関連していました。脈絡膜厚は通常の有意水準では治療群で厚く累積用量と正の相関を示しましたが、多重比較の補正には耐えませんでした。結果は慎重に解釈し、今後の検証のための仮説として受け取るべきと述べられています。"],
      use:"イソトレチノインを内服中の患者さんに、目の乾きが起こりうることをあらかじめお伝えし、必要なら眼科へのご相談をご案内する材料になります。" },
    { cat:"A", pmid:"42896048", journal:"Sci Prog", year:2026, type:"FAERS（米国FDA有害事象報告システム）を用いた後方視的ファーマコビジランス観察研究",
      tj:"IL-23阻害薬3剤のFAERS解析：添付文書に未記載の心血管・悪性腫瘍などの報告シグナル",
      te:"Safety profile of IL-23 inhibitors from the perspective of physicians and pharmacists: A retrospective real-world pharmacovigilance observational study based on the FAERS database.",
      sum:["インターロイキン23（IL-23）阻害薬は乾癬と炎症性腸疾患に広く使われていますが、長期の安全性は継続的な監視が必要だとして、チルドラキズマブ・リサンキズマブ・グセルクマブについて報告の偏り（シグナル）を検出した研究です。2017年第3四半期〜2025年第3四半期のFAERSの有害事象報告を抽出し、報告オッズ比（ROR）による不均衡解析を行い、器官別大分類（SOC）で分類しています。",
           "3剤でそれぞれ1,124件・8,574件・14,597件の有害事象報告が得られ、42・286・348のシグナルが検出され、23・24・24のSOCにわたっていました。報告が多かったのは薬剤の効果不十分、乾癬、注射部位反応、感染症でした。現行のFDA承認添付文書に記載のないシグナルとしては、心血管系の事象（例：心筋梗塞、チルドラキズマブでROR=6.45）、悪性腫瘍（例：悪性黒色腫、リサンキズマブでROR=8.57）、肝胆道系の障害、腎合併症が挙げられました。",
           "これらは探索的で仮説を生み出す段階の報告シグナルであり、感染症や全身反応といった既知の事象とあわせてIL-23阻害薬の日常のファーマコビジランスに役立ちうるものの、検証にはさらなる薬剤疫学研究が必要であると述べられています。"],
      use:"IL-23阻害薬を使用中の患者さんの定期的な安全性の確認で、どこに目を配るかの参考になります（報告の偏りをみる解析で、因果関係を示すものではないと述べられています）。" },
    { cat:"A", pmid:"42896635", journal:"J Am Acad Dermatol", year:2026, type:"総説（2部構成の継続医学教育シリーズ・第1部）",
      tj:"小児の爪の病気 Part 1：生理的変化と先天性・遺伝性・感染性の見分け方",
      te:"Nail disorders in pediatric patients: Part 1. Clinical overview, diagnosis and management of physiological variants, and congenital, hereditary, and infectious etiologies.",
      sum:["小児の爪の病気は比較的よくみられ、ご家族の不安も大きい一方、日常診療では見落とされやすいとして書かれた継続医学教育の総説です。2部構成の第1部として、生理的な変化と、先天性・遺伝性・感染性の爪疾患を取り上げています。",
           "小児の爪の病気の多くは治療が不要であったり、容易に治療できるものですが、見慣れていないために不要な治療・不適切な治療・治療の遅れにつながることがあると指摘されています。本稿では、これらの病態を診る皮膚科医のために、診断と対応のこつが示されています。",
           "生理的な変化と治療を要する病気を見分けることが、小児の爪の診療で重要であると述べられています。"],
      use:"お子さんの爪の変化でご相談を受けたとき、経過をみてよい生理的な変化と対応が必要な病気を区別し、ご家族の不安を和らげるご説明の材料になります。",
      note:"総説のため個別の数値は示されていません。同日に炎症性・色素性・腫瘍性を扱うPart 2（PMID 42896633）も公開されています。" },
    { cat:"A", pmid:"42896905", journal:"J Cutan Pathol", year:2026, type:"症例報告（病理組織学的検討を含む）",
      tj:"デュピルマブ使用中に生じた脱毛の1例：皮脂腺の著明な萎縮という病理像",
      te:"A Case of Alopecia Secondary to Dupilumab in a Patient With Atopic Dermatitis.",
      sum:["デュピルマブはインターロイキン4と13のシグナル伝達を阻害し、治療抵抗性のアトピー性皮膚炎に有効ですが、円形脱毛症が副作用として報告されることはまれで、数例に限られています。本報告は、アトピー性皮膚炎の治療中にデュピルマブによる脱毛が生じた患者さんの症例です。",
           "病理組織学的な所見は、典型的な円形脱毛症・休止期脱毛・基礎にある乾癬性脱毛のいずれとも異なり、円形脱毛症では報告されていない皮脂腺の著明な萎縮がみられました。考えられる説明として、Th2経路の阻害によりTh1を介する免疫反応が強まることが挙げられています。",
           "デュピルマブが脱毛のある患者さんで発毛に働く可能性を述べた報告がある一方、本症例を含むいくつかの報告は、毛と皮脂腺の単位や発毛に対する負の影響を示唆していると述べられています。"],
      use:"デュピルマブ使用中に脱毛のご相談があったとき、まれな副作用の可能性も念頭に置く材料になります（1例の報告です）。" }
  ]
},
{
  date: "2026-10-20",
  range: { A: "2026-10-18〜10-20", B: "2026-10-18〜10-20", C: "2026-09-20〜10-20" },
  items: [
    { cat:"A", pmid:"42895209", journal:"J Dermatolog Treat", year:2026, type:"第3相試験の事後解析（ADvocate 1・2／ADjoin／ADmirable／ADapt）",
      tj:"レブリキズマブの顔・頭頸部：16週反応例の94.8%が152週までHN EASI75を維持",
      te:"Long-term efficacy of lebrikizumab in treating head, neck and face involvement in patients with moderate-to-severe atopic dermatitis.",
      sum:["頭部・頸部・顔面（HNF）のアトピー性皮膚炎は生活の質を大きく損ないますが、この部位における生物学的製剤の長期の成績は限られているとして行われた事後解析です。第3相試験（ADvocate 1・2、ADjoin）と対象を絞った試験（ADmirable、ADapt）に参加した12歳以上・体重40kg以上の青年と成人の中等症〜重症のアトピー性皮膚炎の患者さんを対象に、頭頸部のEASI下位スコアと顔面のF-IGA（Face Investigator's Global Assessment）を評価しています。",
           "レブリキズマブ250mgの4週ごと投与では、16週時に反応が得られた患者さんで3年間にわたり効果が持続しました。152週時点でHN EASI 75・90・100を維持していた割合は、それぞれ94.8%・82.9%・85.3%でした。来院した機会の8割以上で反応を維持した「安定した反応」は、HN EASI 75で88.8%、HN EASI 90で80.0%、HN EASI 100で74.0%にみられました。さらに16週時の反応例のうち93.8%が152週時点でHN EASIの絶対値1以下、69.2%が0を達成しました。有色の皮膚を対象としたADmirableでは24週時に61%、デュピルマブの使用歴がある患者さんを対象としたADaptでは55%がF-IGA 0を達成しました。",
           "レブリキズマブは、全身療法を受けていない患者さんも生物学的製剤の使用歴がある患者さんも含めた多様な集団で、頭頸部・顔面に対して持続的かつ安定した長期の効果を示したと述べられています。"],
      use:"顔の皮疹が治りにくいアトピー性皮膚炎の患者さんに生物学的製剤をご提案する際、顔の部位でも長期に効果が続きうること、他の生物学的製剤の使用歴があっても効果が期待できることをご説明する材料になります。" },
    { cat:"A", pmid:"42892381", journal:"J Am Acad Dermatol", year:2026, type:"ランダム化二重盲検偽薬対照第2相試験（AMETHYST Part A）",
      tj:"皮膚ループスにリチフィリマブ：16週で紅斑ほぼ消失14.7%対偽薬2.9%",
      te:"Efficacy and safety of litifilimab in cutaneous lupus erythematosus: 24-week results of the randomized phase 2 study, AMETHYST.",
      sum:["皮膚型ループスエリテマトーデス（CLE）は重大な自己免疫疾患ですが、承認された分子標的治療はありません。本研究は、第2/3相試験AMETHYSTのPart A（第2相）として、リチフィリマブの有効性と安全性を評価したものです。参加者をリチフィリマブ225mgまたは偽薬の4週ごと投与に無作為に割り付け、0〜24週に投与しました。主要評価項目は16週時のCLA-IGA-R（皮膚ループス活動性の医師による全般評価・改訂版）の紅斑スコア0〜1、副次評価項目は24週時のCLASIに基づく複数の指標で、安全性もあわせて評価しています。",
           "16週時に皮膚が消失またはほぼ消失（CLA-IGA-Rの紅斑スコア0〜1）を達成した割合は、リチフィリマブ群14.7%に対し偽薬群2.9%で、有意差がありました（p=0.0263）。24週時のCLASI-70の達成率も、リチフィリマブ群21.7%に対し偽薬群5.8%でした（p=0.0195）。リチフィリマブの忍容性はおおむね良好で、安全性のデータはこれまでの試験と一致していました。なお本試験は、副次評価項目で統計学的な有意差を検出する検出力をもたせた設計ではないと述べられています。",
           "リチフィリマブは24週までの期間で偽薬に比べ皮膚の疾患活動性をより改善させ、忍容性も良好であったと結論づけられています。"],
      use:"紅斑が続く皮膚型ループスの患者さんに、承認された分子標的薬がまだない領域で新しい治療の開発が進んでいることをお伝えする材料になります（現時点では試験段階の薬剤です）。" },
    { cat:"A", pmid:"42894382", journal:"Allergy", year:2026, type:"後方視解析＋免疫学的検討（円形脱毛症＋アトピー123名／非アトピー円形脱毛症119名／アトピー性皮膚炎126名）",
      tj:"アトピーを伴う円形脱毛症123名：脱毛はより重く長く、Th2・ILC2とIL-13が上昇",
      te:"Investigation of Clinical and Immunological Features of Alopecia Areata With Comorbid Atopic Dermatitis.",
      sum:["円形脱毛症（AA）はアトピー性皮膚炎（AD）と併存することが多いものの（AA-AD）、その特徴は明らかではないとして、臨床像と免疫学的特徴を明らかにすることを目的とした研究です。2011〜2024年のAA-ADの患者さん123名、非アトピー性のAAの患者さん119名、ADのみの患者さん126名のデータを後方視的に解析し、患者さんと健常対照の末梢血単核球・血漿・頭皮組織をフローサイトメトリー、マルチプレックスのサイトカイン測定、蛍光免疫染色で調べています。",
           "臨床的には、AA-ADの患者さんは非アトピー性AAやADのみの患者さんより若く、脱毛はより重症で病悩期間が長い一方、湿疹は軽い傾向でした。非アトピー性AAと比べてダニアレルギー・総IgE・好酸球数（割合）が高く、ADのみの患者さんと比べると内因性ADが多く総IgEと好酸球は低い値でした。AAの重症度と期間は、ADの重症度・期間と正の相関を示しました。AAが先に発症した例や内因性ADを伴う例に比べ、ADが先に発症した例や外因性ADを伴う例はより若く、湿疹が重く、総IgEが高く、ダニアレルギーが多い結果でした。非アトピー性AA群と健常対照と比べ、AA-AD群では血漿のIL-4/6/10/13が上昇し、末梢血単核球中のTh2細胞とILC2（2型自然リンパ球）の割合およびそのIL-13産生が増加しており、いずれもAAの経過と正の相関を示しました。AA-ADの頭皮でもTh2細胞とILC2が最も多くみられました。",
           "AA-ADはAAの中で独立した臨床・免疫学的なエンドタイプであり、AAとADはTh2/ILC2-IL-13を軸とする非対称だが双方向の相互作用を示すため、これが重要な機序であり精密医療の標的になりうると述べられています。"],
      use:"アトピー性皮膚炎の患者さんに円形脱毛症が重なったとき、脱毛がより重く長引きやすいことを念頭に、早めの対応や専門施設へのご紹介をご検討いただく材料になります。" },
    { cat:"A", pmid:"42894818", journal:"Cureus", year:2026, type:"システマティックレビュー（ランダム化試験9件・301名）",
      tj:"ニキビ後の赤み：ピコ秒レーザーや狭域IPLに効果の報告、標準治療は未確立",
      te:"Post-acne Erythema: A Systematic Review of Randomized Controlled Trials on the Comparative Efficacy and Safety of Interventions Across Clinical, Instrumental, and Patient-Reported Outcomes.",
      sum:["ニキビの後に残る持続的な赤み（post-acne erythema、PAE）には確立した標準治療がないとして、ランダム化試験で検討された治療の有効性と安全性を比較したシステマティックレビューです。PubMed/MEDLINE・Scopus・Web of Scienceを開始時から2026年8月1日まで検索し、紅斑のアウトカムを報告したランダム化並行群間試験と左右顔面比較試験を対象としました。バイアスリスクはCochraneのRoB 2で評価し、異質性が高くメタ解析はできなかったため、得られた結果は記述的に統合されています。",
           "9件の試験・301名から11の対比較が得られました。未治療または無治療の対照と比べ、ピコ秒アレキサンドライトレーザー、狭域スペクトラムの血管用IPL、非架橋ヒアルロン酸のメソセラピーで良好な効果が報告されました。577nmの半導体レーザーは機器測定では途中の時点で有益でしたが、盲検化された評価者による最終評価では左右差がありませんでした。実薬同士や追加併用の比較では、狭域IPLが広域IPLより、低用量イソトレチノインへのNd:YAGレーザーの追加がイソトレチノイン単独より、577nmのプロイエローレーザーが外用ブリモニジンより良好でした。A型ボツリヌス毒素はもっとも早い評価時点のみブロードバンドライトより良好でした。フラクショナルレーザーと色素レーザーには有意差がなく、デリケートパルスライトとQスイッチ1064nm Nd:YAGレーザーは最終評価で持続的な差を示しませんでした。有害事象はおおむね軽度で一時的でしたが、広域IPLのあるプロトコルでは色素沈着と水疱が生じました。5件は懸念あり、4件は全体のバイアスリスクが高いと判定されています。",
           "各試験は効果の可能性を示したものの、少数例・異質性・短い観察期間・報告の限界により、優先すべき治療を特定することはできなかったと述べられています。"],
      use:"ニキビが治った後の赤みが気になるという患者さんに、機器治療に一定の報告はあるものの、どれを選ぶべきかは定まっていない現状をご説明する材料になります。" },
    { cat:"A", pmid:"42894608", journal:"Cureus", year:2026, type:"単施設・横断観察研究（成人の顔面皮膚炎50名）",
      tj:"顔の皮膚炎50名：パッチテスト陽性24%、最多はパラフェニレンジアミン26.7%",
      te:"Patch Testing and Psychosocial Burden in Adults With Facial Dermatitis: A Cross-Sectional Observational Study.",
      sum:["顔面の皮膚炎は、化粧品・環境・職業上の刺激への反復曝露によって生じる多因子性のよくみられる炎症性皮膚疾患で、目に見える部位であり慢性再発性の経過をとるため、心理社会的な健康や生活の質を大きく損ないうるとして行われた研究です。インドの三次病院の皮膚科外来を受診した成人50名を対象に、詳細な曝露歴の聴取と臨床評価の後、インド標準シリーズ・化粧品シリーズ・香料シリーズでパッチテストを施行し、ICDRG基準で判定、COADEX方式で臨床的関連性を評価し、心理社会的負担をSkindex-16で評価しています。",
           "50名のうち37名（74%）が女性で、もっとも多い年齢層は31〜40歳（40%）でした。6か月を超える病悩期間が32名（64%）にみられ、病変部位は頬（84%）・前額（76%）・眼瞼（68%）が多く、かゆみは全例にみられました。悪化因子は日光曝露（92%）・熱や発汗（56%）・季節変動（54%）・毛染めの曝露（50%）が多く挙げられました。パッチテスト陽性は12名（24%）で、9種類のアレルゲンに対し15の反応がみられ、もっとも多いのはパラフェニレンジアミン（26.7%）、次いでベンジルアルコール・サリチル酸ベンジル・ブロノポール（各13.3%）でした。9種類のうち8種類（88.9%）がCOADEX上で化粧品・外用関連と分類されました。パッチテストの陽性は、色素沈着・毛染めの使用・アトピーの既往と有意に関連していました（それぞれp<0.001、p=0.002、p=0.023）。Skindex-16の平均総スコアは39.4±18.7で、情緒領域がもっとも高く（18.8±8.9）、パッチテスト陽性例は陰性例より有意に高いスコアでした（中央値69対34、p<0.001）。色素沈着のある患者さんも総スコアが有意に高い値でした（60.7±14.7対28.4±8.0、p<0.001）。",
           "顔面皮膚炎ではパッチテストが、とくに化粧品や毛染めに関連する臨床的に意味のあるアレルゲンの同定に有用であり、心理社会的な負担も大きいため、アレルゲンの同定と回避の指導に加えて心理社会的な支援を含めた包括的な管理が望ましいと述べられています。"],
      use:"院内アプリ「生活指導アシスタント」のパッチテストのタブで、顔の皮膚炎が長引く患者さんに毛染めや化粧品を含めたパッチテストをおすすめする際の根拠になります。" },
    { cat:"A", pmid:"42893814", journal:"Contact Dermatitis", year:2026, type:"横断研究（1,001名）＋システマティックレビュー（34研究・77,261名）",
      tj:"パッチテスト陰性は16.1%：生検歴が多く、約30%は皮膚炎以外の診断",
      te:"Characteristics and Outcomes of Patients With Negative Patch Test Results and Systematic Literature Review.",
      sum:["パッチテストが陰性（NPT）だった患者さんはアレルゲン回避の指導を受けられないため、その経験を理解することが重要だとして、臨床像と転帰を記述した研究です。倫理審査委員会の承認を得たREDCapレジストリのデータを用いた横断研究に加え、Ovid MEDLINE・Embase・Cochrane Libraryを検索したシステマティックレビューを行っています。",
           "1,001名（女性769名・男性230名）のうち161名（16.1%）がパッチテスト陰性でした。平均年齢は52.2歳（標準偏差20.6）で、年齢中央値・女性優位・人種/民族・皮疹の持続期間・貼付した数は、陰性例と陽性例で有意差がありませんでした。陰性例では下腿の病変（p=0.04）と生検の既往（p=0.002）がより多くみられました。29.9%は皮膚炎以外の診断でした。検者による評価も患者さんご本人による評価も、パッチテスト後に有意に改善していました。34研究・77,261名のシステマティックレビューでは、陰性率は16.7%〜83.1%、貼付した数は20〜102と幅がありました。皮膚炎の部位としてもっとも多かったのは手でした。",
           "本コホートとシステマティックレビューのいずれでも、パッチテスト陰性は少数派であり人口統計学的な大きな違いはみられませんでしたが、陰性例には生検の既往があり非典型的な現れ方をしていることが示唆され、他の型の皮膚炎と診断されることが多く、30%は皮膚炎以外の診断であったと述べられています。"],
      use:"パッチテストが陰性だった患者さんに、陰性であること自体は珍しくなく、皮膚炎以外の病気も含めて診断を見直す機会になるとご説明する材料になります。" },
    { cat:"A", pmid:"42892377", journal:"Clin Dermatol", year:2026, type:"システマティックレビュー（13研究・患者446名・瘢痕475か所、うちランダム化比較研究5件）",
      tj:"外傷・術後の傷あとにピコ秒レーザー：13研究446名で瘢痕尺度の改善、副作用は軽度",
      te:"Picosecond Laser Therapy for Traumatic and Surgical Scars: a Systematic Review.",
      sum:["外傷後や手術後の瘢痕は、機能の障害・美容上の悩み・生活の質の低下を生じうるとして、ピコ秒レーザー治療の有効性と安全性を評価したシステマティックレビューです。PRISMA 2020声明に沿って、PubMed・Scopus・Web of Science・Embase・Cochrane Library・MEDLINE・LILACS・VERTINDEXを開始時から2025年8月まで言語・日付の制限なく検索し、2025年12月までデータベースのアラートを監視しました。ニキビ以外の外傷性または術後の瘢痕に対するピコ秒レーザー治療を評価した臨床研究を組み入れ、ランダム化試験のバイアスリスクはRoB 2で評価しています。",
           "13研究（患者446名・瘢痕475か所）が組み入れ条件を満たし、うち5件はランダム化比較研究でした。多くの研究で、妥当性が確認された瘢痕の評価尺度・全体的な美容評価・客観的な測定値の改善がみられました。対照のある試験ではおおむね未治療の対照よりピコ秒レーザー治療が良好で、一部のアウトカムではフラクショナル炭酸ガスレーザーより優れていましたが、すべての領域で一貫して優れていたわけではありませんでした。ランダム化研究のうち4件は懸念あり、1件は全体のバイアスリスクが高いと判定されました。有害事象は主に軽度かつ一時的で、重篤なものや永続的なものはありませんでした。",
           "現時点の根拠は、ピコ秒レーザー治療が外傷性・術後の瘢痕に対する有望でおおむね忍容性の良い選択肢であることを支持する一方、瘢痕の性質・治療プロトコル・アウトカム指標の異質性が課題として残ると述べられています。"],
      use:"けがや手術のあとの傷あとを気にされる患者さんに、レーザー治療という選択肢があり、報告されている副作用はおおむね軽度で一時的であったことをご説明する材料になります。" },
    { cat:"A", pmid:"42892520", journal:"J Allergy Clin Immunol", year:2026, type:"総説",
      tj:"皮膚炎が出る部位の差を説明する：角層の厚さは部位で10〜100倍の違い",
      te:"Site-Specific Cutaneous Inflammation: Mechanisms and Therapeutic Implications.",
      sum:["炎症性皮膚疾患は特徴的な解剖学的分布を示し、長く臨床診断の手がかりとされてきましたが、その部位特異性の生物学的機序は十分に明らかではないとして、構造・免疫・微生物の観点から整理した総説です。",
           "部位ごとの偏りは、ヒトの皮膚にわたる構造・免疫・微生物の不均一性から生じると述べられています。表皮のバリア構造は部位によって大きく異なり、角層の厚さには10〜100倍の差があり、毛包や腺の有無と種類も異なるため、それぞれ異なる微小環境ができ、常在する免疫細胞・微生物の群集・宿主の抗微生物防御が形づくられます。皮膚には推定200億個の組織常在型メモリーT細胞が解剖学的に限られたニッチに留まっており、同じ部位で疾患が再発する機序の基盤となります。皮膚マイクロバイオームも、脂っぽい部位・湿った部位・乾燥した部位で異なる群集を作り、疾患ごとに異なる形で乱れます。紫外線・機械的な刺激・湿度などの環境曝露も部位差をさらに強めます。単一細胞解析と空間トランスクリプトームの進歩により、炎症反応を高い精度で地図化し、部位特異的な細胞間の相互作用とシグナル経路を詳細に調べられるようになっています。",
           "これらの知見は、部位ごとの組織の性質と局所の免疫環境が疾患特異的な炎症回路を形づくるという統一的なモデルを支持し、炎症性疾患が特定の部位に出やすい理由を説明するとともに、精密治療において組織の文脈が重要であることを示していると述べられています。"],
      use:"顔・手・体で皮疹の出方や治りにくさが違う理由を、角層の厚さや常在菌、紫外線や摩擦などの環境が部位ごとに異なるためと患者さんにご説明する材料になります。" },
    { cat:"A", pmid:"42894698", journal:"JID Innov", year:2026, type:"病院ベースのケースコントロール研究（乾癬636名・1:1傾向スコアマッチング134組）",
      tj:"乾癬の動脈硬化予測：NLRがオッズ比16.33、SIIが20.78でCRP・赤沈を上回る",
      te:"Hematological inflammatory markers as predictors of atherosclerotic progression in patients with psoriasis: A retrospective case-control study from the SH-YIMED database.",
      sum:["乾癬では慢性の炎症が心血管の併存疾患を引き起こしますが、臨床情報だけの危険予測モデルには限界があり、血液の炎症マーカーが乾癬の動脈硬化を予測できるかは確認されていないとして行われた研究です。血管超音波検査を受けた乾癬の患者さん636名を登録した病院ベースのケースコントロール研究で、1:1の傾向スコアマッチングにより134組を得ました。主要および探索的な血液炎症マーカーを解析し、ロジスティック回帰と補足的な層別解析・非線形解析で動脈硬化との関連を検討し、AUC・決定曲線分析・NRI（純再分類改善度）・IDI（統合識別改善度）でリスク予測モデルを評価しています。",
           "好中球/リンパ球比（NLR）（オッズ比16.33、95%信頼区間7.54〜35.35、p<0.001）と全身免疫炎症指数（SII）（オッズ比20.78、95%信頼区間7.92〜54.53、p<0.001）は、CRPや赤沈よりも強い独立した動脈硬化の予測因子でした。NLR（交互作用のオッズ比7.45、p=0.018）とSII（交互作用のオッズ比28.03、p=0.008）には、年齢との有意な交互作用がみられました。NLRを組み込んだモデル（AUC 0.894、IDI 0.439、NRI 1.339）とSIIを組み込んだモデル（AUC 0.891、IDI 0.413、NRI 1.281）は良好な校正を示し、決定曲線分析の閾値0.05〜0.75の範囲で臨床的な純利益が高い結果でした。CRP＋NLR＋SIIを組み合わせたモデルのAUCは0.906ともっとも高い値でした。",
           "NLRとSIIは、動脈硬化を伴う乾癬の患者さんの心血管リスク予測を改善し、有効なリスクの層別化を可能にすると述べられています。"],
      use:"乾癬の患者さんの採血結果を見るときに、好中球とリンパ球の比にも目を向け、生活習慣の指導や内科との連携を考える手がかりとして使えます。" },
    { cat:"A", pmid:"42893123", journal:"Clin Cosmet Investig Dermatol", year:2026, type:"単施設・後方視ケースコントロール研究（814名）＋メンデルランダム化解析",
      tj:"入院を要する成人アトピー：血清アルブミンが1g/L高いとオッズ比0.92",
      te:"Serum Albumin and Inflammation-Nutrition Burden in Adult Hospitalized Atopic Dermatitis: A Case-Control Study with Complementary Genetic Evidence.",
      sum:["アトピー性皮膚炎（AD）は全身の炎症や代謝の乱れを伴いうる慢性炎症性皮膚疾患ですが、日常的に測定できる負の急性期蛋白である血清アルブミン（Alb）と、入院を要するADやスフィンゴミエリン関連の代謝シグナルとの関連は明らかではないとして行われた研究です。単施設の後方視ケースコントロール研究として成人814名（入院したADの患者さん381名、脂肪腫の手術で入院した対照433名）を解析し、Albを連続値・標準偏差あたり・四分位で多変量ロジスティック回帰、制限付き3次スプライン、感度分析、傾向スコアマッチングにより評価し、2標本メンデルランダム化（MR）で遺伝学的な補足の検討を、探索的な2段階MRであらかじめ定めたスフィンゴミエリン関連の表現型を検討しています。",
           "Albは対照よりADの患者さんで低い値でした（38.9±4.6対41.2±5.0 g/L、p<0.001）。完全に調整したモデルでは、Albが1g/L高いごとに入院を要するAD患者さんであるオッズが低下しました（オッズ比0.92、95%信頼区間0.89〜0.96、p<0.001）。標準化・四分位・スプライン・感度分析・マッチング解析でも一貫した結果でした。主要なIVW解析では、遺伝学的に予測されるAlbが高いことはADの危険の低さと関連しましたが（オッズ比0.693、95%信頼区間0.519〜0.926、p=0.013）、補完的なMRの推定値は一様に有意ではありませんでした。探索的な2段階MRでは、遺伝学的に予測されるAlbが高いことがあらかじめ定めたスフィンゴミエリン関連の表現型の低値と、またスフィンゴミエリン関連の値が高いことがADの危険の高さと関連していました。",
           "血清Albの低値は入院を要する成人のADと一貫して関連し、入院の場では全身の炎症・栄養の負担についての補助的な情報となりうる一方、MRの結果は支持的ではあるものの一様ではなく、スフィンゴミエリンの解析は媒介を示す根拠ではなく探索的なものだと述べられています。標準化されたAD重症度スコアと経時的なAlb測定を含む前向きの縦断研究が必要とされています。"],
      use:"重症のアトピー性皮膚炎の患者さんで採血を行う際に、アルブミンの低下を栄養と全身の炎症の目安として確認する材料になります（入院患者さんを対象とした研究である点はご留意ください）。",
      note:"入院患者さんを対象とした後方視研究で、遺伝学的解析（メンデルランダム化）の一部は探索的と位置づけられています。" }
  ]
},
{
  date: "2026-10-19",
  range: { A: "2026-10-17〜10-19", B: "2026-10-17〜10-19", C: "2026-09-19〜10-19" },
  items: [
    { cat:"A", pmid:"42890077", journal:"Postepy Dermatol Alergol", year:2026, type:"システマティックレビュー・メタ解析（7ランダム化試験・2,168名）",
      tj:"レブリキズマブのメタ解析：EASI75 オッズ比3.65、かゆみNRS 4点以上の改善3.76",
      te:"Lebrikizumab for the treatment of atopic dermatitis: a systematic review and meta-analysis of randomised controlled trials.",
      sum:["アトピー性皮膚炎は慢性の炎症性疾患で、レブリキズマブは有望な治療選択肢とされていますが、有効性と安全性を包括的に評価する必要があるとして行われた研究です。PubMed・Embase・Web of Science・Medline・ClinicalTrials.gov を各データベースの開始時から2025年12月まで系統的に検索し、レブリキズマブ（介入群）と偽薬（対照群）を比較したランダム化比較試験を集めました。文献の選別とデータ抽出ののち、Cochrane ハンドブック（第5.1.0版）推奨のバイアスリスク評価ツールで質を評価し、RevMan 5.4 でメタ解析を、Stata で感度分析と出版バイアスの解析を行っています。",
           "7件のランダム化比較試験・2,168名が組み入れられました。介入群は対照群に比べ、EASI 75 の達成率（オッズ比3.65、95%信頼区間2.58〜5.16、p<0.00001）、EASI 90（オッズ比3.67、95%信頼区間2.88〜4.67、p<0.00001）、vIGA-AD（オッズ比3.29、95%信頼区間2.62〜4.14、p<0.00001）、かゆみのNRSが4点以上改善した割合（オッズ比3.76、95%信頼区間2.96〜4.77、p<0.00001）のいずれも有意に高い結果でした。有害事象・重篤な有害事象・鼻咽頭炎・頭痛の発生率には両群で統計学的な有意差がありませんでした（いずれもp>0.05）。サブグループ解析では、異質性の主な源は治療の組み方（外用ステロイドの併用の有無）と用量であり、外用ステロイドの併用がサブグループ間の異質性の76.5%を説明し、各サブグループ内の異質性は低い値でした。用量のサブグループ内の異質性は0%で、ベースラインの重症度の影響は比較的小さいとされています。感度分析と出版バイアスの評価からは、結果は頑健で出版バイアスの可能性は低いと述べられています。",
           "レブリキズマブはアトピー性皮膚炎の治療において良好な有効性と安全性を示したと結論づけられています。"],
      use:"アトピー性皮膚炎で生物学的製剤をご検討いただく際に、皮疹だけでなくかゆみの改善も見込める薬剤であることをご説明する材料になります。" },
    { cat:"A", pmid:"42890071", journal:"Postepy Dermatol Alergol", year:2026, type:"システマティックレビュー・メタ解析（ランダム化試験8件＋長期継続投与試験11件）",
      tj:"ウパダシチニブと帯状疱疹：アトピーで15mgオッズ比2.62・30mg 3.13、長期も用量依存",
      te:"Short-term risk and long-term incidence rate of herpes zoster with upadacitinib in patients with atopic dermatitis and psoriatic arthritis: a systematic review and meta-analysis.",
      sum:["ウパダシチニブは選択的ヤヌスキナーゼ1（JAK1）阻害薬ですが、帯状疱疹の危険を高めることが知られています。本研究は、アトピー性皮膚炎（AD）と乾癬性関節炎（PsA）の患者さんにおける用量別の短期の危険と長期の発生率を推定することを目的としました。ウパダシチニブのランダム化比較試験と、52週以上の長期非盲検継続投与試験を組み入れ、短期のオッズ比と長期の曝露調整イベント率（EAER）を R 4.4.3 と STATA 18.0 で算出しています。",
           "ランダム化比較試験8件と長期非盲検継続投与試験11件が含まれました。短期の解析では、ADの患者さんで15 mg のオッズ比が2.62（95%信頼区間1.06〜6.47）、30 mg が3.13（95%信頼区間1.38〜7.12）でした。PsAの患者さんではそれぞれ1.39（95%信頼区間0.45〜4.33）、2.43（95%信頼区間0.96〜6.16）でした。長期の解析では、AD・PsAの患者さんで15 mg の EAER は1年3.87／100人年、2年4.68／100人年、3年4.30／100人年、30 mg では1年6.96／100人年、2年8.29／100人年、3年7.53／100人年でした。30 mg は15 mg より帯状疱疹の危険が有意に高く、1年（オッズ比1.78、95%信頼区間1.41〜2.24）、2年（オッズ比1.80、95%信頼区間1.28〜2.53）、3年（オッズ比1.94、95%信頼区間1.59〜2.35）と、経時的に一貫した用量依存性がみられました。",
           "ウパダシチニブはADとPsAの患者さんで帯状疱疹の危険を高め、その影響はADの患者さんでより顕著で、用量依存性があると述べられています。"],
      use:"JAK阻害薬を始める前に、帯状疱疹が出うること・用量によって頻度が変わることを数字でご説明し、発疹や痛みが出たら早めにご連絡いただくようお伝えする材料になります。" },
    { cat:"A", pmid:"42891666", journal:"J Am Acad Dermatol", year:2026, type:"原著（詳細は原著確認が必要）",
      tj:"アブロシチニブ：4週時点の反応が12週の寛解を予測（タイトルのみ）",
      te:"Week 4 response to abrocitinib predicts week 12 remission and correlates with glycolytic pathway modulation in moderate-to-severe atopic dermatitis.",
      sum:["中等症から重症のアトピー性皮膚炎に対するアブロシチニブについて、4週時点の反応と12週時点の寛解との関係、および解糖系経路の変化との相関を検討した報告です。",
           "抄録が公開されていないため、結果の数値は確認できません。",
           "タイトルの範囲では、4週時点の反応が12週の寛解を予測しうることが示唆されていますが、詳細は原著の確認が必要です。"],
      use:"アブロシチニブを開始した患者さんの効果判定の時期を考えるうえで、原著を取り寄せて確認する価値のある報告です。",
      note:"抄録なし（タイトルのみで要約）。原著確認が必要。" },
    { cat:"A", pmid:"42889692", journal:"Postepy Dermatol Alergol", year:2026, type:"前向き観察研究・横断デザイン（0〜2歳・104名）",
      tj:"受動喫煙とアトピー性皮膚炎：SCORAD 33.4 対 11.6 と重症度に大きな差",
      te:"Association of passive tobacco smoke exposure on disease severity among children aged 0-2 years with non-allergic atopic dermatitis.",
      sum:["環境中のたばこ煙への曝露は小児の呼吸器疾患の危険因子として確立していますが、乳幼児期の非アレルギー性アトピー性皮膚炎における役割は十分に定義されていませんでした。本研究は、0〜2歳の非アレルギー性アトピー性皮膚炎の小児における受動喫煙と重症度との関連を評価することを目的に、2025年2月から4月に診断された104名を対象とした前向き観察研究（横断デザイン）として行われました。受動喫煙は構造化された質問票で評価し、重症度はSCORAD指数で評価しています。",
           "親の喫煙に曝露された小児のSCORADは、曝露のない小児より有意に高い値でした（33.42±15.04 対 11.64±11.78、p<0.001）。父親の能動喫煙・受動喫煙、および出生後の家庭内での喫煙が、重症度の上昇と有意に関連していました。曝露期間の区分によってもSCORADは有意に異なりました。出生前の受動喫煙も高いSCORADと関連していた一方、妊娠中の母親の能動喫煙は重症度と有意な関連を示しませんでした。",
           "出生前および出生後早期の受動喫煙は、アトピー性皮膚炎の小児の重症度の上昇と関連しており、早期の予防的対応と家族ぐるみの禁煙が皮膚の経過の改善に重要であると述べられています。"],
      use:"小さなお子さんの湿疹が治りにくいときに、院内アプリ「生活指導アシスタント」の生活指導として、ご家族の喫煙と屋内での受動喫煙について伺い、禁煙をお勧めする根拠になります。" },
    { cat:"A", pmid:"42891531", journal:"Eur J Dermatol", year:2026, type:"ランダム化・偽薬対照・二重盲検のパイロット試験（28日）",
      tj:"不活化微生物入りローション28日：安全に使えたが湿疹の重症度は偽薬と差なし",
      te:"Testing the safety of nature-based microbial exposure in atopic dermatitis patients: a randomized, placebo-controlled, double-blinded pilot trial.",
      sum:["生物多様性仮説は、多様な微生物との接触が健康に有益で、その接触の喪失がアトピーなどの免疫介在性疾患に寄与しうるとする考え方です。本研究は、不活化した自然由来の多様な微生物の混合物を含むローションが、ヒトに自然由来の微生物曝露を与える安全で実行可能な方法かどうかを検討しました。アトピー性皮膚炎の参加者が、体の片側に1%の不活化微生物抽出物を含むローションを、反対側に偽薬のローションを28日間塗布し、検査部位には他のクリームを併用していません。評価項目は経表皮水分蒸散量と紅斑の測定、SCORAD指数、有害事象、皮膚のテープストリップ検体のサイトカイン、皮膚細菌叢です。",
           "ローション中の微生物抽出物は忍容性が良好でした。偽薬と比較して、アトピー性皮膚炎の重症度、経表皮水分蒸散量、紅斑、細菌叢全体の構成、炎症性サイトカインのいずれにも有意な影響を与えませんでした。病変部でIL-1β・IL-22・IL-33および抗菌ペプチドhBD-2の値が低下しましたが、この効果は偽薬と区別できませんでした。",
           "皮膚科医の監督のもとでの28日間の試験において、多様な不活化微生物抽出物を含むローションの毎日の使用は、アトピー性皮膚炎の参加者に良好に忍容されたと述べられています。自然由来の微生物曝露を導入する新しく安全な方法になりうるとしています。"],
      use:"「自然の菌に触れると湿疹が良くなるのか」とご質問を受けたときに、現時点では安全に使えたという段階で効果は確認されていない旨をお伝えする材料になります。" },
    { cat:"A", pmid:"42891786", journal:"Ir J Med Sci", year:2026, type:"横断・症例対照研究（患者108名・対照95名）",
      tj:"慢性蕁麻疹108名：睡眠の質の低下・抑うつ・仕事の能率低下が有意に強い",
      te:"The functional burden of chronic urticaria: Sleep quality, activity impairment and work productivity.",
      sum:["慢性蕁麻疹は皮膚症状にとどまらない大きな疾病負担と関連し、心理的な健康・睡眠の質・日常生活の機能・仕事の生産性を損ないうるものの、これらの領域が同時に評価されることはまれでした。本研究は、慢性蕁麻疹の患者さん108名と健常対照95名を対象に、ピッツバーグ睡眠質問票（PSQI）、うつ・不安・ストレス尺度21項目版（DASS-21）、労働生産性・活動障害質問票（WPAI）を用いて、睡眠の質・心理状態・活動の障害・仕事の生産性を評価した横断的な症例対照研究です。多変量ロジスティック回帰で慢性蕁麻疹と独立して関連する因子を検討しています。",
           "慢性蕁麻疹の患者さんは対照に比べ、睡眠の質が有意に不良で、抑うつと不安のスコアが高く、活動の障害も大きい結果でした（いずれもp<0.05）。多変量解析では、PSQIの高さ、抑うつ、ストレス、活動障害のスコアが、慢性蕁麻疹と独立して関連していました（いずれもp<0.05）。就労している参加者のなかでは、欠勤・出勤していても能率が落ちること・全体の労働生産性の障害が、いずれも患者さんで有意に大きい結果でした（いずれもp<0.001）。",
           "慢性蕁麻疹は睡眠の質の低下、心理的苦痛、活動の障害、仕事の生産性の低下と関連しており、多面的な疾病負担を踏まえた全人的で患者さん中心の対応が支持されると述べられています。"],
      use:"蕁麻疹は「かゆいだけ」ではなく眠りや仕事にも響くことをお伝えし、睡眠や気分の状態も伺ったうえで治療の強さをご相談する材料になります。" },
    { cat:"A", pmid:"42889646", journal:"Postepy Dermatol Alergol", year:2026, type:"単施設・非介入コホート（557名）",
      tj:"刺激誘発型蕁麻疹557名：4週時のUCT-7の変化を加えるとAUROC 0.84で12週の効果を予測",
      te:"Exploration of a simple-indicator prediction model for omalizumab efficacy in chronic inducible urticaria.",
      sum:["慢性刺激誘発型蕁麻疹（CIndU）はオマリズマブへの反応にばらつきがあり、日常診療のデータと初期の症状変化から効果を予測する簡便な道具がありませんでした。本研究は、誘発試験で確定したCIndUの連続症例でオマリズマブを開始した患者さんを対象に、入手しやすい指標を用いた実用的な予測モデルを作成し検証した単施設・非介入コホート研究です。主要評価項目は12週時点の反応（UCT 12点以上）で、効果が得られにくい患者さんを早く見分けるため、非反応（UCT 12点未満）をモデル化する事象としました。あらかじめ定めた予測因子は、人口統計学的特徴、罹病期間、病型、ベースラインのUCT、総IgEの対数値、基本的な血液指標、CRP、抗TPO抗体、誘発閾値です。多重代入とブートストラップ検証を伴う罰則付きロジスティック回帰を用い、4週時点のUCT-7の変化量を加えた動的モデルも検討しています。",
           "557名が解析され、343名（61.6%）が12週時点の反応者、214名（38.4%）が非反応者でした。ベースラインのモデルは良好な性能（AUROC 0.78、Brier 0.19）と理想に近い較正（較正勾配0.98、切片0.01）を示しました。4週時点のUCT-7の変化量を加えると、識別能（AUROC 0.84）と正確さ（Brier 0.16）が向上しました。この性能の向上は主なCIndUの病型にわたって一貫し、時期を分けた検証セットでも同様でした。決定曲線分析では、臨床的に意味のある非反応リスクの閾値において、全員を治療する・誰も治療しない方針より高い正味の便益が示されました。アナフィラキシーの発生はなく、軽度の有害事象が5件記録されています。",
           "簡便な指標によるモデルは、4週時点の情報で更新することにより、CIndUにおける12週時点のオマリズマブの反応を正確かつ臨床的に有用な形で予測でき、外部検証と前向きの影響評価が望まれると述べられています。"],
      use:"寒冷蕁麻疹やコリン性蕁麻疹などでオマリズマブを始めた患者さんに、4週時点で効き具合を見直してその後の見通しをご説明する材料になります。" },
    { cat:"A", pmid:"42889680", journal:"Postepy Dermatol Alergol", year:2026, type:"後方視的評価（前向き要素を含む・40名）",
      tj:"慢性蕁麻疹＋食物アレルギー40名：オマリズマブ後の再摂取で反応の重さが有意に軽減",
      te:"Omalizumab and food allergy: does reaction severity improve in adult patients?",
      sum:["成人のIgE介在性食物アレルギーは、さまざまな重さの臨床的に意味のあるアレルギー反応と関連します。オマリズマブは選ばれた集団で食物関連の反応を減らすことが示されてきましたが、成人、とくに慢性特発性蕁麻疹（CSU）を併せ持つ成人での根拠は限られていました。本研究は、オマリズマブを受けているCSUの成人でIgE介在性食物アレルギーの既往が記録されている患者さんを後方視的に評価し（前向きの要素を一部含む）、原因食物に再び曝露された患者さんに限って、EAACI・Brown・Ring-Messmer の分類で治療前後の反応の重症度を比較しました。",
           "成人40名（年齢中央値42歳、70%が女性）が含まれました。アナフィラキシーの既往は、食物アレルギーを併せ持つCSUの患者さんで、食物アレルギーのないCSUの患者さんより高頻度でした（p=0.040）。オマリズマブ開始後に原因食物へ再曝露されたのは31名で、反応の重症度は EAACI・Brown・Ring-Messmer のいずれの分類でも治療後に有意に低下しました（いずれもp<0.001）。ベースラインの総IgE値・好酸球数・血清トリプターゼ値・アトピーの有無は臨床的な反応と関連せず、反応者ではベースラインのCRPが高い傾向がみられました（p=0.039）。",
           "オマリズマブは、CSUとIgE介在性食物アレルギーを併せ持つ成人において、原因食物への再曝露時の反応の重さを一貫して軽減することと関連し、この改善は従来のアレルギー関連の検査値とはおおむね独立して生じたと述べられています。"],
      use:"院内アプリ「生活指導アシスタント」の食物アレルギーのタブで、蕁麻疹でオマリズマブを使っている患者さんから食物の誤食についてご相談を受けたときの説明材料になります（原因食物の除去が前提である点は変わりません）。" },
    { cat:"A", pmid:"42893199", journal:"Cureus", year:2026, type:"叙述的総説",
      tj:"高GI食と痤瘡：インスリン・IGF-1経路の説明はつくが臨床試験の結果は一定しない",
      te:"Molecular Role of Carbohydrates in Acne and Seborrheic Dermatitis.",
      sum:["尋常性痤瘡と脂漏性皮膚炎は、皮脂腺の活動・常在微生物・免疫シグナル・宿主の代謝の相互作用によって形づくられる、皮脂腺の多い皮膚によくみられる炎症性疾患です。本叙述的総説は、高グリセミックな食事が、インスリンおよびインスリン様成長因子-1（IGF-1）シグナル、mTORC1、皮脂腺の脂質産生、疾患ごとの微生物・炎症経路を介して、これらの疾患にどう影響しうるかを検討しています。",
           "痤瘡については、観察研究・機序のデータ・小規模のランダム化試験が、高いグリセミック指数（GI）やグリセミック負荷（GL）が高インスリン血症、IGF-1シグナル、PI3K/Akt/FoxO1/mTORC1 の活性化、皮脂の脂質産生の変化、毛包の角化、炎症を促すという生物学的に妥当なモデルを支持する一方、臨床の食事介入試験の結果は一定していないと述べられています。GLP-1受容体作動薬に関する新しい観察からは、全身の代謝シグナルが炎症性の毛包疾患を修飾しうることも示唆されますが、これらのデータはまだ予備的です。脂漏性皮膚炎については、マラセチアと宿主の相互作用、皮脂の脂質、バリア機能の障害、炎症シグナルはよく確立している一方、食事のグリセミック曝露を病変部のIGF-1/mTORC1 活性や増悪に直接結びつける根拠は不足しています。",
           "現時点の根拠は、食事と代謝の因子を一律の原因ではなく疾患修飾因子として位置づけるものであり、痤瘡では選ばれた患者さんで食事の指導を補助的に考慮しうる一方、脂漏性皮膚炎に対する疾患特異的な糖質制限は現時点では推奨できないと述べられています。"],
      use:"ニキビの患者さんから食事についてご質問を受けたときに、甘い物や高GI食を控えることは補助的な位置づけであり、外用・内服治療の代わりにはならない旨をご説明する材料になります。" },
    { cat:"A", pmid:"42890950", journal:"Crohns Colitis 360", year:2026, type:"単施設・後方視コホート（37名）",
      tj:"炎症性腸疾患のあるニキビ37名：イソトレチノイン後も92%が寛解を維持",
      te:"Acne therapy with isotretinoin is well tolerated in patients with established inflammatory bowel disease: a retrospective, single center study.",
      sum:["初期の症例報告や観察研究はイソトレチノインと炎症性腸疾患（IBD）との関連を示唆してきましたが、大規模コホート研究とメタ解析では意味のある関連は示されていません。これまでの研究の多くは新規発症の危険に注目しており、すでにIBDがある患者さんの疾患活動性については検討が限られていました。本研究は、2015年から2025年にイソトレチノインで治療されたクローン病（CD）または潰瘍性大腸炎（UC）の患者さんを対象とした単施設の後方視コホート研究です。開始前4か月以内と開始後12か月以内に少なくとも1回のIBDの評価があることを組み入れ条件とし、Harvey-Bradshaw 指数（HBI）、部分Mayoスコア（pMS）、炎症マーカー、一部で腸管超音波と便中カルプロテクチンで活動性を評価しました。",
           "37名（CD 57%、UC 43%）が条件を満たし、86%がベースラインで臨床的寛解でした。イソトレチノイン曝露後も92%が寛解を維持し、HBI・pMS・赤沈・CRP・便中カルプロテクチンに有意な変化はありませんでした。IBDの状態の変化は4名（11%）に生じましたが、その多くは生物学的製剤の切り替え、抗薬物抗体の出現、薬剤の用量調整など、もともとのIBDに関連する要因によるものでした。",
           "すでにIBDがあり良好にコントロールされている患者さんでは、イソトレチノインは臨床的に意味のある疾患活動性の悪化と関連せず、安定した患者さんを慎重に選べば使用を支持する結果であったと述べられています。"],
      use:"潰瘍性大腸炎やクローン病をお持ちのニキビの患者さんについて、治療の選択を消化器内科と相談する際の参考になります。" }
  ]
},
