    { cat:"A", pmid:"42858405", journal:"Dermatol Pract Concept", year:2026, type:"総説（ナラティブレビュー）",
      tj:"スタポキバート（IL-4Rα 抗体）：第 3 相で EASI-75 66.9%",
      te:"Stapokibart (CM310) in Atopic Dermatitis: A Narrative Review of a Next-Generation IL-4Rα Antagonist.",
      sum:["インターロイキン（IL）-4／IL-13 のシグナル伝達はアトピー性皮膚炎（AD）の病態の中心にあります。スタポキバート（CM310）は IL-4 受容体 α 鎖（IL-4Rα）を標的とする新しいヒト化モノクローナル抗体です。本論文は、中等症から重症の AD に対するスタポキバートの作用機序・臨床的有効性・安全性・治療上の可能性をまとめる目的で、2015 年 1 月から 2026 年 1 月までの PubMed／MEDLINE と ClinicalTrials.gov を対象に検索を行ったナラティブレビューです。",
           "スタポキバートは IL-4Rα に高い親和性で結合し（KD = 0.25 nM）、下流の IL-4 と IL-13 のシグナルを阻害します。第 3 相試験（500 名）では、スタポキバート 300 mg を 2 週ごとに投与した群が 16 週時点で有意な改善を示し、EASI-75 達成が 66.9%（プラセボ 25.8%）、IGA 0/1 達成が 44.2%（プラセボ 16.1%、P<0.0001）でした。反応が得られた方のうち 92.5% が 52 週まで EASI-75 を維持しました。忍容性は概ね良好で、最も多い有害事象は上気道感染と注射部位反応でした。結膜炎の発生は 5.0〜5.9% と低率でした。",
           "中等症から重症の成人 AD において確かな有効性と良好な安全性プロファイルを示し、長期の効果の持続と結膜炎の低い発生率が認められたと述べられています。一方で、初期のデータは有望であるものの、既存の IL-4／IL-13 阻害薬との比較はすべて間接比較であり、治療の位置づけを定めるには国際的な第 3 相試験と実臨床のデータがさらに必要とされています。"],
      use:"生物学的製剤を検討されている中等症から重症のアトピー性皮膚炎の方に、IL-4／IL-13 を抑える薬の選択肢が広がりつつあることと、結膜炎などの注意点を併せてご説明する材料になります。" },
    { cat:"A", pmid:"42858442", journal:"Dermatol Pract Concept", year:2026, type:"系統的レビュー・メタ解析（観察研究 8 件・447 名）",
      tj:"イソトレチノイン内服 6 か月で TSH 上昇・T3／T4 低下（447 名）",
      te:"Impact of Isotretinoin Therapy on Thyroid Hormone Levels in Patients with Acne Vulgaris: A Systematic Review and Meta-Analysis.",
      sum:["全身性のイソトレチノインは中等症から重症の尋常性痤瘡（にきび）の治療に広く使われており、視床下部-下垂体-甲状腺系を介して全身の内分泌に影響する可能性があります。本研究は、痤瘡の患者さんで全身性イソトレチノインの開始後に甲状腺ホルモンの値がどう変化するかを調べる目的で、PubMed・ScienceDirect・Scopus・Cochrane Library を検索し、観察研究 8 件・計 447 名を統合解析したものです。",
           "TSH については、3 か月時点（標準化平均差 SMD 0.09、95% 信頼区間 -0.27〜0.46、P=0.62）と 4 か月時点（SMD 0.72、95% CI -0.01〜1.45、P>0.05）では上昇は認められませんでしたが、6 か月時点では有意な上昇がみられました（SMD 0.54、95% CI 0.05〜1.03、P=0.03）。T4 は 3 か月時点では変化がなく（SMD -0.24、95% CI -0.56〜0.08、P=0.14）、4 か月時点（SMD -0.79、95% CI -1.20〜-0.38、P=0.0001）と 6 か月時点（SMD -0.87、95% CI -1.57〜-0.17、P=0.01）で低下しました。T3 は 3 か月時点（SMD -0.42、95% CI -0.80〜-0.04、P=0.03）、4 か月時点（SMD -0.63、95% CI -1.03〜-0.23、P=0.002）、6 か月時点（SMD -1.13、95% CI -1.77〜-0.55、P=0.0001）で低下しました。",
           "長期のイソトレチノイン治療は、時間に依存して甲状腺ホルモンの値を変化させる可能性があると述べられています。"],
      use:"イソトレチノインを長期に内服されている方が、だるさや冷え、体重の変化などを訴えられたときに、甲状腺機能の確認も選択肢に入れてご相談する材料になります。" },
    { cat:"A", pmid:"42858311", journal:"Skin Pharmacol Physiol", year:2026, type:"ランダム化比較試験（50 名・6 週間）",
      tj:"うっ血性湿疹への保湿剤 6 週間：皮膚指標・炎症指標に有意差なし（50 名）",
      te:"Efficacy of Topical Emollients on Skin Biophysical Properties and Inflammatory Markers in Stasis Eczema.",
      sum:["うっ血性湿疹は慢性静脈不全にしばしば伴う慢性の炎症性皮膚疾患で、臨床的な負担が大きい状態です。保湿剤は皮膚の水分とバリア機能を改善するために広く使われていますが、うっ血性湿疹における炎症や皮膚のリモデリングへの影響は明らかではありません。本研究はうっ血性湿疹の患者さん 50 名を保湿剤群とプラセボ群にランダムに割り付け、6 週間投与して皮膚バリアと全身の炎症指標への影響を調べたものです。メラニン量・水分量・経皮水分蒸散量（TEWL）を Tewameter で評価し、血中の炎症性サイトカイン（IL-6・IL-1β・TNF-α）、抗炎症性サイトカイン IL-10、マトリックスメタロプロテアーゼ（MMP-1・MMP-2・MMP-3・MMP-9）を、開始時と治療後に ELISA で測定しました。",
           "開始時の臨床評価では、高血圧・慢性静脈不全・糖尿病・脂質異常症といった併存疾患が多くみられました。6 週間の治療後、皮膚バリアの指標も血中のサイトカインの値も統計学的に有意な変化は認められませんでした。MMP-1 と MMP-2 の濃度は両群で安定していました。一方で、治療後の MMP-3 は保湿剤群でプラセボ群より有意に高く、MMP-9 はプラセボ群でのみ群内での有意な変化を示しました。",
           "短期間の保湿剤の使用は皮膚バリア機能と全身の炎症状態を保つ助けになる可能性はあるものの、特定の MMP に限られた変化を除けば、慢性のうっ血性湿疹の患者さんで皮膚バリアや炎症の指標に臨床的に意味のある改善をもたらすとはいえないと述べられています。この集団の治療の複雑さが示され、今後はより長い治療期間・より大きな例数・開始時の併存疾患を考慮した統計的な調整が必要とされています。"],
      use:"下腿のうっ血性湿疹の方に、保湿は土台として続けていただきながらも、保湿剤だけでは短期間での改善が限られることと、併存疾患を含めた全体の管理が必要なことをご説明する材料になります。" },
    { cat:"A", pmid:"42858396", journal:"Dermatol Pract Concept", year:2026, type:"多施設後方視研究（12 施設・4,236 名）",
      tj:"中等症以上の AD の 0.9% に炎症性腸疾患、71% で AD が先行",
      te:"Clinical Characteristics of Patients Presenting with Moderate-to-Severe Atopic Dermatitis and Concomitant Inflammatory Bowel Diseases: a Multicenter Retrospective Study.",
      sum:["アトピー性皮膚炎（AD）と炎症性腸疾患（IBD：クローン病および潰瘍性大腸炎）は、いずれも免疫を介する慢性の疾患で、病態の機序が一部重なります。AD と IBD を併せ持つ方の臨床的特徴についての研究は限られています。本研究は、中等症から重症の AD と確定した IBD を併せ持つ成人の臨床像を評価する目的で、2022 年から 2024 年のあいだに 12 の病院皮膚科施設の電子記録から該当する患者さんを同定したものです。",
           "中等症から重症の AD の患者さん 4,236 名のうち 38 名（0.9%）に IBD が確認され（クローン病 19 名、潰瘍性大腸炎 19 名）、イタリアの一般人口で想定される頻度より高い割合でした（0.9% 対 0.41%）。AD の診断時年齢は平均 25 歳で、71% の方では AD が IBD の診断に中央値 10 年先行していました。調査の時点で、クローン病の方の 40%、潰瘍性大腸炎の方の 63% が臨床的寛解にありました。IBD を併せ持つ方の AD の臨床像は典型的で、68% が屈曲部型を示し、34% に本人のアトピーの既往、40% に家族のアトピーの既往が認められました。",
           "AD の患者さんで IBD は多くはないものの、一般人口に比べて頻度が高いようであり、多くの方で AD が IBD より先に生じるため、皮膚科医が IBD の早期診断に関わりうると述べられています。ただし、この結果から因果関係は導けず、より大規模で対照を置いた前向き研究が必要とされています。"],
      use:"中等症から重症のアトピー性皮膚炎の方が、長引く腹痛や下痢、血便を訴えられたときに、消化器内科へのご相談を検討する材料になります。" },
    { cat:"A", pmid:"42858419", journal:"Dermatol Pract Concept", year:2026, type:"横断研究（慢性蕁麻疹 257 名・対照群）",
      tj:"慢性自発性蕁麻疹の 19.0% に線維筋痛症（対照 4.4%）",
      te:"Evaluation of Fibromyalgia Frequency in Chronic Spontaneous Urticaria Patients Referred to a Tertiary Dermatology Outpatient Clinic.",
      sum:["慢性自発性蕁麻疹（CSU）と線維筋痛症（FM）は、自己免疫の関与・心理的な影響・女性に多いという特徴が重なります。CSU の患者さんにおける FM の頻度についてはこれまでの研究で結果が一致していません。本研究は CSU の患者さんにおける FM の併存頻度を評価する目的で、三次医療機関の皮膚科外来を紹介受診した CSU 257 名と、年齢・性別を一致させた健康な対照群を対象とした横断研究です。背景情報・病悩期間・重症度（UAS-7）・生活の質（DLQI）を収集し、FM は 2016 年の ACR 基準で診断しました。",
           "FM の有病率は CSU の患者さんで 18.98%、対照群で 4.43% でした（P<0.01）。WPI と SSS のスコアの平均は CSU 群で高く、WPI は統計学的に有意でしたが（P<0.01）、SSS は有意差を示しませんでした（P=0.05）。FM を併せ持つ CSU の患者さんは、病悩期間がより長く、疾患の重症度がより高く、生活への支障がより大きいという特徴がありました。さらに、女性の CSU の患者さんは男性より FM が多くみられました（P<0.001）。",
           "CSU の患者さんでは対照群に比べて FM の頻度が高く、女性であること・重症度が高いこと・生活の質の低下が FM と有意に関連していました。両方の状態を併せ持つ方で生活の質が低下していることをふまえ、とくに症状の重い CSU の患者さんでは FM の評価を考慮して、正確な診断と包括的な管理につなげるべきであると述べられています。この関連の性質を明らかにするにはさらに研究が必要とされています。"],
      use:"慢性蕁麻疹で全身の痛みやこわばり、疲れやすさも訴えられる方に、線維筋痛症が隠れていないかを確かめ、必要に応じて他科と連携する材料になります。" },
    { cat:"A", pmid:"42858394", journal:"Dermatol Pract Concept", year:2026, type:"多施設横断研究（慢性蕁麻疹 150 名・対照 75 名）",
      tj:"重症の慢性蕁麻疹は DLQI・PHQ-9 がともに高い（150 名）",
      te:"Associations of Disease Activity, Depression Severity, and Quality of Life in Chronic Spontaneous Urticaria.",
      sum:["慢性自発性蕁麻疹（CSU）はしばしば心身にまたがる併存状態を伴い、うつが CSU を引き起こし、かつ持続させると考えられています。本研究は CSU の患者さんにおけるうつの重さと、CSU が生活の質に与える影響を調べる目的で、CSU 150 名と健康な対照 75 名を登録したものです。Urticaria Activity Score 7（UAS7）で疾患活動性を算出して軽症から中等症の CSU 75 名と重症の CSU 75 名に分け、全員に Patient Health Questionnaire-9（PHQ-9）でうつの重さを、CSU の 150 名に Dermatology Life Quality Index（DLQI）で生活の質を測定しました。",
           "順位変換した DLQI と PHQ-9 のスコアに対して、疾患の重症度（P<0.001）と性別（P<0.001）の主効果が有意でした。重症の CSU の患者さんは、軽症から中等症の方に比べて調整後の DLQI・PHQ-9 が大幅に高く（P<0.001）、女性は男性に比べて高いスコアを示しました（P<0.001）。共変量のうち、病悩期間は DLQI・PHQ-9 に強い正の影響を示しました（P<0.001）。さらに、血管浮腫があることはうつ症状の増加と関連し（P=0.042）、アレルギーの併存はわずかに保護的でした（P=0.001）。",
           "この多施設研究は、慢性自発性蕁麻疹の患者さんで DLQI・PHQ-9 の上昇の主要な決定因子が疾患の重症度と期間であり、女性であることもわずかですが有意に寄与することを示したと述べられています。"],
      use:"慢性蕁麻疹が長引いている方に、かゆみや膨疹の状態だけでなく、気分や日常生活への支障もお尋ねし、院内アプリ「生活指導アシスタント」の生活指導や心理面の支援につなげる材料になります。" },
    { cat:"A", pmid:"42858381", journal:"Dermatol Pract Concept", year:2026, type:"総説（ナラティブレビュー）",
      tj:"IL-17・IL-23 阻害薬の皮膚有害反応：乾癬様・湿疹様が最多",
      te:"Cutaneous Adverse Reactions to IL-17 and IL-23 Inhibitors: A Clinical Review of Reaction Patterns.",
      sum:["IL-17 阻害薬と IL-23 阻害薬は、標的を絞った免疫の調整によって中等症から重症の乾癬やその他の炎症性疾患の治療を大きく変えました。概して忍容性は良好ですが、よくみられる逆説的な皮疹から、もともとの炎症性疾患や自己免疫疾患に似て見える稀な免疫介在性の皮膚疾患まで、報告される皮膚有害反応の幅は広がっています。本論文は、報告されている反応の型・想定される機序・臨床および病理の特徴・現時点での診断と治療の考え方を整理して臨床判断を支える目的で、データベース収載開始から 2025 年 8 月までの PubMed・Google Scholar・Web of Science の英語文献から、IL-17・IL-23・IL-12/23 阻害薬に伴う皮膚有害反応を記載した臨床試験・観察研究・症例集積・症例報告・総説を評価し、反応の表現型別にまとめたナラティブレビューです。",
           "最も多く報告されている皮膚有害反応は乾癬様および湿疹様の皮疹で、臨床的にも組織学的にも特発性の皮膚疾患と区別がつかないことがあります。報告頻度の低いものとして、ループス様症候群・水疱性類天疱瘡・リケノイド型の薬剤反応・肉芽腫性の皮疹、および IgA 血管炎を含む血管炎の像が挙げられています。想定される機序は薬剤の直接の毒性ではなく、サイトカインの遮断に続いて起こる免疫シグナルの逆説的な変化とされていますが、明確な経路は十分に解明されていません。対応は重症度と表現型によって幅があり、外用療法を行いながら生物学的製剤を継続する場合から、原因薬の中止と全身の免疫抑制を行う場合までさまざまです。",
           "IL-17・IL-23 阻害薬には多様な皮膚有害反応が伴い、もともとの皮膚疾患と重なりうるため認識が必要であり、診断と管理を構造化して進めることが適切な時期の介入につながると述べられています。頻度・危険因子・機序・根拠に基づく治療戦略を明らかにするには、さらに研究が必要とされています。"],
      use:"乾癬の生物学的製剤による治療中に新しい湿疹様・乾癬様の皮疹が出てきたときに、薬剤による逆説的な反応も考えに入れて評価する材料になります。" },
    { cat:"A", pmid:"42858420", journal:"Dermatol Pract Concept", year:2026, type:"総説（専門家パネルによる実践的概説）",
      tj:"乾癬の関節痛：炎症性かどうかの見分けと紹介のタイミング",
      te:"Arthralgia in Patients with Chronic Plaque Psoriasis: Practical Insights for Dermatologists.",
      sum:["関節痛は乾癬（PsO）の患者さんによくみられる症状ですが見過ごされやすく、乾癬性関節炎（PsA）の早期の現れであることがあります。本論文は、皮膚科医が乾癬の患者さんの関節痛を見つけて対応するのを支える実践的な概説を示す目的で作成されました。皮膚科医 3 名とリウマチ科医 2 名からなる専門家パネルが、PubMed／MEDLINE と EMBASE を「arthralgia」「psoriasis」という語で検索した文献のデータを検討し、臨床的な関連と、疫学・病態・診断・管理について得られるデータに基づいて質的に分析しました。",
           "PsA の発症を予測する因子と、炎症性の関節痛と非炎症性の関節痛の区別が示され、変形性関節症や線維筋痛症といった主な鑑別診断が論じられています。妥当性が確認されたスクリーニングツール、早期の画像検査、適切な時期のリウマチ科への紹介の重要性が強調され、併せて患者教育と危険因子の管理についての推奨も示されています。",
           "皮膚科医は乾癬の患者さんの関節痛の早期発見において中心的な役割を果たすと述べられています。適切な時期のリウマチ科への紹介は、早期の介入、不可逆な関節の障害の予防、長期の転帰の改善につながるために欠かせないとされています。"],
      use:"乾癬の方の診察のたびに関節の痛みや朝のこわばりの有無をお尋ねし、該当があればリウマチ科へのご紹介を検討する材料になります。" },
    { cat:"A", pmid:"42858415", journal:"Dermatol Pract Concept", year:2026, type:"総説（ナラティブレビュー）",
      tj:"乾癬とアトピー性皮膚炎に共通する経路（IL-17／IL-22 軸）",
      te:"Shared Pathways between Psoriasis and Atopic Dermatitis.",
      sum:["乾癬とアトピー性皮膚炎は、臨床像・病態・患者層の分布が異なる慢性の炎症性皮膚疾患の代表的な例です。しかし近年の研究では、有望な治療標的になりうる免疫経路の重なりが明らかになってきました。本論文は、両疾患に共通する主な免疫・表皮バリア・マイクロバイオームの経路を整理し、その応用と治療上の意味を論じる目的で、2000 年 1 月から 2024 年 6 月までの PubMed の文献を「psoriasis」「atopic dermatitis」「cytokine pathways」「T cells」「environmental triggers」などの語で検索したナラティブレビューです。両疾患に共通する機序との関連、とくにサイトカインのプロファイル・免疫細胞の活動・皮膚バリアの機能障害に注目して文献を選びました。",
           "サイトカインを介する経路、とくにケラチノサイトの過増殖と炎症を担う IL-17／IL-22 軸に大きな重なりが認められました。Th17 と Th22 の活動を含む T 細胞の制御異常が、慢性の炎症を維持するうえで重要な役割を果たしていました。いずれの疾患でも皮膚バリア機能の障害が認められ、アトピー性皮膚炎ではフィラグリンの機能喪失型変異と、乾癬ではケラチノサイトの分化の異常と関連していました。",
           "Th17 や Th22 の経路といった共通する機序を標的とし、バリアの修復を目指す方策を組み合わせることで、両疾患に対して二重の治療上の利益が得られる可能性が示唆されると述べられています。慢性の炎症性皮膚疾患の管理において、統合的な治療の進め方と個別化医療の可能性が強調されています。"],
      use:"乾癬とアトピー性皮膚炎のどちらの方にも、保湿によるバリアのケアが治療の土台になることをご説明する材料になります。" },
    { cat:"A", pmid:"42859274", journal:"Int Arch Occup Environ Health", year:2026, type:"横断研究（移住労働者 2,123 名・7 職種）",
      tj:"手・手首・前腕の湿疹は 1 年有病率 4.2%、職種で最大 10.8 倍",
      te:"Prevalence and risk factors of hand/wrist/forearm eczema among migrant workers in Qassim, Saudi Arabia.",
      sum:["移住労働者は職場で皮膚の刺激物に曝露されるため、職業性の手湿疹になりやすい可能性がありますが、サウジアラビアに特化したデータは限られています。本研究は、サウジアラビアの移住労働者における手・手首・前腕の湿疹の 1 年有病率を推定し、関連する因子を明らかにする目的で行われた横断研究です。自動車修理・市街の清掃・病院の清掃・建設・飲食サービス・理美容・養鶏の 7 職種の移住労働者 2,123 名を対象に、訓練を受けた多言語の面接者が社会人口学的特性・生活習慣・健康状態についての構造化質問票を実施しました。手・手首・前腕の湿疹は、妥当性が確認された Nordic Occupational Skin Questionnaire の短縮版で評価し、ロジスティック回帰でオッズ比（OR）と 95% 信頼区間（CI）を推定しました。",
           "参加者の平均年齢は 35 歳（標準偏差 9）、85.3% が男性でした。自己申告による手・手首・前腕の湿疹の 1 年有病率は 4.2% でした。多変量解析では、女性は男性より湿疹のオッズが有意に高く（OR 7.7、95% CI 2.7〜21.8）、現在の喫煙（OR 2.3、95% CI 1.1〜4.8）、食事の質の低さ（OR 2.4、95% CI 1.3〜4.5）、中等度の身体活動（OR 2.3、95% CI 1.2〜4.3）が独立して湿疹と関連していました。飲食店の労働者と比べると、市街の清掃員（OR 10.8）・養鶏工場の労働者（OR 9.3）・建設労働者（OR 6.3）・自動車修理の労働者（OR 5.8）で湿疹のオッズが著しく高くなっていました（いずれも P<0.05）。",
           "職種は手・手首・前腕の湿疹の強い相関要因の一つとして浮かび上がりました。加えて、食事の質の低さ・喫煙・身体活動の少なさといった修正可能な生活習慣と、女性であることが湿疹と関連していたと述べられています。"],
      use:"手湿疹でお越しになった方に、お仕事の内容と水や洗剤に触れる回数を具体的にお伺いし、院内アプリ「生活指導アシスタント」の生活指導と合わせてお伝えする材料になります。" }
  ]

{

    { cat:"A", pmid:"42854835", journal:"J Allergy Clin Immunol Pract", year:2026, type:"全国規模コホート（デンマーク・292,393 名・最長 23 年）",
      tj:"吸入・点鼻・外用ステロイドの合計量と有害事象（29 万名）",
      te:"Inhaled, nasal and topical corticosteroid burden and association with corticosteroid-associated adverse events.",
      sum:["タイプ 2 炎症に関わる病気の患者さんは、複数の形のステロイドを同時に使われることが多い一方、局所ステロイドを組み合わせて長く使うことの危険は十分に明らかになっていません。本研究はデンマークの全国データベースを用い、2000〜2012 年に吸入・点鼻・外用のステロイドを受け取った全身ステロイド未使用の成人を、使い始めていない方と照合して最長 23 年追跡したものです。6 か月ごとの合計曝露量をプレドニゾロン換算で低（1.25 mg 未満）・中（1.25〜2.5 mg）・高（2.5 mg 超）に分け、ステロイドに関連する 11 の病気との関連を、競合リスクを考慮した時間依存の Cox モデルで、曝露 6 か月 1 期間あたりのハザード比（HR）として解析しました。",
           "合計 292,393 名の局所ステロイド使用者（平均 45 歳、女性 47.7%）を解析しました。関連する病気の発生頻度は全般に低かったものの、すべての病気で使用者の部分分布ハザード比が高く、白内障と肥満では 1.4〜3.8 でした（p<0.001）。局所ステロイド使用者では、曝露が 6 か月 1 期間増えるごとに骨粗鬆症（低〜高用量で HR 1.01〜1.10）・肥満（1.03〜1.03）・肺炎（1.03〜1.15）の危険が上昇しました。心血管疾患・心不全・白内障・胃食道逆流症は高用量の曝露でのみ上昇し、1 期間あたりの HR はそれぞれ 1.03・1.02・1.04・1.04 でした。剤形別では、高用量の吸入ステロイドと外用ステロイドで最も強い関連が示されました。",
           "局所ステロイドを使用されている方では、短期間の高用量を含めた全体のステロイド負荷がステロイド関連の有害事象と関連するものの、発生頻度とハザードは全般に低いと述べられています。"],
      use:"アトピー性皮膚炎の外用薬と、喘息やアレルギー性鼻炎の吸入・点鼻薬を併用されている方に、身体全体で受けるステロイドの合計量という考え方をご説明し、必要な量を一緒に見直す材料になります。" },
    { cat:"A", pmid:"42855295", journal:"J Dermatol", year:2026, type:"症例集積（12 例）",
      tj:"DPP-4 阻害薬に伴う水疱性類天疱瘡：12 例中 6 例は口腔粘膜のみ",
      te:"Clinical Study of Bullous Pemphigoid With Oral Mucosal Symptoms After Oral Administration of Dipeptidyl Peptidase-4 Inhibitors.",
      sum:["ジペプチジルペプチダーゼ-4（DPP-4）阻害薬は糖尿病の治療に広く使われていますが、DPP-4 阻害薬に関連する水疱性類天疱瘡（BP）の報告が増えています。本研究は、DPP-4 阻害薬の内服に関連して口腔粘膜の病変を伴った BP の 12 例を検討したものです。",
           "6 例は口腔粘膜の病変のみを示し、残りの 6 例は非炎症性の皮膚病変を伴っていました。DPP-4 阻害薬の中止により 9 例で症状が改善しましたが、3 例は改善せず、病変が咽頭へ進展しました。寛解は DPP-4 阻害薬の中止から平均 20.8 ± 24.6 か月で得られましたが、2 例が再発しました。抗 BP180 NC16a 抗体は 6 例で陽性、全長 BP180 の ELISA は検査された 10 例のうち 8 例で陽性でした。",
           "DPP-4 阻害薬に関連する BP は口腔粘膜の病変を伴うことが多く、粘膜の症状のみで現れる例もあると示唆されます。再発や重症化の可能性があるため、長期の経過観察が欠かせないと述べられています。"],
      use:"糖尿病の内服をされている方が口の中の痛みやびらん、皮膚の水疱を訴えられたときに、DPP-4 阻害薬に関連する類天疱瘡を疑い、処方医と連携して対応する材料になります。" },
    { cat:"A", pmid:"42855445", journal:"Pediatr Dermatol", year:2026, type:"全国入院データベース解析（米国 KID・2016〜2022 年）",
      tj:"小児の SJS/TEN 入院は 0.02%→0.009% に減少、死亡率 1〜2%",
      te:"Pediatric Stevens-Johnson Syndrome and Toxic Epidermal Necrolysis Hospitalizations in the United States.",
      sum:["スティーヴンス・ジョンソン症候群（SJS）と中毒性表皮壊死症（TEN）は、稀ですが生命を脅かす皮膚粘膜の反応であり、小児での実態は十分に明らかになっていません。本研究は米国の Healthcare Cost and Utilization Project（HCUP）の Kids’ Inpatient Database（KID）を用いて、小児の SJS/TEN による入院の頻度と死亡率を調べたものです。",
           "SJS/TEN による入院の割合は 2016 年の 0.02% から 2022 年の 0.009% へ低下し、全期間では 0.014% でした。入院された患者さんの死亡率は比較的安定しており、2016 年の 1.8%、2019 年と 2022 年の 1.1% という範囲でした。",
           "小児の SJS/TEN の頻度と生存について励みになる傾向が示され、同時に包括的な支持療法の重要性が強調されると述べられています。"],
      use:"お子さんに内服薬を処方するとき、重症の薬疹は極めて稀であるとお伝えしたうえで、皮膚と口・眼の粘膜の症状が同時に出たらすぐ受診いただくようご案内する材料になります。" },
    { cat:"A", pmid:"42854862", journal:"Chem Phys Lipids", year:2026, type:"横断研究（若年女性 66 名・皮表脂質リピドミクス）",
      tj:"脂性肌でも痤瘡のある人は皮表脂質の構成が異なる（66 名）",
      te:"Phosphatidylserine-Related Lipid Alterations Are Associated with the Shift of Oily Skin Towards an Acne-Associated Unhealthy State in Young Women: A Skin Surface Lipidomic Study.",
      sum:["脂性肌は痤瘡（にきび）と同じ意味ではありませんが、脂性肌の方のなかで健康な状態と痤瘡を伴う状態の皮表脂質の違いは十分に明らかになっていません。本研究は、脂性肌の 18〜24 歳の女性 66 名（健康な脂性肌 33 名、軽症から中等症の痤瘡を伴う脂性肌 33 名）を対象に、皮表脂質を超高速液体クロマトグラフィー・四重極飛行時間型質量分析と多変量解析で比較し、脂質の量・脂肪酸鎖の長さ・不飽和度に注目して解析したものです。",
           "両群で皮表脂質の構成は明確に異なりました。痤瘡を伴う脂性肌の群では、飽和脂肪酸の相対量が低く、不飽和脂肪酸の相対量が高く、一価不飽和／多価不飽和脂肪酸の比が低下していました。脂肪酸とトリグリセリドの量で重みづけした平均鎖長は短くなり、セラミドでは長鎖のものが増え超長鎖のものが減るという鎖長の再配分がみられました。ホスファチジルセリンとホスファチジルイノシトールも増加していました。",
           "若年女性の痤瘡を伴う脂性肌は、皮脂・バリア・細胞膜に関わる脂質の多層的な再構成を特徴とし、ホスファチジルセリンに関連する変化が健康な脂性肌からの逸脱を示す脂質の候補になりうると述べられています。"],
      use:"皮脂が多いこと自体が痤瘡の原因と思い込まれている方に、皮脂の量だけでなく質の違いも研究されていることをご説明し、洗顔や保湿の指導を補う材料になります。",
      note:"二群を比較した横断研究であり、因果関係や治療の効果は示されていません。" },
    { cat:"A", pmid:"42854539", journal:"Eur J Obstet Gynecol Reprod Biol", year:2026, type:"後方視コホート（受診 4,480 名中 319 名・2014〜2024 年）",
      tj:"外陰部の硬化性萎縮性苔癬：生殖年齢の女性にも広く分布（平均 45 歳）",
      te:"Reassessing the age distribution of vulvar lichen sclerosus: A retrospective cohort study.",
      sum:["外陰部の硬化性萎縮性苔癬（vLS）は閉経後の女性と初経前の女児に多いと広く報告されていますが、その根拠は限られており、診断が主に臨床で行われているにもかかわらず病理組織診断に基づくものが中心でした。本研究は、診断が主に臨床で行われる外陰・膣の専門外来で 2014 年 1 月から 2024 年 12 月に vLS と診断された女性全員を対象とした後方視コホートで、年齢分布を主要評価項目とし、併存症・症状・臨床所見・治療反応を副次評価項目としたものです。",
           "評価された 4,480 名の女性のうち 319 名（7.1%）が vLS と診断されました。診断時の平均年齢は 45（±18.3）歳で、年齢分布は一様分布と有意な差がありませんでした（p = 0.99）。典型的な解剖学的所見は 92% にみられ、87% が有症状で、そう痒（76.5%）と性交痛（39.4%）が主な症状でした。初回受診で診断された 214 名のうち 171 名（80%）が再診し、94% が臨床的な改善を報告し、74.5% が 80% 以上の症状軽減を達成しました。これは主にステロイド外用後のものです。",
           "vLS の年齢分布は成人期を通じてほぼ一様であり、生殖年齢の女性でも診断の注意を保つべきであると述べられています。"],
      use:"外陰部のかゆみを訴えられる若い世代の方に対しても硬化性萎縮性苔癬を念頭に置き、ステロイド外用で多くの方の症状が和らぐとご説明する材料になります。" },
    { cat:"A", pmid:"42851899", journal:"Front Immunol", year:2026, type:"総説",
      tj:"IL-13 と皮膚の線維化：アトピー性皮膚炎から痒疹・ケロイドまで",
      te:"IL-13 and skin fibrosis in inflammatory skin diseases.",
      sum:["皮膚の線維化は慢性の炎症性皮膚疾患の重要な一面として認識が広がっており、皮膚の肥厚・組織の硬さ・持続する機能の障害につながります。従来は形質転換成長因子 β（TGF-β）が線維化の中心と考えられてきましたが、タイプ 2 免疫の中心的なサイトカインであるインターロイキン（IL）-13 が慢性炎症と線維化をつなぐ役割を担うという知見が蓄積しています。本総説は IL-13 が皮膚の線維化を進める仕組みを整理したものです。",
           "IL-13Rα1/STAT6 経路を介した線維芽細胞の直接の活性化、細胞外マトリックスの産生と分解の調節の乱れ、慢性のかゆみと機械刺激の受容に関わる神経免疫の相互作用、マクロファージと線維芽細胞の相互作用、エピジェネティックな変化による線維芽細胞の記憶という新たな知見が論じられています。さらに、アトピー性皮膚炎・痒疹（prurigo nodularis）・全身性強皮症・ケロイドという代表的な皮膚疾患の間で、IL-13 に関連する線維化の病理学的な特徴が比較されています。IL-13 に関連する線維化は、通常の瘢痕形成とは異なり、免疫の活性化が持続し、細胞外マトリックスの再構成が続き、組織の可塑性が残る点が特徴で、動的で可逆的でありうる過程と考えられると述べられています。",
           "本総説は皮膚の線維化における IL-13 の多様な役割を統一的に捉える枠組みを示し、免疫・機械・ストローマの仕組みを統合して考えることの重要性を強調しています。"],
      use:"長く続く湿疹で皮膚が硬く厚くなってしまうことをご心配される方に、炎症が続くと線維化につながる仕組みが研究されていると説明し、掻破を減らす生活指導の根拠を補う材料になります。",
      note:"総説であり、特定の治療の効果を示すものではありません。" },
    { cat:"A", pmid:"42851360", journal:"Front Immunol", year:2026, type:"症例報告＋文献レビュー（7 歳・16 週）",
      tj:"小児の劣性栄養障害型表皮水疱症の強いかゆみ：デュピルマブで NRS 7→1",
      te:"Case Report: dupilumab for severe pruritus in pediatric recessive dystrophic epidermolysis bullosa-a longitudinal clinical assessment and literature review.",
      sum:["劣性栄養障害型表皮水疱症（RDEB）は COL7A1 遺伝子の両アレルの変化により生じ、外力による水疱・瘢痕・皮膚以外の進行性の合併症を引き起こします。強いかゆみは掻破の連鎖を通じて皮膚の損傷を悪化させることがあります。本報告は、乳児期に全身の水疱で発症し、強いかゆみ・粘膜と爪の病変・瘢痕・手指の拘縮を有する 7 歳・体重 25 kg の女児の症例です。病理では表皮下の水疱がみられ、遺伝子解析で COL7A1 の c.5605G>C（p.Gly1869Arg）と c.5532+5G>A が別々の親から trans で受け継がれていることが示され、RDEB の分子診断が支持されました。",
           "支持療法を行っても強いかゆみと炎症性のびらんが続いたため、デュピルマブが適応外で開始されました（負荷投与 600 mg、以後 4 週ごとに 300 mg）。創傷ケアは継続され、セチリジン点眼・内服とフシジン酸外用の併用は経過中に断続的でした。開始時と 4・8・12・16 週の前向きな評価で、主要な臨床的観察項目であるかゆみの数値評価尺度（NRS）が 7 から 1 に低下しました。副次的な記述的変化として、表皮水疱症の疾患活動性・瘢痕指数（EBDASI）の活動性スコアが 52 から 32 へ、痛みの NRS が 4 から 1 へ低下し、手の機能の段階が 3 から 2 へ改善しました。写真では活動性のびらんと痂皮が減少しましたが、既存の瘢痕と拘縮は残りました。16 週の経過中、デュピルマブに関連すると考えられる有害事象はありませんでした。",
           "対照のない観察で背景治療も続いていたため、これらの変化は因果関係を示すものではなく、患者さん個別のタイプ 2 炎症のバイオマーカーも測定されていないと述べられています。"],
      use:"強いかゆみに難渋される希少な遺伝性皮膚疾患の方について、かゆみそのものを標的にする治療の報告があることを情報提供し、専門施設へのご相談につなげる材料になります。",
      note:"単一の症例報告で、デュピルマブの適応外使用です。因果関係は示されていません。" },
    { cat:"A", pmid:"42853462", journal:"J Hematop", year:2026, type:"症例報告（空間的単細胞プロテオミクス併用）",
      tj:"グセルクマブ投与中に生じた EBV 陽性ホジキンリンパ腫の 1 例",
      te:"EBV-positive Hodgkin lymphoma with an immunosuppressive microenvironment during guselkumab (interleukin-23 inhibitor) therapy for chronic plaque psoriasis.",
      sum:["乾癬は古典的ホジキンリンパ腫（cHL）の独立した危険因子であり、インターロイキン（IL）-23 を標的とするグセルクマブは臨床試験では悪性腫瘍に関して良好な安全性を示してきました。本報告は、生物学的製剤の使用歴がない乾癬性関節炎の患者さんが、尋常性乾癬に対するグセルクマブ治療中に発症した EBV（エプスタイン・バー・ウイルス）陽性 cHL の初めての報告で、その腫瘍微小環境を記述したものです。切除生検に免疫組織化学・EBER in situ ハイブリダイゼーション・標的シークエンスと、9 種類を順次検出する免疫蛍光による空間的単細胞プロテオミクスを行っています。",
           "40 代前半の男性が、グセルクマブ開始から 7 か月後に寝汗・失神・右頸部の大きなリンパ節腫脹を生じました。生検では混合細胞型の EBV 陽性 cHL（潜伏感染 IIa 型：EBER 陽性、LMP1 陽性、EBNA-2 陰性）が示されました。微小環境には CTLA4 陽性の抑制性 T 細胞（10.15%）・M2 マクロファージ（10.35%）・わずかな Th2 細胞（0.38%）・低い Th1/Th2 比（約 0.39）・Th17 細胞（約 13%）が含まれていました。グセルクマブの中止後、ABVD 療法と病変部放射線治療で完全代謝反応が得られ、アプレミラストの内服下で寛解を維持しています。",
           "発症までの期間が短く、EBV 陽性 cHL に典型的な Th1 優位とは対照的に Th2 に傾き骨髄系細胞が多い微小環境であったことから、IL-23 阻害下での免疫環境の変化の可能性が提起されています。著者らは IL-23 阻害薬を受ける患者さんにおける稀なリンパ腫について引き続き薬剤監視を行い、クラス全体の影響を明らかにするより大規模な研究が必要と述べています。"],
      use:"IL-23 阻害薬を続けておられる方に寝汗や頸部のリンパ節の腫れがみられたときに、稀な事象として念頭に置き、速やかに精査につなげる材料になります。",
      note:"単一の症例報告であり、薬剤との因果関係は示されていません。" },
    { cat:"A", pmid:"42850800", journal:"Br J Dermatol", year:2026, type:"総説",
      tj:"表皮分化異常症（先天性魚鱗癬）：遺伝子・免疫の型・皮膚の細菌で層別化",
      te:"Towards Personalised Therapeutics for Epidermal Differentiation Disorders: Integrating Host Genetics, Immuno-Endotypes and the Skin Microbiome.",
      sum:["表皮分化異常症（EDD）は、従来「先天性魚鱗癬」と呼ばれてきた病気を含む稀で多様な単一遺伝子疾患の総称で、皮膚バリアの機能低下・皮膚の炎症とそれに伴う負担を特徴とします。既存の生物学的製剤を転用する免疫調節治療が新しい選択肢として現れていますが、反応率が一定せず予測しにくいため臨床への実装が進んでいません。本総説は、遺伝子型・免疫プロファイル・皮膚細菌叢の知見を整理し、個別化した管理の枠組みを提案するものです。",
           "遺伝子型の判定と免疫プロファイリングにより、EDD の各病型に共通して主に Th17 への免疫の偏りがあり、一部の病型では Th2 や IL-36 を介したシグナルが加わる混合型の免疫エンドタイプが示されました。この理解を踏まえ、IL-4 受容体・IL-17・IL-12/23 を標的とする既存の生物学的製剤の転用が行われ、ヤヌスキナーゼ（JAK）阻害薬への関心も高まっています。メタゲノムによる細菌叢の解析では、各病型に共通して常在菌（Cutibacterium acnes や Malassezia 属）が減り、病原性をもちうる Staphylococcus 属や Corynebacterium 属が増えるという恒常性の乱れが示され、遺伝子変異と症状の重さが細菌の構成に影響していました。",
           "著者らは、EDD の遺伝子型と免疫エンドタイプ（宿主ゲノム）と皮膚細菌叢を同時に層別化の要素として統合する「宿主ゲノムと細菌叢」の枠組みを個別化医療として提案しています。免疫エンドタイプによる生物学的製剤の合理的な選択には前向きの検証が必要であり、細菌叢の解析は新しい治療の指針やバイオマーカーになりうると述べられています。"],
      use:"生まれつき皮膚が厚く乾燥しやすい病気の方やご家族に、近年は免疫の型や皮膚の細菌を踏まえた治療の研究が進んでいるとご説明し、専門施設での遺伝子診断をご案内する材料になります。",
      note:"総説であり、個々の治療の効果を示すものではありません。" },
    { cat:"A", pmid:"42854988", journal:"J Allergy Clin Immunol", year:2026, type:"第 II 相無作為化二重盲検プラセボ対照試験（33 名・6 か月）",
      tj:"鼻茸のない慢性副鼻腔炎にデュピルマブ：SNOT-22 が -7.0",
      te:"Efficacy of Dupilumab for Patients with Chronic Rhinosinusitis without Nasal Polyps: a Randomized Double-Blind Placebo Controlled Phase II Study.",
      sum:["鼻茸（鼻ポリープ）のない慢性副鼻腔炎（CRSsNP）は人口の最大 8% が罹患する多様な炎症性疾患ですが、現在承認された生物学的製剤はなく、タイプ 2 炎症が強い（T2-high）エンドタイプが標的治療に反応しやすいことが示唆されています。本研究は、中等症から重症の CRSsNP の成人 33 名を対象に、インターロイキン（IL）-4／IL-13 のシグナル経路を標的とする抗体であるデュピルマブ 300 mg またはプラセボを 2 週ごとに 6 か月投与した無作為化二重盲検プラセボ対照試験です。主要評価項目は 22 項目の副鼻腔症状質問票（SNOT-22）と簡易版の鼻結膜炎 QOL 質問票（mini-RQLQ）のスコアの変化で、副次評価項目は CT の副鼻腔スコアと救済薬の使用でした。アレルゲンの皮膚テストの強い陽性または血中好酸球の上昇で定義した T2-high の患者さんについて、あらかじめ定めたサブグループ解析が行われました。",
           "デュピルマブは SNOT-22（プラセボとの差 -7.0、P<.001）と mini-RQLQ（-5.2、P<.01）を有意に改善しました。T2-high の患者さんでは SNOT-22 の改善が数値上大きく（-11.3、P=.07）、mini-RQLQ では有意な改善が示されました（-9.2、P<.01）。CT スコアと救済薬の使用の減少はデュピルマブに有利でしたが、統計学的な有意差はありませんでした。治療の忍容性は良好で、参加者全員が試験を完了しました。",
           "デュピルマブは CRSsNP の成人において患者さんが報告する転帰を意味のある程度改善したとされ、T2-high の方でより大きな効果が得られる傾向はエンドタイプに応じた治療の可能性を支持する一方、より大規模な研究が必要と述べられています。"],
      use:"アトピー性皮膚炎でデュピルマブを使われている方が鼻づまりや嗅覚の低下も訴えられたときに、同じ経路を標的とする薬の研究が進んでいるとお伝えし、耳鼻咽喉科へのご相談につなげる材料になります。",
      note:"皮膚領域外（副鼻腔）の試験で、例数も 33 名と限られます。皮膚症状への効果を示すものではありません。" }
  ]
},
{

  items: [
    { cat:"A", pmid:"42844553", journal:"Rheumatol Ther", year:2026, type:"第 III 相試験の長期延長（SELECT-PsA 1・1,704 名・260 週）",
      tj:"ウパダシチニブ 5 年：効果は維持、帯状疱疹はアダリムマブより多い",
      te:"Long-Term Safety and Efficacy of Upadacitinib in Patients with Psoriatic Arthritis: 5-Year Results from the Phase 3 SELECT-PsA 1 Study.",
      sum:["第 III 相の SELECT-PsA 1 試験では、経口のヤヌスキナーゼ（JAK）阻害薬であるウパダシチニブが乾癬性関節炎の症状と所見を 12 週から 152 週まで改善しました。本報告はその長期延長期であり、260 週（約 5 年）までのウパダシチニブとアダリムマブの安全性と有効性を評価したものです。プラセボ、またはウパダシチニブ 15 mg もしくは 30 mg を 1 日 1 回、あるいはアダリムマブ 40 mg を隔週で 1 回以上投与された患者さんについて、治療下で発現した有害事象と主要・副次の評価項目を 260 週まで収集しました。",
           "1,704 名が少なくとも 1 回投与を受け、983 名（57.7%）が 260 週の治療を完了しました。260 週までのウパダシチニブの安全性の特徴は 104 週・152 週の結果と一貫していました。ウパダシチニブはアダリムマブと比べ、重篤な感染症・帯状疱疹・リンパ球減少・クレアチンキナーゼ上昇・非メラノーマ皮膚がんの頻度が高い傾向と関連していました。主要な心血管事象（100 患者年あたり：15 mg 0.4、30 mg 0.4、アダリムマブ 0.3）と静脈血栓塞栓症（15 mg 0.2、30 mg 0.4、アダリムマブ 0.2）の曝露調整発生率は低く、群間で同程度でした。56 週・104 週で得られた有効性の改善は 260 週まで維持され、アダリムマブと同程度でした。",
           "ウパダシチニブの 5 年間の安全性の特徴は 104 週・152 週の時点と一貫しており、新たな懸念は認められなかったと述べられています。"],
      use:"JAK 阻害薬を長く続けることをご心配される方に、5 年の時点で新たな安全性の懸念は示されなかった一方、帯状疱疹や重篤な感染症は比較薬より多かったとお伝えし、帯状疱疹の初期症状の見分け方をご案内する材料になります。",
      note:"乾癬性関節炎の試験であり、皮膚のみの乾癬やアトピー性皮膚炎にそのまま当てはまるものではありません。" },
    { cat:"A", pmid:"42849024", journal:"Indian Dermatol Online J", year:2026, type:"無作為化非盲検比較試験（134 名・16 週）",
      tj:"尋常性乾癬：低用量 MTX ＋低用量アシトレチンは標準用量 MTX と同等",
      te:"Efficacy and Safety of Treatment with Methotrexate Versus a Combination of Low Dose of Methotrexate Plus Low Dose of Acitretin in Chronic Plaque Psoriasis: A Randomised Nonblinded Controlled Trial.",
      sum:["メトトレキサート（MTX）とアシトレチン（ACI）はいずれも尋常性乾癬に対する確立した全身療法ですが、肝毒性が上乗せされる懸念から、低用量で固定して併用する無作為化試験は限られています。本研究は、体表面積 10% 超かつ PASI 10 超の尋常性乾癬の患者さんを対象に、MTX 0.3 mg/kg/週の単独と、低用量 MTX 0.15 mg/kg/週＋低用量 ACI 0.3 mg/kg/日の併用の有効性と安全性を比較した非盲検の無作為化比較試験です。MTX は筋肉内投与、ACI は内服で、最初の 4 週は 2 週ごと、以降は毎月、16 週まで追跡しました。",
           "合計 134 名（各群 67 名）を解析しました。開始時の体表面積と PASI は両群で同程度（P = 0.54、P = 0.82）で、16 週では両群ともに有意に低下しました（P = 0.01、P = 0.04）。16 週時点の PASI-75・90・100 は単独療法群でやや高かったものの、per-protocol 解析・intention-to-treat 解析のいずれでも統計学的な有意差はありませんでした。効果が現れるまでの期間は単独療法群で有意に早く（P = 0.001）、検査値と臨床の有害事象は両群で軽度かつ対処可能でした。",
           "定期的な検査と通院での経過観察が確保できるならば、低用量 MTX ＋ ACI は標準用量 MTX に代わる安全で有効な選択肢になりうると述べられています。"],
      use:"乾癬で全身療法を検討される方に、薬の量を抑えた組み合わせという考え方があることと、いずれの場合も定期的な血液検査が前提になることをご説明する材料になります。",
      note:"非盲検の試験で、アシトレチン単独群がなく、期間も限られ、肝線維化の非侵襲的な評価は行われていません。" },
    { cat:"A", pmid:"42848523", journal:"Expert Opin Biol Ther", year:2026, type:"2 施設の後方視コホート（261 名）",
      tj:"乾癬：IL-23 阻害薬は IL-17 阻害薬より FIB-4 が下がりやすい",
      te:"Changes in the FIB-4 index with IL-23 vs IL-17 inhibitors in psoriasis: a retrospective cohort study.",
      sum:["乾癬は肝線維化の危険と関連しますが、インターロイキン（IL）-17 阻害薬と IL-23 阻害薬の肝臓に関する比較は明らかではありません。本研究は、IL-17 阻害薬または IL-23 阻害薬で治療された成人の乾癬の患者さんを対象とした 2 施設の後方視コホートで、6 か月後の FIB-4 指数と APRI（AST と血小板比の指数）の変化、12 か月後の超音波による脂肪化の転帰を比較しました。6 か月時点の FIB-4 は、開始時の FIB-4 と共変量で調整した共分散分析で解析しています。",
           "261 名（IL-17 阻害薬 129 名、IL-23 阻害薬 132 名）のうち 140 名で超音波検査が行われました。FIB-4 の変化量の中央値はそれぞれ -0.005（四分位範囲 -0.054〜0.046）と -0.050（-0.143〜-0.011）で、調整後は IL-23 阻害薬で 6 か月時点の FIB-4 が低い結果でした（β = -0.063、95% 信頼区間 -0.091〜-0.034）。FIB-4 の改善はそれぞれ 12.4%・32.6% に認められ、開始時の FIB-4 が 1.30 以上の方では変化量の中央値が -0.030 と -0.222（調整 β = -0.199、95% 信頼区間 -0.265〜-0.133）でした。血小板数はそれぞれ -4.0・+14.5 × 10⁹/L と変化し（P = 0.031）、PASI の変化と超音波の脂肪化の変化は同程度で、肝臓に関する事象は発生しませんでした。",
           "IL-23 の阻害は IL-17 の阻害より FIB-4 と APRI の低下が大きく、とくに開始時の FIB-4 が高い方で顕著であったとされ、エラストグラフィによる確認を含む前向きの検証が必要と述べられています。"],
      use:"脂肪肝や肝機能の数値を気にされる乾癬の方に、生物学的製剤の種類によって肝線維化の指標の推移が異なる可能性があるとご説明する材料になります。",
      note:"後方視の観察研究であり、治療の選択による偏りを完全には除けません。" },
    { cat:"A", pmid:"42851414", journal:"Front Immunol", year:2026, type:"スコーピングレビュー（42 研究）",
      tj:"慢性誘発性蕁麻疹：日常の検査で使えるバイオマーカーはまだない",
      te:"Scoping review: biomarkers in chronic inducible urticaria.",
      sum:["慢性誘発性蕁麻疹は人口の約 0.5% に生じ、寒冷・温熱・運動・機械的な摩擦・振動・遅延性の圧迫といった特定の刺激で膨疹が出る点が、慢性特発性蕁麻疹と異なります。バイオマーカーは診断・病型の分類・経過の予測・治療反応の評価に役立つ可能性があります。本研究は、H1 抗ヒスタミン薬とオマリズマブの治療を中心に、診断・予後・予測・経過観察のバイオマーカーの現在の証拠を整理したスコーピングレビューで、Embase・MEDLINE・Web of Science を 2026 年 1 月 29 日まで検索し、2 名の評価者が独立して選択とデータ抽出を行いました。",
           "3,394 件を一次選択し 42 件を採用しましたが、証拠は均一でなく探索的で、バイオマーカーと病型をまたいだ検証は限られていました。寒冷・遅延性圧迫・日光蕁麻疹など複数の病型では診断のバイオマーカーが見いだされませんでした。コリン性蕁麻疹では汗に関連する IgE が汗アレルギーの病型の診断に中等度の可能性を示しましたが検証が必要で、機械性蕁麻疹ではオミクスによる探索で分子の変化が示されたものの臨床応用には至っていません。寒冷蕁麻疹では誘発試験に基づく指標が重症度と H1 抗ヒスタミン薬への反応と関連し、総 IgE はオマリズマブへの反応の予測に探索的な可能性を示しました。日常の検査値は治療反応や経過観察の指標としては概して信頼できませんでした。",
           "病型をまたいで有望な探索的バイオマーカーが複数見いだされ、今後の研究の土台になるとされ、大規模でよく特徴づけられたコホートでの外部検証が臨床応用の鍵になると述べられています。"],
      use:"寒冷や圧迫で膨疹が出る方に、血液検査で原因や効き具合を確かめる確立した指標はまだなく、症状の記録と誘発の所見が診療の中心になるとご説明する材料になります。",
      note:"スコーピングレビューであり、採用された研究は探索的なものが中心です。" },
    { cat:"A", pmid:"42845078", journal:"Acta Med Indones", year:2026, type:"横断観察研究（70 名）",
      tj:"透析患者のかゆみ：血清 IL-31 は高いが単独の指標には不十分（AUC 0.64）",
      te:"The Relationship Between Serum Interleukin-31 Levels and Chronic Kidney Disease-Associated Pruritus in Patients Undergoing Hemodialysis.",
      sum:["慢性腎臓病に伴うかゆみはインターロイキン（IL）-31 の上昇を含む免疫の調節異常と関連づけられてきましたが、対象集団や評価方法が一定でないため結果は一致していません。本研究は、定期的な血液透析を受けている患者さんにおける血清 IL-31 値とかゆみおよびその重症度との関係を検討した横断観察研究です。2024 年 4 月から 5 月にかけて単施設で実施し、かゆみは視覚的評価尺度（VAS）と 5-D itch scale で評価し、血清 IL-31 は酵素結合免疫吸着測定法で測定して、二変量解析と多変量解析を行いました。",
           "参加者 70 名（男性 54.3%、年齢の中央値 52.5 歳、透析歴の中央値 57 か月）のうち 35 名にかゆみがありました。VAS と 5-D itch scale の中央値はそれぞれ 5.3 と 13 で、中等度のかゆみを示していました。かゆみのある方は血清 IL-31 値が有意に高かった一方（P = 0.05）、受信者操作特性解析での判別能は限定的で（曲線下面積 0.64）、173 pg/mL を境とすると感度 51.4%・特異度 74.3% でした。IL-31 値とかゆみの有無には有意な関連がありましたが（P = 0.03）、VAS（P = 0.79）や 5-D itch scale（P = 0.44）で測った重症度との相関は認められませんでした。",
           "血清 IL-31 はかゆみのある方で高く関連が示唆される一方、診断の成績は限定的で重症度とも相関しないため、単独の臨床指標となる可能性は低く、補助的・探索的な指標にとどまると述べられています。"],
      use:"透析を受けていてかゆみに悩まれる方に、採血だけでかゆみの強さを測ることは難しく、問診でのかゆみの評価と保湿などの手当てが中心になるとご説明する材料になります。",
      note:"単施設・70 名の横断研究で、因果関係を示すものではありません。" },
    { cat:"A", pmid:"42847490", journal:"J Cutan Med Surg", year:2026, type:"ナラティブレビュー",
      tj:"臓器移植後の爪真菌症：免疫抑制薬との相互作用で治療が難しい",
      te:"Onychomycosis in Solid Organ Transplant Recipients.",
      sum:["爪真菌症は爪の慢性の真菌感染で、臨床で最も多く出会う爪の疾患です。放置すると爪の変形が進み、局所の痛みや心理社会的な影響が大きくなります。治療には長い期間が必要で再発率も高いため、もともと治療が難しい疾患です。固形臓器の移植を受けた方は生涯にわたる免疫抑制のためにとくに罹りやすく、拒絶反応を抑える薬と全身の抗真菌薬との薬物相互作用という固有の課題があり、この集団に対する標準化された治療指針がないことが難しさを強めています。本総説はこの集団における疫学・原因・診断・治療を論じたものです。",
           "有効な抗真菌療法と免疫抑制療法の両立という複雑さが重点的に取り上げられ、この脆弱な集団で転帰を最適化するために個別に設計された治療の手順が必要であることが述べられています。",
           "移植後の方の爪真菌症では、併用薬との相互作用を踏まえた個別の治療設計が必要であると述べられています。"],
      use:"移植後や免疫抑制薬を使っている方の爪白癬で、内服の抗真菌薬を考える際に併用薬との相互作用を必ず確認し、主治医と連携する必要があることをご説明する材料になります。",
      note:"ナラティブレビューであり、治療の優劣を比較した研究ではありません。" },
    { cat:"A", pmid:"42846383", journal:"Front Pediatr", year:2026, type:"単施設の横断研究（47 名・3.6〜19 歳）",
      tj:"小児のアトピー性皮膚炎：報告された誘因で最多はダニ（57.4%）",
      te:"Clinical profile, reported triggers, and comorbidity pattern in children and adolescents with atopic dermatitis: a cross-sectional study from Fujian, China.",
      sum:["中国南部の小児のアトピー性皮膚炎についての詳しい臨床の記述は少なく、入手できる中国のデータは推計による疾病負担か、アレルゲン感作の検査の集積が中心でした。本研究は、福建省福州市の三次医療の皮膚科外来で UK Working Party の基準を満たした 3.6〜19.0 歳の 47 名を対象とした単施設の横断研究です。誘因・併存症・家族歴は通常の診療記録から抽出し、確定診断や有病率の推計ではなく「記録された病歴」として報告されています。重症度は体表面積（BSA）、Patient-Oriented Eczema Measure（POEM）、小児皮膚科 QOL 指標で評価しました。",
           "年齢の中央値は 11.0 歳（四分位範囲 6.0〜13.5 歳）でした。最も多く報告された誘因はヒョウヒダニで 27/47 名（57.4%）、次に魚介類・甲殻類（40.4%）、湿った環境（21.3%）であり、多くの参加者が複数の誘因を挙げていました。特異的 IgE や皮膚プリックテストは行われておらず、これらは報告された誘因であって感作ではありません。アレルギー疾患の家族歴は 95.7%（95% 信頼区間 85.8〜98.8）、アレルギー性鼻炎は 70.2%（56.0〜81.3）に記録されており、鼻炎の数値は組み入れ基準を一部反映しています。記録された喘息はまれでした（1/44 名、2.3%）。",
           "ヒョウヒダニが最も多く報告された誘因で、アレルギー性鼻炎の病歴の記録が多く、各群内では中等症が中心であったとされています。すべての数値は 1 施設の記録に基づく集計であり、より大規模で前向きに設計された多施設のコホートでの確認が必要な予備的所見と述べられています。"],
      use:"お子さんのアトピー性皮膚炎で何が悪化のきっかけかを伺うとき、ダニ・魚介類・住まいの湿気を順に確認する材料になります（生活指導アシスタントの生活指導・食物アレルギーのタブ）。",
      note:"47 名の単施設の記録に基づく集計で、有病率の推計ではありません。日本の小児にそのまま当てはまるものではありません。" },
    { cat:"A", pmid:"42847763", journal:"Pediatr Dermatol", year:2026, type:"後方視の症例集積（15 名）",
      tj:"小児の円形脱毛症：JAK 阻害薬で再燃後、デュピルマブ追加で 84.6% が完全再生",
      te:"Dupilumab as Add-On Therapy for JAK Inhibitor-Relapsed Pediatric Alopecia Areata: A Case Series.",
      sum:["ヤヌスキナーゼ（JAK）阻害薬で SALT80（開始時から 80% の改善）を達成した後に再燃した重症の円形脱毛症のお子さん 15 名について、デュピルマブの追加投与を評価した後方視の症例集積です。",
           "12 週の時点で SALT スコアの開始時からの改善の中央値は 59.0% でした。24 週の治療を完了した 13 名のうち 84.6% が完全な発毛（SALT100）を達成しました。",
           "デュピルマブの追加療法は有効性と許容できる安全性を示し、JAK 阻害薬の治療中に再燃した小児の円形脱毛症に対する有望な選択肢になりうると述べられています。"],
      use:"お子さんの重い円形脱毛症で治療後に再び抜けてきた場合に、追加の選択肢が検討されているとお伝えし、専門施設への紹介を考える材料になります。",
      note:"15 名の後方視の症例集積で、比較群がありません。" },
    { cat:"A", pmid:"42851899", journal:"Front Immunol", year:2026, type:"総説",
      tj:"IL-13 は皮膚の線維化をつなぐ鍵、可逆的な過程の可能性",
      te:"IL-13 and skin fibrosis in inflammatory skin diseases.",
      sum:["皮膚の線維化は慢性の炎症性皮膚疾患の重要な構成要素として認識が進んでおり、皮膚の厚み・硬さ・持続する機能の障害に関わります。長らく線維化の中心的な媒介因子と考えられてきたトランスフォーミング増殖因子 β（TGF-β）に加え、2 型免疫の主要なサイトカインであるインターロイキン（IL）-13 が慢性の炎症と線維性のリモデリングをつなぐ重要な役割を担うという証拠が蓄積しています。本総説は IL-13 が皮膚の線維化を促す機序についての現在の理解を整理したものです。",
           "IL-13Rα1/STAT6 経路を介した線維芽細胞の直接の活性化、細胞外マトリックスの合成と分解の調節の乱れ、慢性のかゆみと力学的な刺激の感知を含む神経と免疫の相互作用、マクロファージと線維芽細胞の連携、エピジェネティックなリモデリングによる線維芽細胞の記憶について論じられています。さらに、アトピー性皮膚炎・結節性痒疹・全身性強皮症・ケロイドという代表的な疾患における IL-13 関連の線維化の病理学的な特徴が比較されています。",
           "IL-13 に関連する線維化は、通常の瘢痕形成とは異なり、持続する免疫の活性化・継続的な細胞外マトリックスのリモデリング・組織の可塑性の残存を特徴とし、動的で可逆的な可能性のある過程と考えられると述べられています。"],
      use:"長年の湿疹で皮膚が硬く厚くなった方に、その硬さが炎症と結びついた変化で、治療によって戻りうる部分があると考えられているとご説明する材料になります。",
      note:"機序に関する総説であり、特定の治療の効果を示したものではありません。" },
    { cat:"A", pmid:"42845199", journal:"Ann Dermatol", year:2026, type:"総説",
      tj:"顔の尋常性白斑：病型に応じた個別の治療戦略",
      te:"Personalized Approaches to Facial Vitiligo: A Comprehensive Review From Clinical Phenotypes to Novel Therapeutic Strategies.",
      sum:["顔の尋常性白斑は白斑の患者さんのかなりの割合に生じ、目につきやすいため心理社会的な負担が大きい状態です。顔の白斑は主に非分節型と分節型に分類され、それぞれ分布の型と予後の特徴が異なります。非分節型はさらに顔面中央型・汎顔面型・生え際型の 3 つの形態に分けられ、臨床の特徴と治療への反応がそれぞれ異なります。発症には遺伝的な素因・酸化ストレス・メラノサイトに対する自己免疫による破壊が多面的に関わり、診断は臨床所見を基本に、Wood 灯・ダーモスコピー・画像検査で補助されます。",
           "一次治療として外用のカルシニューリン阻害薬と外用のルキソリチニブが挙げられ、色素の再生を最大にするために光線療法と併用されることが多いとされています。308 nm エキシマレーザーは紫外線を狙って照射し、病変のない皮膚への光障害を抑えます。進行している場合は安定化のために全身のステロイドが用いられ、代替としてメトトレキサート・シクロスポリン・アザチオプリンが挙げられます。安定して治療に反応しない例ではミニパンチ移植などの外科的治療が有効な選択肢です。経口の JAK 阻害薬や組織に常在する記憶 T 細胞を標的とする生物学的製剤といった新しい治療が研究中で、予備的な結果は期待できるとされています。",
           "摩擦を避けること・紫外線対策・抗酸化物質に富む食事といった生活上の工夫が、薬物療法を支える補助になりうるとされ、臨床の多様性を踏まえた病型に基づく個別の治療戦略が必要であると述べられています。"],
      use:"顔の白斑でお悩みの方に、外用薬と光線療法を組み合わせる考え方や、摩擦を避け紫外線対策を行う日常の工夫をご案内する材料になります（生活指導アシスタントの生活指導のタブ）。",
      note:"総説であり、記載された治療の一部は本邦の適応と異なる場合があります。" },
    { cat:"C", pmid:"42744632", journal:"Zhongguo Zhen Jiu", year:2026, type:"画像解析（2〜6 歳の小児 100 名の頸椎 CT・三次元再構成）",
      tj:"小児の風府（GV16）：5 歳未満は 20 mm、5 歳以上は 25 mm までが安全域",
      te:"[Research on the depth and angle of needle insertion at Fengfu (GV16) in children based on three-dimensional image reconstruction].",
      sum:["2〜6 歳の小児における風府（GV16）への刺鍼の深さと角度の安全性を検討した研究です。2〜6 歳の小児の頸椎の CT 画像データを年齢別の 5 群（各 20 例）に分けて収集し、三次元再構成を行って解剖学的な指標から皮膚上に風府を標記しました。危険な刺入深度は、皮膚上の経穴から危険な臓器に対応する骨の構造までの最短の直線距離と定義し、危険な角度はその線と水平面または正中面との角度として求めました。大後頭孔の下縁、第 1 頸椎後弓の後結節、第 2 頸椎棘突起の上縁、第 1 頸椎の椎骨動脈溝の上部外側縁、第 1 頸椎の横突孔の上部外側縁までの距離と角度を測定しています。",
           "危険な刺入深度は 2 歳群と 3 歳群で有意差がありませんでした。4 歳群では 2 歳群に比べて左右の横突孔までの距離が大きく（P < 0.05）、5 歳群では 2 歳群・3 歳群に比べて大後頭孔下縁までの距離と左右の横突孔までの距離が大きく（P < 0.05）、6 歳群では 2・3・4 歳群に比べて複数の距離が大きくなりました（P < 0.05）。同一群内で左右の危険な刺入深度に統計学的な差はありませんでした。安全な刺入深度の変化はおおむね危険な刺入深度の変化と一致していました。",
           "正中面に沿って 10° 以内で刺入する場合、5 歳未満では深さを 20 mm、5 歳以上では 25 mm を超えないようにするとされています。外側に向けて 15〜25° で斜めに刺入する場合は 25 mm 以内、25〜35° の場合は 40 mm 以内にとどめるべきであると述べられています。"],
      use:"小児に頸部の経穴を用いる際に、年齢ごとの刺入の深さと角度の目安を確認する材料になります。",
      note:"皮膚科領域外（鍼灸の安全性）。中国語の論文で、画像に基づく解剖学的な計測であり、臨床での検証ではありません。" },
    { cat:"C", pmid:"42745782", journal:"Front Med (Lausanne)", year:2026, type:"探索的な混合研究法の試験",
      tj:"三叉神経痛への鍼治療：探索的な混合研究法の試験（抄録なし）",
      te:"Acupuncture in patients with trigeminal neuralgia-an exploratory mixed methods trial.",
      sum:["三叉神経痛の患者さんに対する鍼治療について、量的な評価と質的な評価を組み合わせた探索的な試験として報告されています。",
           "抄録が公開されていないため、対象数・方法・結果の数値は確認できません。",
           "臨床的な示唆はタイトルの範囲では判断できません。原著のご確認が必要です。"],
      use:"顔面の痛みで鍼治療をご希望される方のご相談に備え、原著を取り寄せて内容を確かめる候補になります。",
      note:"抄録なし（タイトルのみで要約）。原著確認が必要。皮膚科領域外（顔面の神経痛）。" }
  ]

{
  date: "2026-10-09",
  range: { A: "2026-10-07〜10-09", B: "2026-10-07〜10-09", C: "2026-09-09〜10-09" },
  items: [
    { cat:"A", pmid:"42844558", journal:"Dermatol Ther (Heidelb)", year:2026, type:"2 つの無作為化比較試験の事後解析（JADE COMPARE・JADE EXTEND）",
      tj:"アブロシチニブ：重症のアトピー性皮膚炎でも 112 週で IGA 0/1 が 54.5%",
      te:"Does Baseline Severity of Atopic Dermatitis Impact the Long-Term Efficacy of Abrocitinib? Post-hoc Analysis of Two Randomized Trials.",
      sum:["アトピー性皮膚炎の開始時の重症度は治療への反応に影響する可能性があります。本研究は、開始時の重症度別にアブロシチニブの短期と長期の有効性・安全性を評価することを目的とした事後解析です。対象は 12 歳以上の中等症から重症のアトピー性皮膚炎で、アブロシチニブ 100 mg・200 mg またはプラセボを投与された JADE COMPARE 試験と JADE EXTEND 試験の患者さんです。開始時の重症度は医師による全般評価（IGA）や Eczema Area and Severity Index（EASI）など複数の指標で判定し、有効性と安全性の評価項目を開始時の重症度で層別しました。",
           "16 週の時点で IGA 0/1（皮疹が消失またはほぼ消失）を達成した割合は、開始時が中等症の方で 40.8%（100 mg）・50.0%（200 mg）、重症の方で 19.1%（100 mg）・43.2%（200 mg）であり、プラセボ（中等症 18.0%、重症 2.8%）より高い割合でした。112 週の時点では、中等症の方で 60.2%（100 mg）・64.3%（200 mg）、重症の方で 38.6%（100 mg）・54.5%（200 mg）が IGA 0/1 を達成しました。EASI-90（開始時から 90% の改善）とかゆみの最大値の数値評価尺度 0/1（かゆみなしまたは軽度）の同時達成など、ほかの指標でも同様の反応率でした。新しい安全性の懸念は認められませんでした。",
           "アブロシチニブは成人と青年において 112 週まで皮膚の改善とかゆみの改善を早期から持続して示し、開始時が中等症・重症のいずれの部分集団でも反応は維持されていたと述べられています。"],
      use:"重症だから飲み薬は効きにくいのではと心配される方に、重症の方でも時間をかけて改善が積み上がりうることをご説明する材料になります（生活指導アシスタントの外用薬・スキンケアのタブと併せて）。",
      note:"無作為化比較試験の事後解析で、部分集団ごとの結果です。" },
    { cat:"A", pmid:"42845229", journal:"Allergy Asthma Immunol Res", year:2026, type:"前向きコホート（UK Biobank・約 33 万人）",
      tj:"アトピー性皮膚炎は睡眠障害の独立した危険因子：ハザード比 1.51",
      te:"Atopic Dermatitis and Sleep Disorders.",
      sum:["アトピー性皮膚炎は世界で 1 億 2,900 万人が罹患する一般的な炎症性皮膚疾患で、繰り返す湿疹・強いかゆみ・皮膚のバリアの障害を特徴とします。これまでのアトピー性皮膚炎と睡眠障害の関連についての研究は、対象数が少ないか単施設の設計で、大規模な疫学の証拠が不足していました。本研究は UK Biobank の前向きコホートを用いて両者の関連を検討し、性別・人種・肥満がこの関係に及ぼす影響を探ることを目的としています。横断解析に 329,796 名、縦断解析に 330,875 名を組み入れ、多変量ロジスティック回帰と Cox 比例ハザードモデルを用い、部分集団解析と感度分析で頑健性を確認しました。",
           "横断解析では、アトピー性皮膚炎は睡眠障害の危険の増加と有意に関連していました（調整オッズ比 2.84、95% 信頼区間 2.54-3.18、P < 0.001）。縦断解析でも、アトピー性皮膚炎は睡眠障害の独立した予測因子であることが確認されました（調整ハザード比 1.51、95% 信頼区間 1.32-1.73、P < 0.001）。Kaplan-Meier 曲線でも、アトピー性皮膚炎のある方で睡眠障害の累積の危険が高いことが示されました。部分集団解析では、女性と体格指数（BMI）が中程度の方でより強い関連がみられ、感度分析でも所見の頑健性が裏づけられました。",
           "アトピー性皮膚炎は睡眠障害の独立した危険因子であり、とくに女性と BMI が中程度の方で顕著であると述べられています。今後は特定の集団に向けた精密な治療と管理の方策をさらに探る必要があるとされています。"],
      use:"夜眠れないと訴えられるアトピー性皮膚炎の方に、睡眠の問題が病気と結びついていることをお伝えし、睡眠を含めた生活の整え方をご案内する根拠になります（生活指導アシスタントの生活指導のタブ）。",
      note:"観察研究であり、因果関係を示すものではありません。" },
    { cat:"A", pmid:"42841428", journal:"J Dermatolog Treat", year:2026, type:"系統的レビュー・ネットワークメタ解析（7 コホート・1,435 名）",
      tj:"結節性痒疹：デュピルマブとネモリズマブはいずれも有効、両者の優劣は未確定",
      te:"Randomized evidence breadth and comparative maturity of systemic targeted therapies for prurigo nodularis: a time-aligned systematic review and network meta-analysis.",
      sum:["結節性痒疹に対する全身の分子標的治療の無作為化の証拠は増えていますが、試験間の違いが妥当な比較を難しくしています。本研究は無作為化の証拠を整理し、16 週時点のかゆみの数値評価尺度が 4 点以上改善した割合（NRS4）という厳密に揃えた指標で比較の効果を評価した系統的レビュー・ネットワークメタ解析です。MEDLINE・Embase・CENTRAL・Web of Science を 2026 年 8 月 14 日まで検索し、無作為化された群ごとの 16 週 NRS4 のデータが取り出せる研究を、固定効果の対比に基づくネットワークメタ解析で統合しました。バイアスのリスクは RoB 2、確信度は CINeMA で評価しています。",
           "24 件の無作為化研究が 117 の報告として存在しましたが、指標を揃えたネットワークに寄与したのは 7 コホート（1,435 名・19 群・10 の活性ノード）のみでした。デュピルマブ（オッズ比 4.04、95% 信頼区間 2.42-6.75、確信度は低）と、国際第 III 相のネモリズマブ（オッズ比 5.81、95% 信頼区間 3.81-8.86、確信度は低）はプラセボに対して有効でした。ネモリズマブとデュピルマブの間接比較は精度が低く（オッズ比 1.44、95% 信頼区間 0.74-2.79、確信度は低）、いずれかの生物学的製剤が優れていることを示すには至りませんでした。",
           "無作為化の証拠の全体は、定量的に比較できたネットワークよりかなり広く、結果の公表が不十分であることと試験間の違いを反映していると述べられています。"],
      use:"掻き壊した硬いしこりのかゆみが続く方に、注射による治療の選択肢が複数あり、どちらが優れているかは現時点で確定していないと率直にご説明する材料になります。",
      note:"直接比較ではなく間接比較を含み、確信度は低と評価されています。" },
    { cat:"A", pmid:"42845143", journal:"Pediatr Allergy Immunol", year:2026, type:"後方視コホート（340 名・機械学習）",
      tj:"アトピー性皮膚炎の乳幼児：通常の血液検査から食物感作を予測（AUC 0.82）",
      te:"Machine learning-based prediction of food sensitization in infants and toddlers with atopic dermatitis.",
      sum:["食物感作はアトピー性皮膚炎のお子さんによくみられる併存状態で、アレルギーマーチにつながることがあります。危険の高い患者さんを一次医療の場で見分けることは、専門医への紹介の優先順位をつけ、不必要な除去食を避けるために重要です。本研究は、アトピー性皮膚炎と診断された 0〜3 歳の乳幼児について、通常の臨床・検査の項目を用いて IgE が関与する食物感作の危険を予測する機械学習による臨床判断支援の道具を開発し検証することを目的とした後方視コホート研究です。特異的 IgE 値と皮膚プリックテストにより食物感作の有無を分類し、10 種類の機械学習の手法を 5 分割の層別交差検証で訓練・比較し、特徴量の重要度を解析して対話型のウェブの道具を作成しました。",
           "340 名のうち 156 名（45.8%）が IgE 関与の食物感作を有していました。食物感作の独立した主な予測因子は、総 IgE 値が高いこと、受診時の年齢が低いこと、好酸球数が高いこと、症状が出た時点で母乳栄養であったことでした。ブースティングに基づくモデルの成績が優れており、とくに AdaBoost モデルは安定性と判別能が高く（ROC AUC は交差検証で 0.815、取り置いた検証集団で 0.819）、確率の閾値を 0.40 に最適化すると再現率 92%・F1 値 0.75 となり、見逃しを効果的に減らせました。",
           "この機械学習モデルは、アトピー性皮膚炎のお子さんにおける IgE 関与の食物感作のふるい分けと危険の層別化の道具になりうると述べられています。通常の検査データを活かすことで、危険の高い例を適時に紹介し、危険の低い乳児では不必要な検査を減らすことを支援しうるとされています。"],
      use:"乳児のアトピー性皮膚炎で食物アレルギーをご心配される保護者に、年齢・総 IgE・好酸球数といった通常の検査から危険を見立てる考え方をご説明する材料になります（生活指導アシスタントの食物アレルギーのタブ）。",
      note:"単一集団での後方視の開発研究で、日本の診療での外部検証はされていません。" },
    { cat:"A", pmid:"42844089", journal:"Allergol Int", year:2026, type:"症例対照の免疫解析（患者 59 名・健常者 18 名）",
      tj:"慢性特発性蕁麻疹：T 細胞が皮膚へ向かいやすく、病型で Th2 と Th17/Th1 が分かれる",
      te:"T cells in chronic spontaneous urticaria show skin-migratory capacity and endotype-specific differences.",
      sum:["慢性特発性蕁麻疹は、かゆみのある膨疹を繰り返すことを特徴とします。病変の浸潤に CD4 陽性 T 細胞が認められ、T 細胞の機能を抑える治療が有効であることから、T 細胞が病態に重要な役割を果たしている可能性がありますが、その正確な影響は明らかではありません。本研究では、慢性特発性蕁麻疹の患者さん 59 名と健常者 18 名について、表面マーカーの発現とサイトカイン（IL-17・IL-5・IFNγ・IL-10・IL-31）の分泌をフローサイトメトリーと ELISpot で解析しました。皮膚への移動の能力は皮膚ホーミングのマーカー（CLA・CCR10・CCR8）の発現で評価し、病型は抗 TPO 抗体と抗 IL-24 IgE の血中濃度、好塩基球活性化試験による血清の自己反応性により、自己アレルギー型と自己免疫型に分類しています。",
           "血中のヘルパー T 細胞・濾胞ヘルパー T 細胞・制御性 T 細胞の分布は患者さんと健常者で同等でした。一方、患者さんの CD4 陽性 T 細胞では CLA の発現が有意に高く、CLA 陽性 CD4 陽性のメモリー T 細胞のうち Th2 細胞と Th17 細胞の割合が増加していました。自己アレルギー型では Th2 細胞が優位で、自己免疫型では Th17 細胞と Th1 細胞が優位でした。また患者さんの末梢血では、IL-17・IFNγ・IL-10 を分泌する T 細胞が有意に少なくなっていました。",
           "慢性特発性蕁麻疹の患者さんの末梢血 T 細胞は皮膚へ移動する能力が高まっており、自己アレルギー型か自己免疫型かという病型に応じて Th2 と Th17/Th1 の部分集団が異なって関与していると述べられています。これらの所見は新しい治療の標的を示しうるとされています。"],
      use:"原因のはっきりしない蕁麻疹が長引く方に、免疫の型によって背景が異なることが分かってきている段階だとお伝えする材料になります。",
      note:"病態の解明を目的とした免疫解析で、治療法を示したものではありません。" },
    { cat:"A", pmid:"42841678", journal:"Ann Med", year:2026, type:"系統的レビュー（23 論文・症例報告と症例集積のみ）",
      tj:"紅色扁平苔癬への JAK 阻害薬：23 論文で有益な効果の報告、比較試験はまだない",
      te:"Janus kinase inhibitors in the management of lichen planus: a systematic review.",
      sum:["紅色扁平苔癬は皮膚・毛包・爪・粘膜に生じうる慢性のリンパ球性の炎症性皮膚疾患で、治療の選択肢が限られています。病態にはインターフェロンと JAK-STAT のシグナル伝達経路による炎症が関与するため、JAK 阻害薬が有力な治療の方法として提案されてきました。JAK 阻害薬は円形脱毛症やアトピー性皮膚炎といった一部のリンパ球性の皮膚疾患に対して近年承認されています。本研究は、紅色扁平苔癬に対する JAK 阻害薬の効果を評価した系統的レビューです。PubMed・Scopus・Google Scholar を検索し、2015 年 1 月から 2024 年 5 月に公表され、皮膚型および粘膜・付属器型を含む紅色扁平苔癬への JAK 阻害薬の臨床効果を評価した研究をすべて組み入れ、バイアスのリスクは Joanna Briggs Institute の道具で低・中等度・高の懸念に分類しました。",
           "57 件の全文が評価され、基準に合致しない 34 件が除外されたため、本レビューには 23 件が組み入れられました。そのうち 7 件が症例集積で、残る 16 件は症例報告でした。薬剤別ではトファシチニブが 13 件、バリシチニブが 6 件、ルキソリチニブとウパダシチニブが各 2 件でした。複数の症例集積と症例報告で、JAK 阻害薬が紅色扁平苔癬の治療に有益な効果を示すことが報告されています。軽微な有害事象がみられた患者さんは少数でした。",
           "紅色扁平苔癬に対する JAK 阻害薬には有益な効果の報告が集まっているものの、現在の証拠は症例報告と症例集積にとどまると述べられています。"],
      use:"治りにくい紅色扁平苔癬の方に、新しい薬の報告が集まり始めている段階であることをお伝えする材料になります（適応や使用の可否は個別に医師が判断します）。",
      note:"組み入れられたのは症例報告と症例集積のみで、比較試験は含まれていません。" },
    { cat:"A", pmid:"42842113", journal:"Dermatol Ther (Heidelb)", year:2026, type:"症例報告（2 例）",
      tj:"カペシタビンの手足症候群にデルゴシチニブ外用：2 例で反応が分かれる",
      te:"Topical Delgocitinib for Capecitabine-Induced Hand-Foot Syndrome: A Therapeutic Option?",
      sum:["手足症候群はカペシタビンに頻度の高い、投与量を制限しうる有害事象で、現在の治療の方策が常に有効とは限りません。カペシタビンによる手足症候群には JAK-STAT3 のシグナル伝達を含む炎症の経路が関わる可能性があるため、外用による JAK 阻害が治療の方法になりうると考えられます。本報告は、カペシタビンの単剤治療を受けて両手掌と両足底に有害事象共通用語規準（CTCAE）グレード 3 の手足症候群を生じた転移性乳癌の女性 2 名についてのものです。いずれもクロベタゾールプロピオン酸エステル 0.05% と尿素 30% の併用を先に受けていましたが、効果は一時的でした。その後、デルゴシチニブ 20 mg/g クリームを 1 日 2 回、手掌と足底に 6 週間外用し、臨床所見と HFS-14 という生活の質の尺度で治療の反応を評価しました。カペシタビンの用量と投与の予定は 6 週間の外用期間を通じて変更していません。",
           "1 例目では手足症候群が CTCAE グレード 3 からグレード 1 へ改善し、症状は著明に改善して HFS-14 の点数は 73.5 から 17.6 へ低下しました。カペシタビンは変更せずに継続され、その後 3 か月の追跡でも臨床の改善は安定していました。2 例目では紅斑は軽減したものの落屑と灼熱感が持続し、手足症候群は CTCAE グレード 3 のままで HFS-14 の点数は 76.5 から 67.6 への低下にとどまったため、6 週の評価の後にカペシタビンを中断しました。デルゴシチニブに関連する局所および全身の有害事象は認められませんでした。",
           "外用のデルゴシチニブはカペシタビンによる手足症候群に対する治療の方策になりうるとされ、とくに外用のステロイドに十分に反応しない患者さんで検討されうると述べられています。ただしこの 2 例で反応が一致しなかったことは、その位置づけが不確かであり、前向きのさらなる検討を要することを示すとされています。"],
      use:"抗がん剤による手足のあれで受診された方に、外用の JAK 阻害薬を試す報告が出てきていることをお伝えする材料になります（2 例のみの報告で、適応外の使用になりますので最終判断は医師が行います）。",
      note:"2 例の症例報告で、適応外の使用です。効果は一致していません。" },
    { cat:"A", pmid:"42841872", journal:"Contact Dermatitis", year:2026, type:"後方視コホート（3,436 名・登録データ連結）",
      tj:"金のパッチテスト陽性は 18.7%：他の金属アレルギーと関連し、自己免疫疾患とは無関連",
      te:"Gold Contact Sensitization, Clinical Characteristics and Associations With Autoimmune Disease: A Retrospective Cohort Study With Registry Linkage.",
      sum:["金への感作は多くみられますが、その臨床的・免疫学的な意義は明らかではなく、連続してパッチテストを受けた患者さんについての欧州のデータは乏しい状況です。動物のモデルでは金が全身の自己免疫を誘導しうると示唆されていますが、ヒトでの研究は限られています。本研究は、チオ硫酸金ナトリウム（GST）のパッチテストが陽性の患者さんの特徴を、ほかの金属との共感作の型を含めて明らかにし、金への感作が自己免疫疾患と関連するかを判定することを目的としました。デンマークのオーデンセ大学病院で 2015 年から 2024 年に連続してパッチテストを受けた皮膚炎の患者さん 3,436 名を対象とする後方視の登録研究で、パッチテストの結果をデンマーク国民患者登録の診断データと連結し、自己免疫疾患を 6 つの分類に分けてロジスティック回帰で解析しました。",
           "金への感作は検査を受けた患者さんの 18.7% に認められ、女性に多く（オッズ比 2.38、95% 信頼区間 1.96-2.94）、40 歳を超える年齢で多くみられました（オッズ比 1.32、95% 信頼区間 1.09-1.60）。ニッケル・クロム・コバルトへの同時の感作は、金への反応が強いほど増加していました（P < 0.01）。一方、金への感作と自己免疫疾患の間には全体として関連は認められませんでした（オッズ比 1.00、95% 信頼区間 0.82-1.22）。",
           "GST のパッチテスト陽性はほかの金属アレルギーと関連していましたが、いずれの自己免疫疾患とも関連していなかったと述べられています。"],
      use:"金属アレルギーのパッチテストで金が陽性となった方に、ほかの金属とのアレルギーは重なりやすい一方、自己免疫の病気と結びつける証拠はないとご説明する材料になります（生活指導アシスタントのパッチテストのタブ）。",
      note:"単一施設の後方視研究で、デンマークの患者さんを対象としています。" },
    { cat:"A", pmid:"42845208", journal:"Ann Dermatol", year:2026, type:"後方視コホート（640 万人・中央値 9.1 年）",
      tj:"若年成人の MASLD は乾癬の発症と関連：調整ハザード比 1.13",
      te:"Increased Risk of Psoriasis in Young Adults With Metabolic Dysfunction-Associated Steatotic Liver Disease: A Retrospective Cohort Study.",
      sum:["代謝機能障害に関連する脂肪性肝疾患（MASLD）は新しく定義された状態で、心血管・代謝の危険と結びついていますが、乾癬との関連は明らかではありませんでした。本研究は、韓国の若年成人における MASLD と乾癬の発症の危険の関連を評価することを目的とした後方視コホート研究です。韓国国民健康保険の 20〜39 歳の成人 6,400,590 名のデータを用い、参加者を研究で定義した互いに重複しない 7 つの脂肪性肝疾患の群に分類し、新規の乾癬は ICD-10 のコードで同定し、Cox 比例ハザードモデルでハザード比を推定しました。",
           "中央値 9.1 年の追跡期間に 170,921 名が乾癬を発症しました。MASLD は乾癬の危険の増加と有意に関連していました（調整ハザード比 1.13）。危険の推定値は研究で定義した群の間で異なっていました。",
           "MASLD とそれに関連する群は、若年成人における乾癬の危険と関連していたと述べられています。"],
      use:"健診で脂肪肝を指摘された乾癬の方に、体重と代謝を整えることを生活指導に組み入れる根拠の一つになります（生活指導アシスタントの生活指導のタブ）。",
      note:"保険請求データに基づく観察研究であり、因果関係を示すものではありません。" },
    { cat:"A", pmid:"42842243", journal:"JAMA Dermatol", year:2026, type:"無作為化比較試験（364 組の親子）",
      tj:"メラノーマ経験者の子どもへの遠隔教育：日やけ対策の行動は改善、日やけの回数は不変",
      te:"Melanoma Prevention Among Children of Melanoma Survivors: A Randomized Clinical Trial.",
      sum:["メラノーマを経験された方のお子さんは生涯のメラノーマの危険が 2 倍であるにもかかわらず、日やけ対策の実践が一貫せず、防ぎうる日やけを経験しています。本研究は、メラノーマ経験者のお子さんにおける皮膚癌の予防について、遠隔医療で提供する行動の介入を評価した並行群間の無作為化比較試験です。2020 年 4 月から 2023 年 10 月に、経験者とお子さんの組を FLARE（家族・生活様式・行動・危険の教育）の介入群と対照群に割り付けました。参加者は癌登録と州全体・臨床のデータベースから募り、適格な経験者はメラノーマの診断が確認されており、過去 1 年に 1 回以上日やけをした 8〜17 歳のお子さんが 1 人以上いる方としました。適格な経験者 520 名のうち 364 組が登録・開始時評価・無作為化を完了し、データは 2025 年から 2026 年に解析されています。両群とも 4 週間にわたる遠隔医療の教育のモジュールで、FLARE は家族性のメラノーマの危険の教育とお子さんの日やけ対策を標的とした技能の習得を含み、対照は信頼できる健康情報の見分け方についての一般的な皮膚癌の教育でした。主要評価項目はお子さんの日やけの発生で、開始時から介入後 2 回の評価までの変化として評価しました。",
           "364 組（親の平均年齢 45.1 歳、女性 228 名 62.6%、お子さんの平均年齢 12.9 歳、女性 189 名 51.9%）が無作為化され、治療意図に基づく主解析（FLARE 群 180 組 49.5%、対照群 184 組 50.5%）では、日やけの変化率に群間の有意差は認められませんでした。ただし介入後 1 回目の評価では、お子さんご自身が報告した日やけの発生は FLARE 群で対照群より少なく（B = -0.17、95% 信頼区間 -0.30〜-0.04、P = .01）、お子さんの日やけ対策の行動は開始時から介入後 2 回目の評価までに FLARE 群でより大きく増加しました（B = 0.26、95% 信頼区間 0.14-0.38、P < .001）。意図的・非意図的な日焼けには群間の有意差はなく、開始時の報告も少数でした。",
           "この無作為化比較試験では、FLARE は積極的な教育を行う対照と比べて経時的なお子さんの日やけを減らすには至りませんでした。FLARE は日やけ対策の行動を改善し、介入直後にはお子さんご自身の報告による日やけの減少と関連していましたが、危険の高いお子さんで持続的に減らすには追加の方策が必要かもしれないと述べられています。"],
      use:"皮膚癌のご家族歴を心配される保護者に、日やけ対策の行動は教育で変わりうる一方、日やけの回数を減らし続けるには継続的な働きかけが必要だとご説明する材料になります（生活指導アシスタントの生活指導のタブ）。",
      note:"主要評価項目では有意差が示されませんでした。米国の家族を対象とした試験です。" },
    { cat:"C", pmid:"42846028", journal:"Front Med (Lausanne)", year:2026, type:"多施設の横断研究（健常者 110 名）",
      tj:"手の陽明大腸経の経穴：超音波で深さ 1.6〜1.8 cm、いずれも筋膜と密接",
      te:"Multicenter study on ultrasound characteristics of acupoints in the Hand Yangming Meridian and related factors.",
      sum:["本研究は、手の陽明大腸経の合谷（LI4）・下廉（LI8）・手三里（LI10）について、多様な様式の超音波検査によって画像の特徴と影響する要因を検討したものです。多施設で健常の志願者 110 名を募り、合谷・下廉・手三里の位置を標準化して同定し、グレースケール超音波・カラードプラ血流画像・剪断波エラストグラフィを用いて超音波のデータを取得し、経穴における鍼先の深さ・経穴と骨との距離・組織の構成・血流の灌流・生体力学的な性質を定量的に測定しました。",
           "各施設の間で背景の情報と観察指標は一致していました（P > 0.05）。経穴の超音波のパラメータと志願者の背景の特徴の間には相関は認められませんでした（P > 0.05）。皮膚からの深さと橈骨の中央までの距離の中央値は、合谷が 1.72 cm（1.38、1.96 cm）と 0.93 cm（0.63、1.24 cm）、下廉が 1.64 cm（1.36、1.95 cm）と 0.43 cm（0.29、0.60 cm）、手三里が 1.75 cm（1.51、2.14 cm）と 0.66 cm（0.45、0.84 cm）でした。解剖学的には、合谷は主に母指内転筋（62.7%）、下廉は回外筋（41.8%）、手三里は長橈側手根伸筋と回外筋の間の筋膜（39.1%）に位置していました。3 つの経穴はいずれも筋膜の構造と密接に関連し（χ² = 11.864、P = 0.003）、周囲の参照組織より高い弾性率を示しました（P < 0.05）。",
           "手の陽明大腸経の経穴には、明確な解剖学的位置・筋膜との密接な付着・経絡に沿って筋膜との関連が増すこと・局所の組織の生体力学的な優位性といった特有の超音波の所見があると述べられています。本研究は経絡と結合組織の仮説に定量的な超音波の証拠を与え、鍼の機序を探る実用的な方法を示すとされています。"],
      use:"鍼の深さについてご質問をいただいたときに、合谷や手三里でおよそ 1.6〜1.8 cm という計測値を目安としてお示しできます。",
      note:"皮膚疾患を対象とした研究ではありません（経穴の超音波解剖）。健常者での計測で、治療効果を示したものではありません。" },
    { cat:"C", pmid:"42845882", journal:"Front Pain Res (Lausanne)", year:2026, type:"交差試験（鍼を受けたことのない学生 20 名・脳波）",
      tj:"刺入する鍼と刺入しない偽鍼：得気は弱くても脳波の反応はよく似る",
      te:"Phase-dependent oscillatory dynamics during needle retention and withdrawal: a comparison of penetrating and non-penetrating acupuncture.",
      sum:["臨床と脳画像の研究では、刺入しない偽の鍼が本物の鍼と同等の効果を引き起こしうることが示されていますが、頭皮上の電気生理学的な特徴は明らかではありません。本研究は、鍼を受けたことのない大学生 20 名を対象とした 2×2 の交差試験で、合谷（LI4）への本物の鍼と偽の鍼の施術中に脳波を記録し、置鍼の時期と抜鍼の後の時期において偽の鍼が本物の鍼と同等の頭皮上の電気生理学的な活動を引き起こすかを検討しました。",
           "本物の鍼はより強い得気の感覚を引き起こしたにもかかわらず、頭皮上の電気生理学的な反応は偽の鍼で引き起こされたものとよく似ていました。いずれの施術でも、置鍼の時期と抜鍼の後の時期に中央領域のシータ波の有意な増加、置鍼の時期に中央領域のベータ波の有意な増加、置鍼の時期から抜鍼の後の時期にかけて広範なアルファ波の低下が認められました。ただし偽の鍼の影響は相対的に弱い可能性があり、本物と偽の鍼の最も一貫した違いは、置鍼の時期から抜鍼の後の時期にかけてのアルファ波の低下に関するものでした。探索的な相関の解析では、得気の感覚と頭皮上の脳波のパワーの関連は本物と偽の鍼で異なる可能性が示されました。",
           "これらの結果は、経穴への刺入しない皮膚への接触の刺激と、それに伴う感覚への注意が、本物の鍼に似た（ただし部分的に弱い）電気生理学的な活動を引き起こしうることを示すと述べられています。"],
      use:"鍼は刺さないと効かないのかとご質問をいただいたときに、皮膚への接触だけでも脳の反応が生じうると分かってきていることをお伝えする材料になります。",
      note:"皮膚疾患を対象とした研究ではありません（健常者の脳波）。20 名の少人数での検討です。" }
  ]
},
{

  items: [
    { cat:"A", pmid:"42839349", journal:"Acta Derm Venereol", year:2026, type:"前向き多施設の実地研究（149 例・20 施設・16 週）",
      tj:"デルゴシチニブ外用で慢性手湿疹：16 週で HECSI-75 が 88.0%",
      te:"Efficacy and Safety of Delgocitinib and Its Impact on Patient's Perspective for Moderate-to-severe Chronic Hand Eczema in Adults: A 16-week Real-world Prospective Multicentre Study.",
      sum:["デルゴシチニブは成人の中等症から重症の慢性手湿疹に承認された汎 JAK 阻害の外用薬ですが、実地診療での証拠は限られているという背景の研究です。2025 年 5 月から 11 月にイタリアの皮膚科 20 施設で、慢性手湿疹にデルゴシチニブを使用した成人 149 名（平均年齢 46.4 歳、女性 60.4%）を前向きに登録し、4 か月間追跡しました。3 分の 2 は職業性の曝露がない例で、8 割を超える方が小水疱型またはアトピー型の慢性手湿疹でした。",
           "4 週の時点で医師による全般評価（PGA-慢性手湿疹）0/1 の達成は 42.3%、Hand Eczema Severity Index（HECSI）-75 の達成は 43.8% でしたが、16 週にはそれぞれ 74.3%・88.0% へ有意に上昇しました。かゆみの数値評価尺度（NRS）0/1 は 43.8% から 74.4%、痛みの NRS 0/1 は 52.3% から 86.5% へ有意に増加し、患者さんご自身による重症度の印象（HESD PGI-S）0/1 も 45.6% から 76.6% へ増えました。職業性の曝露がない方は曝露のある方より早期の反応率が有意に高く、その差は 16 週までに縮まりました。HECSI-75 の達成は病型を通じて一貫しており、とくに小水疱型 94.0%、アトピー型 90.0% でした。有害事象はまれで、重篤なものの報告はありませんでした。",
           "これらの結果は、デルゴシチニブが慢性手湿疹に対して速やかで有効かつ安全な治療の選択肢であることを支持すると述べられています。"],
      use:"手あれ・手湿疹でお困りの方に、外用の JAK 阻害薬でかゆみと痛みがどのくらいの期間で変わりうるかをご説明する材料になります（生活指導アシスタントの外用薬・スキンケアのタブ）。" },
    { cat:"A", pmid:"42838757", journal:"J Dermatol", year:2026, type:"デルファイ法による専門家合意（2 ラウンド・17 名）",
      tj:"アトピー性皮膚炎の心身医学的アプローチ：日本の専門家が 25 項目で合意",
      te:"Non-Pharmacological Psychosomatic Approaches to Patients With Atopic Dermatitis: A Delphi Consensus of Expert Opinions in Japan.",
      sum:["アトピー性皮膚炎は持続するかゆみと長い経過を特徴とする慢性の炎症性皮膚疾患で、精神的な健康に影響し生活の質を損なうことがあります。ストレスや不安はかゆみの症状を悪化させ、掻破行動に影響して予後を悪くする悪循環につながるため、皮膚科医は心身の相関を考慮して心身医学的な介入を行うことが望まれますが、日本では非薬物の心身医学的アプローチについて標準化された合意が確立していませんでした。そこで心身皮膚科領域の日本の専門家が、第 1 ラウンドの 28 項目に第 2 ラウンドで 1 項目を加えた計 29 項目について同意の程度を表明し、合意は参加者の 75% 以上の同意と事前に定義されました。",
           "回答率は第 1 ラウンドが 17/21（81.0%）、第 2 ラウンドが 17/17（100%）で、2 ラウンドを通じて 25 項目が採択されました。良好な治療関係の確立に分類された、問診と身体診察の実施、患者さんの努力を認めること、患者さんの解釈モデルを尊重することについて同意が得られました。身体と心理の両面からの病態の評価（嗜癖的な掻破、生物心理社会モデルと病態仮説の構築）には高い水準の同意がありました。悪化因子への気づきを間接的に促すこと、生物心理社会モデルと病態仮説を患者さんと共有することでも合意に達しました。さらに心身相関を治療に応用することに関する 14 項目で同意が得られ、第 2 ラウンドでは集団療法も有用な介入として合意されました。",
           "このデルファイパネルは、アトピー性皮膚炎の患者さんに対する心身医学的な介入について、日常臨床と研究におけるアプローチを標準化するための推奨を示すものと述べられています。"],
      use:"かゆくて掻いてしまう悪循環を訴えられる方に、まず努力を認めてから悪化因子への気づきを促すという進め方の裏づけになります（生活指導アシスタントの生活指導のタブ）。" },
    { cat:"A", pmid:"42840331", journal:"JMA J", year:2026, type:"系統的レビュー・メタ解析（5 RCT・2,755 名）",
      tj:"経口 IL-23 受容体拮抗薬イコトロキンラ：乾癬で PASI 90 達成がプラセボより有意に増加",
      te:"Efficacy and Safety of Icotrokinra (an Interleukin-23 Inhibitor) in the Management of Moderate-to-Severe Plaque Psoriasis: A Systematic Review and Meta-Analysis.",
      sum:["尋常性（板状）乾癬は生活の質を大きく損なう慢性の免疫介在性の炎症性皮膚疾患で、サイトカインの IL-23 はその発症に中心的な役割を果たします。イコトロキンラは臨床試験で有効性が示されつつある新しい経口の IL-23 受容体拮抗薬です。本研究は、成人と青年の中等症から重症の尋常性乾癬におけるイコトロキンラの有効性と安全性を評価した系統的レビュー・メタ解析です。PRISMA に沿って PubMed・ScienceDirect・Cochrane Library を包括的に検索し、1 日 1 回の経口イコトロキンラ 200 mg とプラセボを比較した無作為化比較試験を同定しました。主要評価項目は 16 週時点の PASI 90、医師による全般評価（IGA）0/1、有害事象で、ランダム効果モデルでリスク比と 95% 信頼区間を統合しています。",
           "合計 5 件の無作為化比較試験・2,755 名が組み入れられました。イコトロキンラはプラセボと比べ、PASI 90、IGA 0/1、IGA 0、Psoriasis Symptoms and Signs Diary 0 の達成を有意に増加させました。有害事象の全体の頻度は両群で同程度でしたが、有害事象による治療中止の割合はイコトロキンラのほうが低かったと報告されています。",
           "イコトロキンラは中等症から重症の尋常性乾癬に対して有効で忍容性の良い経口治療であり、臨床面と患者さんご自身の報告の両面で相当の利益があると述べられています。"],
      use:"注射に抵抗のある乾癬の方に、飲み薬の新しい選択肢が開発されている状況をお伝えする材料になります（現時点では研究段階の報告で、最終判断は医師が行います）。" },
    { cat:"A", pmid:"42840172", journal:"Front Pharmacol", year:2026, type:"薬剤安全性監視（FAERS 7,850 報告・JADER 104 例）",
      tj:"ビメキズマブはカンジダ関連の報告が IL-17A 選択薬より多い：FAERS と JADER で一致",
      te:"Postmarketing reporting patterns of Candida-related events associated with bimekizumab and selective IL-17A inhibitors in psoriasis: a FAERS and JADER pharmacovigilance study.",
      sum:["カンジダ関連の事象は IL-17 経路の阻害で確立した既知の事象です。本研究は、乾癬領域でビメキズマブと選択的 IL-17A 阻害薬の自発報告において、カンジダの表現型がどのように現れているかを、報告制度のデータという解釈上の限界を踏まえて検討した二つのデータベースによる不均衡解析です。主たる資料として米国の FAERS の 2023 年第 4 四半期から 2026 年第 1 四半期を、整合性の確認として日本の JADER の 2026 年 5 月版を用い、解析は乾癬に関連する報告・症例に限定しました。カンジダ関連事象を中心の感染表現型とし、炎症性腸疾患と湿疹・皮膚炎を機序に関連する文脈領域として事前に設定し、報告オッズ比（ROR）は探索的な相対報告の対比として解釈しています。PT 水準での判断にはビメキズマブの事象報告が 5 件以上であることを要件とし、10 件以上を感度の閾値として検討しました。",
           "解析には FAERS のビメキズマブ 7,850 報告と選択的 IL-17A 比較群 10,971 報告、JADER のビメキズマブ 104 例と比較群 890 例が含まれました。FAERS では何らかのカンジダ関連事象がそれぞれ 514/7,850 と 139/10,971 の報告で認められ（ROR 5.46、95% 信頼区間 4.52-6.60）、JADER でも方向性の一致する報告の対比が示されました（ROR 7.73、95% 信頼区間 4.09-14.62）。FAERS では口腔カンジダ症・カンジダ感染・食道カンジダ症が 5 件以上と 10 件以上の両方の閾値を満たしました。年齢と性別で層別した完全症例の解析でも方向は同じでしたが、とくに FAERS の性別の欠測が解釈を制限しました。厳密な発症までの時間を評価できたのは、カンジダ陽性の FAERS 報告のうち 74/514 と 45/139 でした。炎症性腸疾患と湿疹・皮膚炎の所見は一貫性が低いと報告されています。",
           "カンジダ関連の表現型は FAERS と JADER を通じて再現性のある不均衡報告のパターンを示し、表現型に着目した安全性監視の継続と臨床上の注意を支持する一方、これらは自発報告のパターンを記述したものであり、発生率や薬剤間の比較リスクの推定として解釈すべきではなく、薬剤の安全性に順位をつけるものでもないと述べられています。"],
      use:"IL-17 経路の生物学的製剤を使用中の方が口の中の白い付着やのどの違和感を訴えられたときに、カンジダを疑って確認するきっかけになります。" },
    { cat:"A", pmid:"42839952", journal:"Front Med (Lausanne)", year:2026, type:"横断研究（患者 181 例・対照 101 名）",
      tj:"アトピー性皮膚炎の重症度と血液指標：60 歳以上では D-ダイマーが目安に（AUC 0.805）",
      te:"Age-stratified correlations between atopic dermatitis severity and biomarkers: hypercoagulability as a key indicator of severity in older adults.",
      sum:["アトピー性皮膚炎は全身の炎症を伴う慢性の皮膚疾患ですが、これまでの研究はおもにアレルギーの性質に注目し、随伴する全身の炎症と凝固が進みやすい状態について、とくに年齢層ごとの検討が十分ではありませんでした。本研究はアトピー性皮膚炎の重症度と、全身の炎症・凝固の傾向・アレルギー反応との関連を調べ、これらの指標の年齢ごとの予測的な価値を評価した横断研究で、患者 181 名と健康な対照 101 名が登録されました。重症度は EASI で評価し、血液検体でアレルギーの指標（総 IgE、好酸球絶対数）、凝固の指標（D-ダイマー、フィブリノゲン分解産物、D-ダイマー／フィブリノゲン比 DFR）、全身の炎症の指標（SII、血小板／リンパ球比 PLR、好中球／リンパ球比など）を測定し、60 歳未満と 60 歳以上に層別して ROC 曲線で予測の性能を評価しています。",
           "測定したすべての指標は対照より患者で有意に高く（いずれも P < 0.05）、年齢による層別でいくつかの指標に年齢依存の影響が認められました。全体では総 IgE・SII・PLR が EASI と正の相関を示し（r はそれぞれ 0.184、0.237、0.266、P < 0.05）、この関連は年齢に依存しませんでした。60 歳以上では好酸球絶対数が重症度と相関し（r = 0.248、P < 0.05）、中等症から重症を予測しました（AUC = 0.688）。凝固の指標は両方の年齢層で重症度と相関しましたが予測のパターンは異なり、60 歳未満では DFR が軽症から中等症の予測に最も優れ（AUC = 0.723）、60 歳以上では D-ダイマーが中等症から重症の予測に最も優れていました（AUC = 0.805）。炎症の指標では SII と PLR が中等症から重症を予測しました（AUC = 0.630、0.616）。",
           "アトピー性皮膚炎の患者さんには有意な全身の炎症、症状として現れない凝固が進みやすい状態、強まったアレルギー反応がみられ、総 IgE・SII・PLR は年齢に依存しない重症度の指標として信頼でき、凝固の指標と好酸球数の診断的な有用性は年齢に依存するため、年齢で層別した実際的な臨床のアプローチが提案されています。とくに中等症から重症の高齢の患者さんでは、全身の炎症と凝固を観察することが臨床的に意味があると述べられています。"],
      use:"高齢のアトピー性皮膚炎の方で重症度を客観的に確かめたいときに、血液検査の読み方の参考になります（単一施設の横断研究で、最終判断は医師が行います）。" },
    { cat:"A", pmid:"42839190", journal:"Dermatol Ther (Heidelb)", year:2026, type:"横断オンライン調査（専門医 265 名）",
      tj:"慢性蕁麻疹：診断までに平均 4 人の専門医、約 2 割が十分に抑えられていない",
      te:"Urticaria Voices: Perspectives of Dermatologists and Allergists Regarding Chronic Urticaria Care and Its Treatment in China.",
      sum:["慢性蕁麻疹は、かゆみを伴う膨疹（じんましん）や血管性浮腫、あるいはその両方が 6 週間を超えて繰り返す疾患で、はっきりした誘因があるかどうかで慢性特発性蕁麻疹（CSU）と慢性誘発性蕁麻疹（CIndU）に分けられます。中国は蕁麻疹による障害調整生存年が世界で 2 番目に多く、地域に合わせた対策が求められています。本研究は、中国の皮膚科医とアレルギー科医が慢性蕁麻疹の疾病負担と管理をどのように捉えているかを調べた横断的なオンライン調査（約 40 分）で、中国全土の専門医 265 名（皮膚科医 81%、アレルギー科医 19%）が対象です。参加した医師は生物学的製剤を含むすべての慢性蕁麻疹の治療を自ら処方できる権限があり、CSU・CIndU の患者さんを実際に診療している方に限られ、患者さんの特徴、生活の各領域における負担、治療のパターンを想起して回答しました。",
           "医師の回答では、患者さんは診断に至るまでに平均 4 人の専門医を受診していました。初回の評価時点で 25% が重症または非常に重症の症状を示しており、現在 CSU の 19%、CIndU の 18% が十分に抑えられていない状態（蕁麻疹コントロールテスト UCT が 12 未満）でした。これらの患者さんについて医師は、精神・情緒と経済の領域で 10 点中 7 点、社会的な関係で 6 点（10 が極度に悪い影響）という大きな負担を報告しました。全体の 61% が本来の生活の可能性を発揮するうえで中等度に損なわれていると評価され、睡眠の乱れは慢性蕁麻疹の患者さん全体の 44% に及びました。医師の 93% は症状の完全な抑制を目標としていましたが、それが達成できるのは 59% の患者さんだと考えており、生物学的製剤へ段階を上げる前に平均 3 回の抗ヒスタミン薬の変更を試みていました。",
           "医師は約 2 割という不十分な管理の割合を想起しつつ、多くの患者さんが本来の生活の可能性を発揮できていないという大きな負担を認識しており、治療目標と達成可能性の認識の隔たり、診断の遅れ、慎重な段階の引き上げのパターンは、包括的な慢性蕁麻疹の管理を改善する余地を示すと述べられています。"],
      use:"いくつもの医療機関を回って来られた蕁麻疹の方に、抗ヒスタミン薬の調整の段階と次の手順をご説明する材料になります。",
      note:"中国の専門医を対象とした意識調査で、日本の診療の実態とは異なる可能性があります。" },
    { cat:"A", pmid:"42840039", journal:"Front Med (Lausanne)", year:2026, type:"症例報告（60 歳男性・1 例）",
      tj:"難治性のアミロイド苔癬にウパダシチニブ：かゆみ NRS が 8 から 1〜2 へ",
      te:"Rapid therapeutic response in refractory lichen amyloidosis treated with upadacitinib: a case report.",
      sum:["アミロイド苔癬は真皮の乳頭層にアミロイドが沈着する、治療の難しい慢性のかゆみを伴う皮膚疾患で、強いかゆみを伴う色素沈着した小結節や敷石状の板状の病変として、おもに四肢に生じます。従来の治療では部分的あるいは一時的な効果にとどまり、効果が安定しないことが多いとされています。本報告は、両側の四肢に 3 年間にわたり進行する難治性のアミロイド苔癬を呈した 60 歳の中国人男性の症例です。この患者さんは 2 年間にわたり、経口の抗ヒスタミン薬や強力なステロイド外用薬を含む複数の治療を続けて、あるいは併用して試みましたが効果が得られず、組織病理の染色で原発性の限局性皮膚アミロイドーシスが確認されました。",
           "経口ウパダシチニブ 15 mg を 1 日 1 回の単独療法として開始したところ、速やかな改善が得られました。かゆみは 1 か月以内に大きく和らぎ、数値評価尺度は 8 から 1〜2 へ低下しました。これに伴って小結節が明らかに平坦化し、病変の数が減少し、色素沈着が薄くなり、敷石状の皮膚病変が消失しました。服薬中に短期的な有害反応は認められませんでした。",
           "本症例は、難治性の炎症性皮膚疾患の治療における JAK1 阻害薬の価値を支持する新たな臨床的証拠を加え、アミロイド苔癬の発症に IL-31 に依存する JAK1 シグナルが関与することを裏づけ、従来の治療に抵抗する例での救済的な治療としてウパダシチニブが有望であることを示すと述べられています。ただし長期の有効性・最適な用量・安全性の確認には、より大規模な前向きコホート研究と無作為化比較試験が必要とされています。"],
      use:"強いかゆみが続くアミロイド苔癬の方に、JAK 阻害薬という選択肢の報告があることをお伝えする材料になります（1 例の報告で、最終判断は医師が行います）。" },
    { cat:"A", pmid:"42841090", journal:"Clin Cosmet Investig Dermatol", year:2026, type:"症例報告（41 歳女性・1 例）",
      tj:"成人発症の顔面アトピー性皮膚炎にオマリズマブ：3 回の投与で赤みとかゆみが改善",
      te:"Omalizumab in Refractory Adult-Onset Facial Atopic Dermatitis: A Case Report.",
      sum:["成人発症の顔面アトピー性皮膚炎は、おもに顔に生じるアトピー性皮膚炎の独立した一型で、ロゼアなど他の顔面の皮膚疾患と誤って診断されることが多いとされています。とくに従来の治療への反応が乏しい患者さんでは管理が難しく、この病型に対する抗 IgE 療法の報告は現時点で限られています。本報告は、血清 IgE が著明に高く、オマリズマブに良好な反応を示した成人発症の顔面アトピー性皮膚炎の 1 例で、臨床的な特徴・検査所見・治療経過・治療の成績を後方視的に解析したものです。かゆみの程度は視覚的評価尺度（0〜10）で、顔の赤みと皮膚の乾燥は SCORAD の客観的な徴候の項目で評価し、経過中に臨床写真と客観的な評価の結果を記録しています。",
           "41 歳の女性が、10 年間にわたり繰り返す顔の赤みにかゆみと熱感を伴って受診しました。複数の従来の全身療法と外用療法への反応は乏しく、血清の総 IgE は著明に高い値でした。オマリズマブ 300 mg を 4 週ごとに皮下注射し、合計 3 回投与したところ、治療の経過とともに顔の赤み・落屑・かゆみ・熱感が次第に改善し、症状に関する各スコアは低下しました。本症例では有害事象は認められませんでした。",
           "典型的なアトピーの既往がない場合でも、血清の総 IgE が高く従来の治療への反応が乏しい成人発症の顔面アトピー性皮膚炎の患者さんにとって、オマリズマブが治療の選択肢になりうることを示す症例であると述べられています。"],
      use:"顔の赤みとかゆみが長く続き、ロゼアとの見分けが難しい成人の方で、血清 IgE が高いときの選択肢を知る材料になります（1 例の報告です）。" },
    { cat:"A", pmid:"42835590", journal:"Cureus", year:2026, type:"後方視観察研究（各群 100 例）",
      tj:"2 型糖尿病の爪の変化は血糖と関連：縦走隆線 64%・爪白癬 36%",
      te:"Clinical and Hematological Correlation of Nail Changes in Type 2 Diabetes Mellitus: A Retrospective Study.",
      sum:["爪の異常は 2 型糖尿病でよくみられますが見落とされやすい所見で、血糖の管理状況や糖尿病の罹病期間との関係は十分に解明されていません。本研究は 2 型糖尿病の患者さんにみられる爪の異常の内容を評価し、血糖の指標と罹病期間との関連を明らかにすることを目的とした後方視的観察研究です。2023 年 1 月から 2024 年 12 月に三次医療機関を受診した 2 型糖尿病の患者さんを、爪の異常がある群（A 群）とない群（B 群）に分け、人口統計学的・臨床的なデータ、空腹時血糖（FBS）、食後血糖（PPBS）、随時血糖（RBS）、HbA1c、糖尿病の罹病期間を解析しました。爪の異常は臨床的な観察とダーモスコピーによる爪の観察で評価し、カイ二乗検定・t 検定・相関解析・ROC 曲線解析を用いています。",
           "各群 100 名が対象となりました（A 群は男性 68 名・女性 32 名、B 群は男性 52 名・女性 48 名）。最も多い爪の異常は縦走隆線（64%）で、次に爪白癬（36%）、慢性爪囲炎（26%）、ボー線（25%）、爪の萎縮・変形（18%）でした。爪の異常がある患者さんは、ない患者さんより FBS・PPBS・RBS・HbA1c がいずれも有意に高値でした（すべて P < 0.001）。ROC 曲線解析では、血糖の指標が罹病期間よりも爪の異常の予測に優れ、RBS が最も高い感度、HbA1c が最も高い特異度を示しました。ボー線は罹病期間の長さと関連しましたが、多くの爪の異常は罹病期間と有意な関係を示しませんでした。爪の変化の総スコアは血糖の指標の悪化と正の相関を示しました。",
           "2 型糖尿病における爪の異常は血糖の管理の不良と密接に関連し、罹病期間よりも積み重なった代謝の影響を反映している可能性があり、必要に応じてダーモスコピーを加えた日常的な爪の診察は、より詳しい代謝の評価が必要な患者さんを見つけるための簡便で非侵襲的な手がかりになりうると述べられています。確認には前向きの縦断研究が必要とされています。"],
      use:"爪の変化でお見えになった糖尿病の方に、血糖の状態も確かめていただくようお勧めする材料になります（爪白癬との見分けも含めて）。" },
    { cat:"A", pmid:"42834161", journal:"Aesthetic Plast Surg", year:2026, type:"系統的レビュー（4 件の半顔比較試験）",
      tj:"ニキビ痕：マイクロニードル高周波とフラクショナルレーザーの比較は 4 試験のみで優劣は未確定",
      te:"Microneedling Radiofrequency Versus Fractional Laser for the Treatment of Acne Scars: A Systematic Review with Descriptive Quantitative Synthesis.",
      sum:["萎縮性のニキビ痕は美容皮膚科領域で治療の難しい課題が続いています。フラクショナルレーザーによる皮膚の再生は確立した治療ですが、マイクロニードル高周波（MNRF）は低侵襲の選択肢として登場し、選ばれた患者さんでは回復の経過が良好である可能性があります。本研究は、萎縮性のニキビ痕に対する MNRF による治療とフラクショナルレーザーによる治療を、臨床的な有効性・回復の経過・安全性の面で比較した系統的レビューです。PubMed と Web of Science で、MNRF を用いた治療とフラクショナルレーザーを対照とする無作為化または比較臨床研究を検索し、対照のレーザーを組織との相互作用の性質によって削除的なフラクショナル CO2 レーザー、削除的なフラクショナル Er:YAG レーザー、非削除的なエルビウムガラスのフラクショナルレーザーに分類し、直接の対面比較と上乗せの併用プロトコルを別々に検討しました。バイアスのリスクは Cochrane RoB 2 で、非無作為化の比較の証拠を記述的に扱う際は ROBINS-I で評価しています。",
           "検索で 152 件が得られ、選別と適格性の評価を経て、あらかじめ定めた基準を満たしたのはフラクショナルレーザーを対照とする半顔比較の 4 試験でした。最終の ECCA スコアを報告したのは 2 試験で、1 試験は非削除的なフラクショナルレーザーへの上乗せとして MNRF を評価し、もう 1 試験は MNRF と削除的なフラクショナル CO2 レーザーを直接比較していました。これらの試験は臨床の設計が異なり、半顔比較の対応のある統計を一貫して示していなかったため、ECCA の結果は研究ごとに記述的にまとめられました。含まれた証拠を通じて、MNRF を用いたプロトコルは臨床的な改善と関連し、一部の削除的なレーザーより回復が短い可能性が示されましたが、回復と忍容性の結果は瘢痕の再構築による有効性とは分けて解釈されています。",
           "現在の比較の証拠は、MNRF を用いた治療が顔面の萎縮性のニキビ痕を改善しうること、選ばれた患者さんでは忍容性の面で利点がありうることを示唆する一方、すべてのフラクショナルレーザーに対して一律に有効性が優れているとは示していません。適格な試験の数が少なく、対照が多様で、研究の設計が異なり、結果の報告が一貫しないため、慎重に解釈すべきと述べられています。"],
      use:"ニキビ痕の治療をご相談いただいたときに、機器の優劣を断定できる段階ではないと率直にご説明する材料になります。" },
    { cat:"C", pmid:"42817124", journal:"Curr Neuropharmacol", year:2026, type:"ナラティブレビュー",
      tj:"経皮的耳介迷走神経刺激と慢性痛：片頭痛・線維筋痛症などで予備的な効果",
      te:"Transcutaneous Auricular Vagus Nerve Stimulation for Chronic Pain Management: A Narrative Review.",
      sum:["慢性の痛みは世界的な公衆衛生上の課題であり、現在の治療の手立ては限られ、しばしば有害作用を伴います。経皮的耳介迷走神経刺激（taVNS）は近年、非侵襲的な神経調節の治療として登場し、慢性の痛みの管理に新しい可能性をもたらすものとして注目されています。本稿はその知見を整理したナラティブレビューです。",
           "予備的な研究では、taVNS は片頭痛・線維筋痛症・慢性腰痛といった状態で治療効果の可能性を示しており、三叉神経痛・糖尿病性末梢神経障害・持続する腹痛でも探索的な応用が始まっています。複数の研究では、この方法が痛みの強さを和らげ、患者さんの生活の質を高めうることが示唆されています。鎮痛の機序としては、青斑核とノルアドレナリン系、前頭前野とドパミン系、自律神経機能の調節、さらに炎症反応の抑制との関連が考えられています。",
           "現在の証拠は taVNS が安全で有効な補助的治療になりうることを示唆していますが、刺激の条件を標準化し長期的な臨床上の利益を確認するためには、今後の質の高い大規模で長期の研究が不可欠であると述べられています。"],
      use:"耳のツボへの刺激を希望される慢性の痛みの方に、現時点では補助的な位置づけであることをご説明する材料になります。",
      note:"皮膚疾患を対象とした研究ではありません（慢性の痛み）。ナラティブレビューで、効果の大きさを示すものではありません。" },
    { cat:"C", pmid:"42802247", journal:"Neurol Sci", year:2026, type:"単施設・非盲検のパイロット研究（14 名）",
      tj:"taVNS を 8 週：関節過動型 EDS の自律神経症状スコアが 36.5% 低下",
      te:"Transcutaneous auricular vagus nerve stimulation improves dysautonomia in patients with hypermobile Ehlers-Danlos syndrome.",
      sum:["自律神経系の機能の障害は関節過動型エーラス・ダンロス症候群（hEDS）で頻度が高く、多臓器にわたる症状と生活の質の低下に大きく関わります。神経と免疫の調節の乱れと慢性の軽度の炎症が、その背景の機序として認識されつつあります。経皮的耳介迷走神経刺激（taVNS）は自律神経のバランスを回復させ、コリン作動性の抗炎症の経路を活性化する可能性があります。本研究は前向き・単施設・非盲検のパイロット研究で、hEDS で日常生活を妨げる自律神経症状（COMPASS-31 が 20 を超える）のある女性 14 名が連続して登録され、週 1 回 60 分の taVNS を 8 週間受けました。自律神経症状は毎週 COMPASS-31 で評価し、生活の質は開始時と 8 週時に SF-36 で評価しています。",
           "taVNS の忍容性は良好で、重篤な有害事象はありませんでした。COMPASS-31 の合計点は開始時の 44.6 ± 12.7 から 8 週時に 28.3 ± 15.4 へ有意に低下しました（36.5% の低下、P < 0.001）。起立性の不耐、消化器、血管運動、分泌運動の各領域で有意な改善がみられました。SF-36 の合計点は 27.7% 上昇し（P = 0.07）、身体機能・身体的な役割・身体の痛み・全般的健康感・活力の各項目で統計学的に有意な改善が認められました。",
           "このパイロット研究では taVNS は安全であり、hEDS の患者さんの自律神経症状について臨床的に意味のある改善と関連していました。客観的な自律神経と神経免疫の指標を取り入れた無作為化比較研究のさらなる実施が支持されると述べられています。"],
      use:"立ちくらみや胃腸の不調など自律神経の訴えに耳への刺激を併せてご案内する際の参考になります（少人数で対照群のない研究です）。",
      note:"皮膚疾患を対象とした研究ではありません（自律神経症状）。対照群のない非盲検のパイロット研究です。" },
    { cat:"C", pmid:"42744642", journal:"Zhongguo Zhen Jiu", year:2026, type:"実行可能性の検討（8 規格の鍼）",
      tj:"細く長い鍼 8 規格の刺入：管を用いる刺入のほうが皮膚を貫くときに痛みが少ない",
      te:"[Feasibility study on needle insertion with comfortable fine elongated-needles].",
      sum:["現代の鍼灸臨床で求められる快適さに応えるため、本研究では細く長い鍼を 8 規格（0.16 mm×100 mm、0.18 mm×100 mm、0.20 mm×100 mm、0.25 mm×100 mm、0.16 mm×125 mm、0.18 mm×125 mm、0.20 mm×125 mm、0.25 mm×125 mm）特注し、刺入の実際の実行可能性を検討しました。例として、両側の肩髃（LI15）から臂臑（LI14）への透刺と、肩髎（TE14）から臂臑（LI14）への透刺を用いています。",
           "結果として、両手で鍼体を保持する刺入法と、管を区分して用いる刺入法のいずれでも、すべての規格の細く長い鍼が臨床の刺鍼の要件を満たし、被験者はいずれも酸・麻・重・脹という得気の感覚を得ました。刺入の深さは鍼の長さとともに増加しました。両手で保持する刺入法と比べ、管を用いる刺入法は皮膚を貫く際に痛みのない操作がより可能でした。",
           "本研究は、新しい快適な細く長い鍼による刺入の臨床的な実行可能性を予備的に探り、その操作上の特徴と限界を整理したもので、今後の臨床での検証の方向性を示しうると述べられています。"],
      use:"刺鍼の痛みを気にされる方に、管を用いる刺入法を選ぶ根拠の一つになります。",
      note:"皮膚疾患の治療ではなく、鍼の手技（刺入）に関する検討です。被験者数など詳細は抄録に記載がありません。" }
  ]
},
{
  date: "2026-10-07",
